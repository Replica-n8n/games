/* Layout: one letterboxed 320×180 arcade screen, centred, HTML buttons floating over its top-right corner */
:root{
  --bg:#07040f;        /* night of the manor */
  --ink:#ece6ff;       /* moonlit text */
  --dim:#5b4f80;       /* faded wallpaper */
  --accent:#ff9a2e;    /* beam orange */
  --ecto:#7dff6a;      /* ectoplasm green */
  --neon:#ff3fa4;      /* ballroom neon */
  --panel:rgba(20,10,34,.82);
  --font-pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--font-pixel);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-bottom, 0px));
  background:radial-gradient(ellipse at 50% 40%, #1a0f2e 0%, var(--bg) 70%)}
#frame{position:relative;max-width:100%;box-shadow:0 0 0 2px #1d1233, 0 0 40px rgba(255,63,164,.10)}
#screen{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:none;background:#000}
#btns{position:absolute;top:6px;right:6px;display:flex;gap:6px}
.hb{font-family:var(--font-pixel);font-size:clamp(7px,1.3vw,10px);letter-spacing:.04em;color:var(--ink);background:var(--panel);
  border:2px solid var(--dim);padding:5px 7px;cursor:pointer;line-height:1;touch-action:manipulation}
.hb:hover{border-color:var(--accent);color:var(--accent)}
.hb:focus-visible{outline:2px solid var(--ecto);outline-offset:2px}
.hb[aria-pressed="false"]{color:var(--dim)}
#hint{display:none;margin:0;font-size:9px;line-height:1.6;color:var(--dim);text-align:center;max-width:36ch}
@media (orientation:portrait) and (max-width:760px){ #hint{display:block} }
</style>

<div id="stage">

      <button id="bSound" class="hb" type="button" aria-pressed="true">SON</button>

  </div>

function makeSprite(rows){
  const w=Math.max(...rows.map(r=>r.length)),h=rows.length;
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  rows.forEach((r,j)=>{for(let i=0;i<w;i++){const ch=r[i]||'.';if(ch==='.')continue;x.fillStyle=PAL[ch]||'#f0f';x.fillRect(i,j,1,1);}});
  return c;
}
function silhouette(src,col){
  const c=document.createElement('canvas');c.width=src.width;c.height=src.height;const x=c.getContext('2d');
  x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle=col;x.fillRect(0,0,c.width,c.height);return c;
}
function makeBoss(){
  const S=40,c=document.createElement('canvas');c.width=S;c.height=S;const x=c.getContext('2d');
  const id=x.createImageData(S,S),d=id.data;
  const set=(i,j,hex)=>{const k=(j*S+i)*4;d[k]=hex>>16&255;d[k+1]=hex>>8&255;d[k+2]=hex&255;d[k+3]=255;};
  const inside=(i,j)=>{
    const hx=i-20,hy=j-14;
    if((i-20)**2+(j-4)**2<=16) return 'bun';
    if(hx*hx/121+hy*hy/121<=1) return 'body';
    if(j>14&&j<=35+2*Math.sin(i*0.9)){const hw=10+(j-14)*0.42;if(Math.abs(hx)<=hw)return 'body';}
    if(j>=18&&j<=24){const a=Math.abs(hx);if(a>=9&&a<=17&&Math.abs((j-18)-(a-9)*0.55)<=1.6)return 'body';}
    return null;
  };
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){
    const r=inside(i,j);if(!r)continue;
    if(r==='bun'){set(i,j,((i+j)&3)?0x4a4466:0x6a6390);continue;}
    const edge=Math.abs(i-20)/(10+Math.max(0,j-14)*0.42);
    let col=edge>0.72?0x8a80b4:edge>0.45?0xb2a9d8:0xd6d0f0;
    if(j>28&&((i+j)%5===0))col=0x8a80b4;
    set(i,j,col);
  }
  const rect=(x0,y0,w,h,hex)=>{for(let j=y0;j<y0+h;j++)for(let i=x0;i<x0+w;i++)set(i,j,hex);};
  rect(13,10,5,5,0x140a22);rect(22,10,5,5,0x140a22);
  rect(14,11,3,3,0xff3344);rect(23,11,3,3,0xff3344);rect(15,11,1,1,0xffd0d0);rect(24,11,1,1,0xffd0d0);
  rect(11,8,7,1,0x4a4466);rect(22,8,7,1,0x4a4466);
  for(let i=14;i<=26;i++)set(i,19+((i&1)?1:0),0x140a22);rect(15,20,11,2,0x140a22);
  for(let i=15;i<=25;i+=2)set(i,20,0xf6f2ff);
  rect(19,25,3,3,0xffe066);rect(20,26,1,1,0xff9a2e);
  for(let a=0;a<12;a++){const t=a/12*Math.PI*2;set(Math.round(30+Math.cos(t)*2.5),Math.round(31+Math.sin(t)*2.5),0xffe066);}

  const out=new Uint8ClampedArray(d);
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){const k=(j*S+i)*4;if(d[k+3])continue;

    if(n){out[k]=0x14;out[k+1]=0x0a;out[k+2]=0x22;out[k+3]=255;}}
  id.data.set(out);x.putImageData(id,0,0);return c;

/* ================= background raycaster ================= */

const FOG=[8,5,18],LV=8;
const pack=(r,g,b)=>((255<<24)|(b<<16)|(g<<8)|r)>>>0;
function ramp(hex){const r=hex>>16&255,g=hex>>8&255,b=hex&255,a=new Uint32Array(LV);
  for(let i=0;i<LV;i++){const k=i/(LV-1);a[i]=pack(Math.round(FOG[0]+(r-FOG[0])*k),Math.round(FOG[1]+(g-FOG[1])*k),Math.round(FOG[2]+(b-FOG[2])*k));}return a;}
const MATS={FAR:0x07040f,

 MARBLE_L:0x9a96b0,MARBLE_D:0x2c2840,CARPET:0x7a1828,CARPET_B:0xc8a040,CEIL:0x261b32,BEAM:0x3e2a20,
 GLASS:0x7fb6e6,FRAME:0x2a1810,CANVAS:0x1c2a24,EYE:0xff3a3a,PILLAR:0x2a160e,
 SHELF:0x4c2c18,SHELF_D:0x1a0e08,BK0:0x8e2c2c,BK1:0x2c6040,BK2:0x2e3e84,BK3:0xa08030,BK4:0x6e2e70,
 WOOD_A:0x6e4428,WOOD_B:0x5c3620,WOOD_GAP:0x2a180c,LIB_CEIL:0x2c1c12,
 PLANK_A:0x5e4a38,PLANK_B:0x4c3a2c,PLANK_GAP:0x201810,WEB:0xb4b4c8,MOON:0xcfe6ff,RAFTER:0x3a2a1c,
 MIRROR:0x5a6890,MIRROR_S:0xc8d6ff,BALL_GOLD:0xd8b050,NEON_M:0xff3fa4,NEON_C:0x3fe8ff,

const M={},RAMPS=[];for(const k in MATS){M[k]=RAMPS.length;RAMPS.push(ramp(MATS[k]));}
const FARCOL=RAMPS[M.FAR][LV-1];
const colDX=new Float32Array(W),colTW=new Float32Array(W);
for(let px=0;px<W;px++){const dx=(px-CX+0.5)/F;colDX[px]=dx;colTW[px]=Math.abs(dx)>1e-6?HW/Math.abs(dx):1e9;}
function hh(n){n=Math.imul(n^61^(n>>>16),9);n^=n>>>4;n=Math.imul(n,0x27d4eb2d);n^=n>>>15;return n>>>0;}
const fm=(a,b)=>((a%b)+b)%b;
const roomAt=z=>z<50?0:z<100?1:z<150?2:3;
let EM=0,flashL=0,beatN=0,beatF=0;
function shade(s,x,y,z,side){
  EM=0;
  const bz=Math.round(z/50)*50;
  if(s!==3&&bz>0&&bz<ENDZ&&Math.abs(z-bz)<0.28) return M.PILLAR;
  if(s===3){
    const r2=x*x+(y+0.45)*(y+0.45);
    if(r2<0.36){if(Math.abs(x)<0.035||Math.abs(y+0.45)<0.035)return M.FRAME;EM=0.9;return M.MOON;}
    if(r2<0.46) return M.RAFTER;
    const v=(y+2)*6;if(v%1<0.12)return M.PLANK_GAP;return (v|0)&1?M.PLANK_A:M.PLANK_B;
  }
  const room=roomAt(z);
  if(room===0){
    if(s===0){
      if(y>0.24){const u=z%1.6;if(u<0.07||y>1.07)return M.WAIN_D;if(u<0.14||y<0.33||y>0.98)return M.WAIN_L;return M.WAIN;}
      if(y>0.15) return M.GOLD;
      const wz=z%8;
      if(wz>3&&wz<4.8&&y>-1.1&&y<-0.1){
        const u=wz-3,v=y+1.1;
        if(side<0){
          if(u<0.1||u>1.7||v<0.08||v>0.92||Math.abs(u-0.9)<0.05||Math.abs(v-0.45)<0.04) return M.FRAME;
          EM=0.55+flashL*0.45;return M.GLASS;
        }
        if(u<0.14||u>1.66||v<0.12||v>0.88) return M.GOLD;
        if(v>0.32&&v<0.42&&((u>0.62&&u<0.75)||(u>1.05&&u<1.18))){EM=0.75;return M.EYE;}
        return M.CANVAS;
      }
      const zz=z*4;
      if((zz|0)&1){const fy=fm(y*4,1),fz=zz%1;if(fz>0.35&&fz<0.65&&fy>0.35&&fy<0.65)return M.PAPER_DOT;return M.PAPER_B;}
      return M.PAPER_A;
    }
    if(s===1){const ax=Math.abs(x);if(ax<0.72)return ax>0.6?M.CARPET_B:M.CARPET;
      return ((Math.floor(x*1.25)+Math.floor(z*1.25))&1)?M.MARBLE_L:M.MARBLE_D;}
    return z%2<0.3?M.BEAM:M.CEIL;
  }
  if(room===1){
    if(s===0){
      if(z%4<0.28||y>0.95) return M.SHELF;
      const yy=y+1.5,shelf=(yy/0.5)|0,f=yy%0.5;
      if(f<0.06) return M.SHELF;

      if((z*9)%1<0.12) return M.SHELF_D;
      return M.BK0+(hv%5);
    }
    if(s===1){const pl=Math.floor(x*3.5),fx=x*3.5-pl;if(fx<0.08)return M.WOOD_GAP;
      const off=(hh(pl+500)%100)/50;if((z+off)%2.2<0.05)return M.WOOD_GAP;return pl&1?M.WOOD_A:M.WOOD_B;}
    if(z%2<0.22||fm(x*1.5,1)<0.1) return M.SHELF;
    return M.LIB_CEIL;
  }
  if(room===2){ // ballroom: mirrors, neon, dance floor pulsing on the beat
    const pulse=1-beatF;
    if(s===0){
      const pz=z%2.5;
      if(pz<0.22) return M.BALL_GOLD;
      if(y>0.8) return y>0.86?M.TILE_D:M.BALL_GOLD;
      if(y<-0.95&&y>-1.08){EM=0.45+pulse*0.5;return ((z/2.5|0)+beatN)&1?M.NEON_M:M.NEON_C;}
      if(y<-1.08) return M.STAGE_CEIL;
      const sh=pz+y*0.6;
      if(fm(sh,1.2)<0.08||fm(sh+0.18,1.2)<0.03) return M.MIRROR_S;
      return M.MIRROR;
    }
    if(s===1){
      const tx=Math.floor(x*1.3),tz=Math.floor(z*1.3);
      if(fm(x*1.3,1)<0.06||fm(z*1.3,1)<0.06) return M.TILE_D;
      const hv=hh(tx*73856093^tz*19349663^(beatN*83492791));
      if((hv&3)===0){EM=0.35+pulse*0.55;return M.TILE_M+((hv>>2)&3);}
      return M.TILE_D;

    return M.STAGE_CEIL;
  }
  if(s===0){

  e.ox=clamp(e.ox+e.pdx*k*dt,-1.2,1.2);e.oy=clamp(e.oy+e.pdy*k*0.6*dt,-0.5,0.5);
}
function updateEnt(e,dt){
  e.t+=dt;
  if(e.state==='cap'){e.ct+=dt;if(e.ct>=e.cdur){e.dead=true;burst(TRAPX,TRAPY-4,10,['#ffe066','#fff6c8','#7dff6a'],50);sfx('snap');
      if(e.type==='boss'){whiteFlash=1;endT=2.4;bossRef=null;}}return;}
  if(e.state==='live'&&!isShot(e)&&e.type!=='lumi'&&e.type!=='flyby'){
    if(e.held)struggle(e,dt);else{e.ox*=Math.pow(0.3,dt);e.oy*=Math.pow(0.3,dt);e.pull=Math.max(0,e.pull-dt*0.4);}
  }
  if(e.stun>0&&e.state==='live'&&e.type!=='boss'){
    e.stun-=dt;if(e.type==='sheet')e.alpha=1;
    if(e.type==='shade')e.reveal=Math.max(e.reveal,0.5);
    if(e.held)e.z+=0.3*dt;
    return;
  }
  const d=e.z-camZ;
  switch(e.type){
    case 'ghoul':
      if(e.state==='live'){if(!e.held)e.z-=e.spd*dt;else e.z+=0.4*dt;
        e.x=e.bx+Math.sin(e.t*e.wf+e.ph)*0.7;e.y=-0.15+Math.sin(e.t*3.1+e.ph)*0.18;
        if(d<1.5)e.state='attack';}
      else if(e.state==='attack')attackStep(e,dt);
      break;
    case 'sheet':
      if(e.state==='live'){e.rise+=dt;e.y=lerp(1.0,-0.2,Math.min(1,e.rise));
        e.alpha=e.rise<1?e.rise:0.62+0.42*Math.sin(e.t*1.8);
        if(!e.held)e.z-=e.spd*dt;else e.z+=0.3*dt;
        e.x=e.bx+Math.sin(e.t*0.8+e.ph)*0.4;
        if(d<1.6){e.state='attack';e.alpha=1;}}
      else if(e.state==='attack')attackStep(e,dt);
      break;
    case 'skull':
      if(e.state==='live'){
        if(e.shots<3){if(d>6.5&&!e.held)e.z-=1.8*dt;if(e.held)e.z+=0.4*dt;
          e.x=Math.sin(e.t*0.9+e.ph)*1.3;e.y=-0.45+Math.sin(e.t*2)*0.15;
          e.shotT-=dt;if(e.shotT<=0&&d<8){spawnShot(e);e.shots++;e.shotT=2.4;}}
        else{if(!e.held)e.z-=2.4*dt;else e.z+=0.4*dt;e.x*=0.99;}
        if(Math.random()<dt*14){const p=proj(e.x+e.ox,e.y+e.oy+e.size*0.35,e.z);if(p)parts.push({x:p.sx+rnd(-2,2),y:p.sy,vx:rnd(-4,4),vy:rnd(6,16),life:0.4,t:0,col:Math.random()<.5?'#8fdcff':'#2c5fd0'});}
        if(e.z-camZ<1.5)e.state='attack';}
      else if(e.state==='attack')attackStep(e,dt);
      break;
    case 'idol':
      if(e.state==='live'){
        if(d>e.hold&&!e.held)e.z-=1.7*dt;if(e.held)e.z+=0.3*dt;
        if(e.beat!==beatN){e.beat=beatN;e.pose=(e.pose+1)%4;
          const step=[0,0.55,0,-0.55][e.pose]*(e.trio?0.55:1);
          e.tx=e.ax+step;e.ty=-0.28+((e.pose&1)?-0.2:0.08);e.bounce=1;
          if(d<e.hold+1.5){e.toShot--;if(e.toShot<=0){spawnShot(e,'note');e.notes++;e.toShot=e.trio?6:4;}}
          if(!e.trio&&e.notes>=4)e.hold=1.2;
        }
        e.bounce=Math.max(0,e.bounce-dt*4);
        const k=Math.min(1,dt*14);e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;
        if(Math.random()<dt*6){const p=proj(e.x+e.ox,e.y+e.oy,e.z);if(p)parts.push({x:p.sx+rnd(-10,10),y:p.sy+rnd(-10,10),vx:0,vy:-10,life:0.5,t:0,col:Math.random()<.5?'#ff3fa4':'#3fe8ff'});}
        if(d<1.5)e.state='attack';}
      else if(e.state==='attack')attackStep(e,dt);
      break;
    case 'shade':
      e.reveal=Math.max(0,e.reveal-dt);
      e.alpha=e.reveal>0?Math.min(1,e.reveal*2):0.07+0.05*Math.sin(e.t*7);
      e.x=e.bx+Math.sin(e.t*0.6)*1.4;e.y=-0.5+Math.sin(e.t*1.7)*0.2;
      e.life-=dt;if(e.life<=0&&e.reveal<=0)e.dead=true;
      break;
    case 'flyby':
      e.x+=e.dir*2.6*dt;e.z=camZ+e.rd+(e.held?0.3:0);e.y=-0.3+Math.sin(e.t*5)*0.25;
      if(e.dir*e.x>3.6)e.dead=true;
      break;
    case 'ecto':case 'note':
      e.z-=e.spd*dt;{const k=Math.min(1,dt*1.3);e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;}
      if(e.type==='note')e.oy=Math.sin(e.t*8+e.ph)*0.08;
      if(e.z-camZ<0.6){e.dead=true;const p=proj(e.x,e.y,camZ+0.6);
        if(mode==='play'){splats.push({x:p?p.sx:160,y:p?p.sy:90,r:rnd(16,24),t:0,seed:Math.random()*99,note:e.type==='note'});damagePlayer(1);}}
      break;
    case 'lumi':
      if(e.state==='live'){e.x+=e.dir*0.62*dt;e.z=camZ+e.rd;e.y=-0.2+Math.sin(e.t*2.4)*0.15;
        if(Math.random()<dt*10){const p=proj(e.x,e.y,e.z);if(p)parts.push({x:p.sx+rnd(-8,8),y:p.sy+rnd(-6,8),vx:0,vy:-8,life:0.6,t:0,col:'#ffe066'});}
        if(e.dir*e.x>2.8){e.dead=true;lumiSaved++;score+=500;sfx('lumi');
          const cx=e.dir>0?260:60;addText('MERCI ! +500',cx,70,'#ff9ab8',1.6);
          if(hp<MAXHP){hp++;addText('+1 COURAGE',cx,82,'#ff9ab8',1.6);}}}
      else{e.y-=1.5*dt;e.rd+=3*dt;e.z=camZ+e.rd;e.x+=e.dir*1.2*dt;e.alpha-=dt*0.7;if(e.alpha<=0)e.dead=true;}
      break;
    case 'boss':
      e.enter+=dt;e.alpha=Math.min(1,e.enter/1.5);
      if(e.stun>0){e.stun-=dt;e.z=camZ+6.2+(e.held?0.3:0);break;}
      e.z=camZ+6.2+Math.sin(e.t*0.5)*0.6+(e.held?0.3:0);
      e.x=Math.sin(e.t*0.65)*1.25;e.y=lerp(1.2,-0.35+Math.sin(e.t*1.3)*0.25,Math.min(1,e.enter/1.5));
      if(e.enter<1.6)break;
      e.shT-=dt;if(e.shT<=0){e.shield=!e.shield;e.shT=e.shield?3.5:4;}
      e.atkT-=dt;if(e.atkT<=0){for(let i=0;i<3;i++)spawnShot(e);e.atkT=3.4-(1-e.hp/e.maxhp)*1.3;}
      e.sumT-=dt;if(e.sumT<=0){const a=spawn('ghoul',e.x-0.8),b=spawn('ghoul',e.x+0.8);a.z=b.z=e.z;e.sumT=9;}
      break;
  }
}

/* ================= actions ================= */
function doFlash(){
  if(mode!=='play'||flashCD>0)return;
  flashCD=FLASH_CD;sfx('flash');flashes.push({x:input.x,y:input.y,t:0});
  let hit=false;
  for(const e of ents){
    if(e.state!=='live'||!(e.rw>0)||isShot(e))continue;
    const cx=e.rx+e.rw/2,cy=e.ry+e.rh/2,dist=Math.hypot(cx-input.x,cy-input.y),reach=FLASH_R+Math.max(e.rw,e.rh)*0.35;
    if(e.type==='shade'&&dist<reach*1.8){e.reveal=3.5;if(dist<reach)e.stun=2.4;hit=true;continue;}
    if(dist>reach)continue;
    if(e.type==='sheet'&&e.alpha<0.4)continue;
    if(e.friendly){if(e.state==='live'&&!e.giggled){e.giggled=true;addText('HIHI !',cx,e.ry-10,'#ff9ab8');sfx('giggle');}continue;}
    if(e.type==='boss'){if(e.enter<1.6)continue;
      if(e.shield){e.shield=false;e.shT=4.5;addText('BOUCLIER BRISÉ !',cx,e.ry-10,'#3fe8ff',1.4);sfx('shatter');burst(cx,cy,24,['#ff3344','#3fe8ff','#fff6c8'],90);}
      e.stun=1.8;hit=true;continue;}
    e.stun=2.4;hit=true;
  }
  if(hit)showTip('slam',touchUI()?'MAINTIENS TIRE PUIS GLISSE À L\'OPPOSÉ':'TIRE PUIS TIRE À L\'OPPOSÉ : SLAM !',4.5);
}
function doHymn(){
  if(mode!=='play'||voix<1||hymnT>0)return;
  voix=0;hymnT=0.001;hymnDone=false;sfx('hymn');whiteFlash=0.25;
}
function slam(e){
  e.pull=0;e.hp-=e.maxhp*0.6;shake=RM?0:0.25;score+=100;
  const cx=e.rx+e.rw/2,cy=e.ry+e.rh/2;addText('SLAM ! +100',cx,e.ry-14,'#ff9a2e',1.2);burst(cx,cy,16,['#ff9a2e','#fff6c8','#ffe066'],90);sfx('slam');
  dropCoins(cx,cy,2,false);
  if(e.hp<=0)capture(e);
}

/* ================= update ================= */
function update(dt){
  frameN++;modeT+=dt;
  if(paused)return;
  // beat clock (synced to the scheduled music when it plays)
  if(AC&&musicOn){
    while(beatQ.length&&beatQ[0]<=AC.currentTime){lastBeatT=beatQ.shift();beatN++;}
    beatF=clamp((AC.currentTime-lastBeatT)*track.bpm/60,0,1);
  }else{beatQ.length=0;beatAcc+=dt*track.bpm/60;if(beatAcc>=1){beatAcc-=1;beatN++;}beatF=beatAcc;}
  flashL=Math.max(0,flashL-dt*3);
  lightT-=dt;
  if(lightT<=0){lightT=rnd(4,9);if(!RM&&(mode==='title'||camZ<50)){flashL=1;setTimeout(()=>{flashL=0.8;},120);}}
  whiteFlash=Math.max(0,whiteFlash-dt*1.2);redFlash=Math.max(0,redFlash-dt*2);
  shake=Math.max(0,shake-dt);
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;}
  parts=parts.filter(p=>p.t<p.life);
  for(const t of texts){t.t+=dt;t.y-=12*dt;}
  texts=texts.filter(t=>t.t<t.life);
  for(const f of flashes)f.t+=dt;flashes=flashes.filter(f=>f.t<0.3);
  if(mode==='title'){camZ=(camZ+dt*1.3)%42;HZ=CY;return;}
  if(mode==='over'||mode==='win'){return;}
  gtime+=dt;
  if(mode==='dying'&&modeT>1.4){endGame(false);return;}
  if(endT>0){endT-=dt;if(endT<=0){endGame(true);return;}}
  // rail
  if(railState==='move'){
    const st=STOPS[stopIdx];
    camZ+=3.4*dt;walk+=dt;
    if(st&&camZ>=st.z){camZ=st.z;railState='stop';stopT=0;queue=st.sp.map(a=>({t:a[0],type:a[1],x:a[2]}));clearT=0;
      if(stopIdx===0)showTip('flash',touchUI()?'FLASH POUR ÉTOURDIR, PUIS TIRE':'FLASH (F/CLIC DROIT) PUIS RAYON',5);}
    cruiseT-=dt;if(cruiseT<=0&&camZ<188){spawn('flyby',Math.random()<.5?-1:1);cruiseT=rnd(2.5,5);}
  }else{
    stopT+=dt;
    while(queue.length&&queue[0].t<=stopT){const q=queue.shift();spawn(q.type,q.x);}
    if(!queue.length&&!ents.some(e=>e.blocks&&e.state!=='cap'&&!e.dead)&&!bossRef&&endT<=0){
      clearT+=dt;if(clearT>0.9){railState='move';stopIdx++;}}
  }
  HZ=CY+(railState==='move'&&!RM?Math.round(Math.sin(walk*9)):0);
  const r=roomAt(camZ);
  if(r!==roomIdx){roomIdx=r;banner={s:ROOMS[r],sub:'ÉTAGE '+(r+1),t:0,life:2.6};if(!bossRef)setTrack(r===2?TRACKS.idol:TRACKS.manor);}
  if(banner){banner.t+=dt;if(banner.t>banner.life)banner=null;}
  if(tip){tip.t-=dt;if(tip.t<=0)tip=null;}
  // keyboard aim
  const k=input.keys,sp=170*dt;
  if(k.ArrowLeft||k.KeyA||k.KeyQ)input.x-=sp;if(k.ArrowRight||k.KeyD)input.x+=sp;
  if(k.ArrowUp||k.KeyW||k.KeyZ)input.y-=sp;if(k.ArrowDown||k.KeyS)input.y+=sp;
  input.x=clamp(input.x,2,W-3);input.y=clamp(input.y,2,H-3);
  if(dt>0){input.vx=lerp(input.vx,(input.x-input.px)/dt,0.5);input.vy=lerp(input.vy,(input.y-input.py)/dt,0.5);}
  input.px=input.x;input.py=input.y;
  flashCD=Math.max(0,flashCD-dt);
  // beam
  for(const e of ents)e.held=false;
  inv=Math.max(0,inv-dt);
  const firing=mode==='play'&&(input.down||k.Space||k.KeyX)&&!input.lock&&overheat<=0;
  if(overheat>0){overheat-=dt;if(overheat<=0)heat=0.55;}
  if(firing){
    heat+=0.27*dt;
    if(heat>=1){heat=1;overheat=1.7;sfx('overheat');addText('SURCHAUFFE !',60,150,'#ff3344',1.4);lockT=null;}
    let tg=null;
    if(lockT&&hittable(lockT)&&near(lockT,touchUI()?22:14))tg=lockT;else tg=pick(input.x,input.y);
    lockT=tg&&!isShot(tg)&&!tg.friendly?tg:null;
    if(tg)applyBeam(tg,dt);
    if(Math.random()<dt*30)parts.push({x:input.x,y:input.y,vx:rnd(-40,40),vy:rnd(-40,10),life:0.25,t:0,col:Math.random()<.5?'#ff9a2e':'#fff6c8'});
  }else{lockT=null;if(overheat<=0)heat=Math.max(0,heat-0.55*dt);}
  setBeam(firing);
  // hymn
  if(hymnT>0){hymnT+=dt;
    if(!hymnDone&&hymnT>0.35){hymnDone=true;
      for(const e of ents){if(e.state!=='live'||e.friendly||!(e.rw>0))continue;
        if(isShot(e)){e.dead=true;burst(e.rx+e.rw/2,e.ry+e.rh/2,6,['#ffd34a','#fff6c8'],50);continue;}
        if(e.type==='boss'){e.hp-=3;e.shield=false;e.stun=2;if(e.hp<=0)capture(e,true);continue;}
        if(e.type==='shade')e.reveal=1;
        capture(e,true);}}
    if(hymnT>1.6)hymnT=0;}
  for(const e of ents)updateEnt(e,dt);
  ents=ents.filter(e=>!e.dead);
  for(const s of splats)s.t+=dt;
  splats=splats.filter(s=>s.t<3.5);
  for(const c of coins){c.t+=dt;if(c.t>=c.dur&&!c.done){c.done=true;score+=c.val;sfx('coin');}}
  coins=coins.filter(c=>!c.done);
}
function near(e,m){return input.x>=e.rx-m&&input.x<=e.rx+e.rw+m&&input.y>=e.ry-m&&input.y<=e.ry+e.rh+m;}
function pick(ax,ay){
  let best=null;const m=touchUI()?8:3;
  for(const e of ents){if(!hittable(e))continue;
    if(ax>=e.rx-m&&ax<=e.rx+e.rw+m&&ay>=e.ry-m&&ay<=e.ry+e.rh+m){if(!best||e.z<best.z)best=e;}}
  return best;
}
function applyBeam(e,dt){
  if(e.friendly){
    if(e.state==='live'){e.state='flee';lumiHurt++;damagePlayer(1,true);sfx('sad');addText('AÏE ! PAS LUMI !',e.rx+e.rw/2,e.ry-10,'#ff9ab8',1.6);}
    return;
  }
  if(e.type==='boss'&&e.shield){
    if(Math.random()<dt*20){burst(input.x,input.y,2,['#ff3344','#ffe066'],70);sfx('shield');}
    if(!texts.some(t=>t.s==='BOUCLIER ! FLASHE-LA'))addText('BOUCLIER ! FLASHE-LA',e.rx+e.rw/2,e.ry-8,'#ff3344',0.9);
    return;
  }
  if(isShot(e)){e.hp-=BEAM_DPS*dt;if(e.hp<=0){e.dead=true;score+=20;burst(input.x,input.y,8,e.type==='note'?['#ff3fa4','#fff6c8']:['#7dff6a','#b9ff8c','#2f8f3a'],60);sfx('pop');}return;}
  e.held=true;
  e.hp-=BEAM_DPS*(e.stun>0?1:WEAK)*dt;
  // tug-of-war: dragging the aim against the ghost's pull charges a slam
  const along=-(input.vx*e.pdx+input.vy*e.pdy);
  if(along>25)e.pull+=dt*Math.min(along,260)/170;
  if(Math.random()<dt*25){parts.push({x:e.rx+e.rw/2+rnd(-6,6),y:e.ry+e.rh/2+rnd(-6,6),vx:(236-e.rx)*1.2,vy:(159-e.ry)*1.2,life:0.35,t:0,col:'#cdb0ff'});}
  if(e.pull>=1){slam(e);return;}
  if(e.hp<=0)capture(e);
}
function endGame(won){
  setBeam(false);musicOn=false;
  if(score>hi){hi=score;store.set('spectro-hi',String(hi));}
  setMode(won?'win':'over');input.lock=true;
  if(won)sfx('win');
}

/* ================= drawing ================= */
function text(s,x,y,col,align,size,outline){
  ctx.font=(size||8)+'px '+FONT;ctx.textAlign=align||'left';ctx.textBaseline='top';
  x=Math.round(x);y=Math.round(y);
  ctx.fillStyle=outline||'#140a22';
  ctx.fillText(s,x-1,y);ctx.fillText(s,x+1,y);ctx.fillText(s,x,y-1);ctx.fillText(s,x,y+1);ctx.fillText(s,x+1,y+1);
  ctx.fillStyle=col||'#f6f2ff';ctx.fillText(s,x,y);
}
function spriteFor(e){
  switch(e.type){
    case 'ghoul':case 'flyby':return e.stun>0?'GHOUL_STUN':(((e.t*5)|0)&1?'GHOUL_B':'GHOUL_A');
    case 'sheet':return 'SHEET';case 'skull':return 'SKULL';case 'ecto':return 'ECTO';case 'note':return 'NOTE';
    case 'boss':return 'BOSS';case 'idol':return 'IDOL';case 'shade':return 'SHADE';
    case 'lumi':return e.state==='flee'?'LUMI_SAD':(((e.t*4)|0)&1?'LUMI_A':'LUMI_B');
  }
}
function drawEnt(e){
  const d=e.z-camZ;if(d<0.25){e.rw=0;return;}
  const s=F/d,size=Math.max(2,e.size*s);
  const sx=CX+(e.x+(e.ox||0))*s,sy=HZ+(e.y+(e.oy||0))*s;
  const a=clamp(e.alpha*Math.min(1,1.25-d/MAXD),0,1);
  if(!isShot(e)&&e.type!=='shade'){
    ctx.globalAlpha=0.3*a;ctx.fillStyle='#000';ctx.beginPath();
    ctx.ellipse(Math.round(sx),Math.round(HZ+FLOORY*s),size*0.32,Math.max(1,size*0.07),0,0,Math.PI*2);ctx.fill();
  }
  const beatPulse=Math.pow(1-beatF,3)*0.06;
  let q=isShot(e)?0:Math.sin(e.t*6+e.ph)*0.06+beatPulse;
  if(e.type==='idol')q=e.bounce*0.18;
  if(e.stun>0)q=Math.sin(gtime*40)*0.03;
  let w=size*(1+q),h=size*(1-q);
  let ox=0,oy=0;if(e.held){ox=(frameN&1)?1:-1;oy=(frameN&2)?1:0;}
  const x0=Math.round(sx-w/2+ox),y0=Math.round(sy-h/2+oy),wi=Math.max(1,Math.round(w)),hi_=Math.max(1,Math.round(h));
  const key=spriteFor(e);
  if(e.type==='boss'&&e.shield){ctx.globalAlpha=a*(0.45+0.3*Math.sin(gtime*20));const g=1.14;
    ctx.drawImage(BOSS_RED,Math.round(sx-w*g/2),Math.round(sy-h*g/2),Math.round(w*g),Math.round(h*g));}
  if(e.type==='idol'){ctx.globalAlpha=a*(0.25+0.4*(1-beatF));const g=1.18;
    ctx.drawImage(IDOL_GLOW,Math.round(sx-w*g/2),Math.round(sy-h*g/2),Math.round(w*g),Math.round(h*g));}
  ctx.globalAlpha=a;ctx.drawImage(SPR[key],x0,y0,wi,hi_);
  if((e.held&&(frameN&2))||(e.stun>0&&(frameN&8)&&!e.held)){ctx.globalAlpha=a*(e.held?0.75:0.35);ctx.drawImage(SIL[key],x0,y0,wi,hi_);}
  ctx.globalAlpha=1;
  e.rx=x0;e.ry=y0;e.rw=wi;e.rh=hi_;
  if(e.type==='shade'&&e.reveal<=0&&(frameN&16)&&d<9){ctx.globalAlpha=0.5;text('?',sx,sy-4,'#8fdcff','center');ctx.globalAlpha=1;}
  // stunned: stars + heart counter

  if(isTouch(ev)){if(ev.pointerId!==input.tid)return;
    input.x=clamp(input.x+(p[0]-input.lx)*TOUCH_SENS,2,W-3);input.y=clamp(input.y+(p[1]-input.ly)*TOUCH_SENS,2,H-3);
    input.lx=p[0];input.ly=p[1];return;}
  input.x=clamp(p[0],2,W-3);input.y=clamp(p[1],2,H-3);});
const up=ev=>{
  if(isTouch(ev)){if(ev.pointerId===input.tid)input.tid=null;if(ev.pointerId===input.fid){input.fid=null;input.down=false;input.lock=false;}return;}
  if(ev.button===2)return;
  input.down=false;input.lock=false;};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',ev=>{
  if(ev.target&&ev.target.tagName==='BUTTON'&&(ev.code==='Space'||ev.code==='Enter'))return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(ev.code))ev.preventDefault();
  if(ev.repeat)return;
  if(ev.code==='KeyP'||ev.code==='Escape'){if(mode==='play'){paused=!paused;setBeam(false);}return;}
  if(ev.code==='KeyM'){initAudio();setMute(!muted);return;}
  if(ev.code==='Enter'||ev.code==='Space'){if(primary())return;}
  if(ev.code==='KeyF'||ev.code==='KeyC'){doFlash();return;}
  if(ev.code==='KeyE'){doHymn();return;}
  input.keys[ev.code]=true;
});
addEventListener('keyup',ev=>{input.keys[ev.code]=false;if(ev.code==='Space'||ev.code==='Enter')input.lock=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='play'){paused=true;setBeam(false);}});
addEventListener('blur',()=>{input.down=false;input.keys={};setBeam(false);});

/* ================= buttons ================= */
['bSound','bFull','bInstall'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));
$('bSound').addEventListener('click',()=>{initAudio();setMute(!muted);});
setMute(muted);
const frame=$('frame');
const canFS=!!(frame.requestFullscreen||frame.webkitRequestFullscreen);
if(!canFS)$('bFull').hidden=true;
$('bFull').setAttribute('aria-label','Plein écran');
$('bFull').addEventListener('click',()=>{
  const el=$('stage');
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
  const r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});
});
let deferredInstall=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('bInstall').hidden=false;});
$('bInstall').addEventListener('click',async()=>{if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;$('bInstall').hidden=true;});
addEventListener('appinstalled',()=>{$('bInstall').hidden=true;});
if('serviceWorker' in navigator&&document.querySelector('link[rel="manifest"]')){
  addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}

/* ================= layout ================= */
const stage=$('stage');
function fit(){
  const cs=getComputedStyle(stage);
  const hint=$('hint'),hh_=hint.offsetParent?hint.offsetHeight+10:0;
  const aw=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-hh_;
  let s=Math.min(aw/W,ah/H);if(s>=3)s=Math.floor(s);s=Math.max(0.5,s);
  frame.style.width=Math.floor(W*s)+'px';frame.style.height=Math.floor(H*s)+'px';
}
addEventListener('resize',fit);fit();

/* ================= debug hook (tests only) ================= */
window.__spectro={jump(z){camZ=z;stopIdx=STOPS.findIndex(s=>s.z>=z);railState='move';},state:()=>({mode,camZ,stopIdx,score,hp,beatN,ents:ents.length,voix}),fill(){voix=1;},god(){hp=99;}};

/* ================= loop ================= */
let last=performance.now();
function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.05)dt=0.05;if(dt<0)dt=0;update(dt);draw();requestAnimationFrame(loop);}
if(document.fonts&&document.fonts.load){document.fonts.load('8px "Press Start 2P"').catch(()=>{});}
requestAnimationFrame(loop);
})();
</script>
