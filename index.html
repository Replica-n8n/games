<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcade</title>
<meta name="description" content="Cinq jeux dans une seule app, à jouer sur le téléphone, sans réseau et sans publicité.">
<meta name="theme-color" content="#0d0d14">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<link rel="apple-touch-icon" href="./icone-192.png">
<link rel="preload" href="./polices/unbounded-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* L'ARCADE : une seule app pour tous les jeux (direction « mosaïque », choisie
   par Julie le 2026-10-05). Chaque jeu garde SES couleurs, et la grande tuile est
   toujours le dernier jeu joué. La liste des jeux est le tableau JEUX plus bas ;
   Petit Plus contre Petit Minus n'y entre JAMAIS (c'est un outil pour un enfant,
   il a sa propre icône). */
@font-face{font-family:'Unbounded';font-weight:600 800;font-display:swap;src:url(./polices/unbounded-latin.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:500 700;font-display:swap;src:url(./polices/outfit-latin.woff2) format('woff2')}
:root{color-scheme:dark;--fond:#0d0d14;--texte:#ffffff;--texte2:#b9b6c9;--titre:'Unbounded',system-ui,sans-serif;--corps:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--fond)}
body{margin:0;background:var(--fond);color:var(--texte);font:500 16px var(--corps);-webkit-tap-highlight-color:transparent;
  padding:env(safe-area-inset-top,0) 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
.page{max-width:460px;margin:0 auto}
header{padding:20px 6px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font:800 30px/1 var(--titre)}
#etat{font-size:14px;color:var(--texte2);text-align:right}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.tuile{position:relative;display:block;border-radius:26px;overflow:hidden;height:150px;background:var(--c);color:var(--t,#fff);padding:14px;text-decoration:none;
  transition:transform .15s cubic-bezier(.25,1,.5,1)}
a.tuile:active{transform:scale(.97)}
a.tuile:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:3px}
a.tuile img{position:absolute;right:-14px;bottom:-14px;width:112px;height:112px;border-radius:26px;transform:rotate(8deg);box-shadow:0 8px 18px rgba(0,0,0,.35)}
a.tuile b{display:block;font:600 16px/1.15 var(--titre);max-width:9ch}
a.tuile.grand{grid-column:1/3;height:176px}
a.tuile.grand b{font-size:24px;max-width:none}
a.tuile.grand small{display:block;margin-top:6px;font-size:15px}
a.tuile.grand img{width:150px;height:150px;right:-10px;bottom:-22px}
a.tuile.grand i{position:absolute;left:14px;bottom:14px;font-style:normal;font-weight:700;font-size:16px;background:#fff;color:#0d0d14;padding:12px 20px;border-radius:24px}
.pied{margin-top:24px;display:flex;flex-direction:column;gap:12px}
#instAide{margin:0;font-size:15px;line-height:1.35;color:var(--texte);text-align:center;text-wrap:balance}
#instBtn{font:700 17px var(--corps);height:56px;border:0;border-radius:28px;background:#fff;color:#0d0d14;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="page">
  <header><h1>Arcade</h1><span id="etat" role="status"></span></header>
  <main class="grille" id="grille"></main>
  <div class="pied">
    <p id="instAide" hidden></p>
    <button type="button" id="instBtn" hidden>Installer l'arcade</button>
  </div>
</div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
/* Un jeu = son dossier, son nom, sa couleur (celle de SON monde, pas de l'arcade)
   et la couleur de son texte. Ajouter un jeu : une ligne ici, et son dossier dans
   JEUX de sw.js n'est pas nécessaire (l'arcade installe le service de chaque jeu). */
var JEUX=[
 {id:'bataille',nom:'La Bataille',c:'linear-gradient(#000644,#202a6b)',t:'#ffffff'},
 {id:'toto',nom:'Teeth of the Ocean',c:'#0b5b78',t:'#ffffff'},
 {id:'paper-race',nom:'Paper Race',c:'#f3ecd9',t:'#1b2a4a'},
 {id:'serpentin',nom:'Le chevalier',c:'#2c7436',t:'#ffffff'},
 {id:'echecs',nom:'Échecs et Dames',c:'#6b4a2b',t:'#ffffff'}
];
function lis(cle){try{return localStorage.getItem(cle);}catch(e){return null;}}
function ecris(cle,v){try{localStorage.setItem(cle,v);}catch(e){}}
/* Ce que l'arcade sait d'une partie en cours : elle partage l'adresse des jeux,
   donc leurs sauvegardes. Pour l'instant seule La Bataille dit où elle en est. */
function encours(id){
  if(id==='bataille'){try{var p=JSON.parse(lis('bataille-partie'));if(p&&p.round)return'Mois '+p.round+' sur 12';}catch(e){}}
  return'';}
function peindre(){var dernier=lis('arcade-dernier'),liste=JEUX.slice(),g=$('grille');
  liste.sort(function(a,b){return(b.id===dernier)-(a.id===dernier);});g.innerHTML='';
  liste.forEach(function(j,i){var a=document.createElement('a');a.className='tuile'+(i===0?' grand':'');a.href='./'+j.id+'/';a.style.setProperty('--c',j.c);a.style.setProperty('--t',j.t);a.dataset.jeu=j.id;
    var b=document.createElement('b');b.textContent=j.nom;a.appendChild(b);
    if(i===0){var d=encours(j.id);if(d){var s=document.createElement('small');s.textContent=d;a.appendChild(s);}
      var bouton=document.createElement('i');bouton.textContent=j.id===dernier?'Reprendre':'Jouer';a.appendChild(bouton);}
    var im=document.createElement('img');im.src='./'+j.id+'/icone-192.png';im.alt='';im.width=192;im.height=192;a.appendChild(im);
    a.addEventListener('click',function(){ecris('arcade-dernier',j.id);});g.appendChild(a);});}
peindre();
/* Revenir d'un jeu (bouton retour) : la grande tuile doit être ce jeu-là. */
addEventListener('pageshow',peindre);

/* Installation : le bouton est là tant que l'arcade n'est pas installée. */
var invitation=null;
function installe(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;}
function majInstaller(){$('instBtn').hidden=installe();if(installe())$('instAide').hidden=true;}
addEventListener('beforeinstallprompt',function(e){e.preventDefault();invitation=e;majInstaller();});
addEventListener('appinstalled',function(){invitation=null;majInstaller();});
$('instBtn').addEventListener('click',function(){
  if(invitation){var i=invitation;invitation=null;i.prompt();if(i.userChoice&&i.userChoice.then)i.userChoice.then(majInstaller,majInstaller);return;}
  var a=$('instAide');a.textContent=/iPhone|iPad|iPod/.test(navigator.userAgent)?'Touche Partager, puis « Sur l’écran d’accueil ».':'Ouvre le menu du navigateur, puis « Ajouter à l’écran d’accueil ».';a.hidden=!a.hidden;});
majInstaller();

/* UNE installation, TOUS les jeux : l'arcade installe elle-même le service de
   chaque jeu (chacun range alors ses propres fichiers, environ 1 Mo en tout).
   Les jeux restent autonomes : leurs adresses, leurs caches et leurs mises à jour
   ne changent pas. */
if('serviceWorker' in navigator){
  var prets=0,etat=$('etat');
  /* « hors ligne » ne s'affiche que si le service de l'ARCADE est prêt lui aussi :
     sans lui, les jeux marcheraient sans réseau mais pas la page qui y mène. */
  var total=JEUX.length+1,dire=function(){etat.textContent=prets>=total?JEUX.length+' jeux · hors ligne':'Téléchargement '+Math.min(prets,JEUX.length)+' sur '+JEUX.length;};
  var actif=function(reg){return new Promise(function(ok){
    if(reg.active){ok();return;}var w=reg.installing||reg.waiting;if(!w){ok();return;}
    w.addEventListener('statechange',function(){if(w.state==='activated'||w.state==='redundant')ok();});});};
  dire();
  navigator.serviceWorker.register('./sw.js').then(function(reg){reg.update().catch(function(){});return actif(reg);}).then(function(){prets++;dire();},function(){dire();});
  JEUX.forEach(function(j){
    navigator.serviceWorker.register('./'+j.id+'/sw.js',{scope:'./'+j.id+'/'}).then(function(reg){reg.update().catch(function(){});return actif(reg);})
      .then(function(){prets++;dire();},function(){dire();});});
}else $('etat').textContent=JEUX.length+' jeux';
})();
</script>
</body>
</html>
