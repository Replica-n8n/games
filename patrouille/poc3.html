<title>Patrouille POC 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* POC 3 : la sensation de chaque véhicule. Formes simples, aucun graphisme définitif.
   Écran de jeu unique, sombre par choix ; le canvas au centre, l'interface posée dessus. */
:root{
  --fond:#0a0f2e; --panneau:#141c4a; --trait:#2a3570; --texte:#eef0ff; --doux:#b8c0f0;
  --accent:#fabc41; --sur-accent:#271900;
  --police:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--fond);color:var(--texte);font-family:var(--police);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cadre{position:relative;height:100%;display:grid;place-items:center}
#jeu{position:relative;touch-action:none}
canvas{display:block}
button{font:inherit;touch-action:manipulation;cursor:pointer}
.ecran{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:20px 16px;background:rgba(6,9,30,.93);text-align:center;overflow:auto}
.ecran h1{font-size:26px;line-height:1.1;font-weight:800;text-wrap:balance}
.ecran h2{font-size:24px;font-weight:800}
.ecran p{color:var(--doux);font-size:15px;line-height:1.4;max-width:32ch}
.gros{min-height:60px;min-width:240px;padding:0 20px;border:0;border-radius:18px;background:var(--accent);color:var(--sur-accent);font-size:20px;font-weight:800;box-shadow:0 5px 0 #8a6200}
.moyen{min-height:48px;min-width:180px;padding:0 18px;border:2px solid var(--doux);border-radius:14px;background:transparent;color:var(--texte);font-size:17px;font-weight:700}
#garage{display:grid;gap:10px;width:min(330px,100%)}
.vehicule{min-height:72px;border-radius:16px;border:2px solid var(--c);background:var(--panneau);color:var(--texte);text-align:left;padding:10px 14px;display:grid;gap:2px}
.vehicule b{font-size:17px;color:var(--c)}
.vehicule small{font-size:14px;color:var(--doux);line-height:1.3}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
details{width:min(330px,100%);text-align:left;border:1px solid var(--trait);border-radius:12px;padding:6px 12px}
summary{min-height:36px;display:flex;align-items:center;color:var(--doux);font-size:15px;cursor:pointer}
label{display:flex;align-items:center;gap:10px;font-size:15px;min-height:34px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.bilan{display:grid;gap:6px;width:min(300px,100%);text-align:left;font-size:16px;padding:12px;border-radius:14px;background:var(--panneau)}
.rond{position:absolute;border:0;border-radius:50%;display:grid;place-items:center;font-weight:800}
#pause{top:8px;right:8px;width:44px;height:44px;background:rgba(20,28,74,.85);color:var(--texte);font-size:18px}
#superb{right:12px;bottom:12px;width:76px;height:76px;background:#3a426e;color:#9aa3d0;font-size:13px;line-height:1.1;box-shadow:0 4px 0 #1a1f40}
#superb.pret{background:var(--accent);color:var(--sur-accent);box-shadow:0 4px 0 #8a6200,0 0 24px rgba(250,188,65,.8)}
.cache{display:none!important}
</style>

<div id="cadre">
  <div id="jeu">
    <canvas id="toile"></canvas>
    <button id="pause" class="rond cache" aria-label="Pause">II</button>
    <button id="superb" class="rond cache" aria-label="Super-pouvoir">SUPER</button>

    <section id="menu" class="ecran">
      <h1>Le garage d'essai</h1>
      <p>Une mission courte par véhicule, pour sentir comment chacun se pilote.</p>
      <div id="garage"></div>
      <details>
        <summary>Réglages de test</summary>
        <label><input type="checkbox" id="o-zone"> Voir les zones touchées</label>
        <label><input type="checkbox" id="o-invincible"> Invincible</label>
        <label><input type="checkbox" id="o-vite"> Vitesse x2</label>
      </details>
    </section>

    <section id="pausee" class="ecran cache">
      <h2>Pause</h2>
      <button class="gros" id="p-reprendre">Reprendre</button>
      <button class="moyen" id="p-menu">Retour au garage</button>
    </section>

    <section id="mort" class="ecran cache">
      <h2>Oups, plus de cœurs !</h2>
      <button class="gros" id="d-reprendre">Recommencer</button>
      <button class="moyen" id="d-menu">Garage</button>
    </section>

    <section id="bilan" class="ecran cache">
      <h2>Mission réussie !</h2>
      <div class="bilan" id="bilan-liste"></div>
      <button class="gros" id="g-suite">Véhicule suivant</button>
      <button class="moyen" id="g-menu">Garage</button>
    </section>
  </div>
</div>

<script>
'use strict';
// ================= Constantes =================
const W = 360, H = 640, FPS = 60, SEC = FPS;
const DEFIL = 1.2, SENS = 1.25;
const ZT = 4, ZB = 15;
const COUL = { rouge: '#ff3b5c', bleu: '#4fd6ff', bouton: '#ffb347', ami: '#5fd68a' };
const toile = document.getElementById('toile');
const ctx = toile.getContext('2d');
const $ = (id) => document.getElementById(id);
let echelle = 1;
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const hasard = (a, b) => a + Math.random() * (b - a);
const borne = (v, a, b) => Math.max(a, Math.min(b, v));

// ================= Les 4 véhicules : chacun sa façon de bouger =================
// direct : le jouet glisse vers la cible du doigt (lissage).
// inertie : la cible tire le véhicule comme un ressort ; il prend de l'élan et freine lentement.
const VEH = {
  avion:     { nom: 'Avion', planete: 'Jungle', c: '#5fd68a', type: 'direct', lissage: 0.35, zone: [80, H - 100],
    texte: 'Libre et vif. Des ennemis surgissent du feuillage.' },
  rover:     { nom: 'Rover', planete: 'Désert', c: '#ffb86a', type: 'inertie', raideur: 0.03, acc: 0.6, frX: 0.93, frY: 0.86, vmax: 5.5, vmaxY: 3, zone: [H * 0.48, H - 100],
    texte: 'Il colle au sol : élan, dérapages, poussière. Rochers, sable mou et tremplins.' },
  sousmarin: { nom: 'Sous-marin', planete: 'Océan', c: '#53d5ff', type: 'inertie', raideur: 0.014, acc: 0.24, frX: 0.955, frY: 0.955, vmax: 3.2, vmaxY: 3.2, zone: [80, H - 100], bas: true,
    texte: 'Lourd, il flotte. Courants, obscurité, torpilles lentes. On plonge vers le bas.' },
  vaisseau:  { nom: 'Vaisseau', planete: 'Ceinture', c: '#f7adff', type: 'inertie', raideur: 0.07, acc: 2, frX: 0.94, frY: 0.94, vmax: 9, vmaxY: 9, zone: [80, H - 100],
    texte: 'Le plus rapide, mais il glisse dans le vide. Astéroïdes qui se cassent, planète qui attire.' },
};
const ORDRE = ['avion', 'rover', 'sousmarin', 'vaisseau'];

// ================= Armes et bonus (repris de la POC 2) =================
const ARMES = {
  crayon:   { nom: 'Lance-crayons', mun: 40, cad: 14, c: '#ffe14d', tir(j) { balle({ x: j.x, y: j.y - 18, vy: -12, dmg: 2, perce: new Set(), forme: 'trait' }); } },
  arrosoir: { nom: 'Arrosoir', mun: 220, cad: 3, c: '#6fd3ff', tir(j) { balle({ x: j.x + hasard(-4, 4), y: j.y - 16, vx: hasard(-0.8, 0.8), vy: -6.5, dmg: 1, vie: 30, forme: 'goutte' }); } },
  elastiques: { nom: 'Élastiques', mun: 30, cad: 14, c: '#ff9de2', tir(j) { for (let i = -2; i <= 2; i++) balle({ x: j.x, y: j.y - 14, vx: i * 1.8, vy: -8, dmg: 1, forme: 'rond' }); } },
  avions:   { nom: 'Avions téléguidés', mun: 24, cad: 24, c: '#c6ff6f', tir(j) { for (const s of [-1, 1]) balle({ x: j.x + s * 12, y: j.y, vx: s * 2, vy: -4, dmg: 3, guide: true, vie: 150, forme: 'fleche' }); } },
  billes:   { nom: 'Billes', mun: 30, cad: 16, c: '#ffffff', tir(j) { for (const s of [-1, 1]) balle({ x: j.x, y: j.y - 14, vx: s * 3, vy: -7, dmg: 1, rebond: 3, vie: 200, r: 5, forme: 'rond' }); } },
  bulles:   { nom: 'Grosses bulles', mun: 20, cad: 22, c: '#9fe8ff', tir(j) { balle({ x: j.x, y: j.y - 18, vy: -3.5, dmg: 3, zone: 46, r: 11, forme: 'bulle' }); } },
};
const LISTE_ARMES = Object.keys(ARMES);
const POIDS_BONUS = { bouclier: 25, aimant: 20, toupies: 25, etoile: 20, coeur: 10 };
const NOM_BONUS = { bouclier: 'Bouclier : il encaisse un coup', aimant: 'Aimant géant 10 s', toupies: 'Toupies-compagnons 15 s', etoile: 'Étoile : invincible 5 s', coeur: 'Un cœur en plus' };
const tire = (p) => { let s = 0; for (const k in p) s += p[k]; let r = Math.random() * s; for (const k in p) if ((r -= p[k]) < 0) return k; };

// ================= État =================
let S = null;
const opt = { zone: false, invincible: false, vite: false };
function setMsg(t, d = 3 * SEC) { S.msg = t; S.msgT = d; }
function balle(o) { S.tirsJ.push(Object.assign({ vx: 0, vy: -9, dmg: 1, r: 4 }, o)); }
function tirE(x, y, a, v, bleu = false) { S.tirsE.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 5, bleu }); }
const bleuP = (e) => Math.random() < (TYPES[e.type]?.pBleu ?? 0.3);
function vise(e, v, n = 1, ecart = 0.22) { const a = Math.atan2(S.j.y - e.y, S.j.x - e.x); for (let i = 0; i < n; i++) tirE(e.x, e.y, a + (i - (n - 1) / 2) * ecart, v, bleuP(e)); }
function anneau(e, n, v, dec = 0, tous = 0) { for (let i = 0; i < n; i++) tirE(e.x, e.y, dec + (i / n) * Math.PI * 2, v, tous ? i % tous === 0 : bleuP(e)); }
function eclats(x, y, c, n = 8, v = 3) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = hasard(0.5, 1) * v; S.effets.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vie: 30, c }); } }

// ================= Ennemis =================
const TYPES = {
  // Jungle
  guepe:    { r: 11, hp: 1, taille: 'petit', forme: 'tri', c: '#ffd23f', maj(e) { e.y += 2.6; } },
  cocci:    { r: 10, hp: 1, taille: 'petit', forme: 'rond', c: '#ff7a3d', maj(e) { if (e.age < e.delai) e.x += e.vx; else { if (!e.pique) { const a = Math.atan2(S.j.y - e.y, S.j.x - e.x); e.vx = Math.cos(a) * 3.2; e.vy = Math.sin(a) * 3.2; e.pique = true; } e.x += e.vx; e.y += e.vy; } } },
  libellule:{ r: 14, hp: 5, taille: 'moyen', forme: 'barre', c: '#3de0ff', pBleu: 0.3, maj(e) { if (e.y < e.arret && !e.part) e.y += 2.4; else if (!e.part) { e.att = (e.att || 0) + 1; if ([40, 70, 100].includes(e.att)) vise(e, 3.2); if (e.att > 150) e.part = true; } else e.x += e.x < W / 2 ? -3 : 3; } },
  // Plante cachée sous le feuillage : elle tremble, puis surgit et tire
  plante:   { r: 14, hp: 4, taille: 'moyen', forme: 'etoile', c: '#ff8ad8', pBleu: 0.4,
    maj(e) {
      if (e.cache) { e.y += DEFIL; if (e.age > 80) { e.cache = false; e.surgi = 0; } return; }
      e.surgi++; if (e.surgi < 20) e.y -= 2.5; else e.y += 0.6;
      if (e.surgi === 30 || e.surgi === 70) vise(e, 2.8, 3);
      if (e.surgi > 110) e.y += 2.5;
    } },
  ruche:    { r: 30, hp: 40, taille: 'gros', forme: 'hexa', c: '#ffae00', pBleu: 0.3,
    maj(e) { if (e.y < 110 && !e.part) e.y += 1; else if (!e.part) { e.reste = (e.reste ?? 600) - 1; if (e.reste % 80 === 0) ajoute('guepe', e.x + hasard(-20, 20), e.y + 20); if (e.reste % 140 === 70) vise(e, 2.4, 5, 0.25); if (e.reste <= 0) e.part = true; } else e.y += 1.5; } },
  // Désert
  scorpion: { r: 14, hp: 4, taille: 'moyen', forme: 'losange', c: '#ffd36a', sol: true, pBleu: 0.35,
    maj(e) { e.y += DEFIL; e.x += borne((S.j.x - e.x) * 0.01, -0.8, 0.8); if (e.age % 100 === 50 && e.y > 30) vise(e, 2.4, 3); } },
  vautour:  { r: 12, hp: 2, taille: 'petit', forme: 'tri', c: '#c98a3e',
    maj(e) { if (e.age < 50) e.y += 2; else { if (!e.pique) { const a = Math.atan2(S.j.y - e.y, S.j.x - e.x); e.vx = Math.cos(a) * 3.6; e.vy = Math.sin(a) * 3.6; e.pique = true; } e.x += e.vx; e.y += e.vy; } } },
  ver:      { r: 22, hp: 45, taille: 'gros', forme: 'rond', c: '#ff9a3d', pBleu: 0.3,
    maj(e) {
      e.y += e.y < 140 ? 1.2 : 0; e.x = W / 2 + Math.sin(e.age * 0.018) * 120;
      e.trace = e.trace || []; e.trace.unshift([e.x, e.y]); if (e.trace.length > 60) e.trace.pop();
      if (e.age % 110 === 55) anneau(e, 10, 2, e.age * 0.03, 3);
      if (e.age > 900) e.y += 3;
    } },
  // Océan
  meduse:   { r: 14, hp: 4, taille: 'moyen', forme: 'demi', c: '#f7adff', pBleu: 0.5,
    maj(e) { e.y += 0.7 + Math.max(0, Math.sin(e.age * 0.08)) * 1.2; e.x += Math.sin(e.age * 0.03) * 0.6; if (e.age % 130 === 65) anneau(e, 6, 1.6, e.age, 2); } },
  poisson:  { r: 9, hp: 1, taille: 'petit', forme: 'tri', c: '#53d5ff', maj(e) { e.x += e.vx; e.y += 1 + Math.sin(e.age * 0.15) * 0.5; } },
  anguille: { r: 12, hp: 5, taille: 'moyen', forme: 'barre', c: '#7fe08a', pBleu: 0.3, maj(e) { e.y += 1.4; e.x = e.x0 + Math.sin(e.age * 0.05) * 80; if (e.age % 90 === 45) vise(e, 2.2); } },
  calamar:  { r: 30, hp: 40, taille: 'gros', forme: 'ovale', c: '#ff7aa8', pBleu: 0.35,
    maj(e) { if (e.y < 120 && !e.part) e.y += 0.8; else if (!e.part) { e.reste = (e.reste ?? 660) - 1; e.x = W / 2 + Math.sin(e.age * 0.015) * 90; if (e.reste % 90 === 0) anneau(e, 12, 1.7, e.age * 0.04, 3); if (e.reste % 150 === 75) vise(e, 2.2, 3); if (e.reste <= 0) e.part = true; } else e.y += 1.4; } },
  // Ceinture
  asteroide:{ r: 28, hp: 6, taille: 'moyen', forme: 'roc', c: '#bcc3fa', maj(e) { e.x += e.vx; e.y += e.vy; e.rot += e.vr; if (e.x < e.r || e.x > W - e.r) e.vx *= -1; } },
  soucoupe: { r: 15, hp: 5, taille: 'moyen', forme: 'ovale', c: '#f7adff', pBleu: 0.35, maj(e) { if (e.y < 120) e.y += 1.5; e.x += e.vx; if (e.x < 30 || e.x > W - 30) e.vx *= -1; if (e.age % 80 === 40) vise(e, 2.8, 2, 0.3); if (e.age > 600) e.y += 2; } },
  station:  { r: 32, hp: 45, taille: 'gros', forme: 'hexa', c: '#9fa8ff', pBleu: 0.3,
    maj(e) { e.rot += 0.01; if (e.y < 130 && !e.part) e.y += 0.9; else if (!e.part) { e.reste = (e.reste ?? 660) - 1; if (e.reste % 70 === 0) anneau(e, 8, 2.2, e.rot, 2); if (e.reste % 200 === 100) for (let i = 0; i < 2; i++) ajouteRoc(e.x + hasard(-30, 30), e.y + 30, 2); if (e.reste <= 0) e.part = true; } else e.y += 1.3; } },
  porteur:  { r: 13, hp: 3, taille: 'porteur', forme: 'penta', c: '#ffe066', maj(e) { e.x += e.vx; e.y = e.y0 + Math.sin(e.age * 0.05) * 14; } },
};
const RECOLTE = { petit: 1, moyen: 3, gros: 12, porteur: 2 };
const JAUGE = { petit: 4, moyen: 10, gros: 25, porteur: 6 };
function ajoute(type, x, y, extra = {}) {
  const T = TYPES[type];
  const e = Object.assign({ type, x, y, x0: x, y0: y, vx: 0, vy: 0, hp: T.hp, r: T.r, age: 0, rot: 0, flash: 0 }, extra);
  S.ennemis.push(e); return e;
}
// Astéroïde de taille 3 (gros), 2 ou 1 : il se casse en deux plus petits
function ajouteRoc(x, y, taille = 3) {
  const R = [0, 10, 17, 28][taille], HP = [0, 1, 3, 6][taille];
  const pts = Array.from({ length: 9 }, () => hasard(0.72, 1.08));
  return ajoute('asteroide', x, y, { taille, r: R, hp: HP, pts, vx: hasard(-0.8, 0.8), vy: hasard(0.8, 1.6), vr: hasard(-0.03, 0.03) });
}

// ================= Terrain et milieu =================
// Désert : rochers (bloquent le rover ET les tirs), sable mou (ralentit), tremplins (saut).
const rocher = (x, r = 22) => S.terrain.push({ k: 'rocher', x, y: -r, r });
const sable = (x, w = 130, h = 100) => S.terrain.push({ k: 'sable', x, y: -h, w, h });
const tremplin = (x) => S.terrain.push({ k: 'tremplin', x, y: -24, w: 64, h: 26 });
// Océan : courants horizontaux qui poussent le sous-marin
const courant = (f) => S.terrain.push({ k: 'courant', y: -120, h: 120, f });
// Jungle : touffes de feuillage, au-dessus du sol et sous l'avion
const feuillage = (x, r = 60) => { const t = { k: 'feuille', x, y: -r, r, bouts: Array.from({ length: 6 }, () => [hasard(-0.7, 0.7), hasard(-0.7, 0.7), hasard(0.45, 0.7)]) }; S.terrain.push(t); return t; };
const plante = (t) => ajoute('plante', t.x, t.y, { cache: true, feuille: t });
// Ceinture : la planète qui attire
const planete = (x) => { S.planete = { x, y: -90, r: 46, vy: 0.55 }; setMsg('Une planète : elle attire tout vers elle !', 3 * SEC); };

const porteur = () => ajoute('porteur', -20, 120, { vx: 1.6, y0: hasard(100, 170) });
const V = (n, x0, type = 'guepe') => { for (let i = 0; i < n; i++) { const k = i - (n - 1) / 2; ajoute(type, x0 + k * 26, -20 - Math.abs(k) * 22); } };
const cocci = (n, cote, y) => { for (let i = 0; i < n; i++) ajoute('cocci', cote < 0 ? -20 - i * 26 : W + 20 + i * 26, y, { vx: cote < 0 ? 2.4 : -2.4, delai: 50 + i * 10 }); };
const banc = (n, cote) => { for (let i = 0; i < n; i++) ajoute('poisson', cote < 0 ? -20 - i * 22 : W + 20 + i * 22, hasard(-40, 80), { vx: cote < 0 ? 2 : -2 }); };

// ================= Les 4 missions d'essai =================
const MISSIONS = {
  avion: [
    [2, () => { for (let i = 0; i < 4; i++) feuillage(hasard(40, 320), hasard(50, 80)).y = hasard(60, 560); }],
    [3, () => V(5, 180)], [6, () => feuillage(90)], [7, () => feuillage(270, 70)], [9, () => plante(S.terrain.filter((t) => t.k === 'feuille').slice(-2)[0])],
    [12, () => cocci(6, -1, 150)], [15, () => { const t = feuillage(180, 75); plante(t); }], [18, () => porteur()], [20, () => libel(240)],
    [23, () => { const a = feuillage(80, 60), b = feuillage(280, 60); plante(a); plante(b); }], [27, () => V(5, 120)], [30, () => feuillage(200, 80)],
    [32, () => { cocci(6, 1, 170); libel(90); }], [36, () => { const a = feuillage(120, 70); plante(a); feuillage(300, 55); }], [40, () => porteur()],
    [42, () => { V(5, 250); const t = feuillage(180, 70); plante(t); }], [47, () => { libel(70); libel(290); }], [50, () => feuillage(90, 65)], [52, () => feuillage(260, 70)],
    [55, () => ajoute('ruche', W / 2, -40)], [56, 'fin'],
  ],
  rover: [
    [2, () => { setMsg('Le rover a de l\'élan : anticipe tes virages'); rocher(90); }], [4, () => rocher(270, 26)], [6, () => sable(180)],
    [8, () => { ajoute('scorpion', 100, -20); }], [10, () => tremplin(180)], [12, () => { rocher(60); rocher(300); }], [14, () => V(4, 180, 'vautour')],
    [17, () => sable(90, 140, 120)], [18, () => ajoute('scorpion', 280, -20)], [20, () => porteur()], [22, () => { tremplin(110); rocher(260, 24); }],

function libel(x) { ajoute('libellule', x, -20, { arret: hasard(120, 190) }); }

function lancer(veh) {

// ================= Mouvement du véhicule =================
function bouge() {
  const j = S.j, M = S.M;
  if (M.type === 'direct') {
    const px = j.x, py = j.y;
    j.x += (j.cx - j.x) * M.lissage; j.y += (j.cy - j.y) * M.lissage;
    j.vx = j.x - px; j.vy = j.y - py;
  } else {
    // Ressort vers la cible, accélération bornée, frottements différents en x et en y (le rover dérape)

    const vmax = M.vmax * (dans ? 0.45 : 1), vmaxY = M.vmaxY * (dans ? 0.45 : 1);

    j.vy += borne((j.cy - j.y) * M.raideur * 3, -M.acc, M.acc);
    j.vx *= M.frX; j.vy *= M.frY;

    for (const t of S.terrain) if (t.k === 'courant' && j.y > t.y && j.y < t.y + t.h) j.vx += t.f;

    j.x += j.vx; j.y += j.vy;

  // Planète qui attire : elle tire la cible, le joueur doit lutter
  const P = S.planete;

    const dx = P.x - j.x, dy = P.y - j.y, d = Math.hypot(dx, dy);

    if (d < min && d > 0.1) { j.x = t.x + (dx / d) * min; j.y = t.y + (dy / d) * min; j.vx *= -0.3; j.vy *= -0.3; S.secousse = 6; }

  }

  if (j.y < y0 || j.y > y1) j.vy = 0;
  j.x = borne(j.x, 16, W - 16); j.y = borne(j.y, y0, y1);
  j.cx = borne(j.cx, 16, W - 16); j.cy = borne(j.cy, y0, y1);
  // Traînées : poussière du rover, bulles du sous-marin
  const v = Math.hypot(j.vx, j.vy);
  if (S.veh === 'rover' && j.z < 0.2 && v > 0.6) for (let k = 0; k < (sableSous() ? 3 : 1); k++) S.effets.push({ poussiere: true, x: j.x + hasard(-12, 12), y: j.y + 18, vx: hasard(-0.4, 0.4) - j.vx * 0.2, vy: DEFIL + hasard(0, 0.6), vie: 50, r: hasard(3, 6) });

}

// ================= Tir =================
function tirer() {

function tirToupies() {

// ================= Coups =================
function touche() {

}

function prend(o) {

  else { const b = o.b; if (b === 'bouclier') S.bouclier = true; if (b === 'aimant') S.aimantG = 10 * SEC; if (b === 'toupies') S.toupies = 15 * SEC; if (b === 'etoile') S.etoile = 5 * SEC; if (b === 'coeur') S.coeurs = Math.min(S.coeursMax, S.coeurs + 1); setMsg(NOM_BONUS[b], 2 * SEC); }

// ================= Une image =================
function pas() {

  for (const b of S.tirsE) {
    b.x += b.vx; b.y += b.vy;
    for (const t of S.terrain) if (t.k === 'rocher' && dist2(b, t) < t.r * t.r) b.mort = true;

  for (const e of S.ennemis) {
    if (e.cache) continue;
    if (dist2(e, j) < (e.r * 0.7 + ZT) ** 2) { if (S.etoile > 0) { if (S.t % 6 === 0) blesse(e, 1); } else { touche(); blesse(e, 2); } }

  }

  const rayon = 30;
  for (const o of S.objets) {
    const d2 = dist2(o, j);
    if (o.k === 'bouton' && (S.aimantG > 0 || d2 < rayon * rayon)) { const d = Math.sqrt(d2) || 1; o.x += ((j.x - o.x) / d) * 7; o.y += ((j.y - o.y) / d) * 7; }

// ================= Dessin =================
const FONDS = { avion: ['#173d22', '#1c4a29'], rover: ['#5a3d1c', '#664622'], sousmarin: ['#0b3a5a', '#0d4268'], vaisseau: ['#0a0a24', '#0e0e2e'] };

  ctx.beginPath();
  const poly = (n, dec) => { for (let i = 0; i < n; i++) { const a = dec + rot + (i / n) * Math.PI * 2; i ? ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r) : ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); };
  if (f === 'rond') ctx.arc(0, 0, r, 0, Math.PI * 2);
  else if (f === 'tri') poly(3, Math.PI / 2);
  else if (f === 'losange') poly(4, 0);
  else if (f === 'penta') poly(5, -Math.PI / 2);
  else if (f === 'hexa') poly(6, rot ? 0 : 0);
  else if (f === 'barre') ctx.rect(-r * 1.4, -r * 0.45, r * 2.8, r * 0.9);
  else if (f === 'ovale') ctx.ellipse(0, 0, r * 1.3, r * 0.7, 0, 0, Math.PI * 2);

  else if (f === 'roc') { for (let i = 0; i < pts.length; i++) { const a = rot + (i / pts.length) * Math.PI * 2, rr = r * pts[i]; i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); }

}
function dessineFond() {
  const [a, b] = FONDS[S.veh];
  ctx.fillStyle = a; ctx.fillRect(0, 0, W, H);

function dessineMonde() {

    for (const [dx, dy, s] of t.bouts) { ctx.beginPath(); ctx.arc(t.x + dx * t.r - 4 + tremble, t.y + dy * t.r - 4, t.r * s * 0.6, 0, Math.PI * 2); ctx.fill(); }

    ctx.save(); ctx.translate(o.x, o.y);

    dessineEnnemi(e);

    if (b.forme === 'trait') { ctx.fillStyle = '#ffe14d'; ctx.fillRect(b.x - 2, b.y - 16, 4, 32); }
    else if (b.forme === 'torpille') { ctx.fillStyle = '#e8f6ff'; ctx.beginPath(); ctx.ellipse(b.x, b.y, 3.5, 8, 0, 0, Math.PI * 2); ctx.fill(); if (S.t % 3 === 0) S.effets.push({ bulle: true, x: b.x, y: b.y + 8, vx: 0, vy: 0.5, vie: 25, r: 1.5 }); }

function dessineJoueur() {

// ================= Boucle =================
let avant = performance.now(), reste = 0;
function boucle(m) { requestAnimationFrame(boucle); reste += Math.min(100, m - avant); avant = m; while (reste >= 1000 / FPS) { pas(); if (opt.vite) pas(); reste -= 1000 / FPS; } dessine(); }

// ================= Commande relative =================
let doigt = null;

function redim() {

  echelle = Math.min(r.width / W, r.height / H);

  toile.width = Math.floor(w * devicePixelRatio); toile.height = Math.floor(h * devicePixelRatio);
}
addEventListener('resize', redim); redim(); montre('menu');
window.__poc = { get S() { return S; }, opt, pas, lancer, VEH };
