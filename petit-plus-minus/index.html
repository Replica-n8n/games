<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Rien ne quitte le téléphone, et le navigateur le garantit : aucune requête
     hors du dossier du jeu, aucun script ni style en ligne. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Petit Plus contre Petit Minus</title>
<meta name="description" content="Une boîte à outils pour calmer Petit Minus : respirer, se détendre, se dire une phrase de courage. Sans compte, sans publicité, hors ligne.">
<meta name="theme-color" content="#FFF7EC">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icone-192.png">
<link rel="preload" href="./polices/baloo2-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./polices/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/jeu.css">
<script type="module" src="./js/app.js"></script>
</head>
<body>

<!-- Les textes arrivent de contenu.json par data-texte (et data-aria pour les
     libellés). Tout élément ici reste FACULTATIF pour js/app.js. -->

<!-- L'ACCUEIL EST LA BOÎTE À OUTILS : le calme, la jauge, puis les outils au même niveau. -->
<section class="ecran" id="accueil" aria-labelledby="titre-jeu">
  <h1 class="pour-lecteur" id="titre-jeu" tabindex="-1" data-texte="accueil.titre"></h1>
  <button class="btn btn-sos calme" id="vers-calme" type="button">
    <svg class="coeur" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
    <span data-texte="accueil.boutonCalme"></span>
  </button>
  <div class="jauge-carte">
    <h2 class="jauge-q" id="jauge-q" data-texte="jauge.question"></h2>
    <div class="jauge" id="jauge" role="group" aria-labelledby="jauge-q"></div>
    <div class="jauge-barre" aria-hidden="true"></div>
    <p class="conseil" id="conseil" aria-live="polite" data-texte="jauge.aide"></p>
  </div>
  <div class="outils" id="outils"></div>
  <!-- Pour l'adulte. « Installer » disparaît une fois le jeu installé. -->
  <div class="liens-bas">
    <button class="lien" id="installer" type="button" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span data-texte="accueil.installer"></span>
    </button>
    <button class="lien" id="vers-grands" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>
      <span data-texte="accueil.pourLesGrands"></span>
    </button>
  </div>
  <p class="installer-aide" id="installer-aide" data-texte="accueil.installerAide" hidden></p>
</section>

<section class="ecran ecran-sos" id="sos" aria-labelledby="titre-sos" hidden>
  <div class="entete entete-sos">
    <button class="retour" type="button" id="sos-retour" data-aria="sos.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="sos-nom titres" id="titre-sos" data-texte="sos.titre"></div>
    <div class="cale" aria-hidden="true"></div>
  </div>
  <div class="sos-corps" id="sos-corps"></div>
  <div class="pousse"></div>
  <div class="sos-actions" id="sos-actions"></div>
  <div class="adulte">
    <svg class="coeur" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
    <span id="rappel-adulte" data-texte="sos.rappelAdulte"></span>
  </div>
</section>

<!-- LA BOUGIE : sentir la fleur, souffler la bougie. Rien à lire pendant l'exercice. -->
<section class="ecran ecran-bougie" id="bougie" aria-labelledby="titre-bougie" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-bougie" tabindex="-1" data-texte="bougie.titre"></h2>
  </div>
  <div class="scene-outil">
    <div class="fleur-bougie">
      <svg class="fleur" id="fleur" viewBox="0 0 90 150" width="90" height="150" aria-hidden="true">
        <path d="M45 150V70" stroke="#0F766E" stroke-width="5"/><path d="M45 110c-18-2-26-14-24-24c14 0 22 10 24 24z" fill="#34A08A"/>
        <g fill="#F28DB2"><circle cx="45" cy="30" r="14"/><circle cx="26" cy="46" r="14"/><circle cx="64" cy="46" r="14"/><circle cx="33" cy="67" r="14"/><circle cx="57" cy="67" r="14"/></g>
        <circle cx="45" cy="50" r="11" fill="#F2B233"/>
      </svg>
      <svg class="chandelle" id="chandelle" viewBox="0 0 80 190" width="80" height="190" aria-hidden="true">
        <g class="flamme" id="flamme"><path d="M40 12c16 20 16 34 0 42c-16-8-16-22 0-42z" fill="#F59E0B"/><path d="M40 30c7 9 7 15 0 20c-7-5-7-11 0-20z" fill="#FDE68A"/></g>
        <path d="M40 54v12" stroke="#2B2350" stroke-width="3"/>
        <rect x="16" y="64" width="48" height="118" rx="8" fill="#FDE7B0" stroke="#B45309" stroke-width="3"/>
      </svg>
    </div>
    <p class="mot" id="mot-bougie" aria-live="polite"></p>
    <div class="points" id="points-bougie" aria-hidden="true"></div>
  </div>
  <div class="fin-actions" id="fin-bougie" hidden></div>
</section>

<!-- ROBOT SPAGHETTI : tout raide, puis tout mou, une partie du corps à la fois. -->
<section class="ecran ecran-robot" id="robot" aria-labelledby="titre-robot" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-robot" tabindex="-1" data-texte="robot.titre"></h2>
  </div>
  <div class="scene-outil">
    <div class="robot-zone">
      <svg class="le-robot" id="le-robot" viewBox="0 0 160 210" width="150" height="200" aria-hidden="true" fill="#fff" stroke="#134E4A" stroke-width="5" stroke-linejoin="round">
        <rect x="45" y="10" width="70" height="55" rx="8"/><rect x="62" y="30" width="10" height="10" fill="#134E4A"/><rect x="88" y="30" width="10" height="10" fill="#134E4A"/>
        <path d="M65 52h30"/><rect x="35" y="72" width="90" height="75" rx="8"/>
        <rect x="8" y="78" width="22" height="60" rx="6"/><rect x="130" y="78" width="22" height="60" rx="6"/>
        <rect x="48" y="152" width="24" height="52" rx="6"/><rect x="88" y="152" width="24" height="52" rx="6"/>
      </svg>
      <svg class="le-spaghetti" id="le-spaghetti" viewBox="0 0 280 100" width="280" height="100" aria-hidden="true" fill="none" stroke="#F2B233" stroke-width="9" stroke-linecap="round" hidden>
        <path d="M20 40 C60 10 100 70 140 40 S220 10 260 40"/>
      </svg>
    </div>
    <p class="mot" id="mot-robot" aria-live="polite"></p>
    <p class="partie" id="partie-robot"></p>
    <div class="points" id="points-robot" aria-hidden="true"></div>
  </div>
  <div class="fin-actions" id="fin-robot" hidden></div>
</section>

<!-- LA BULLE : respirer au rythme de la bulle, avec Petit Plus. -->
<section class="ecran ecran-bulle" id="souffle" aria-labelledby="titre-souffle" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-souffle" tabindex="-1" data-texte="bulle.titre"></h2>
  </div>
  <div class="scene-outil" id="souffle-corps"></div>
  <div class="fin-actions" id="fin-souffle" hidden></div>
</section>

<section class="ecran ecran-tresors" id="tresors" aria-labelledby="titre-tresors" hidden>
  <div class="entete entete-jeu">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="points points-tresors" id="tresors-points" role="img"></div>
    <div class="cale" aria-hidden="true"></div>
  </div>
  <h2 class="pour-lecteur" id="titre-tresors" tabindex="-1" data-texte="chasse.titre"></h2>
  <div class="jeu-corps" id="tresors-corps"></div>
  <div class="pousse"></div>
  <div class="jeu-actions" id="tresors-actions"></div>
</section>

<!-- LES PAIRES : toutes les cartes visibles. Minus à gauche, les phrases à droite. -->
<section class="ecran ecran-paires" id="paires" aria-labelledby="titre-paires" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-paires" tabindex="-1" data-texte="lesPaires.titre"></h2>
  </div>
  <p class="consigne-outil" data-texte="lesPaires.consigne"></p>
  <div class="colonnes" aria-hidden="true">
    <div class="col-perso" data-perso="petit-minus"></div>
    <div class="col-perso col-plus" data-perso="petit-plus"></div>
  </div>
  <div class="colonnes" id="colonnes"></div>
  <p class="retour-paires" id="retour-paires" aria-live="polite"></p>
  <div class="pousse"></div>
  <div class="fin-actions" id="fin-paires" hidden></div>
</section>

<!-- RÉPONDS À MINUS : sa bulle est juste au-dessus des réponses, un seul endroit où lire. -->
<section class="ecran" id="reponds" aria-labelledby="titre-reponds" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-reponds" tabindex="-1" data-texte="reponds.titre"></h2>
  </div>
  <div class="arene arene-reponds">
    <div class="reponds-plus perso-place" data-perso="petit-plus"></div>
    <div class="reponds-minus perso-place" data-perso="petit-minus"></div>
  </div>
  <div class="bulle-minus" id="bulle-minus" aria-live="polite"></div>
  <div class="reponses" id="reponses"></div>
  <p class="pour-lecteur" id="reponds-annonce" aria-live="assertive"></p>
  <div class="pousse"></div>
  <div class="fin-actions" id="fin-reponds" hidden></div>
</section>

<!-- PETIT YOGA : un chat montre cinq postures, chacune tenue trois respirations. Pendant
     l'exercice, un seul mot à lire : le nom de la posture. Le rond derrière donne le souffle. -->
<section class="ecran ecran-yoga" id="yoga" aria-labelledby="titre-yoga" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-yoga" tabindex="-1" data-texte="yoga.titre"></h2>
  </div>
  <div class="yoga-bloc" id="yoga-avant">
    <div class="pousse"></div>
    <div class="yoga-apercu" id="yoga-apercu"></div>
    <div class="pousse"></div>
    <p class="pas-texte" data-texte="yoga.consigne"></p>
    <div class="pousse"></div>
    <button class="btn btn-plus" id="yoga-commencer" type="button"><span data-texte="yoga.commencer"></span></button>
  </div>
  <div class="yoga-bloc" id="yoga-pendant" hidden>
    <div class="yoga-suite" id="yoga-suite" aria-hidden="true"></div>
    <div class="scene-outil">
      <svg class="yoga-scene" viewBox="0 0 300 290" width="300" height="290" aria-hidden="true">
        <circle class="yoga-souffle" id="yoga-souffle" cx="150" cy="150" r="138"/>
        <rect x="14" y="258" width="272" height="14" rx="7" fill="#F28DB2"/>
        <g id="yoga-chat"></g>
      </svg>
      <p class="mot" id="yoga-nom" aria-live="polite"></p>
      <div class="points" id="points-yoga" aria-hidden="true"></div>
    </div>
    <div class="fin-actions" id="fin-yoga" hidden></div>
  </div>
</section>

<!-- MES PETITS PAS : l'escalier d'une peur. Une étape à la fois, avec un adulte tout près.
     Les marches, la jauge et les trucs sont construits par js/app.js. -->
<section class="ecran ecran-pas" id="pas" aria-labelledby="titre-pas" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-pas" tabindex="-1" data-texte="pas.titre"></h2>
  </div>
  <div class="pas-bloc" id="pas-vide" hidden>
    <div class="pousse"></div>
    <div class="pas-fee" data-perso="petit-plus"></div>
    <p class="pas-grand" data-texte="pas.vide"></p>
    <div class="pousse"></div>
    <button class="btn btn-plus" id="pas-vers-grands" type="button"><span data-texte="pas.avecUnGrand"></span></button>
  </div>
  <div class="pas-bloc" id="pas-plein" hidden>
    <p class="pas-objectif" id="pas-objectif" hidden><span data-texte="pas.objectif"></span> <b id="pas-objectif-texte"></b></p>
    <div class="pousse"></div>
    <div class="escalier" id="escalier" role="group" aria-labelledby="titre-pas">
      <div class="marches" id="marches"></div>
      <svg class="drapeau" viewBox="0 0 30 50" width="30" height="50" aria-hidden="true"><path d="M26 50V4" stroke="#2B2350" stroke-width="3" stroke-linecap="round"/><path d="M26 4L4 12l22 8z" fill="#C2410C"/></svg>
      <div class="escalier-fee" id="escalier-fee" data-perso="petit-plus" aria-hidden="true"></div>
    </div>
    <div class="pas-carte" aria-live="polite">
      <p class="pas-num"><span class="titres" id="pas-num"></span><span class="pas-etat" id="pas-etat"></span></p>
      <p class="pas-phrase" id="pas-phrase"></p>
    </div>
    <button class="btn btn-plus" id="pas-principal" type="button"></button>
    <button class="lien" id="pas-second" type="button"></button>
  </div>
</section>

<section class="ecran ecran-pas" id="pas-avant" aria-labelledby="titre-pas-avant" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-pas-avant" tabindex="-1" data-texte="pas.avant.titre"></h2>
  </div>
  <div class="pousse"></div>
  <p class="pas-grand" id="question-avant" data-texte="pas.avant.question"></p>
  <div class="jauge jauge-pas" id="jauge-avant" role="group" aria-labelledby="question-avant"></div>
  <div class="pousse"></div>
</section>

<!-- Les trucs servent à se préparer, AVANT l'étape, et on peut s'en passer. -->
<section class="ecran ecran-pas" id="pas-trucs" aria-labelledby="titre-pas-trucs" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-pas-trucs" tabindex="-1" data-texte="pas.trucs.titre"></h2>
  </div>
  <div class="pousse"></div>
  <div class="trucs-corps" id="trucs-corps"></div>
  <div class="pousse"></div>
  <button class="btn btn-plus" id="trucs-pret" type="button"><span data-texte="pas.trucs.pret"></span></button>
</section>

<!-- PENDANT : le téléphone est posé. Rien à lire d'autre, aucun truc. -->
<section class="ecran ecran-pas" id="pas-pendant" aria-labelledby="pendant-titre" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="pendant-titre" tabindex="-1"></h2>
  </div>
  <div class="pousse"></div>
  <div class="pas-fee" data-perso="petit-plus-calme"></div>
  <p class="pas-grand" data-texte="pas.pendant.grand"></p>
  <p class="pas-texte" data-texte="pas.pendant.texte"></p>
  <div class="pousse"></div>
  <button class="btn btn-plus" id="pendant-fait" type="button"><span data-texte="pas.pendant.fait"></span></button>
  <button class="lien" id="pendant-arreter" type="button"><span data-texte="pas.pendant.arreter"></span></button>
</section>

<section class="ecran ecran-pas" id="pas-apres" aria-labelledby="titre-pas-apres" hidden>
  <div class="entete">
    <div class="cale" aria-hidden="true"></div>
    <h2 class="outil-titre" id="titre-pas-apres" tabindex="-1" data-texte="pas.apres.titre"></h2>
  </div>
  <div class="pousse"></div>
  <p class="pas-grand" id="question-apres" data-texte="pas.apres.question"></p>
  <div class="jauge jauge-pas" id="jauge-apres" role="group" aria-labelledby="question-apres"></div>
  <div class="pousse"></div>
</section>

<!-- On félicite d'avoir affronté, que Minus ait rapetissé ou non. -->
<section class="ecran ecran-pas" id="pas-bravo" aria-labelledby="titre-pas-bravo" hidden>
  <div class="entete">
    <div class="cale" aria-hidden="true"></div>
    <h2 class="outil-titre" id="titre-pas-bravo" tabindex="-1" data-texte="pas.bravo.titre"></h2>
  </div>
  <div class="pousse"></div>
  <div class="avant-apres" id="avant-apres" aria-hidden="true"></div>
  <p class="pas-grand" data-texte="pas.bravo.grand"></p>
  <p class="pas-texte" id="bravo-texte" aria-live="polite"></p>
  <div class="pousse"></div>
  <button class="btn btn-plus" id="bravo-bouton" type="button"><span data-texte="pas.bravo.bouton"></span></button>
</section>

<section class="ecran ecran-pas" id="pas-dur" aria-labelledby="titre-pas-dur" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-pas-dur" tabindex="-1" data-texte="pas.dur.titre"></h2>
  </div>
  <div class="pousse"></div>
  <p class="pas-grand" data-texte="pas.dur.grand"></p>
  <p class="pas-texte" data-texte="pas.dur.texte"></p>
  <div class="pousse"></div>
  <button class="btn btn-plus" id="dur-grand" type="button"><span data-texte="pas.avecUnGrand"></span></button>
  <button class="lien" id="dur-garder" type="button"><span data-texte="pas.dur.garder"></span></button>
</section>

<!-- CONSTRUIRE L'ESCALIER : pour l'adulte, après le calcul de « Pour les grands ». -->
<section class="ecran" id="construire" aria-labelledby="titre-construire" hidden>
  <div class="entete">
    <button class="retour" type="button" id="construire-retour" data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-construire" tabindex="-1" data-texte="pas.construire.titre"></h2>
  </div>
  <p class="construire-aide" data-texte="pas.construire.intro"></p>
  <h3 class="construire-pas titres" data-texte="pas.construire.pas1"></h3>
  <label class="champ" for="champ-peur"><span data-texte="pas.construire.peur"></span>
    <input id="champ-peur" type="text" maxlength="40" autocomplete="off"></label>
  <label class="champ" for="champ-objectif"><span data-texte="pas.construire.objectif"></span>
    <input id="champ-objectif" type="text" maxlength="40" autocomplete="off"></label>
  <h3 class="construire-pas titres" data-texte="pas.construire.pas2"></h3>
  <p class="construire-aide" data-texte="pas.construire.aideEtapes"></p>
  <ol class="liste-etapes" id="liste-etapes"></ol>
  <button class="btn2" id="etape-ajouter" type="button"><span data-texte="pas.construire.ajouter"></span></button>
  <button class="btn2" id="etape-glisser" type="button" hidden><span data-texte="pas.construire.glisser"></span></button>
  <p class="construire-aide" id="etapes-plein" data-texte="pas.construire.plein" hidden></p>
  <h3 class="construire-pas titres" data-texte="pas.construire.pas3"></h3>
  <div class="construire-conseils" id="construire-conseils"></div>
  <button class="btn btn-plus" id="construire-fini" type="button"><span data-texte="pas.construire.fini"></span></button>
  <button class="lien" id="construire-vider" type="button"></button>
</section>

<section class="ecran" id="mes-minus" aria-labelledby="titre-mes-minus" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-mes-minus" tabindex="-1" data-texte="mesMinus.titre"></h2>
  </div>
  <!-- Pour le parent, avant tout : ce qu'est le jeu, ce qu'il garde, quand demander de l'aide. -->
  <div class="aide-parent" id="aide-parent"></div>
  <div class="barriere" id="barriere">
    <p class="barriere-titre titres" data-texte="mesMinus.barriereTitre"></p>
    <p data-texte="mesMinus.barriereTexte"></p>
    <label class="barriere-question" for="barriere-reponse" id="barriere-question"></label>
    <input class="barriere-reponse" id="barriere-reponse" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*">
    <p class="barriere-rate" id="barriere-rate" role="alert" hidden></p>
    <button class="btn btn-plus" id="barriere-valider" type="button"><span data-texte="mesMinus.barriereValider"></span></button>
  </div>
  <!-- Après le calcul : deux choses distinctes, chacune sur son écran. -->
  <div class="mes-minus-contenu" id="mes-minus-contenu" hidden>
    <button class="choix-grand" id="vers-construire" type="button">
      <span class="titres" data-texte="mesMinus.menu.escalier.titre"></span><span data-texte="mesMinus.menu.escalier.texte"></span>
    </button>
    <button class="choix-grand" id="vers-themes" type="button">
      <span class="titres" data-texte="mesMinus.menu.peurs.titre"></span><span data-texte="mesMinus.menu.peurs.texte"></span>
    </button>
  </div>
</section>

<!-- LES PENSÉES DE MINUS : les peurs dont il parle dans « Les paires » et « Réponds à Minus ».
     Rien à voir avec l'escalier, qui a son propre écran (« Construire »). -->
<section class="ecran" id="themes" aria-labelledby="titre-themes" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="outil-titre" id="titre-themes" tabindex="-1" data-texte="mesMinus.menu.peurs.titre"></h2>
  </div>
  <p class="mes-minus-consigne" data-texte="mesMinus.consigne"></p>
  <div class="liste-themes" id="liste-themes"></div>
  <button class="btn btn-plus" id="mes-minus-fini" type="button"><span data-texte="mesMinus.fini"></span></button>
</section>
