<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Rien ne quitte le téléphone, et le navigateur le garantit : aucune requête
     hors du dossier du jeu, aucun script ni style en ligne. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Petit Plus contre Petit Minus</title>
<meta name="description" content="Un petit jeu pour apprendre à rendre Petit Minus tout petit. Sans compte, sans publicité, hors ligne.">
<meta name="theme-color" content="#FFF7EC">
<meta name="color-scheme" content="light">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icone-192.png">
<link rel="preload" href="./polices/baloo2-800-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./polices/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/jeu.css">
<script type="module" src="./js/app.js"></script>
</head>
<body>

<!-- Les textes arrivent de contenu.json par data-texte (et data-aria pour les
     libellés). Tout élément ici reste FACULTATIF pour js/app.js. -->

<section class="ecran" id="accueil" aria-labelledby="titre-jeu">
  <div>
    <div class="surtitre" data-texte="accueil.surtitre"></div>
    <h1 class="titre-jeu" id="titre-jeu" tabindex="-1"><span data-texte="accueil.titre"></span> <small data-texte="accueil.sousTitre"></small></h1>
  </div>
  <div class="arene">
    <div class="perso perso-plus">
      <div class="perso-place" data-perso="petit-plus"></div>
      <div class="nom" data-texte="accueil.nomPlus"></div>
    </div>
    <div class="vs" aria-hidden="true" data-texte="accueil.vs"></div>
    <div class="perso perso-minus">
      <div class="perso-place" data-perso="petit-minus"></div>
      <div class="nom" data-texte="accueil.nomMinus"></div>
    </div>
  </div>
  <p class="intro" data-texte="accueil.intro"></p>
  <div class="pousse"></div>
  <button class="btn btn-sos calme" id="vers-calme" type="button">
    <svg class="coeur" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
    <span data-texte="accueil.boutonCalme"></span>
  </button>
  <div class="rangee">
    <button class="btn2 btn2-plus" id="vers-entrainement" type="button"><span data-texte="accueil.boutonEntrainer"></span></button>
    <button class="btn2 btn2-minus" id="vers-diplomes" type="button" hidden>
      <svg class="etoile" viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z"/></svg>
      <span data-texte="accueil.boutonDiplomes"></span>
    </button>
  </div>
  <button class="btn btn-orange" id="vers-meteo" type="button"><span data-texte="accueil.boutonPartir"></span></button>
  <!-- Pour l'adulte, dans le navigateur seulement : caché une fois le jeu installé. -->
  <div class="liens-bas">
    <button class="lien" id="installer" type="button" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
      <span data-texte="accueil.installer"></span>
    </button>
    <!-- Pour l'adulte : « Mes Minus » est derrière un petit calcul. -->
    <button class="lien" id="vers-grands" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>
      <span data-texte="accueil.pourLesGrands"></span>
    </button>
  </div>
  <p class="installer-aide" id="installer-aide" data-texte="accueil.installerAide" hidden></p>
</section>

<section class="ecran" id="meteo" aria-labelledby="titre-meteo" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
  <div>
    <h2 class="q" id="titre-meteo" tabindex="-1" data-texte="meteo.question"></h2>
    <p class="sous" data-texte="meteo.sousTitre"></p>
  </div>
  <div class="grille" id="grille"></div>
  <div id="meteo-message" aria-live="polite"></div>
  <div class="pousse"></div>
  <button class="btn" id="meteo-suite" type="button" hidden></button>
</section>

<section class="ecran ecran-sos" id="sos" aria-labelledby="titre-sos" hidden>
  <div class="entete entete-sos">
    <button class="retour" type="button" id="sos-retour" data-aria="sos.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="sos-nom titres" id="titre-sos" data-texte="sos.titre"></div>
    <div class="cale" aria-hidden="true"></div>
  </div>
  <div class="sos-corps" id="sos-corps"></div>
  <div class="pousse"></div>
  <div class="sos-actions" id="sos-actions"></div>
  <div class="adulte">
    <svg class="coeur" viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>
    <span id="rappel-adulte" data-texte="sos.rappelAdulte"></span>
  </div>
</section>

<section class="ecran ecran-hub" id="entrainement" aria-labelledby="titre-hub" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="accueil.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="hub-titre" id="titre-hub" tabindex="-1" data-texte="jeux.hub.titre"></h2>
  </div>
  <div class="niveau-carte">
    <div class="niveau-plus" data-perso="petit-plus"></div>
    <div class="niveau-infos">
      <div class="niveau-nom titres" id="niveau-nom"></div>
      <div class="jauge" aria-hidden="true"><div class="jauge-rempli" id="jauge"></div></div>
      <p class="niveau-texte" id="niveau-texte"></p>
      <p class="niveau-texte" id="niveau-aide" data-texte="jeux.hub.aide"></p>
      <p class="niveau-texte plafond" id="plafond" data-texte="limites.messageFinRituel" hidden></p>
    </div>
  </div>
  <div class="liste-jeux" id="liste-jeux"></div>
  <div class="pousse"></div>
  <button class="btn btn-orange" id="vers-combat" type="button"><span data-texte="jeux.hub.combat"></span></button>
</section>

<section class="ecran" id="combat" aria-labelledby="combat-tour" hidden>
  <div class="entete entete-jeu">
    <button class="retour" type="button" data-retour data-aria="jeux.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="combat-tour" id="combat-tour" tabindex="-1"></h2>
    <div class="cale" aria-hidden="true"></div>
  </div>
  <div class="pensee-bulle">
    <div class="pensee-qui" data-texte="combat.ecran.minusDit"></div>
    <div class="pensee-texte" id="pensee" aria-live="polite"></div>
  </div>
  <div class="arene arene-combat">
    <div class="jauges">
      <div class="jauge-bloc" id="bloc-plus" role="img">
        <div class="jauge-ligne" aria-hidden="true"><span class="jauge-nom-plus" data-texte="combat.ecran.forcePlus"></span><span class="force-chiffre"><svg viewBox="0 0 24 24" width="16" height="16" fill="none"><use href="#i-etoile"/></svg><span id="force-valeur"></span></span></div>
        <div class="jauge jauge-combat" aria-hidden="true"><div class="jauge-rempli" id="jauge-plus"></div></div>
      </div>
      <div class="jauge-bloc" id="bloc-minus" role="img">
        <div class="jauge-ligne" aria-hidden="true"><span class="jauge-nom-minus" data-texte="combat.ecran.tailleMinus"></span></div>
        <div class="jauge jauge-combat" aria-hidden="true"><div class="jauge-rempli jauge-minus" id="jauge-minus"></div></div>
      </div>
    </div>
    <div class="combat-plus perso-place" data-perso="petit-plus"></div>
    <div class="combat-minus perso-place" data-perso="petit-minus"></div>
  </div>
  <div class="combat-message" id="combat-message" role="status"></div>
  <div class="pousse"></div>
  <div class="jeu-actions" id="combat-actions"></div>
</section>

<section class="ecran" id="victoire" aria-labelledby="titre-victoire" hidden>
  <div>
    <div class="surtitre" data-texte="combat.victoire.surtitre"></div>
    <h2 class="titre-jeu" id="titre-victoire" tabindex="-1" data-texte="combat.victoire.titre"></h2>
  </div>
  <div class="arene arene-victoire">
    <div class="victoire-plus perso-place" data-perso="petit-plus"></div>
    <div class="victoire-minus">
      <div class="pff" data-texte="combat.victoire.pff"></div>
      <div class="perso-place victoire-minus-place" data-perso="petit-minus"></div>
    </div>
  </div>
  <p class="intro" data-texte="combat.messages.victoireSousTexte"></p>
  <div class="phrase-carte">
    <svg class="etoile etoile-grande" viewBox="0 0 24 24" width="40" height="40" fill="none" aria-hidden="true"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z"/></svg>
    <div>
      <div class="phrase-titre" data-texte="combat.victoire.phraseTitre"></div>
      <div class="phrase-texte" id="victoire-phrase"></div>
    </div>
  </div>
  <div class="pousse"></div>
  <div class="fin-actions">
    <button class="btn2 btn2-minus" id="victoire-rejouer" type="button"><span data-texte="jeux.rejouer"></span></button>
    <button class="btn btn-plus" id="victoire-accueil" type="button"><span data-texte="combat.victoire.aDemain"></span></button>
  </div>
</section>

<section class="ecran" id="mes-minus" aria-labelledby="titre-mes-minus" hidden>
  <div class="entete">
    <button class="retour" type="button" data-retour data-aria="jeux.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <h2 class="hub-titre" id="titre-mes-minus" tabindex="-1" data-texte="mesMinus.titre"></h2>
  </div>
  <div class="barriere" id="barriere">
    <p class="barriere-titre titres" data-texte="mesMinus.barriereTitre"></p>
    <p data-texte="mesMinus.barriereTexte"></p>
    <label class="barriere-question" for="barriere-reponse" id="barriere-question"></label>
    <input class="barriere-reponse" id="barriere-reponse" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*">
    <p class="barriere-rate" id="barriere-rate" role="alert" hidden></p>
    <button class="btn btn-plus" id="barriere-valider" type="button"><span data-texte="mesMinus.barriereValider"></span></button>
  </div>
  <div class="mes-minus-contenu" id="mes-minus-contenu" hidden>
    <p class="mes-minus-consigne" data-texte="mesMinus.consigne"></p>
    <div class="liste-themes" id="liste-themes"></div>
    <button class="btn btn-plus" id="mes-minus-fini" type="button"><span data-texte="mesMinus.fini"></span></button>
  </div>
</section>

<section class="ecran ecran-souffle" id="souffle" aria-labelledby="titre-souffle" hidden>
  <div class="entete entete-jeu">
    <button class="retour" type="button" data-retour data-aria="jeux.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="compteur" id="souffle-compteur"></div>
    <div class="cale" aria-hidden="true"></div>
  </div>
  <h2 class="jeu-titre" id="titre-souffle" tabindex="-1" data-jeu="souffle"></h2>
  <p class="jeu-consigne" data-texte="jeux.souffle.consigne"></p>
  <div class="jeu-corps" id="souffle-corps"></div>
  <div class="pousse"></div>
  <div class="jeu-actions" id="souffle-actions"></div>
</section>

<section class="ecran ecran-tresors" id="tresors" aria-labelledby="titre-tresors" hidden>
  <div class="entete entete-jeu">
    <button class="retour" type="button" data-retour data-aria="jeux.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="points points-tresors" id="tresors-points" role="img"></div>
    <div class="cale" aria-hidden="true"></div>
  </div>
  <h2 class="jeu-titre" id="titre-tresors" tabindex="-1" data-jeu="tresors"></h2>
  <div class="jeu-corps" id="tresors-corps"></div>
  <div class="pousse"></div>
  <div class="jeu-actions" id="tresors-actions"></div>
</section>

<section class="ecran ecran-memo" id="memo" aria-labelledby="titre-memo" hidden>
  <div class="entete entete-jeu">
    <button class="retour" type="button" data-retour data-aria="jeux.retour">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="compteur" id="memo-compteur"></div>
    <div class="cale" aria-hidden="true"></div>
  </div>
  <div>
    <h2 class="jeu-titre" id="titre-memo" tabindex="-1" data-jeu="memo"></h2>
    <p class="jeu-consigne memo-consigne" data-texte="jeux.memo.consigne"></p>
  </div>
  <div class="memo-message" id="memo-message" aria-live="polite"></div>
  <div class="memo-grille" id="memo-grille"></div>
  <div class="pousse"></div>
  <div class="jeu-actions" id="memo-actions"></div>
</section>

<!-- Les icônes au trait (le kit : pas d'émoji). Une par sens pour la chasse aux trésors. -->
<svg width="0" height="0" fill="none" class="symboles" aria-hidden="true">
  <symbol id="i-vue" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-toucher" viewBox="0 0 24 24"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11M11 10.5V4a1.5 1.5 0 0 1 3 0v6.5M14 10.5V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-.5a6 6 0 0 1-5-2.7L2.8 14a1.5 1.5 0 0 1 2.5-1.7L8 15"/></symbol>
  <symbol id="i-ouie" viewBox="0 0 24 24"><path d="M6 9a6 6 0 1 1 12 0c0 3-1.8 4.2-3 5.6-1 1.2-1 2.4-2 3.6-1.2 1.4-4 1.4-5-.8"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0"/></symbol>
  <symbol id="i-odorat" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M12 3.5v1.5M16.5 8H15M9 8H7.5M15.2 4.8l-1 1M9.8 10.2l-1 1M15.2 11.2l-1-1M9.8 5.8l-1-1M12 11v10M12 17c-3 0-5-2.5-5-2.5S9 13 12 14"/></symbol>
  <symbol id="i-gout" viewBox="0 0 24 24"><path d="M3.5 11c2.5 6 14.5 6 17 0"/><path d="M3.5 11c3-2.5 14-2.5 17 0"/><path d="M9 14.5c1 1 5 1 6 0"/></symbol>
  <symbol id="i-bulle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M8.5 7.5a5 5 0 0 1 3-1.5"/></symbol>
  <symbol id="i-gemme" viewBox="0 0 24 24"><path d="M6.5 3.5h11l4 5.5L12 20.5 2.5 9z"/><path d="M2.5 9h19M9.5 3.5 8 9l4 11.5L16 9l-1.5-5.5"/></symbol>
  <symbol id="i-etoile" viewBox="0 0 24 24"><path d="M12 2.8l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6-4.5-4.2 6.1-.8z"/></symbol>
</svg>

<div class="bulle-info" id="bientot" role="status" hidden></div>

<!-- Pour l'adulte qui a relu contenu.json : où est l'erreur. -->
<div class="panne" id="panne" role="alert" hidden>
  <strong>Le fichier contenu.json contient une erreur.</strong>
  Le jeu ne démarre pas tant qu'elle n'est pas corrigée :
  <ul id="panne-liste"></ul>
</div>

</body>
</html>
