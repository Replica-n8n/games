<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mémo des phrases</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#FFF1F6}
a{color:#BE185D}a:hover{color:#831843}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 20px 24px; display: flex; flex-direction: column; gap: 12px; background: #FFF1F6; font-family: Nunito, 'Trebuchet MS', sans-serif; color: #2B2350; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<a href="Entrainement.dc.html" aria-label="Retour à l’entraînement" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; color: #831843">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="font-weight: 800; font-size: 15px; color: #831843">Paires : {{foundLabel}} / 4</div>
<div style="width: 44px"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; text-align: center">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.05; color: #831843">Mémo des phrases</h1>
<div style="font-size: 15px; font-weight: 700; color: #4B4470">Retrouve chaque pensée de Minus et la phrase de Plus qui lui répond.</div>
</div>
<div style="padding: 10px 14px; border-radius: 16px; background: {{msgBg}}; min-height: 50px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; font-weight: 800; line-height: 1.3; color: #2B2350">{{message}}</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="8">
<button type="button" onClick="{{c.tap}}" aria-label="{{c.label}}" style="position: relative; height: 104px; padding: 8px 10px; border-radius: 18px; border: {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font-family: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; box-sizing: border-box">
<sc-if value="{{c.hidden}}" hint-placeholder-val="{{ true }}">
<svg viewBox="0 0 24 24" width="38" height="38" fill="#F9C74F" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"></path></svg>
</sc-if>
<sc-if value="{{c.shown}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase">{{c.tag}}</span>
<span style="font-size: 14px; font-weight: 800; line-height: 1.2">{{c.text}}</span>
</sc-if>
<sc-if value="{{c.matched}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="#15803D" aria-hidden="true" style="position: absolute; top: 6px; right: 6px"><circle cx="12" cy="12" r="11"></circle><path d="M7 12.5l3.2 3L17 9" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</sc-if>
</button>
</sc-for>
</div>
<sc-if value="{{won}}" hint-placeholder-val="{{ false }}">
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" onClick="{{reset}}" style="height: 56px; border-radius: 18px; border: 2px solid #BE185D; background: #FFFFFF; color: #BE185D; font-family: inherit; font-weight: 800; font-size: 16px; cursor: pointer">Rejouer</button>
<a href="Entrainement.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #0F766E; color: #FFFFFF; text-decoration: none; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 #134E4A">+2 étoiles !</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
    this.timer = null;
  }
  fresh() {
    return { open: [], matched: [false, false, false, false, false, false, false, false], lock: false, found: 0, good: null,
      message: "Touche deux cartes pour les retourner." };
  }
  componentWillUnmount() { if (this.timer) clearTimeout(this.timer); }
  deck() {
    var pairs = [
      ["Tu vas sûrement rater !", "Si je me trompe, ce n’est pas grave : j’apprends."],
      ["Et si tout le monde se moquait de toi ?", "Mes vrais amis m’aiment comme je suis."],
      ["Et s’il arrivait quelque chose de grave ?", "Je suis en sécurité, et je peux demander de l’aide."],
      ["Avoir peur, c’est pour les bébés !", "J’ai le droit d’avoir peur. Et la peur, ça passe."]
    ];
    var order = [[1, 1], [0, 0], [2, 0], [3, 1], [0, 1], [1, 0], [3, 0], [2, 1]];
    return order.map(function (o) { return { pair: o[0], kind: o[1], text: pairs[o[0]][o[1]] }; });
  }
  tap(i) {
    var st = this.state;
    if (st.lock || st.matched[i] || st.open.indexOf(i) !== -1) return;
    var open = st.open.concat([i]);
    if (open.length < 2) { this.setState({ open: open }); return; }
    var d = this.deck();
    var a = d[open[0]], b = d[open[1]];
    if (a.pair === b.pair && a.kind !== b.kind) {
      var m = st.matched.slice(); m[open[0]] = true; m[open[1]] = true;
      var found = st.found + 1;
      var phrase = a.kind === 1 ? a.text : b.text;
      this.setState({ open: [], matched: m, found: found, good: true,
        message: found === 4 ? "Bravo ! Tu connais toutes les phrases magiques. Petit Plus devient plus forte !" : "Paire trouvée ! Répète avec Plus : « " + phrase + " »" });
    } else {
      var self = this;
      this.setState({ open: open, lock: true, good: false, message: "Pas encore la bonne paire… retiens bien où elles sont !" });
      this.timer = setTimeout(function () { self.setState({ open: [], lock: false }); }, 1400);
    }
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var cards = this.deck().map(function (c, i) {
      var matched = st.matched[i];
      var shown = matched || st.open.indexOf(i) !== -1;
      var minus = c.kind === 0;
      return {
        hidden: !shown, shown: shown, matched: matched,
        text: c.text,
        tag: minus ? "Minus dit" : "Plus répond",
        label: shown ? (minus ? "Minus dit : " : "Plus répond : ") + c.text : "Carte " + (i + 1) + ", face cachée",
        bg: !shown ? "#BE185D" : (minus ? "#F3E6FF" : "#E3F6EF"),
        color: minus ? "#4C3A75" : "#134E4A",
        border: matched ? "3px solid #15803D" : (!shown ? "3px solid #831843" : (minus ? "3px solid #4C3A75" : "3px solid #0F766E")),
        tap: function () { self.tap(i); }
      };
    });
    return {
      cards: cards,
      foundLabel: String(st.found),
      message: st.message,
      msgBg: st.good === false ? "#FDF1DC" : (st.good ? "#E3F6EF" : "#FFFFFF"),
      won: st.found === 4,
      reset: function () { if (self.timer) clearTimeout(self.timer); self.setState(self.fresh()); }
    };
  }
}
</script>
</body>
</html>
