<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chasse aux 5 trésors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&amp;family=Nunito:wght@500;700;800&amp;display=swap">
<style>
body{margin:0;background:#EAF1FF}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 44px 24px 28px; display: flex; flex-direction: column; align-items: center; gap: 16px; background: #EAF1FF; font-family: Nunito, 'Trebuchet MS', sans-serif; color: #1E3A8A; overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between; width: 100%">
<a href="Entrainement.dc.html" aria-label="Retour à l’entraînement" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; color: #1E3A8A">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="display: flex; gap: 6px" aria-label="Étape {{stepLabel}} sur 5">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="5">
<div style="width: 12px; height: 12px; border-radius: 50%; background: {{d.bg}}; border: 2px solid #1D4ED8; box-sizing: border-box"></div>
</sc-for>
</div>
<div style="width: 44px"></div>
</div>
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 32px; line-height: 1; text-align: center">Chasse aux 5 trésors</h1>

<sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%">
<div style="width: 150px; height: 150px; border-radius: 50%; background: #FFFFFF; border: 4px solid #1D4ED8; display: flex; align-items: center; justify-content: center; box-sizing: border-box; color: #1D4ED8">
<sc-if value="{{s0}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
<sc-if value="{{s1}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 11V4a1.5 1.5 0 0 1 3 0v7M14 11V5.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3 14a1.5 1.5 0 0 1 2.5-1.6L8 15"></path></svg></sc-if>
<sc-if value="{{s2}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9a5 5 0 0 1 10 0c0 3-3 4-3 7a3 3 0 0 1-6 0M10 9a2 2 0 0 1 4 0c0 1.5-1.5 2-1.5 3.5"></path></svg></sc-if>
<sc-if value="{{s3}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c0 5 5 8 5 12a2.5 2.5 0 0 1-2.5 2.5c-1 0-1.5-.8-2.5-.8s-1.5.8-2.5.8A2.5 2.5 0 0 1 7 15c0-2 1.5-3.5 2.5-5"></path></svg></sc-if>
<sc-if value="{{s4}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="80" height="80" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11c4 6 14 6 18 0M3 11c4-3 14-3 18 0M8 14.5h8"></path></svg></sc-if>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 28px; line-height: 1.1">{{title}}</div>
<div style="font-size: 16px; font-weight: 700; line-height: 1.35; max-width: 310px; color: #334E8A">{{hint}}</div>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; min-height: 64px">
<sc-for list="{{gems}}" as="g" hint-placeholder-count="5">
<button type="button" onClick="{{g.tap}}" aria-label="{{g.label}}" style="width: 58px; height: 58px; border-radius: 18px; border: 3px solid #1D4ED8; background: {{g.bg}}; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
<svg viewBox="0 0 24 24" width="30" height="30" fill="{{g.fill}}" stroke="#1D4ED8" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12l4 5-10 11L2 9z"></path></svg>
</button>
</sc-for>
</div>
<div style="font-size: 15px; font-weight: 800; color: #1D4ED8">{{countLabel}}</div>
</div>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<svg viewBox="0 0 160 200" width="150" height="188" aria-label="Petit Plus contente">
<ellipse cx="45" cy="95" rx="32" ry="45" fill="#BFE9F2" stroke="#7CC7D6" stroke-width="3" transform="rotate(-28 45 95)"></ellipse>
<ellipse cx="115" cy="95" rx="32" ry="45" fill="#BFE9F2" stroke="#7CC7D6" stroke-width="3" transform="rotate(28 115 95)"></ellipse>
<path d="M70 172 L70 192 M90 172 L90 192" stroke="#FFC9A0" stroke-width="7" stroke-linecap="round"></path>
<path d="M80 95 L118 170 Q80 182 42 170 Z" fill="#F28DB2"></path>
<path d="M104 118 L128 88 M56 118 L34 92" stroke="#FFC9A0" stroke-width="7" stroke-linecap="round"></path>
<circle cx="80" cy="70" r="30" fill="#FFD9B8"></circle>
<path d="M50 68 Q52 36 80 36 Q108 36 110 68 Q100 50 80 52 Q60 50 50 68 Z" fill="#F2B233"></path>
<path d="M65 73 Q70 67 75 73 M85 73 Q90 67 95 73" stroke="#2B2350" stroke-width="3" fill="none" stroke-linecap="round"></path>
<path d="M68 83 Q80 97 92 83 Z" fill="#2B2350"></path>
</svg>
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.1">15 trésors trouvés !</div>
<p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4; max-width: 300px; color: #334E8A">Quand Minus fait tourner ta tête, fais la chasse aux trésors : ton corps revient ici, maintenant, au calme.</p>
<div style="padding: 8px 16px; border-radius: 999px; background: #FDE7B0; border: 2px solid #F2B233; font-weight: 800; font-size: 16px; color: #7C2D12">+1 étoile pour Petit Plus</div>
</div>
</sc-if>

<div style="margin-top: auto; width: 100%; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{canNext}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{next}}" style="width: 100%; height: 58px; border: 0; border-radius: 20px; background: #1D4ED8; color: #FFFFFF; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 21px; cursor: pointer; box-shadow: 0 5px 0 #1E3A8A">{{nextLabel}}</button>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<a href="Entrainement.dc.html" style="display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 20px; background: #0F766E; color: #FFFFFF; text-decoration: none; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 21px; box-shadow: 0 5px 0 #134E4A">Retour à l’entraînement</a>
<button type="button" onClick="{{reset}}" style="height: 48px; border-radius: 16px; border: 2px solid #1D4ED8; background: #FFFFFF; color: #1D4ED8; font-family: inherit; font-weight: 800; font-size: 15px; cursor: pointer">Rejouer</button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0, found: 0 };
  }
  renderVals() {
    var steps = [
      { n: 5, title: "5 choses que tu vois", hint: "Regarde autour de toi : une couleur, un objet, une lumière… Touche un trésor à chaque fois." },
      { n: 4, title: "4 choses que tu touches", hint: "Ton pull, la table, tes cheveux… Qu’est-ce que ça fait sous tes doigts ?" },
      { n: 3, title: "3 choses que tu entends", hint: "Ferme les yeux et écoute bien : une voiture, un oiseau, ta respiration…" },
      { n: 2, title: "2 choses que tu sens", hint: "Renifle comme un petit chien : ton t-shirt, ta main, l’air de la pièce…" },
      { n: 1, title: "1 chose que tu goûtes", hint: "Le goût dans ta bouche, une gorgée d’eau… ou une chose que tu aimes très fort !" }
    ];
    var self = this;
    var st = this.state;
    var done = st.step >= 5;
    var cur = steps[Math.min(st.step, 4)];
    var gems = [];
    for (var k = 0; k < cur.n; k++) {
      (function (idx) {
        var on = idx < st.found;
        gems.push({
          bg: on ? "#DBE7FF" : "#FFFFFF",
          fill: on ? "#60A5FA" : "none",
          label: "Trésor " + (idx + 1) + (on ? " trouvé" : ""),
          tap: function () { if (!on && idx === self.state.found) self.setState({ found: self.state.found + 1 }); }
        });
      })(k);
    }
    var dots = [];
    for (var j = 0; j < 5; j++) dots.push({ bg: j < st.step || done ? "#1D4ED8" : (j === st.step ? "#93B4F5" : "#FFFFFF") });
    var complete = !done && st.found >= cur.n;
    return {
      playing: !done, done: done,
      s0: st.step === 0, s1: st.step === 1, s2: st.step === 2, s3: st.step === 3, s4: st.step === 4,
      title: cur.title, hint: cur.hint, gems: gems, dots: dots,
      stepLabel: String(Math.min(st.step + 1, 5)),
      countLabel: complete ? "Tous trouvés, bravo !" : st.found + " sur " + cur.n + " trouvés",
      canNext: complete,
      nextLabel: st.step === 4 ? "Terminer la chasse" : "Trésor suivant",
      next: function () { self.setState({ step: self.state.step + 1, found: 0 }); },
      reset: function () { self.setState({ step: 0, found: 0 }); }
    };
  }
}
</script>
</body>
</html>
