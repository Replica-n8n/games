<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La Bataille · cartes vivantes</title>
<meta name="description" content="La bataille, mais les cartes se battent pour de vrai. Douze mois, douze constellations, des arcanes à lancer. Hors ligne, sans publicité.">
<meta name="theme-color" content="#000644">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<link rel="apple-touch-icon" href="./icone-192.png">
<link rel="preload" href="./polices/fraunces-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./polices/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Direction « Nuit claire » (voir DESIGN.md) : le ciel partout, le verre par-dessus.
   Les couleurs ci-dessous sont CALCULÉES par tools/bataille-couleurs.mjs, qui
   vérifie aussi qu'elles sont bien celles écrites ici : ne pas les retoucher à la main. */
@font-face{font-family:'Fraunces';font-weight:600;font-display:swap;src:url(./polices/fraunces-600-latin.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:500 700;font-display:swap;src:url(./polices/outfit-latin.woff2) format('woff2')}
:root{color-scheme:dark;
  --ciel1:#000644;--ciel2:#202a6b;--texte:#f4f2ff;--texte2:#caceff;--marque:#dfe0ff;--lueur:#008580;
  --surface:#111b5e;--accent:#feca63;--surAccent:#010c53;--moi:#feca63;--lui:#cdacff;--moiPlein:#feca63;--luiPlein:#a57ce5;--choix:#ffd790;
  --verre:rgba(6,10,44,.66);--display:'Fraunces',Georgia,serif;--corps:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--ciel1),var(--ciel2));color:var(--texte);font-family:var(--corps);font-weight:500;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
#cadre{position:relative;width:360px;flex:none;transform-origin:top center;overflow:hidden}
canvas{position:absolute;left:0;display:block}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--texte);outline-offset:3px}
svg{display:block}

.mois{position:absolute;left:16px;top:12px;width:186px}
.mois h2{margin:0;font:600 36px/1 var(--display);color:var(--texte)}
.mois p{margin:8px 0 0;font-size:15px;line-height:1.25;color:var(--texte);text-wrap:balance}
.signe{position:absolute;left:206px;width:138px;top:80px;text-align:center;font:600 16px var(--display);color:var(--texte2)}
.annee{position:absolute;left:0;right:0;top:104px;display:flex;justify-content:center;gap:9px}
.annee i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--texte2);opacity:.55}
.annee i.fait{background:var(--texte2);opacity:.8}
.annee i.ici{background:var(--texte);border-color:var(--texte);opacity:1;transform:scale(1.5)}

/* Le verre : liseré sombre au bord, reflet sur l'arête du haut. PAS de flou en
   jeu : même loin de la toile, chaque plaque floue se recalculait à chaque image
   (45 images/s en combat avec trois arcanes, 60 sans). Derrière, le ciel est
   fixe : une plaque teintée donne le même effet. Seuls les écrans de titre et de
   fin floutent, et le jeu est alors à l'arrêt. */
.verre{background:var(--verre);
  border:1px solid rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 0 0 1px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.35)}
/* Posé sur le tapis, par-dessus les cartes : presque opaque, pour rester lisible. */
.plein{background:rgba(8,13,58,.9)}
.ruban.verre{background:rgb(8,13,58)}
.compte{position:absolute;left:10px;right:10px;top:124px;height:34px;border-radius:17px;display:flex;align-items:center;gap:8px;padding:0 14px}
.compte .n{font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;min-width:26px;text-align:center}
.compte .qui{font-size:14px}
.compte .moi{color:var(--moi)}.compte .lui{color:var(--lui)}
.barre{flex:1;height:8px;border-radius:4px;position:relative;overflow:hidden;background:var(--luiPlein)}
.barre span{position:absolute;left:0;top:0;bottom:0;background:var(--moiPlein);transition:width .3s cubic-bezier(.25,1,.5,1)}
.arcanesLui{position:absolute;right:16px;top:94px;display:flex;gap:4px}
.arcanesLui i{width:14px;height:21px;border-radius:3px;border:1.5px solid #120c08;background:#5a3a90;box-shadow:inset 0 0 0 2px #9a7ad8}

.astuce{position:absolute;left:50%;transform:translate(-50%,-50%);width:max-content;max-width:316px;padding:6px 14px 7px;border-radius:16px;text-align:center;font-size:15px;line-height:1.3;color:var(--texte);text-wrap:balance;pointer-events:none}
.ruban{position:absolute;left:10px;right:10px;top:124px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font:600 20px/1 var(--display);color:var(--accent);
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.ruban.vu{opacity:1}
.page{position:absolute;left:32px;right:32px;padding:20px 16px 18px;border-radius:28px;text-align:center}
.page h3{margin:0;font:600 30px/1.05 var(--display);text-wrap:balance}
.page p{margin:10px 0 0;font-size:16px;font-weight:700}

/* Sous le pouce : les arcanes, puis l'action. */
.main{position:absolute;left:0;right:0;bottom:100px;height:86px;display:flex;justify-content:center;gap:12px}
.arcane{width:92px;height:86px;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:7px 4px 8px;color:var(--texte);
  transition:opacity .2s,transform .2s cubic-bezier(.25,1,.5,1)}
.arcane .num{font:600 14px/1 var(--display)}
.arcane svg{width:34px;height:34px}
.arcane .nom{font-size:14px;line-height:1;white-space:nowrap}
.arcane.dort svg{opacity:.55}
.arcane.pret{border:1.5px solid var(--accent);background:rgba(40,46,110,.72)}
.arcane:active{transform:scale(.95)}
.action{position:absolute;left:16px;right:16px;bottom:16px;height:60px;border-radius:30px;background:var(--accent);color:var(--surAccent);font-weight:700;font-size:21px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px rgba(0,0,0,.4);transition:transform .15s cubic-bezier(.25,1,.5,1)}
.action:active{transform:scale(.97)}
.action.second{background:rgba(8,13,58,.9);color:var(--texte);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 8px 18px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.45)}
.vitesse{position:absolute;left:16px;right:16px;bottom:22px;height:48px;border-radius:24px;display:flex;overflow:hidden;font-size:16px}
.vitesse button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--texte2);border-radius:24px}
.vitesse button svg{width:16px;height:16px;display:none}
.vitesse button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--accent);font-weight:700}
.vitesse button[aria-pressed="true"] svg{display:block}

.voile{position:absolute;inset:0;background:rgba(0,6,68,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 16px 16px}
.voile h1{margin:22vh 0 0;font:600 58px/1 var(--display);color:var(--texte);text-wrap:balance}
#cadre .voile h1{margin-top:120px}
.voile .sous{margin:12px 0 0;font:600 20px var(--display);color:var(--accent)}
.voile p{margin:14px 12px 0;font-size:17px;line-height:1.4;color:var(--texte);text-wrap:balance}
.voile .pousse{flex:1;min-height:24px}
.voile .action{position:static;align-self:stretch;flex:none;margin-top:12px}
.voile small{margin-top:14px;font-size:14px;color:var(--texte2)}
#tourne{position:fixed;inset:0;z-index:5;background:var(--ciel1);display:none;align-items:center;justify-content:center;font:600 22px var(--display);color:var(--texte);text-align:center;padding:24px}
@media (orientation:landscape) and (max-height:480px){#tourne{display:flex}}

/* Sans transparence ou en contraste renforcé : le verre devient une plaque pleine. */
@media (prefers-reduced-transparency:reduce),(prefers-contrast:more){
  .verre,.action.second,.arcane.pret,.astuce{background:var(--surface)}
  .voile{background:var(--ciel1);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>

function alive(side){return units.filter(function(u){return u.side===side&&!u.dead;});}

/* Les dégâts s'écrivent À CÔTÉ de la carte touchée, jamais sur une jauge. */

function hurt(b,d,bySide,src,crit){if(b.dead)return;
  if(b.shield){b.shield=false;chiffre(b,'Bloqué',false);return;}
  d=Math.round(d);b.hp-=d;b.hit=0.22;if(src)b.y=Math.max(T0+70,Math.min(T1-14,b.y+(b.y>src.y?1:-1)*5));

function attack(a,b){var d=(3+a.v*0.5)*rnd(0.75,1.25),crit=Math.random()<0.12;if(crit)d*=1.9;
  var double=a.first&&rule('belier');if(double)d*=2;a.first=false;
  if(rule('lion')&&(a.card.r==='V'||a.card.r==='D'||a.card.r==='R'))d*=1.5;
  if(a.buff>0)d*=1.5;
  hurt(b,d,a.side,a,crit||double);
  if(rule('poissons')&&a.card.s==='♥'){var soin=Math.min(a.max-a.hp,d*0.4);a.hp+=soin;if(soin>=1)chiffre(a,'+'+Math.round(soin),false);}

function cadence(u){var iv=rnd(0.65,1.0);if(rule('verseau')&&u.card.s==='♠')iv*=0.5;return iv;}
/* La carte que le mois avantage porte une étoile d'or, dès le placement : sans
   elle, rien ne montrait que la règle du mois agissait. */
function favori(u){var m=month().id,r=u.card.r,s=u.card.s;
  return(m==='verseau'&&s==='♠')||(m==='poissons'&&s==='♥')||(m==='taureau'&&s==='♦')||(m==='lion'&&(r==='V'||r==='D'||r==='R'))||(m==='cancer'&&(u.lane===0||u.lane===4))||(m==='sagittaire'&&s==='♣');}
function castArcana(a,side){var mine=alive(side),opp=alive(-side),tombes=side>0?myFallen:foeFallen;
  if(!opp.length&&a.id!=='etoile'&&a.id!=='temperance')return false;
  if((a.id==='roue'||a.id==='temperance'||a.id==='force')&&!mine.length)return false;
  var fallen=tombes.filter(function(u){return u.dead&&!u.clone;});if(a.id==='etoile'&&!fallen.length)return false;
  banner((side>0?'':'Le Maudit joue ')+a.name,1.4);
  if(a.id==='tour'){var t=opp.slice().sort(function(x,y){return y.v-x.v;})[0];bolts.push({x0:t.x,y0:T0,x1:t.x,y1:t.y-30*t.sc,t:0});hurt(t,25,side,null,false);}
  else if(a.id==='mort'){var m=opp.slice().sort(function(x,y){return x.hp-y.hp;})[0];bolts.push({x0:m.x,y0:T0,x1:m.x,y1:m.y-30*m.sc,t:0,dark:true});m.shield=false;hurt(m,m.hp+99,side,null,false);}

    var r1=lo.hp/lo.max,r2=hi.hp/hi.max;lo.hp=Math.max(1,Math.round(r2*lo.max));hi.hp=Math.max(1,Math.round(r1*hi.max));lo.hit=0.2;hi.hit=0.2;}

  else if(a.id==='etoile'){var f=fallen[fallen.length-1];f.dead=false;f.deathT=0;f.hp=Math.round(f.max/2);f.killer=null;f.target=null;f.poison=0;tombes.splice(tombes.indexOf(f),1);f.drop=0.6;}

function update(dt){
  if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('ruban').classList.remove('vu');}

      var rang=0;for(var k=0;k<units.length;k++){var o=units[k];if(o===u)break;if(o.side===u.side&&!o.dead&&o.target===t)rang++;}

    if(flyers.every(function(f){return f.t>=f.dur+f.delay;})){S.phase='result';$('goBtn').hidden=false;$('goBtn').textContent=(!myDeck.length||!foeDeck.length||S.round>=12)?'Voir le résultat':'Mois suivant';counts();}}
}
function endFight(){S.phase='collect';var gain=0,loss=0,k=0,me={x:62,y:141},foe={x:W-62,y:141};

    flyers.push({x0:u.x,y0:u.y-27*u.sc,x1:dest.x,y1:dest.y,t:0,delay:k*0.08,dur:0.7,side:toMe?1:-1});k++;

  $('pageP').textContent=gain+(gain>1?' cartes prises':' carte prise')+' · '+loss+(loss>1?' perdues':' perdue');$('page').hidden=false;}

  $('endT').textContent=m>f?'Victoire':(m<f?'Défaite':'Égalité');

/* ---------- dessin des cartes (couleurs d'objet, celles d'un vrai jeu) ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

   puis se colle. layout() vide DOS quand l'échelle change. */

  peindreDecor();draw();}
var last=performance.now();
function loop(now){requestAnimationFrame(loop);var dt=Math.min(0.05,(now-last)/1000);last=now;if(pause||!$('title').hidden||!$('end').hidden)return;update(dt);draw();}

/* ---------- départ ---------- */
var sauvee=gardee();
layout();
if(sauvee){reprendre(sauvee);$('startBtn').textContent='Reprendre · mois '+sauvee.round+' sur 12';$('newBtn').hidden=false;}else newGame();
$('startBtn').addEventListener('click',function(){$('title').hidden=true;});
$('newBtn').addEventListener('click',function(){newGame();$('title').hidden=true;});
$('againBtn').addEventListener('click',function(){$('end').hidden=true;newGame();});
addEventListener('resize',layout);
if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load('600 15px Fraunces'),document.fonts.load('700 17px Outfit')]).then(function(){peindreDecor();draw();},function(){});
/* Deux appuis rapides zoomaient toute la page sur iPhone. */
addEventListener('dblclick',function(e){e.preventDefault();});addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('visibilitychange',function(){pause=document.hidden;last=performance.now();});
draw();requestAnimationFrame(loop);

/* Crochets pour les bancs de tools/ : rien ici ne sert au jeu. */
window.__essais={etat:function(){return{phase:S.phase,round:S.round,mois:month().id,moi:myDeck.length,lui:foeDeck.length,
    unites:units.map(function(u){return{side:u.side,lane:u.lane,x:u.x,y:u.y,r:u.card.r,s:u.card.s,dead:u.dead,clone:!!u.clone,hp:u.hp,max:u.max,shield:!!u.shield,poison:u.poison,favori:favori(u)};}),arcanes:myTarot.map(function(a){return a.id;}),H:H,T0:T0,T1:T1};},
  vitesse:function(n){S.speed=n;},ciel:function(){return CIEL;},pose:function(m,t){units.forEach(function(u){var c=(u.side>0?m:t)[u.lane];if(c){u.card={r:c[0],s:c[1]};u.v=VAL[c[0]];}});},coup:function(i,j){var a=units[i],b=units[j],h0=b.hp,s0=a.hp;attack(a,b);return{degats:h0-b.hp,soin:a.hp-s0,poison:b.poison};},blesse:function(i,n){units[i].hp-=n;},rythme:function(i){return cadence(units[i]);},tirees:function(){return TIREES;},peins:function(n){var t=performance.now();for(var i=0;i<n;i++)draw();ctx.getImageData(0,0,1,1);return performance.now()-t;},force:function(o){units.forEach(function(u){for(var k in o)u[k]=o[k];});},donne:function(ids,lui){myTarot=ids.map(arcane);if(lui)foeTarot=lui.map(arcane);renderTarot();},mois:function(id){for(var i=0;i<12;i++)if(MONTHS[i].id===id)S.start=(i-S.round+1+120)%12;units.forEach(function(u){if(!u.clone)(u.side>0?myDeck:foeDeck).unshift(u.card);});donner();}};

/* Installation : un bouton sur l'écran titre, TOUJOURS, tant que le jeu n'est pas
   installé. Chrome donne son invitation (beforeinstallprompt) ; sans elle (iPhone,
   ou invitation déjà refusée), le bouton montre où se trouve la commande. */
var invitation=null;
function installe(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;}
function majInstaller(){$('instBtn').hidden=installe();if(installe())$('instAide').hidden=true;}
addEventListener('beforeinstallprompt',function(e){e.preventDefault();invitation=e;majInstaller();});
addEventListener('appinstalled',function(){invitation=null;majInstaller();});
$('instBtn').addEventListener('click',function(){
  if(invitation){var i=invitation;invitation=null;i.prompt();if(i.userChoice&&i.userChoice.then)i.userChoice.then(majInstaller,majInstaller);return;}
  var a=$('instAide');a.textContent=/iPhone|iPad|iPod/.test(navigator.userAgent)?'Touche Partager, puis « Sur l\u2019écran d\u2019accueil ».':'Ouvre le menu du navigateur, puis « Ajouter à l\u2019écran d\u2019accueil ».';a.hidden=!a.hidden;});
majInstaller();

/* Mise à jour : un rechargement ne redemande pas sw.js, il faut update(). La
   nouvelle version ne se prend qu'à l'écran titre ou de fin, jamais en partie. */
var majPrete=false;
function prendreMaj(){if(majPrete&&(!$('title').hidden||!$('end').hidden))location.reload();}
if('serviceWorker' in navigator){var avait=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(avait){majPrete=true;prendreMaj();}});
  navigator.serviceWorker.register('./sw.js').then(function(reg){var maj=function(){reg.update().catch(function(){});};maj();
    document.addEventListener('visibilitychange',function(){if(!document.hidden)maj();});}).catch(function(){});
  navigator.serviceWorker.ready.then(function(reg){if(!reg.active)return;var canal=new MessageChannel();canal.port1.onmessage=function(e){$('version').textContent=String(e.data);};reg.active.postMessage('version',[canal.port2]);}).catch(function(){});}
})();
</script>
