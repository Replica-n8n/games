<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La Bataille · cartes vivantes</title>
<meta name="description" content="La bataille, mais les cartes se battent pour de vrai. Douze mois, douze constellations, des arcanes à lancer. Hors ligne, sans publicité.">
<meta name="theme-color" content="#000644">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<link rel="apple-touch-icon" href="./icone-192.png">
<link rel="preload" href="./polices/fraunces-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./polices/outfit-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Direction « Nuit claire » (voir DESIGN.md) : le ciel partout, le verre par-dessus.
   Les couleurs ci-dessous sont CALCULÉES par tools/bataille-couleurs.mjs, qui
   vérifie aussi qu'elles sont bien celles écrites ici : ne pas les retoucher à la main. */
@font-face{font-family:'Fraunces';font-weight:600;font-display:swap;src:url(./polices/fraunces-600-latin.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:500 700;font-display:swap;src:url(./polices/outfit-latin.woff2) format('woff2')}
:root{color-scheme:dark;
  --ciel1:#000644;--ciel2:#202a6b;--texte:#f4f2ff;--texte2:#caceff;--marque:#dfe0ff;--lueur:#008580;
  --surface:#111b5e;--accent:#feca63;--surAccent:#010c53;--moi:#feca63;--lui:#cdacff;--moiPlein:#feca63;--luiPlein:#a57ce5;--choix:#ffd790;
  --verre:rgba(6,10,44,.66);--display:'Fraunces',Georgia,serif;--corps:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:linear-gradient(var(--ciel1),var(--ciel2));color:var(--texte);font-family:var(--corps);font-weight:500;overflow:hidden;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
#cadre{position:relative;width:360px;flex:none;transform-origin:top center;overflow:hidden}
#eclat{position:absolute;inset:0;pointer-events:none;opacity:0}
canvas{position:absolute;left:0;display:block}
button{font:inherit;color:inherit;border:0;padding:0;margin:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--texte);outline-offset:3px}
svg{display:block}

.mois{position:absolute;left:16px;top:12px;width:186px}
.mois h2{margin:0;font:600 36px/1 var(--display);color:var(--texte)}
.mois p{margin:8px 0 0;font-size:15px;line-height:1.25;color:var(--texte);text-wrap:balance}
.signe{position:absolute;left:206px;width:138px;top:80px;text-align:center;font:600 16px var(--display);color:var(--texte2)}
.annee{position:absolute;left:0;right:0;top:104px;display:flex;justify-content:center;gap:9px}
.annee i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--texte2);opacity:.55}
.annee i.fait{background:var(--texte2);opacity:.8}
.annee i.ici{background:var(--texte);border-color:var(--texte);opacity:1;transform:scale(1.5)}
/* les mois dont la constellation est allumée dans l'atlas : en or */
.annee i.lu{border-color:var(--accent);opacity:1}.annee i.lu.fait,.annee i.lu.ici{background:var(--accent)}
.signe.lu{color:var(--accent)}

/* Le verre : liseré sombre au bord, reflet sur l'arête du haut. PAS de flou en
   jeu : même loin de la toile, chaque plaque floue se recalculait à chaque image
   (45 images/s en combat avec trois arcanes, 60 sans). Derrière, le ciel est
   fixe : une plaque teintée donne le même effet. Seuls les écrans de titre et de
   fin floutent, et le jeu est alors à l'arrêt. */
.verre{background:var(--verre);
  border:1px solid rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 0 0 1px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.35)}
/* Posé sur le tapis, par-dessus les cartes : presque opaque, pour rester lisible. */
.plein{background:rgba(8,13,58,.9)}
.ruban.verre{background:rgb(8,13,58)}
.compte{position:absolute;left:10px;right:10px;top:124px;height:34px;border-radius:17px;display:flex;align-items:center;gap:8px;padding:0 14px}
.compte .n{font-weight:700;font-size:22px;line-height:1;font-variant-numeric:tabular-nums;min-width:26px;text-align:center}
.compte .qui{font-size:14px}
.compte .moi{color:var(--moi)}.compte .lui{color:var(--lui)}
.barre{flex:1;height:8px;border-radius:4px;position:relative;overflow:hidden;background:var(--luiPlein)}
.barre span{position:absolute;left:0;top:0;bottom:0;background:var(--moiPlein);transition:width .3s cubic-bezier(.25,1,.5,1)}
.arcanesLui{position:absolute;right:16px;top:94px;display:flex;gap:4px}
.arcanesLui i{width:14px;height:21px;border-radius:3px;border:1.5px solid #120c08;background:#5a3a90;box-shadow:inset 0 0 0 2px #9a7ad8}

.astuce{position:absolute;left:50%;transform:translate(-50%,-50%);width:max-content;max-width:316px;padding:6px 14px 7px;border-radius:16px;text-align:center;font-size:15px;line-height:1.3;color:var(--texte);text-wrap:balance;pointer-events:none}
.ruban{position:absolute;left:10px;right:10px;top:124px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;font:600 20px/1 var(--display);color:var(--accent);
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s}
.ruban.vu{opacity:1}
.page{position:absolute;left:32px;right:32px;padding:20px 16px 18px;border-radius:28px;text-align:center}
.page h3{margin:0;font:600 30px/1.05 var(--display);text-wrap:balance}
.page p{margin:10px 0 0;font-size:16px;font-weight:700}

/* Sous le pouce : les arcanes, puis l'action. */
/* Les arcanes sont des LAMES : de vraies cartes de tarot, hautes, tenues en
   éventail (l'angle de chacune est posé par renderTarot). Endormie, la lame a son
   filet éteint ; prête, il s'allume et elle se soulève. */
.main{position:absolute;left:0;right:0;bottom:100px;height:112px;display:flex;justify-content:center;align-items:flex-end;gap:4px}
.arcane{width:92px;height:110px;border-radius:10px;display:flex;flex-direction:column;align-items:center;color:var(--texte);background:linear-gradient(#1c2678,#0a104a);
  border:1.5px solid rgba(254,202,99,.5);box-shadow:inset 0 0 0 3px #0a104a,inset 0 0 0 4px rgba(254,202,99,.3),0 8px 16px rgba(0,0,0,.4);transition:transform .2s cubic-bezier(.25,1,.5,1),border-color .2s}
.arcane .num{font:600 14px/1 var(--display);margin-top:9px;color:var(--texte2)}
.arcane .ill{width:52px;height:52px;margin-top:4px}
.arcane .ill svg{width:100%;height:100%}
.arcane .nom{font-size:14px;line-height:1;margin-top:7px;white-space:nowrap}
.arcane.dort .ill{opacity:.82;filter:saturate(.7)}
.arcane.pret{border-color:var(--accent);box-shadow:inset 0 0 0 3px #0a104a,inset 0 0 0 4px var(--accent),0 12px 20px rgba(0,0,0,.45)}
.arcane.pret .num{color:var(--accent)}
.info{width:44px;height:44px;border-radius:50%;align-self:center;font:600 24px/1 var(--display);color:var(--accent);display:flex;align-items:center;justify-content:center}
/* La fiche des arcanes : une feuille qui monte du bas, sous le pouce. */
.fond{position:absolute;inset:0;background:rgba(0,6,68,.6);display:flex;align-items:flex-end;padding:12px}
.feuille{width:100%;background:rgb(8,13,58);border-radius:28px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:12px}
.feuille h3{margin:0;font:600 26px/1 var(--display);text-align:center}
.feuille .ligne{display:flex;gap:12px;align-items:flex-start;padding:4px 0}
.feuille .ligne svg{width:44px;height:44px;flex:none}
.feuille .ligne strong{display:block;font:600 18px/1.1 var(--display)}
.feuille .ligne span{display:block;font-size:15px;line-height:1.3;margin-top:3px}
.feuille .ligne em{display:block;font-style:normal;font-size:14px;line-height:1.3;color:var(--texte2);margin-top:2px}
.feuille p{margin:0;font-size:14px;line-height:1.3;color:var(--texte2);text-align:center;text-wrap:balance}
.feuille .action{position:static;flex:none;margin-top:12px}
/* Essai du rogue-lite : un atout à choisir parmi trois, entre deux mois. */
.option{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:18px;background:rgba(255,255,255,.08);border:1.5px solid rgba(254,202,99,.5);min-height:68px}
.option:active{background:rgba(255,255,255,.16)}
.option strong{display:block;font:600 18px/1.1 var(--display);color:var(--accent)}
.option span{display:block;font-size:15px;line-height:1.3;margin-top:4px;color:var(--texte)}
/* Une gravure ou un atout : sa médaille à gauche ; le vert dit ce qui va avec ton paquet. */
.option.ico{display:flex;gap:12px;align-items:center}
.option .med{width:40px;height:40px;flex:none}
.option em{display:inline-block;font-style:normal;font-size:14px;font-weight:700;color:#0a104a;background:#a8f0b0;border-radius:8px;padding:1px 7px;margin-top:5px}
/* Ton paquet, pour choisir la carte à graver. */
.paquet{display:grid;grid-template-columns:repeat(6,minmax(44px,1fr));gap:10px 8px;padding:4px 4px 6px}
.paquet.serre{gap:8px 8px}
.pc{position:relative;height:62px;border-radius:6px;background:#f6efe0;border:2px solid #120c08;color:#1a1410;padding:3px 4px;font:600 16px/1 var(--display);text-align:left;display:block}
.serre .pc{height:50px}
.pc.r{color:#b8242c}
.pc i{display:block;font:15px Georgia,serif;font-style:normal;margin-top:2px}
.pc[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px;transform:translateY(-4px)}
.pc:disabled{cursor:default}
.pc .gv{position:absolute;right:-8px;bottom:-8px;width:24px;height:24px}
.feuille{max-height:100%;overflow:auto}
/* L'atlas du ciel */
.ciel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ciel div{border-radius:14px;background:rgba(255,255,255,.05);padding:2px 2px 6px;text-align:center}
.ciel svg{width:100%;height:40px}
.ciel b{display:block;font:600 14px/1.1 var(--display);color:var(--texte2)}
.ciel small{display:block;font-size:14px;line-height:1.15;color:var(--texte2);margin-top:2px}
.ciel .lu{background:rgba(254,202,99,.1);box-shadow:inset 0 0 0 1.5px rgba(254,202,99,.55)}
.ciel .lu b{color:var(--accent)}
.paliers{display:flex;flex-wrap:wrap;gap:4px 6px;justify-content:center}
.paliers button{min-width:44px;height:44px;padding:0 10px;border-radius:22px;background:rgba(165,124,229,.16);border:1.5px solid rgba(205,172,255,.45);color:var(--texte);font-weight:700;font-size:16px}
.paliers button[aria-pressed="true"]{background:var(--lui);color:#0a104a}
.paliers button:disabled{opacity:.35}
#atlasM{min-height:2.6em}
#atlas .feuille{gap:10px}
/* l'atlas s'ouvre depuis l'écran titre : il passe par-dessus */
#atlas{z-index:2}
.page .n{font-weight:500;color:var(--accent);font-size:15px}
.action{position:absolute;left:16px;right:16px;bottom:16px;height:60px;border-radius:30px;background:var(--accent);color:var(--surAccent);font-weight:700;font-size:21px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px rgba(0,0,0,.4);transition:transform .15s cubic-bezier(.25,1,.5,1)}
.action:active{transform:scale(.97)}
.action.second{background:rgba(8,13,58,.9);color:var(--texte);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 8px 18px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.45)}
.vitesse{position:absolute;left:16px;right:16px;bottom:22px;height:48px;border-radius:24px;display:flex;overflow:hidden;font-size:16px}
.vitesse button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--texte2);border-radius:24px}
.vitesse button svg{width:16px;height:16px;display:none}
.vitesse button[aria-pressed="true"]{background:rgba(255,255,255,.14);color:var(--accent);font-weight:700}
.vitesse button[aria-pressed="true"] svg{display:block}

.voile{position:absolute;inset:0;background:rgba(0,6,68,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 16px 16px}
.voile h1{margin:22vh 0 0;font:600 58px/1 var(--display);color:var(--texte);text-wrap:balance}
#cadre .voile h1{margin-top:120px}
.voile .sous{margin:12px 0 0;font:600 20px var(--display);color:var(--accent)}
.voile p{margin:14px 12px 0;font-size:17px;line-height:1.4;color:var(--texte);text-wrap:balance}
.voile .pousse{flex:1;min-height:24px}
.voile .action{position:static;align-self:stretch;flex:none;margin-top:12px}
.voile small{margin-top:14px;font-size:14px;color:var(--texte2)}
#tourne{position:fixed;inset:0;z-index:5;background:var(--ciel1);display:none;align-items:center;justify-content:center;font:600 22px var(--display);color:var(--texte);text-align:center;padding:24px}
@media (orientation:landscape) and (max-height:480px){#tourne{display:flex}}

/* Sans transparence ou en contraste renforcé : le verre devient une plaque pleine. */
@media (prefers-reduced-transparency:reduce),(prefers-contrast:more){
  .verre,.action.second,.astuce{background:var(--surface)}
  .voile{background:var(--ciel1);backdrop-filter:none;-webkit-backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="tourne">Tourne ton téléphone pour jouer</div>
<div id="scene"><div id="cadre">
  <canvas id="decor" aria-hidden="true"></canvas><canvas id="jeu" role="img" aria-label="Le tapis : tes cartes en bas, celles du Maudit en haut"></canvas><div id="eclat" aria-hidden="true"></div>
  <div class="mois"><h2 id="moisT"></h2><p id="moisR"></p></div>
  <div class="signe" id="signe"></div>
  <div class="annee" id="annee" role="img"></div>
  <div class="compte verre"><span class="qui moi">Toi</span><span class="n moi" id="myCount">16</span><div class="barre"><span id="barre" style="width:50%"></span></div><span class="n lui" id="foeCount">16</span><span class="qui lui">Maudit</span></div>
  <div class="arcanesLui" id="foeTarot" role="img"></div>
  <div class="astuce verre plein" id="astuce"></div>
  <div class="ruban verre" id="ruban" role="status"></div>
  <div class="page verre plein" id="page" hidden><h3 id="pageT"></h3><p id="pageP"></p><p class="n" id="pageN" hidden></p></div>
  <div class="main" id="main"></div>
  <button type="button" class="action" id="goBtn">À la bataille !</button>
  <div class="vitesse verre" id="vitesse" hidden>
    <button type="button" id="v1" aria-pressed="true"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Vitesse ×1</button>
    <button type="button" id="v2" aria-pressed="false"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Vitesse ×2</button>
  </div>
  <div class="fond" id="fiche" hidden>
    <div class="feuille verre plein" role="dialog" aria-labelledby="ficheT">
      <h3 id="ficheT">Tes arcanes</h3>
      <div id="ficheL"></div>
      <p id="ficheN"></p>
      <button type="button" class="action" id="ficheOk">Compris</button>
    </div>
  </div>
  <div class="fond" id="choix" hidden>
    <div class="feuille verre plein" role="dialog" aria-labelledby="choixT">
      <h3 id="choixT"></h3>
      <div id="choixL"></div>
      <p id="choixN"></p>
      <button type="button" class="action" id="choixOk" hidden></button>
    </div>
  </div>
  <div class="fond" id="atlas" hidden>
    <div class="feuille verre plein" role="dialog" aria-labelledby="atlasT">
      <h3 id="atlasT">Ton atlas</h3>
      <p id="atlasS"></p>
      <div class="ciel" id="atlasC"></div>
      <div class="paliers" id="atlasP" role="group" aria-label="Quelle année jouer"></div>
      <p id="atlasM"></p>
      <button type="button" class="action" id="atlasOk">Fermer</button>
    </div>
  </div>
  <div class="voile" id="title">
    <h1>La Bataille</h1><div class="sous">cartes vivantes</div>
    <div class="pousse"></div>
    <p id="instAide" hidden></p>
    <button type="button" class="action second" id="instBtn" hidden>Installer le jeu</button>
    <button type="button" class="action second" id="newBtn" hidden>Nouvelle partie</button>
    <button type="button" class="action second" id="atlasBtn" hidden>Atlas du ciel</button>
    <button type="button" class="action" id="startBtn">Jouer</button>
    <small id="version">&nbsp;</small>
  </div>
  <div class="voile" id="end" hidden>
    <h1 id="endT"></h1><p id="endP"></p>
    <div class="pousse"></div>
    <button type="button" class="action" id="againBtn">Rejouer</button>
  </div>
</div></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var cadre=$('cadre'),decor=$('decor'),cv=$('jeu'),dctx=decor.getContext('2d'),ctx=cv.getContext('2d');
/* L'écran fait 360 de large ; sa hauteur H suit celle du téléphone. Le tapis
   va de T0 à T1 et la toile du jeu ne couvre QUE lui ; le décor, lui, est peint
   une fois par mois sur sa propre toile. */
var W=360,H=732,T0=158,T1=514,J0=158,ECH=1,DPR=Math.min(3,window.devicePixelRatio||1);
var COL=[43,111.5,180,248.5,317];
var RANKS=['7','8','9','10','V','D','R','A'],VAL={'7':7,'8':8,'9':9,'10':10,'V':11,'D':12,'R':13,'A':14};
var SUITS=['♠','♥','♦','♣'];
var C={ciel1:'#000644',ciel2:'#202a6b',texte:'#f4f2ff',texte2:'#caceff',marque:'#dfe0ff',lueur:'#008580',lui:'#cdacff',moiPlein:'#feca63',luiPlein:'#a57ce5',choix:'#ffd790'};
var CALME=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- l'année : une constellation par mois, qui change une règle ---------- */
/* Les figures (étoiles st, traits ln, dans un cadre de 134 × 60) sont les VRAIES
   constellations, nord en haut et est à gauche : le bloc ci-dessous est écrit par
   tools/bataille-constellations.mjs depuis des données du ciel. Ne pas le retoucher
   à la main (celles du POC étaient inventées, et ça se voyait). */

/* ---------- MESURES : une fiche anonyme à la fin de chaque année ----------
   Pour régler le jeu (gagne-t-on trop avec les atouts ? lesquels sont pris ?), le
   jeu envoie au compteur serveur-bataille/ : la version, le mode, le résultat, le
   nombre de mois, l'écart de cartes et les atouts proposés et choisis. RIEN qui
   désigne un joueur ou un téléphone : pas d'identifiant, même aléatoire. C'est ce
   qui permet de ne rien demander (décision de Julie, 2026-10-05) ; en ajouter un
   obligerait à prévenir les joueurs.
   La fiche attend dans une petite file (20 au plus) et part quand il y a du réseau :
   le jeu reste jouable hors ligne, et un envoi raté ne se voit pas. Les robots et
   les bancs (127.0.0.1) n'envoient rien, sauf `window.__mesures`. */

  else if(S.phase==='result'){if(!myDeck.length||!foeDeck.length||S.round>=12){endGame();return;}if(ESSAI){if(S.grave>0)ouvrirGravure();else ouvrirChoix();}else moisSuivant();}});
function vitesse(n){S.speed=n;$('v1').setAttribute('aria-pressed',n===1);$('v2').setAttribute('aria-pressed',n===2);}
$('v1').addEventListener('click',function(){vitesse(1);});$('v2').addEventListener('click',function(){vitesse(2);});
function applyMonth(u){var hp=12+u.v*3.5;if(rule('balance'))hp=45;if(rule('capricorne'))hp*=1.3;if(rule('cancer')&&(u.lane===0||u.lane===4))hp*=1.5;
  if(ESSAI&&u.side<0)hp*=REG.f*pal().f;
  var MU=MODS[u.side];if(MU){if(MU.vie)hp*=MU.vie;if(MU.vieFig&&(u.card.r==='V'||u.card.r==='D'||u.card.r==='R'))hp*=MU.vieFig;}
  u.hp=u.max=Math.round(hp);u.first=true;
  /* les boucliers et les vies se COMPTENT : une gravure sous Écho agit deux fois */
  var e=ech(u.side),g=u.card.g;u.shield=(rule('taureau')&&u.card.s==='♦'?1:0)+(g==='bouclier'?e:0);
  u.vies=(g==='phenix'?e:0)+(MU&&MU.pairs&&(u.card.r==='8'||u.card.r==='10'||u.card.r==='D')?1:0);if(g==='eclair')u.atkT=0.05;}
function startFight(){S.phase='reveal';S.t=0;sel=null;$('goBtn').hidden=true;$('vitesse').hidden=false;$('astuce').hidden=true;
  units.forEach(function(u){u.x=COL[u.lane];applyMonth(u);});
  var ties=[];for(var l=0;l<5;l++){var a=units.filter(function(u){return u.side>0&&u.lane===l;})[0],b=units.filter(function(u){return u.side<0&&u.lane===l;})[0];if(a&&b&&a.v===b.v)ties.push(l);}
  S.ties=ties;S.foeCastT=rnd(2.5,6);renderTarot();}
function beginFight(){
  /* Égalité dans une colonne : c'est la bataille, chaque camp y envoie une carte de plus. */
  S.ties.forEach(function(l){[[1,myDeck],[-1,foeDeck]].forEach(function(p){var d=p[1];if(!d.length)return;var u=mkUnit(d.shift(),p[0],l);applyMonth(u);u.x=COL[l]+p[0]*20;u.drop=1;u.reveal=1;units.push(u);});});
  [[1,myDeck],[-1,foeDeck]].forEach(function(p){var MR=MODS[p[0]];if(!MR||!MR.renfort||!p[1].length)return;var rf=mkUnit(p[1].shift(),p[0],2);applyMonth(rf);rf.hp=rf.max=Math.round(rf.max*MR.renfort);rf.x=COL[2]+p[0]*20;rf.drop=1;rf.reveal=1;units.push(rf);});
  if(S.ties.length)banner('Bataille !',1.6);
  if(rule('gemeaux')){[1,-1].forEach(function(side){var al=alive(side);if(!al.length)return;var o=al[Math.floor(Math.random()*al.length)];var c=mkUnit(o.card,side,o.lane);applyMonth(c);c.clone=true;c.x=Math.max(26,Math.min(W-26,o.x-side*22));c.drop=1;c.reveal=1;units.push(c);});banner('Des cartes se dédoublent',1.6);}
  /* Les flèches du Sagittaire VOLENT (0,6 s) et ne blessent qu'à l'arrivée. Dans
     le POC c'était un trait de 10 px qui durait un quart de seconde, dégâts déjà
     faits : elle ne les avait jamais vues. */
  if(rule('sagittaire')){units.forEach(function(u){if(u.card.s!=='♣'||u.dead)return;var t=pickTarget(u);if(t){fleches.push({de:u,vers:t,t:0,dur:0.6,side:u.side,x0:u.x,y0:u.y-40*u.sc});TIREES++;}});
    if(fleches.length)banner('Les Trèfles tirent',1.4);}
  S.phase='fight';S.t=0;renderTarot();counts();}
function alive(side){return units.filter(function(u){return u.side===side&&!u.dead;});}
function pickTarget(u){var opp=alive(-u.side);if(!opp.length)return null;var same=opp.filter(function(o){return o.lane===u.lane;});var pool=same.length?same:opp;
  /* Entre deux cibles à la même distance, on tire au sort. Avant, c'était toujours
     la première de la liste, donc la plus À GAUCHE : toute carte libérée partait
     aider à gauche, la mêlée s'y entassait, et ranger ses cartes de la plus faible
     (à gauche) à la plus forte faisait gagner 64 % des années au lieu de 51 %
     (trouvé par un joueur, mesuré par bataille-equilibre.mjs --placement). */
  var bd=1e9,ex=[];pool.forEach(function(o){var d=Math.abs(o.y-u.y)+Math.abs(o.x-u.x)*2;if(d<bd-1){bd=d;ex=[o];}else if(d<=bd+1){ex.push(o);if(d<bd)bd=d;}});
  return ex[Math.floor(Math.random()*ex.length)];}
function tombe(b){b.hp=0;b.dead=true;b.deathT=0;b.killer=-b.side;(b.side>0?myFallen:foeFallen).push(b);
  var M=MODS[b.side],t=b.card.g==='heritage'?4*ech(b.side):(M&&M.colere&&b.card.r==='A'?5:0);
  if(t){alive(b.side).forEach(function(u){u.buff=Math.max(u.buff,t);});if(b.card.g==='heritage')effet('heritage',b);if(!SIM)banner(b.card.g==='heritage'?'Héritage : '+(b.side>0?'tes cartes':'le Maudit')+' frappe'+(b.side>0?'nt':'')+' plus fort':'Colère : '+(b.side>0?'tes cartes':'le Maudit')+' frappe'+(b.side>0?'nt':'')+' plus fort',1.6);}}
/* Les dégâts s'écrivent À CÔTÉ de la carte touchée, jamais sur une jauge. */
/* Un texte cerné redessiné à chaque image coûte cher : chaque chiffre est peint
   une fois sur sa vignette, puis collé. */
var SIM=false,MODS={},DITS={};
/* ---------- les EFFETS des gravures et des arcanes ----------
   Julie, 2026-10-28 : « le gros rond au-dessus de la tête, ce n'est pas un effet ;
   pour le phénix je veux une colonne de feu ». Maquette validée par elle :
   tools/mockup-bataille-effets.html (ronces A, à contre-jour). Un effet s'attache à
   une carte (il suit u.x, u.y), dure d secondes de VRAI temps, même en vitesse x2,
   pour qu'on ait le temps de le voir, et se dessine en deux couches : `sous` avant
   les cartes, `dessus` après ; `teinte` colore une carte et `gonfle` la grandit
   (pré-passe de draw). Le premier d'une carte est GRAND (secousse, éclat plein
   écran, grand nom) ; s'il revient moins de 4 s après, il est PETIT, sinon les Ailes
   ou l'Épine, qui agissent à chaque coup, rempliraient le tapis. Le grand nom ne
   s'écrit qu'une fois par mois et par camp (DITS), et UN à la fois (NOMQ) : à dix
   gravures, les noms se chevauchaient, illisibles ; au-delà de deux en attente, il
   s'écrira à la prochaine occasion. En animations réduites : ni
   secousse, éclat au tiers. Les lueurs sont des vignettes (`lueur`), jamais de
   ctx.filter. Les couleurs suivent la palette : l'or est à toi, le violet au Maudit
   (Crinière, Héritage, Force, Roue prennent celle du camp), le vert = soin. */
var EFX=[],EF={},NOMQ=[],HORLOGE=0,LUEURS={},NOMS={},SEC0='',EC0=-1;
function fk(t,a,b){return Math.max(0,Math.min(1,(t-a)/(b-a)));}
function flisse(x){return x*x*(3-2*x);}
function fvite(x){return 1-Math.pow(1-x,3);}
function fbosse(t,a,m,b){return t<a||t>b?0:t<m?flisse((t-a)/(m-a)):1-flisse((t-m)/(b-m));}
function fgraine(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
/* des particules tirées UNE fois à la naissance de l'effet, puis calculées au temps t */
function fgerbe(n,f){var r=fgraine(Math.floor(Math.random()*1e9)),l=[];for(var i=0;i<n;i++)l.push(f(r,i));return l;}
function fparts(l,t,dessin){for(var i=0;i<l.length;i++){var p=l[i],u=t-p.t0;if(u<0||u>p.vie)continue;dessin(p,p.x+p.vx*u+(p.ox||0)*Math.sin(u*(p.of||6)+(p.ph||0)),p.y+p.vy*u+0.5*(p.g||0)*u*u,u/p.vie);}}
function fzig(x0,y0,x1,y1,r,n,amp){var pts=[[x0,y0]];for(var i=1;i<n;i++){var a=i/n;pts.push([x0+(x1-x0)*a+(r()-0.5)*amp,y0+(y1-y0)*a+(r()-0.5)*amp*0.3]);}pts.push([x1,y1]);return pts;}
function ftrace(pts,dy){dy=dy||0;ctx.beginPath();for(var i=0;i<pts.length;i++)i?ctx.lineTo(pts[i][0],pts[i][1]+dy):ctx.moveTo(pts[i][0],pts[i][1]+dy);}
function fmel(a,b,u){var x=parseInt(a.slice(1),16),y=parseInt(b.slice(1),16);return 'rgb('+[16,8,0].map(function(d){return Math.round(((x>>d)&255)*(1-u)+((y>>d)&255)*u);})+')';}
function fmil(u){return u.y-37*u.sc;}
function fhaut(u){return u.y-64*u.sc;}
function coulCamp(side){return side>0?'254,202,99':'205,172,255';}
function fteinte(u,rgb,a){if(u&&a>(u.ta||0)){u.tc=rgb;u.ta=a;}}
function fgonfle(u,v){if(u&&v>(u.gf||0))u.gf=v;}
/* une lueur ronde : une vignette par couleur, posée à la taille voulue */
function lueur(x,y,r,rgb,a){if(a<=0||r<=0)return;var c=LUEURS[rgb];if(!c){c=document.createElement('canvas');c.width=c.height=64;var x2=c.getContext('2d'),g=x2.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba('+rgb+',1)');g.addColorStop(1,'rgba('+rgb+',0)');x2.fillStyle=g;x2.fillRect(0,0,64,64);LUEURS[rgb]=c;}
  var g0=ctx.globalAlpha;ctx.globalAlpha=g0*Math.min(1,a);ctx.drawImage(c,x-r,y-r,2*r,2*r);ctx.globalAlpha=g0;}
/* le grand nom d'une gravure, peint une fois sur sa vignette */
function nomGrave(txt,rgb){var cle=txt+rgb+ECH;if(NOMS[cle])return NOMS[cle];var k=ECH*DPR,f='600 26px Fraunces, Georgia, serif',c=document.createElement('canvas'),x=c.getContext('2d');
  x.font=f;var w=Math.ceil(x.measureText(txt).width)+18,h=42;c.width=Math.ceil(w*k);c.height=Math.ceil(h*k);x.setTransform(k,0,0,k,0,0);
  x.font=f;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=6;x.strokeStyle='#120c08';x.strokeText(txt,w/2,h/2);x.fillStyle='rgb('+rgb+')';x.fillText(txt,w/2,h/2);
  return NOMS[cle]={img:c,w:w,h:h};}
function effet(id,u,o){if(SIM||!u)return null;var E=EF[id],e={id:id,u:u,t:0,d:E.d,side:u.side};for(var c in o)e[c]=o[c];
  u.fxT=u.fxT||{};e.grand=!!E.toujours||!(HORLOGE-(u.fxT[id]===undefined?-99:u.fxT[id])<4);if(e.grand)u.fxT[id]=HORLOGE;
  if(e.grand&&E.nom){var cle=id+e.side;if(!DITS[cle]&&NOMQ.length<3&&!NOMQ.some(function(n){return n.cle===cle;}))NOMQ.push({cle:cle,n:nomGrave(E.nom,E.coul||coulCamp(e.side)),u:E.nomSur&&e[E.nomSur]||u,t:-(E.nomT||0)});}
  if(E.init)E.init(e);EFX.push(e);return e;}
function dessineNom(q){var n=q.n,t=q.t,a=fbosse(t,0,0.15,1.3);if(!a)return;var u=q.u;
  /* au-dessus de mes cartes, sous celles du Maudit : vers le milieu du tapis, jamais hors de la toile */
  var s=1+0.5*(1-fvite(fk(t,0,0.2))),y=(u.side>0?fhaut(u)-26:u.y+30)-12*fk(t,0,1.3),x=Math.max(n.w/2+4,Math.min(W-n.w/2-4,u.x));
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(s,s);ctx.drawImage(n.img,-n.w/2,-n.h/2,n.w,n.h);ctx.restore();}
/* la secousse déplace les deux toiles (rien à repeindre) ; l'éclat est un voile #eclat */
function appliqueSecousse(s){if(CALME)s=0;var v=s>0.3?'translate('+(Math.sin(HORLOGE*90)*s).toFixed(1)+'px,'+(Math.cos(HORLOGE*77)*s).toFixed(1)+'px)':'';if(v!==SEC0){SEC0=v;cv.style.transform=v;decor.style.transform=v;}}
function appliqueEclat(c,a){if(CALME)a*=0.35;a=Math.round(a*100)/100;if(a!==EC0){EC0=a;var d=$('eclat');if(d){d.style.opacity=a;if(c)d.style.background=c;}}}
function eclatsGlace(l,t){fparts(l,t,function(p,x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(p.an+a*6);ctx.fillStyle='rgba(220,245,255,'+(1-a)+')';ctx.beginPath();ctx.moveTo(0,-p.s);ctx.lineTo(p.s*0.5,p.s);ctx.lineTo(-p.s*0.5,p.s);ctx.fill();ctx.restore();});}
function gerbeGlace(b,n){var m=fmil(b);return fgerbe(n,function(r){var a=r()*6.283,v=80+r()*190;return{x:b.x,y:m,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,g:420,t0:0,vie:0.5+r()*0.3,s:3+r()*4,an:r()*6};});}

/* PHÉNIX : une colonne de feu jaillit du sol, la carte renaît dans les flammes, ailes de feu ouvertes */
EF.phenix={nom:'Phénix',coul:'255,179,71',nomT:0.35,d:2.4,toujours:true,
  init:function(e){var u=e.u;e.parts=fgerbe(46,function(r){return{x:u.x+(r()-0.5)*44*u.sc,y:u.y,vx:(r()-0.5)*40,vy:-110-r()*260,ox:12,of:5+r()*4,ph:r()*6,t0:r()*1.2,vie:0.7+r()*0.6,s:1.4+r()*2.2};});},
  teinte:function(e,t){fteinte(e.u,'255,170,60',0.55*fbosse(t,0.05,0.3,1.4));fgonfle(e.u,0.25*fbosse(t,0.15,0.4,1.2));},
  sous:function(e,t){var u=e.u,s=u.sc,feu=fbosse(t,0,0.3,1.8),sol=u.y+4;ctx.save();ctx.globalCompositeOperation='lighter';
    if(feu){var larg=92*s*feu;for(var i=0;i<3;i++){var f=1-i*0.26,wob=Math.sin(HORLOGE*30+i)*4,g=ctx.createLinearGradient(0,sol,0,J0);g.addColorStop(0,'rgba(255,240,180,'+(0.85*feu*f)+')');g.addColorStop(0.35,'rgba(255,150,40,'+(0.65*feu*f)+')');g.addColorStop(1,'rgba(200,40,20,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(u.x-larg*f/2+wob,sol);ctx.quadraticCurveTo(u.x-larg*f*0.5,(sol+J0)/2,u.x-larg*f*0.18+wob*2,J0);ctx.lineTo(u.x+larg*f*0.18+wob*2,J0);ctx.quadraticCurveTo(u.x+larg*f*0.5,(sol+J0)/2,u.x+larg*f/2-wob,sol);ctx.fill();}
      lueur(u.x,sol,120*s*feu,'255,120,30',0.5*feu);}
    var ail=fbosse(t,0.3,0.7,2.2);if(ail)[-1,1].forEach(function(sg){for(var p=0;p<6;p++){var L=(52+p*8)*s*ail;ctx.save();ctx.translate(u.x+sg*7*s,fmil(u)-6*s);ctx.scale(sg,1);ctx.rotate((-0.35-p*0.22)*ail);
      ctx.fillStyle='rgba(255,'+(225-p*22)+','+(130-p*16)+','+(0.6*ail*(1-p*0.08))+')';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(L*0.5,-12*s,L,-4*s);ctx.quadraticCurveTo(L*0.5,5*s,0,5*s);ctx.fill();ctx.restore();}});
    ctx.restore();},
  dessus:function(e,t){var u=e.u;ctx.save();ctx.globalCompositeOperation='lighter';
    fparts(e.parts,t,function(p,x,y,a){ctx.fillStyle='rgba(255,'+Math.round(200-120*a)+',60,'+(1-a)+')';ctx.beginPath();ctx.arc(x,y,p.s*(1-a*0.5),0,6.283);ctx.fill();});
    var o=fk(t,0.2,0.65);if(o>0&&o<1){ctx.strokeStyle='rgba(255,190,90,'+(1-o)+')';ctx.lineWidth=6*(1-o);ctx.beginPath();ctx.ellipse(u.x,u.y,26+100*o,9+26*o,0,0,6.283);ctx.stroke();}
    ctx.restore();},
  secousse:function(e,t){return fbosse(t,0.2,0.25,0.55)*7;},
  eclat:function(e,t){return['rgb(255,140,40)',0.35*fbosse(t,0.2,0.25,0.75)];}};

/* GIVRE : des éclats de glace ; la cible se prend dans un bloc (drawUnit, tant que u.gel), qui éclate au dégel */
EF.givre={nom:'Givre',coul:'191,230,255',nomSur:'v',d:1.3,
  init:function(e){var b=e.v;if(!b)return;e.parts=gerbeGlace(b,e.grand?16:8);
    e.flocons=e.grand?fgerbe(18,function(r){return{x:b.x+(r()-0.5)*110,y:fhaut(b)-40-r()*30,vx:0,vy:20+r()*20,ox:9,of:2,ph:r()*6,t0:r()*0.6,vie:0.9,s:1.4+r()*1.4};}):[];},
  dessus:function(e,t){if(!e.parts)return;ctx.save();ctx.globalCompositeOperation='lighter';eclatsGlace(e.parts,t);
    fparts(e.flocons,t,function(p,x,y,a){ctx.fillStyle='rgba(235,250,255,'+(1-a)+')';ctx.beginPath();ctx.arc(x,y,p.s,0,6.283);ctx.fill();});ctx.restore();},
  eclat:function(e,t){return['rgb(150,215,255)',0.25*fbosse(t,0,0.05,0.4)];}};
EF.degel={d:0.8,init:function(e){e.parts=gerbeGlace(e.u,20);},dessus:function(e,t){ctx.save();ctx.globalCompositeOperation='lighter';eclatsGlace(e.parts,t);ctx.restore();}};

/* ÉPINE : deux ronces de nuit s'enroulent autour de la carte, les épines se dressent et rougissent, l'attaquant se pique */
function ronces(e,t,devant){var u=e.u,s=u.sc,pousse=fvite(fk(t,0,0.25)),pique=fvite(fk(t,0.12,0.25)),fane=fk(t,1.0,1.6);if(!pousse||fane>=1)return;
  var cx=u.x,cy=fmil(u),rx=29*s,ry=37*s;ctx.save();ctx.globalAlpha=1-fane;ctx.lineCap='round';ctx.lineJoin='round';
  for(var i=0;i<2;i++){var ph=i*Math.PI,pts=[],n=60;
    for(var j=0;j<=n*pousse;j++){var q=j/n,an=ph+q*1.15*6.283;pts.push([cx+Math.cos(an)*rx*(1+0.1*Math.sin(an*3)),cy+ry*(1-2*q)*0.95,Math.sin(an)>0]);}
    /* devant (sin>0) ou derrière la carte, chaque morceau d'un seul trait */
    var mo=[],m=null;for(var j2=1;j2<pts.length;j2++){if(pts[j2][2]!==devant){m=null;continue;}if(!m){m=[pts[j2-1]];mo.push(m);}m.push(pts[j2]);}
    mo.forEach(function(l){ftrace(l);ctx.strokeStyle=fmel('#05082a','#3a3f6a',fane);ctx.lineWidth=6*s;ctx.stroke();ctx.strokeStyle=fmel('#1c2160','#3a3f6a',fane);ctx.lineWidth=3*s;ctx.stroke();
      ftrace(l,-2*s);ctx.strokeStyle='#caceff';ctx.globalAlpha=(1-fane)*0.7;ctx.lineWidth=1.1;ctx.stroke();ctx.globalAlpha=1-fane;});
    for(var j3=5;j3<pts.length;j3+=5){if(pts[j3][2]!==devant)continue;var p1=pts[j3],nx=p1[0]-cx,ny=(p1[1]-cy)*0.6,L=Math.hypot(nx,ny)||1;nx/=L;ny/=L;var len=(4+9*pique)*s*(1-fane*0.5),b=3.4*s;
      ctx.fillStyle=fmel('#2b3690','#ff5a6a',pique*(1-fane));ctx.strokeStyle='#120c08';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p1[0]-ny*b,p1[1]+nx*b);ctx.lineTo(p1[0]+nx*len,p1[1]+ny*len);ctx.lineTo(p1[0]+ny*b,p1[1]-nx*b);ctx.closePath();ctx.fill();ctx.stroke();}}
  ctx.restore();}
EF.epine={nom:'Épine',coul:'255,159,176',d:1.6,
  init:function(e){var a=e.v;if(!a)return;e.parts=fgerbe(e.grand?18:8,function(r){var an=-1.57+(r()-0.5)*2.4,v=90+r()*150;return{x:a.x,y:fmil(a)+8,vx:Math.cos(an)*v,vy:Math.sin(an)*v,g:500,t0:0.22,vie:0.55,s:2+r()*2.5};});},
  teinte:function(e,t){fteinte(e.v,'255,60,60',0.45*fbosse(t,0.2,0.25,0.6));},
  sous:function(e,t){if(e.grand)ronces(e,t,false);},
  dessus:function(e,t){var u=e.u,a=e.v;if(e.grand)ronces(e,t,true);if(!a)return;
    ctx.save();ctx.globalCompositeOperation='lighter';fparts(e.parts,t,function(p,x,y,q){ctx.fillStyle='rgba(255,70,80,'+(1-q)+')';ctx.beginPath();ctx.arc(x,y,p.s,0,6.283);ctx.fill();});ctx.restore();

  EFX.forEach(function(e){var E=EF[e.id];if(E.teinte)E.teinte(e,e.t);if(!e.grand)return;if(E.secousse)sec=Math.max(sec,E.secousse(e,e.t));if(E.eclat){var x=E.eclat(e,e.t);if(x[1]>ea){ea=x[1];ec=x[0];}}});
  appliqueSecousse(sec);appliqueEclat(ec,ea);
  ctx.setTransform(ECH*DPR,0,0,ECH*DPR,0,-J0*ECH*DPR);ctx.clearRect(0,J0,W,T1-J0);
  EFX.forEach(function(e){if(EF[e.id].sous)EF[e.id].sous(e,e.t);});
  var list=units.slice().sort(function(a,b){return a.y-b.y;});
  list.forEach(function(u){if((S.phase==='place'||S.phase==='reveal')&&u.side<0&&u.reveal<1){drawHidden(u);return;}
    drawUnit(u);
    if(S.phase==='place'&&sel===u){ctx.strokeStyle=C.choix;ctx.lineWidth=3;ctx.setLineDash([6,4]);var w=38*u.sc,h=54*u.sc;rr(ctx,u.x-w/2-7,u.y-h-16*u.sc,w+14,h+34*u.sc,8);ctx.stroke();ctx.setLineDash([]);}});
  bolts.forEach(drawBolt);fleches.forEach(drawFleche);
  EFX.forEach(function(e){if(EF[e.id].dessus)EF[e.id].dessus(e,e.t);});if(NOMQ.length)dessineNom(NOMQ[0]);
  fx.forEach(function(p){ctx.fillStyle=p.c;ctx.globalAlpha=1-p.t/p.life;ctx.fillRect(p.x-2,p.y-2,4,4);ctx.globalAlpha=1;});
  nums.forEach(function(n){ctx.globalAlpha=1-Math.max(0,n.t-0.5)/0.4;ctx.drawImage(n.img,n.x-n.w/2,n.y-n.h/2,n.w,n.h);ctx.globalAlpha=1;});
  flyers.forEach(drawFlyer);}

/* ---------- le décor : peint UNE fois par mois, sur sa propre toile ---------- */
function alpha(hex,a){return 'rgba('+parseInt(hex.slice(1,3),16)+','+parseInt(hex.slice(3,5),16)+','+parseInt(hex.slice(5,7),16)+','+a+')';}
function peindreDecor(){var c=dctx,g,i,graine=7+S.start*31+S.round*7,alea=function(){graine=(graine*16807)%2147483647;return graine/2147483647;};
  c.setTransform(ECH*DPR,0,0,ECH*DPR,0,0);
  g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,C.ciel1);g.addColorStop(1,C.ciel2);c.fillStyle=g;c.fillRect(0,0,W,H);
  g=c.createRadialGradient(40,H-32,10,40,H-32,380);g.addColorStop(0,alpha(C.lueur,.42));g.addColorStop(1,alpha(C.lueur,0));c.fillStyle=g;c.fillRect(0,0,W,H);
  g=c.createRadialGradient(330,60,10,330,60,260);g.addColorStop(0,alpha(C.lui,.22));g.addColorStop(1,alpha(C.lui,0));c.fillStyle=g;c.fillRect(0,0,W,H);
  for(i=0;i<Math.round(H*0.7);i++){var a=alea();c.fillStyle=alpha(C.texte,0.2+a*0.5);var r=a>0.9?1.6:1;c.fillRect(alea()*W,alea()*H,r,r);}
  /* Une vraie figure peut compter trente étoiles : au-delà de douze, elles se dessinent plus fines. */
  var fig=CIEL[month().id]||{st:[],ln:[]},gros=fig.st.length<=12,pts=fig.st.map(function(p){return[206+p[0]*134,14+p[1]*60];});
  /* une constellation déjà allumée dans l'atlas brille en or : on se souvient de l'avoir gagnée */
  var dore=ESSAI&&!!ATLAS.lu[month().id],coulL=dore?alpha(C.moiPlein,.9):alpha(C.texte2,.85),coulE=dore?C.moiPlein:C.texte,halo=dore?alpha(C.moiPlein,.22):alpha(C.texte,.16);
  $('signe').classList.toggle('lu',dore);
  c.strokeStyle=coulL;c.lineWidth=gros?1.5:1.2;fig.ln.forEach(function(l){var p=pts[l[0]],q=pts[l[1]];c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);c.stroke();});
  pts.forEach(function(p){c.fillStyle=halo;c.beginPath();c.arc(p[0],p[1],gros?9:5,0,6.283);c.fill();c.fillStyle=coulE;c.beginPath();c.arc(p[0],p[1],gros?2.8:2,0,6.283);c.fill();});
  /* le tapis : une plaque de verre, arête claire en haut, liseré sombre au bord */
  var th=T1-T0-6;rr(c,8,T0+6,344,th,26);c.fillStyle='rgba(255,255,255,.07)';c.fill();
  g=c.createLinearGradient(0,T0+6,0,T0+142);g.addColorStop(0,'rgba(255,255,255,.10)');g.addColorStop(1,'rgba(255,255,255,0)');rr(c,8,T0+6,344,th,26);c.fillStyle=g;c.fill();
  c.strokeStyle='rgba(0,0,0,.5)';c.lineWidth=1.5;rr(c,7.5,T0+5.5,345,th+1,26);c.stroke();c.strokeStyle='rgba(255,255,255,.3)';c.lineWidth=1;rr(c,9,T0+7,342,th-2,25);c.stroke();
  c.strokeStyle='rgba(255,255,255,.07)';c.lineWidth=1;for(i=1;i<5;i++){var cx=(COL[i-1]+COL[i])/2;c.beginPath();c.moveTo(cx,T0+32);c.lineTo(cx,T1-26);c.stroke();}
  var CH=['I','II','III','IV','V'],m=(T0+T1)/2-2;c.font='600 15px Fraunces, Georgia, serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle=alpha(C.marque,.6);
  for(i=0;i<5;i++)c.fillText(CH[i],COL[i],m);
  c.strokeStyle=alpha(C.marque,.28);c.lineWidth=1.5;c.setLineDash([6,8]);for(i=0;i<5;i++){c.beginPath();c.moveTo(COL[i]-30,m);c.lineTo(COL[i]-13,m);c.moveTo(COL[i]+13,m);c.lineTo(COL[i]+30,m);c.stroke();}c.setLineDash([]);}

function layout(){var vw=window.innerWidth,vh=window.innerHeight,ancien=T1;ECH=Math.min(vw/W,vh/640);DOS={};H=Math.min(880,Math.round(vh/ECH));T1=H-218;
  cadre.style.height=H+'px';cadre.style.transform='scale('+ECH+')';cadre.style.marginTop=Math.max(0,(vh-H*ECH)/2)+'px';
  decor.width=Math.round(W*ECH*DPR);decor.height=Math.round(H*ECH*DPR);decor.style.width=W+'px';decor.style.height=H+'px';decor.style.top='0';
  cv.width=Math.round(W*ECH*DPR);cv.height=Math.round((T1-J0)*ECH*DPR);cv.style.width=W+'px';cv.style.height=(T1-J0)+'px';cv.style.top=J0+'px';
  $('astuce').style.top=((yLui()+yMoi()-76)/2)+'px';$('page').style.top=((T0+T1)/2-62)+'px';

  units.forEach(function(u){u.y=T0+(u.y-T0)*(T1-T0)/(ancien-T0);u.sc=taille(u.y);});
  peindreDecor();draw();}

  nouvelle:function(){$('end').hidden=true;$('title').hidden=true;newGame();},
  jette:function(id,side){var main=side<0?foeTarot:myTarot;for(var i=0;i<main.length;i++)if(main[i].id===id&&castArcana(main[i],side<0?-1:1)){main.splice(i,1);return true;}return false;},
  combat:function(){return{t:S.t,phase:S.phase,moi:myTarot.map(function(a){return a.id;}),lui:foeTarot.map(function(a){return a.id;}),
    u:units.map(function(u,i){return{i:i,x:u.x,c:u.side,v:u.v,hp:u.hp,max:u.max,mort:u.dead,double:!!u.clone,frappe:u.state==='fight'};}),
    tombes:[myFallen,foeFallen].map(function(l){return l.filter(function(u){return u.dead&&!u.clone;}).map(function(u){return u.v;});})};},

  sansLui:function(){S.foeCastT=1e9;},auto:function(v){AUTO=v;},paliers:function(t){if(t)PALIERS=t;return PALIERS;},atlas:function(o){if(o.joue!==undefined){ATLAS.joue=o.joue;ATLAS.max=Math.max(ATLAS.max,o.joue);}if(o.tout!==undefined)TOUT=o.tout;return{lu:ATLAS.lu,ans:ATLAS.ans,max:ATLAS.max,joue:ATLAS.joue,pal:S.pal};},
  gravures:function(){return[myDeck,foeDeck].map(function(d){return d.filter(function(c){return c.g;}).map(function(c){return c.r+c.s+':'+c.g;});});},grave:function(side,i,g){(side>0?myDeck:foeDeck)[i].g=g;},carte:function(i,g){units[i].card.g=g;},effets:function(){return{effets:EFX.length,ids:EFX.map(function(e){return e.id+(e.grand?'+':'');}),noms:NOMQ.length,gel:units.filter(function(u){return u.gel>0;}).length};},effet:function(id,i,o){var u=units[i];o=o||{};if(o.v!==undefined)o.v=units[o.v];if(o.o!==undefined)o.o=units[o.o];if(o.lo!==undefined){o.lo=units[o.lo];o.hi=units[o.hi];}if(o.list)o.list=o.list.map(function(j){return units[j];});if(o.seul){EFX=[];NOMQ=[];DITS={};units.forEach(function(x){x.gel=0;});}if(id==='givre'&&o.v)o.v.gel=1.1;var e=effet(id,u,o);if(e&&o.t!==undefined){e.t=o.t;if(NOMQ[0])NOMQ[0].t=o.t-(EF[id].nomT||0);}return!!e;},fige:function(v){pause=v;},dessine:function(){draw();},allume:function(id,v){if(v)ATLAS.lu[id]=1;else delete ATLAS.lu[id];units.slice().reverse().forEach(function(u){if(!u.clone)(u.side>0?myDeck:foeDeck).unshift(u.card);});donner();},essai:function(){return{actif:ESSAI,atout:ATOUT&&ATOUT.id,lui:ATOUT_LUI&&ATOUT_LUI.id,mods:MODS,reg:REG};},ajuste:ajuste,mod:function(m,lui){MODS={};if(m)MODS[1]=m;if(lui)MODS[-1]=lui;},arcanePlus:function(){if(myTarot.length<4)myTarot.push(drawArcana());},
  /* range mes cartes par valeur, de gauche à droite : sens 1 = de la plus faible à la plus forte, -1 = l'inverse */

  etat:function(){return{phase:S.phase,round:S.round,mois:month().id,moi:myDeck.length,lui:foeDeck.length,

/* Installation : un bouton sur l'écran titre, TOUJOURS, tant que le jeu n'est pas
   installé. Chrome donne son invitation (beforeinstallprompt) ; sans elle (iPhone,
   ou invitation déjà refusée), le bouton montre où se trouve la commande. */
var invitation=null;
function installe(){return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;}
function majInstaller(){$('instBtn').hidden=installe();if(installe())$('instAide').hidden=true;}
addEventListener('beforeinstallprompt',function(e){e.preventDefault();invitation=e;majInstaller();});
addEventListener('appinstalled',function(){invitation=null;majInstaller();});
$('instBtn').addEventListener('click',function(){
  if(invitation){var i=invitation;invitation=null;i.prompt();if(i.userChoice&&i.userChoice.then)i.userChoice.then(majInstaller,majInstaller);return;}
  var a=$('instAide');a.textContent=/iPhone|iPad|iPod/.test(navigator.userAgent)?'Touche Partager, puis « Sur l\u2019écran d\u2019accueil ».':'Ouvre le menu du navigateur, puis « Ajouter à l\u2019écran d\u2019accueil ».';a.hidden=!a.hidden;});
majInstaller();

/* Mise à jour : un rechargement ne redemande pas sw.js, il faut update(). La
   nouvelle version ne se prend qu'à l'écran titre ou de fin, jamais en partie. */
var majPrete=false;
function prendreMaj(){if(majPrete&&(!$('title').hidden||!$('end').hidden))location.reload();}
if('serviceWorker' in navigator){var avait=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',function(){if(avait){majPrete=true;prendreMaj();}});
  navigator.serviceWorker.register('./sw.js').then(function(reg){var maj=function(){reg.update().catch(function(){});};maj();
    document.addEventListener('visibilitychange',function(){if(!document.hidden)maj();});}).catch(function(){});
  navigator.serviceWorker.ready.then(function(reg){if(!reg.active)return;var canal=new MessageChannel();canal.port1.onmessage=function(e){VJ=String(e.data);$('version').textContent=VJ+(ESSAI?'':' · classique');vider();};reg.active.postMessage('version',[canal.port2]);}).catch(function(){});}
})();
