<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Icône : Paper Race</title>
<!-- Source des icônes. `node tools/chevalier-icones.mjs paper-race` les rend
     en PNG : .icone donne icone-512 et icone-192, .masquable donne
     icone-maskable-512. Choisie par elle le 2026-09-18 parmi sept propositions
     (tools/mockup-icones-paper-race.html) : « B, le circuit ». -->
<style>
  body{margin:0;background:#888}
  svg{display:block}
</style>
</head>
<body>
<svg class="icone" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- la voiture vue de dessus, tournée vers la droite -->
    <g id="voiture">
      <g fill="#20262e"><rect x="-34" y="-36" width="20" height="12" rx="3"/><rect x="-34" y="24" width="20" height="12" rx="3"/><rect x="16" y="-36" width="20" height="12" rx="3"/><rect x="16" y="24" width="20" height="12" rx="3"/></g>
      <rect x="-50" y="-28" width="100" height="56" rx="20"/>
      <ellipse cx="8" cy="0" rx="16" ry="15" fill="#FAFBF8" opacity=".92"/>
      <rect x="-50" y="-22" width="9" height="44" fill="#000" opacity=".35"/>
    </g>
    <g id="circuit">
      <rect x="92" y="92" width="328" height="328" rx="112" fill="none" stroke="#5A6473" stroke-width="118"/>
      <rect x="92" y="92" width="328" height="328" rx="112" fill="none" stroke="#D6D8D1" stroke-width="102"/>
      <rect x="92" y="92" width="328" height="328" rx="112" fill="none" stroke="#5E86A6" stroke-width="102" stroke-dasharray="2 30" opacity=".35"/>
      <g transform="translate(92 256)">
        <rect x="-51" y="-10" width="102" height="20" fill="#F4F1EC"/>
        <g fill="#22282F"><rect x="-51" y="-10" width="17" height="10"/><rect x="-17" y="-10" width="17" height="10"/><rect x="17" y="-10" width="17" height="10"/><rect x="-34" y="0" width="17" height="10"/><rect x="0" y="0" width="17" height="10"/><rect x="34" y="0" width="17" height="10"/></g>
      </g>
      <g transform="translate(200 92) scale(1.05)" fill="#B03A2E"><use href="#voiture"/></g>
      <g transform="translate(312 420) rotate(180) scale(1.05)" fill="#2B4C8C"><use href="#voiture"/></g>
    </g>
  </defs>
  <rect width="512" height="512" fill="#8CC07A"/>
  <use href="#circuit"/>
</svg>

<!-- masquable : Android ne garde avec certitude qu'un rond de 40 % du côté
     autour du centre. Le circuit est réduit pour y tenir entier, sur la même
     herbe que background_color, sinon un disque collé au milieu de l'écran
     de chargement. -->
<svg class="masquable" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" fill="#8CC07A"/>
  <g transform="translate(256 256) scale(.8) translate(-256 -256)">
    <use href="#circuit"/>
  </g>
</svg>
</body>
</html>
