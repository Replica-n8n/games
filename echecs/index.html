<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#12100e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Échecs et Dames</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<link rel="apple-touch-icon" href="./icone-192.png">
<style>
:root{
  --bg:#12100e;
  --panel:#1c1917;
  --panel-hi:#252120;
  --ink:#efe8dc;
  --ink-dim:#9b9188;
  --line:#302b28;
  --sq-light:#b08d6a;
  --sq-dark:#6b4f3a;
  --clair:#f7f1e6;
  --sombre:#191512;
  --accent:#d8a743;
  --danger:#c9553f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  user-select:none;
  -webkit-user-select:none;
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}

/* ---------- barre du haut ---------- */
.topbar{
  position:relative;z-index:55;
  display:flex;align-items:center;gap:8px;
  padding:4px 6px 4px 16px;
  min-height:52px;
}
.status{
  flex:1;
  font-size:15px;letter-spacing:.2px;color:var(--ink-dim);
  transition:opacity .3s ease,color .25s;
}
.status.warn,.status.over{color:var(--accent)}
.status.over{font-weight:600}
body.veil .status,body.veil .footnote{opacity:0}

.dots{
  width:48px;height:48px;flex:none;
  border:0;background:transparent;color:var(--ink-dim);
  border-radius:14px;
  display:flex;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;
}
.dots:active{background:var(--panel-hi)}
.dots:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dots i{width:4px;height:4px;border-radius:50%;background:currentColor;display:block}

/* ---------- scene : bandeau joueur, plateau, bandeau joueur ---------- */
.stage-wrap{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:0 8px;
  min-height:0;
}
#stage{
  display:flex;flex-direction:column;gap:9px;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
}
#stage.flip{transform:rotate(180deg)}
#stage.flip .piece,#stage.flip .coord,#stage.flip .bar-in{transform:rotate(180deg)}

.bar{
  height:46px;
  border-radius:12px;
  background:transparent;
  border:1px solid transparent;
  transition:background .25s,border-color .25s;
}
.bar.turn{background:var(--panel);border-color:var(--line)}
.bar-in{
  height:100%;
  display:flex;align-items:center;gap:10px;
  padding:0 12px;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
}
.pip{
  width:14px;height:14px;border-radius:50%;flex:none;
  border:1px solid rgba(0,0,0,.45);
}
.pip.blanc{background:var(--clair)}
.pip.noir{background:#3a3330;border-color:rgba(255,255,255,.25)}
.who{font-size:14px;color:var(--ink-dim);flex:none;transition:color .25s}
.bar.turn .who{color:var(--ink)}
.loot{
  flex:1;min-width:0;
  display:flex;align-items:center;gap:2px;
  font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",serif;
  font-size:17px;line-height:1;
  overflow:hidden;white-space:nowrap;
  color:#6f6862;
}
.loot .mini{
  width:12px;height:12px;border-radius:50%;flex:none;
  border:1px solid rgba(0,0,0,.4);
}
.loot .mini.blanc{background:#8d857c}
.loot .mini.noir{background:#4a423d;border-color:rgba(255,255,255,.18)}
.loot .mini.dame{box-shadow:inset 0 0 0 2px var(--accent)}
.adv{
  margin-left:6px;flex:none;
  font-family:system-ui,sans-serif;font-size:12px;
  font-variant-numeric:tabular-nums;color:var(--ink-dim);
}

/* ---------- plateau ---------- */
#board{
  --n:8;
  --size:min(calc(100vw - 16px), calc(100dvh - 230px));
  width:var(--size);height:var(--size);
  display:grid;
  grid-template-columns:repeat(var(--n),1fr);
  grid-template-rows:repeat(var(--n),1fr);
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.sq.light{background:var(--sq-light)}
.sq.dark{background:var(--sq-dark)}
.sq.last::before{content:"";position:absolute;inset:0;background:rgba(216,167,67,.32)}
.sq.trace::before{content:"";position:absolute;inset:0;background:rgba(216,167,67,.22)}
.sq.sel::before{content:"";position:absolute;inset:0;background:rgba(216,167,67,.45)}
.sq.check::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle,rgba(201,85,63,.85) 20%,rgba(201,85,63,0) 72%);
}
.sq.mange::after{
  content:"";position:absolute;inset:2px;z-index:1;border-radius:8px;
  box-shadow:inset 0 0 0 3px rgba(201,85,63,.85);
}

/* pieces d echecs : des glyphes */
.piece{
  position:relative;z-index:2;
  font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",serif;
  font-size:calc(var(--size) / (var(--n) * 1.4));
  line-height:1;
  pointer-events:none;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
}
.piece.blanc{color:var(--clair);text-shadow:0 1px 2px rgba(0,0,0,.45)}
.piece.noir{color:var(--sombre);text-shadow:0 0 1px rgba(255,255,255,.55),0 1px 2px rgba(0,0,0,.35)}

/* pions de dames : des jetons */
.piece.jeton{
  width:76%;height:76%;border-radius:50%;
  box-shadow:0 2px 4px rgba(0,0,0,.5);
}
.piece.jeton.blanc{
  background:radial-gradient(circle at 34% 30%, #fffdf8, var(--clair) 62%, #cfc5b4);
  border:1px solid rgba(0,0,0,.35);
}
.piece.jeton.noir{
  background:radial-gradient(circle at 34% 30%, #443c37, #201b18 62%, #100d0b);
  border:1px solid rgba(255,255,255,.22);
}
.piece.jeton.dame::after{
  content:"";position:absolute;inset:24%;
  border-radius:50%;
  border:2px solid var(--accent);
}

.hint{
  position:absolute;z-index:3;
  width:30%;height:30%;border-radius:50%;
  background:rgba(20,16,12,.35);
  pointer-events:none;
}
.hint.cap{width:100%;height:100%;border-radius:0;background:none;box-shadow:inset 0 0 0 4px rgba(20,16,12,.35)}
.sq.aide::after{
  content:"";position:absolute;inset:3px;z-index:1;
  border-radius:9px;
  box-shadow:inset 0 0 0 3px var(--accent);
  animation:respire 1.1s ease-in-out 3;
}
@keyframes respire{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.sq.aide::after{animation:none;opacity:.85}}
.coord{
  position:absolute;z-index:1;
  font-size:9px;font-weight:600;opacity:.55;
  font-family:system-ui,sans-serif;
  pointer-events:none;
  transition:transform .45s cubic-bezier(.4,0,.2,1);
}
.coord.f{right:3px;bottom:2px}
.coord.r{left:3px;top:2px}
.sq.light .coord{color:var(--sq-dark)}
.sq.dark .coord{color:var(--sq-light)}

.footnote{
  height:32px;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#6f6862;
  transition:opacity .3s ease;
}

/* ---------- surcouches ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(10,9,8,.88);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:28px;
  transition:opacity .3s ease;
}
.overlay.hidden{opacity:0;pointer-events:none}
.face{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:320px}
.face[hidden]{display:none}

/* choix du jeu */
.choix{
  display:flex;align-items:center;gap:18px;
  width:100%;min-height:96px;
  padding:0 26px;
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  color:var(--ink);
  font-family:Georgia,"Times New Roman",serif;
  font-size:27px;letter-spacing:1px;
  cursor:pointer;
  transition:border-color .18s,transform .12s;
}
.choix + .choix{margin-top:14px}
.choix:active{transform:scale(.98)}
.choix:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.choix .embleme{
  width:52px;flex:none;
  display:flex;align-items:center;justify-content:center;
  font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",serif;
  font-size:42px;color:var(--ink);
}
.choix .jeton-embleme{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fffdf8, var(--clair) 62%, #cfc5b4);
  box-shadow:0 2px 6px rgba(0,0,0,.5);
  position:relative;
}
.choix .jeton-embleme::after{
  content:"";position:absolute;inset:26%;border-radius:50%;
  border:2px solid #b08d6a;
}

/* fin de partie */
.brand{
  font-family:Georgia,"Times New Roman",serif;
  font-size:34px;letter-spacing:1px;font-weight:400;
  text-wrap:balance;text-align:center;
}
.endsub{color:var(--ink-dim);font-size:15px;margin-top:2px;text-align:center}
.glyphe-fin{
  font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",serif;
  font-size:54px;color:var(--ink);
  margin-bottom:6px;
  display:flex;align-items:center;justify-content:center;gap:10px;min-height:70px;
}
.roi-couche{display:inline-block;transform:rotate(-68deg);transform-origin:50% 70%}
.roi-couche.blanc{color:var(--clair)}
.roi-couche.noir{color:var(--sombre);text-shadow:0 0 2px rgba(235,225,205,.75)}
.jeton-fin{
  display:inline-block;width:52px;height:52px;border-radius:50%;
  box-shadow:0 3px 8px rgba(0,0,0,.5);
}
.jeton-fin.blanc{background:radial-gradient(circle at 34% 30%, #fffdf8, var(--clair) 62%, #cfc5b4)}
.jeton-fin.noir{background:radial-gradient(circle at 34% 30%, #443c37, #201b18 62%, #100d0b);border:1px solid rgba(255,255,255,.22)}
.start{
  margin-top:30px;
  min-width:230px;min-height:58px;
  border:0;border-radius:999px;
  background:var(--ink);color:#15120f;
  font-size:17px;font-weight:600;letter-spacing:.4px;
  cursor:pointer;
  box-shadow:0 8px 30px rgba(247,241,230,.16);
}
.start:active{transform:scale(.97)}
.start:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.retour{
  margin-top:14px;min-height:44px;
  border:0;background:none;color:var(--ink-dim);
  font-family:inherit;font-size:14px;cursor:pointer;
}

/* ---------- feuille du menu ---------- */
.scrim{
  position:fixed;inset:0;z-index:60;
  background:rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;
  background:var(--panel);
  border-radius:20px 20px 0 0;
  border-top:1px solid var(--line);
  padding:8px 0 calc(env(safe-area-inset-bottom) + 10px);
  transform:translateY(102%);
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
  max-height:88vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.grabber{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.head{
  padding:0 22px 6px;
  font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:#6f6862;
}
.item{
  display:flex;align-items:center;gap:14px;
  width:100%;min-height:56px;
  padding:0 22px;
  background:none;border:0;
  color:var(--ink);font-size:16px;text-align:left;
  font-family:inherit;cursor:pointer;
}
.item:active{background:var(--panel-hi)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.item[disabled]{color:#5c5551}
.item[hidden]{display:none}
.item .ico{
  width:22px;text-align:center;font-size:17px;opacity:.85;flex:none;
  font-family:"Segoe UI Symbol","Apple Symbols",serif;
}
.item.danger{color:var(--danger)}
.item .sub{display:block;font-size:12px;color:var(--ink-dim);margin-top:2px}
.item .grow{flex:1}
.item .tick{flex:none;color:var(--accent);font-size:17px;opacity:0;transition:opacity .2s}
.item.on .tick{opacity:1}
.sep{height:1px;background:var(--line);margin:8px 22px}
.sep[hidden]{display:none}
</style>
</head>
<body>

<div class="topbar">
  <div class="status" id="status">Aux blancs de jouer</div>
  <button class="dots" id="menuBtn" aria-label="Menu de la partie">
    <i></i><i></i><i></i>
  </button>
</div>

<div class="stage-wrap">
  <div id="stage">
    <div class="bar" id="barNoir">
      <div class="bar-in">
        <span class="pip noir"></span><span class="who">Noirs</span>
        <span class="loot" id="lootNoir"></span>
      </div>
    </div>

    <div id="board"></div>

    <div class="bar" id="barBlanc">
      <div class="bar-in">
        <span class="pip blanc"></span><span class="who">Blancs</span>
        <span class="loot" id="lootBlanc"></span>
      </div>
    </div>
  </div>
</div>

<div class="footnote" id="footnote">Touchez une pièce pour voir ses coups</div>

<div class="overlay" id="overlay">
  <div class="face" id="faceChoix">
    <button class="choix" data-jeu="echecs">
      <span class="embleme">&#9822;&#65038;</span><span>Échecs</span>
    </button>
    <button class="choix" data-jeu="dames">
      <span class="embleme"><span class="jeton-embleme"></span></span><span>Dames</span>
    </button>
  </div>
  <div class="face" id="faceFin" hidden>
    <div class="glyphe-fin" id="finGlyphe"></div>
    <div class="brand" id="finTitre"></div>
    <div class="endsub" id="finSous"></div>
    <button class="start" id="rejouerBtn">Recommencer</button>
    <button class="retour" id="changerBtn">Changer de jeu</button>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grabber"></div>
  <button class="item" id="installBtn" hidden>
    <span class="ico">&#10515;</span>
    <span class="grow">Installer les jeux<span class="sub">Pour jouer sans navigateur, même hors ligne</span></span>
  </button>
  <div class="sep" id="installSep" hidden></div>
  <div class="head">Jeu</div>
  <button class="item" id="optEchecs">
    <span class="ico">&#9822;&#65038;</span>
    <span class="grow">Échecs</span>
    <span class="tick">&#10003;</span>
  </button>
  <button class="item" id="optDames">
    <span class="ico">&#9899;</span>
    <span class="grow">Dames<span class="sub">Internationales, 10x10</span></span>
    <span class="tick">&#10003;</span>
  </button>
  <div class="sep"></div>
  <button class="item" id="undoBtn"><span class="ico">&#8630;</span><span class="grow">Annuler le dernier coup</span></button>
  <div class="sep"></div>
  <div class="head">Plateau</div>
  <button class="item" id="optPivot">
    <span class="ico">&#8635;</span>
    <span class="grow">Pivoter à chaque coup<span class="sub">On se passe le téléphone</span></span>
    <span class="tick">&#10003;</span>
  </button>
  <button class="item" id="optFixed">
    <span class="ico">&#9635;</span>
    <span class="grow">Rester fixe<span class="sub">Les blancs toujours en bas</span></span>
    <span class="tick">&#10003;</span>
  </button>
  <div class="sep"></div>
  <button class="item danger" id="resetBtn"><span class="ico">&#10227;</span><span class="grow">Recommencer la partie</span></button>
  <div class="sep"></div>
  <button class="item" id="closeBtn"><span class="ico">&#10005;</span><span class="grow">Reprendre la partie</span></button>
</div>

<script src="./moteur-echecs.js"></script>
<script src="./moteur-dames.js"></script>
<script>
"use strict";
var JEUX = { echecs: MOTEUR_ECHECS, dames: MOTEUR_DAMES };

var boardEl = document.getElementById("board");
var stageEl = document.getElementById("stage");
var statusEl = document.getElementById("status");
var footnote = document.getElementById("footnote");
var barBlanc = document.getElementById("barBlanc");
var barNoir = document.getElementById("barNoir");
var lootBlanc = document.getElementById("lootBlanc");
var lootNoir = document.getElementById("lootNoir");
var undoBtn = document.getElementById("undoBtn");
var optPivot = document.getElementById("optPivot");
var optFixed = document.getElementById("optFixed");
var optEchecs = document.getElementById("optEchecs");
var optDames = document.getElementById("optDames");

var MOTEUR = null;
var etat, past, prises, squares = [];
var choisi = -1, prefixe = [], candidats = [];
var aide = [], aideMinuteur = null;
var fin = null, finAnnoncee = false;

var autoFlip = true;
try{ autoFlip = localStorage.getItem("damier.plateau") !== "fixe"; }catch(e){}
var jeuChoisi = null;
try{ jeuChoisi = localStorage.getItem("damier.jeu"); }catch(e){}

/* ---------- construction du damier ---------- */
function batirPlateau(){
  var n = MOTEUR.taille;
  boardEl.style.setProperty("--n", n);
  boardEl.innerHTML = "";
  squares = [];
  for(var i=0;i<n*n;i++){
    var r = Math.floor(i/n), c = i%n;
    var sq = document.createElement("div");
    sq.className = "sq " + ((r+c)%2 === 0 ? "light" : "dark");
    sq.dataset.i = i;
    if(MOTEUR.toutesLesCases){
      if(r === n-1){
        var f = document.createElement("span");
        f.className = "coord f";
        f.textContent = "abcdefgh"[c];
        sq.appendChild(f);
      }
      if(c === 0){
        var rk = document.createElement("span");
        rk.className = "coord r";
        rk.textContent = String(n-r);
        sq.appendChild(rk);
      }
    }
    boardEl.appendChild(sq);
    squares.push(sq);
  }
}

function nouvellePartie(){
  aide = []; clearTimeout(aideMinuteur);
  etat = MOTEUR.nouvelle();
  past = [];
  prises = { blanc:[], noir:[] };
  choisi = -1; prefixe = []; candidats = [];
  fin = null; finAnnoncee = false;
  dessiner();
}

function chargerJeu(cle){
  MOTEUR = JEUX[cle];
  try{ localStorage.setItem("damier.jeu", cle); }catch(e){}
  optEchecs.classList.toggle("on", cle === "echecs");
  optDames.classList.toggle("on", cle === "dames");
  batirPlateau();
  nouvellePartie();
}

/* ---------- rendu ---------- */
function dessiner(){
  var i, n = MOTEUR.taille;
  for(i=0;i<n*n;i++){
    var sq = squares[i];
    var vieux = sq.querySelector(".piece");
    if(vieux) vieux.remove();
    var h = sq.querySelector(".hint");
    if(h) h.remove();
    sq.classList.remove("last","sel","check","aide","mange","trace");
    var p = MOTEUR.piece(etat, i);
    if(p){
      var el = document.createElement("span");
      el.className = "piece " + p.camp + (MOTEUR.forme === "disque" ? " jeton" : "") + (p.dame ? " dame" : "");
      if(MOTEUR.forme !== "disque") el.textContent = p.glyphe;
      sq.appendChild(el);
    }
  }

  var der = MOTEUR.derniers(etat);
  for(i=0;i<der.length;i++) squares[der[i]].classList.add("last");

  if(choisi >= 0){
    squares[choisi].classList.add("sel");
    for(i=0;i<prefixe.length;i++) squares[prefixe[i]].classList.add("trace");
    var suites = prochainesEtapes();
    for(i=0;i<suites.length;i++){
      var pt = document.createElement("span");
      pt.className = "hint" + (suites[i].prise >= 0 || suites[i].occupee ? " cap" : "");
      squares[suites[i].case].appendChild(pt);
      if(suites[i].prise >= 0) squares[suites[i].prise].classList.add("mange");
    }
  }

  var danger = MOTEUR.alerte(etat);
  if(danger >= 0) squares[danger].classList.add("check");
  for(i=0;i<aide.length;i++) squares[aide[i]].classList.add("aide");

  stageEl.classList.toggle("flip", autoFlip && MOTEUR.trait(etat) === "noir" && !fin);
  barBlanc.classList.toggle("turn", MOTEUR.trait(etat) === "blanc" && !fin);
  barNoir.classList.toggle("turn", MOTEUR.trait(etat) === "noir" && !fin);

  statusEl.classList.toggle("over", !!fin);
  statusEl.classList.toggle("warn", !fin && MOTEUR.alerte(etat) >= 0);
  statusEl.textContent = fin ? fin.titre + ", " + fin.sous.toLowerCase() : MOTEUR.message(etat);

  dessinerPrises();
  undoBtn.disabled = past.length === 0;
}

function dessinerPrises(){
  var somme = function(a){
    var t = 0;
    for(var i=0;i<a.length;i++) t += MOTEUR.valeur(a[i]);
    return t;
  };
  var ecart = somme(prises.noir) - somme(prises.blanc);
  var lignes = [
    { el:lootBlanc, arr:prises.noir, avance:ecart },
    { el:lootNoir, arr:prises.blanc, avance:-ecart }
  ];
  for(var L=0;L<2;L++){
    var o = lignes[L], html = "";
    var triees = o.arr.slice().sort(function(a,b){ return MOTEUR.valeur(a) - MOTEUR.valeur(b); });
    for(var i=0;i<triees.length;i++){
      var v = MOTEUR.vuePrise(triees[i]);
      html += MOTEUR.forme === "disque"
        ? '<span class="mini ' + v.camp + (v.dame ? " dame" : "") + '"></span>'
        : '<span style="color:' + (v.camp === "blanc" ? "#8d857c" : "#4a423d") + '">' + v.glyphe + '</span>';
    }
    if(o.avance > 0) html += '<span class="adv">+' + o.avance + '</span>';
    o.el.innerHTML = html;
  }
}

/* ---------- coups ---------- */
function coupsDe(i){
  var tous = MOTEUR.coups(etat), out = [];
  for(var k=0;k<tous.length;k++) if(tous[k].de === i) out.push(tous[k]);
  return out;
}

/* les cases touchables à cet instant, avec la pièce que chacune mange */
function prochainesEtapes(){
  var vues = {}, out = [], rang = prefixe.length;
  for(var k=0;k<candidats.length;k++){
    var c = candidats[k];
    if(rang >= c.etapes.length) continue;
    var cible = c.etapes[rang];
    if(vues[cible]) continue;
    vues[cible] = 1;
    out.push({
      case: cible,
      prise: c.prises.length > rang ? c.prises[rang] : -1,
      occupee: !!MOTEUR.piece(etat, cible)
    });
  }
  return out;
}

function deselectionner(){
  choisi = -1; prefixe = []; candidats = [];
}

boardEl.addEventListener("click", function(e){
  if(fin) return;
  var cell = e.target.closest(".sq");
  if(!cell) return;
  var i = parseInt(cell.dataset.i, 10);

  if(choisi >= 0){
    var suites = prochainesEtapes(), touche = null;
    for(var s=0;s<suites.length;s++) if(suites[s].case === i) touche = suites[s];
    if(touche){
      prefixe.push(i);
      var restants = [];
      for(var k=0;k<candidats.length;k++)
        if(candidats[k].etapes[prefixe.length-1] === i) restants.push(candidats[k]);
      candidats = restants;

      var complet = null;
      for(var q=0;q<candidats.length;q++)
        if(candidats[q].etapes.length === prefixe.length) complet = candidats[q];

      if(complet){
        jouerCoup(complet);
      } else {
        footnote.textContent = "La rafle continue";
        dessiner();
      }
      return;
    }
  }

  var p = MOTEUR.piece(etat, i);
  if(p && p.camp === MOTEUR.trait(etat)){
    var liste = coupsDe(i);
    if(liste.length){
      choisi = i; prefixe = []; candidats = liste;
      footnote.textContent = "Touchez un point pour déplacer";
    } else {
      deselectionner();
      if(MOTEUR.aideBloquee(etat)) montrerCeQuiPeut();
      else footnote.textContent = "Cette pièce ne peut pas bouger";
    }
  } else {
    deselectionner();
    footnote.textContent = "Touchez une pièce pour voir ses coups";
  }
  dessiner();
});

function jouerCoup(coup){
  aide = []; clearTimeout(aideMinuteur);
  past.push({ etat: MOTEUR.copie(etat), blanc: prises.blanc.slice(), noir: prises.noir.slice() });
  var mangees = MOTEUR.jouer(etat, coup);
  for(var m=0;m<mangees.length;m++){
    var v = MOTEUR.vuePrise(mangees[m]);
    prises[v.camp].push(mangees[m]);
  }
  deselectionner();
  fin = MOTEUR.fin(etat);
  if(fin) footnote.textContent = "";
  dessiner();
  if(fin) annoncerFin();
}

/* Une pièce immobile n'est pas une impasse : en échec, ou quand une prise est
   obligatoire ailleurs, on entoure celles qui peuvent jouer. */
function montrerCeQuiPeut(){
  var tous = MOTEUR.coups(etat), vues = {};
  aide = [];
  for(var i=0;i<tous.length;i++) if(!vues[tous[i].de]){ vues[tous[i].de] = 1; aide.push(tous[i].de); }
  footnote.textContent = MOTEUR.motAide(aide.length);
  clearTimeout(aideMinuteur);
  aideMinuteur = setTimeout(function(){ aide = []; dessiner(); }, 3600);
}

/* ---------- surcouches ---------- */
var overlay = document.getElementById("overlay");
var scrim = document.getElementById("scrim");
var sheet = document.getElementById("sheet");
var resetBtn = document.getElementById("resetBtn");
var faceChoix = document.getElementById("faceChoix");
var faceFin = document.getElementById("faceFin");
var finGlyphe = document.getElementById("finGlyphe");
var finTitre = document.getElementById("finTitre");
var finSous = document.getElementById("finSous");
var resetArme = false, changeArme = false;

function montrerEcran(quoi){
  faceChoix.hidden = quoi !== "choix";
  faceFin.hidden = quoi !== "fin";
  overlay.classList.remove("hidden");
  document.body.classList.add("veil");
}
function cacherEcran(){
  overlay.classList.add("hidden");
  document.body.classList.remove("veil");
}
function annoncerFin(){
  if(finAnnoncee || !fin) return;
  finAnnoncee = true;
  setTimeout(function(){
    if(!fin) return;
    finGlyphe.innerHTML = MOTEUR.glypheFin(fin);
    finTitre.textContent = fin.titre;
    finSous.textContent = fin.sous;
    montrerEcran("fin");
  }, 900);
}

var cartes = document.querySelectorAll(".choix");
for(var ci=0; ci<cartes.length; ci++){
  cartes[ci].addEventListener("click", function(){
    chargerJeu(this.dataset.jeu);
    cacherEcran();
    footnote.textContent = "Touchez une pièce pour voir ses coups";
  });
}
document.getElementById("rejouerBtn").addEventListener("click", function(){
  nouvellePartie();
  cacherEcran();
  footnote.textContent = "Touchez une pièce pour voir ses coups";
});
document.getElementById("changerBtn").addEventListener("click", function(){
  montrerEcran("choix");
});

function ouvrirMenu(){ scrim.classList.add("on"); sheet.classList.add("on"); }
function fermerMenu(){
  scrim.classList.remove("on");
  sheet.classList.remove("on");
  resetArme = false;
  resetBtn.querySelector(".grow").textContent = "Recommencer la partie";
  changeArme = false;
  rendreLibelleJeux();
}
document.getElementById("menuBtn").addEventListener("click", ouvrirMenu);
scrim.addEventListener("click", fermerMenu);
document.getElementById("closeBtn").addEventListener("click", fermerMenu);

undoBtn.addEventListener("click", function(){
  if(!past.length) return;
  var h = past.pop();
  etat = h.etat;
  prises = { blanc:h.blanc, noir:h.noir };
  deselectionner();
  aide = []; clearTimeout(aideMinuteur);
  fin = null; finAnnoncee = false;
  cacherEcran();
  footnote.textContent = "Coup annulé";
  dessiner();
  fermerMenu();
});

function reglerPivot(oui){
  autoFlip = oui;
  try{ localStorage.setItem("damier.plateau", oui ? "pivote" : "fixe"); }catch(e){}
  optPivot.classList.toggle("on", oui);
  optFixed.classList.toggle("on", !oui);
  if(etat) dessiner();
}
optPivot.addEventListener("click", function(){ reglerPivot(true); });
optFixed.addEventListener("click", function(){ reglerPivot(false); });

/* changer de jeu jette la partie en cours : on demande une 2e touche */
function rendreLibelleJeux(){
  optEchecs.querySelector(".grow").firstChild.nodeValue = "Échecs";
  optDames.querySelector(".grow").firstChild.nodeValue = "Dames";
}
function demanderJeu(cle, bouton){
  if(MOTEUR.cle === cle){ fermerMenu(); return; }
  if(past.length && !changeArme){
    changeArme = true;
    bouton.querySelector(".grow").firstChild.nodeValue = "Confirmer, quitter la partie";
    return;
  }
  chargerJeu(cle);
  fermerMenu();
  footnote.textContent = "Touchez une pièce pour voir ses coups";
}
optEchecs.addEventListener("click", function(){ demanderJeu("echecs", optEchecs); });
optDames.addEventListener("click", function(){ demanderJeu("dames", optDames); });

resetBtn.addEventListener("click", function(){
  if(!resetArme){
    resetArme = true;
    resetBtn.querySelector(".grow").textContent = "Confirmer, tout effacer";
    return;
  }
  nouvellePartie();
  fermerMenu();
  footnote.textContent = "Touchez une pièce pour voir ses coups";
});

/* ---------- installation ---------- */
/* Chrome n'affiche sa bannière qu'une fois, et jamais si elle a été ignorée.
   On garde l'invitation sous la main et on la propose dans le menu. */
var installBtn = document.getElementById("installBtn");
var installSep = document.getElementById("installSep");
var invitation = null;

function offrirInstallation(oui){
  installBtn.hidden = !oui;
  installSep.hidden = !oui;
}
window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  invitation = e;
  offrirInstallation(true);
});
window.addEventListener("appinstalled", function(){
  invitation = null;
  offrirInstallation(false);
});
installBtn.addEventListener("click", function(){
  if(!invitation) return;
  invitation.prompt();
  invitation.userChoice.then(function(){
    invitation = null;
    offrirInstallation(false);
    fermerMenu();
  });
});

/* ---------- démarrage ---------- */
reglerPivot(autoFlip);
chargerJeu(JEUX[jeuChoisi] ? jeuChoisi : "echecs");
document.body.classList.add("veil");
montrerEcran("choix");

/* @artifact-retirer-debut */
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").catch(function(){});
  });
}
/* @artifact-retirer-fin */
</script>
</body>
</html>
