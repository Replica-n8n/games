<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Icône de Pièce à conviction</title><style>
html,body{margin:0;padding:0;background:#fff}
.icone,.masquable{width:512px;height:512px}
.icone svg,.masquable svg{display:block;width:512px;height:512px}
</style></head>
<body>
<!-- Une loupe posée sur le plan de la maquette, un visage dans la lentille.
     tools/chevalier-icones.mjs conviction photographie .icone (192 et 512) et
     .masquable (512) : le fond de celle-ci est EXACTEMENT le background_color
     du manifeste (#1d2327), et le dessin tient dans le cercle central. -->
<div class="icone"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><use href="#dessin"/></svg></div>
<div class="masquable"><svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"><rect width="512" height="512" fill="#1d2327"/><g transform="translate(51 51) scale(.8)"><use href="#trait"/></g></svg></div>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <pattern id="parquet" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="#b88a5c"/><rect x="20" width="2" height="22" fill="#a07247"/></pattern>
    <pattern id="tapis" width="30" height="30" patternUnits="userSpaceOnUse"><rect width="30" height="30" fill="#a04a5c"/><circle cx="15" cy="15" r="6" fill="#b4566a"/></pattern>
    <pattern id="carrelage" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#ece6d8"/><rect width="20" height="20" fill="#c5bba6"/><rect x="20" y="20" width="20" height="20" fill="#c5bba6"/></pattern>
    <pattern id="tomettes" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#c7825d"/><path d="M0 27.5h28M27.5 0v28" stroke="#9c5a3a" stroke-width="1.5"/></pattern>
    <clipPath id="lentille"><circle cx="296" cy="236" r="112"/></clipPath>
    <radialGradient id="reflet" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>

    <g id="trait">
      <!-- Le plan : quatre pièces, murs épais, une ombre portée -->
      <rect x="40" y="52" width="392" height="392" rx="26" fill="#000" opacity=".35"/>
      <rect x="28" y="38" width="392" height="392" rx="26" fill="#2e2522"/>
      <rect x="44" y="54" width="168" height="160" fill="url(#parquet)"/>
      <rect x="224" y="54" width="180" height="200" fill="url(#tapis)"/>
      <rect x="44" y="226" width="168" height="188" fill="url(#carrelage)"/>
      <rect x="224" y="266" width="180" height="148" fill="url(#tomettes)"/>
      <!-- Les murs du plan, sous la loupe -->
      <rect x="212" y="40" width="12" height="380" fill="#2e2522"/>
      <rect x="30" y="214" width="182" height="12" fill="#2e2522"/>
      <rect x="224" y="254" width="194" height="12" fill="#2e2522"/>
      <!-- La lentille grossit le plan… -->
      <g clip-path="url(#lentille)">
        <g transform="translate(296 236) scale(1.45) translate(-296 -236)">
          <rect x="44" y="54" width="168" height="160" fill="url(#parquet)"/>
          <rect x="224" y="54" width="180" height="200" fill="url(#tapis)"/>
          <rect x="44" y="226" width="168" height="188" fill="url(#carrelage)"/>
          <rect x="224" y="266" width="180" height="148" fill="url(#tomettes)"/>
          <rect x="212" y="40" width="12" height="380" fill="#2e2522"/>
          <rect x="30" y="214" width="194" height="12" fill="#2e2522"/>
          <rect x="212" y="254" width="200" height="12" fill="#2e2522"/>
        </g>
        <!-- …et un témoin : le visage dans un médaillon -->
        <circle cx="296" cy="236" r="62" fill="#fff"/>
        <circle cx="296" cy="236" r="56" fill="#b49ad8"/>
        <path d="M250 286c3-22 22-30 46-30s43 8 46 30z" fill="#6b3fa0"/>
        <rect x="288" y="238" width="16" height="16" fill="#c98d68"/>
        <circle cx="296" cy="222" r="26" fill="#c98d68"/>
        <path d="M268 230c-3-20 9-34 28-34s31 14 28 34c-3-9-6-18-12-21-9 6-24 7-33 4-5 5-8 9-11 17z" fill="#2a1a14"/>
        <circle cx="296" cy="191" r="12" fill="#2a1a14"/>
        <circle cx="287" cy="224" r="3.4" fill="#2a1a12"/><circle cx="305" cy="224" r="3.4" fill="#2a1a12"/>
        <path d="M290 238q6 4 12 0" stroke="#7a3a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <circle cx="296" cy="236" r="112" fill="url(#reflet)"/>
      </g>
      <!-- Le manche, puis la monture en laiton -->
      <g transform="rotate(-45 296 236)">
        <rect x="278" y="354" width="36" height="34" rx="6" fill="#c9a24a"/>
        <rect x="282" y="384" width="28" height="118" rx="14" fill="#5a3820"/>
        <rect x="286" y="390" width="8" height="104" rx="4" fill="#7d5130"/>
      </g>
      <circle cx="296" cy="236" r="112" fill="none" stroke="#000" stroke-opacity=".3" stroke-width="34" transform="translate(6 8)"/>
      <circle cx="296" cy="236" r="112" fill="none" stroke="#d9b45a" stroke-width="26"/>
      <circle cx="296" cy="236" r="124" fill="none" stroke="#a8822a" stroke-width="3"/>
      <circle cx="296" cy="236" r="100" fill="none" stroke="#f3dc9a" stroke-width="3"/>
    </g>
    <g id="dessin"><rect width="512" height="512" fill="#1d2327"/><g transform="translate(26 20) scale(.92)"><use href="#trait"/></g></g>
  </defs>
</svg>
</body></html>
