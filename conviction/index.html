<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="text-scale" content="scale">
<title>Pièce à conviction</title>
<meta name="description" content="Enquêtes sur plan : placez chaque personne d'après son témoignage, une par ligne et par colonne, puis désignez le coupable.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d2327" media="(prefers-color-scheme: dark)">
<link rel="preload" href="polices/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="polices/atkinson-hyperlegible-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png" type="image/png">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="apple-mobile-web-app-title" content="Conviction">
<link rel="stylesheet" href="style.css">
<script type="module" src="ui/app.js"></script>
</head>
<body>
<main class="wrap accueil" id="accueil" hidden>
  <header class="titre-app">
    <h1 data-t="appName"></h1>
    <p class="compte" id="compte"></p>
  </header>
  <a class="une" id="une"></a>
  <div id="collections"></div>
  <p class="msg-scelle" id="msg-scelle" role="status" hidden></p>
  <div class="installer">
    <button type="button" class="btn principal" id="installer" data-t="installer" hidden></button>
    <p class="aide-installer" id="aide-installer" hidden></p>
  </div>
  <p class="version" id="version"></p>
</main>

<div class="wrap" id="jeu" hidden>
  <header class="case">
    <a class="retour" href="./" data-t-label="toutes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <div class="titres">
      <h1 id="titre"></h1>
      <p class="sous"><span id="eyebrow"></span> · <span class="sr" data-t="temps"></span><span id="chrono">0:00</span> · <span class="sr" data-t="indices"></span><svg class="ampoule" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="nb-indices">0</span></p>
    </div>
    <button type="button" class="btn icone" id="b-dossier" data-t-label="dossier"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.2l2 2h8.8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg></button>
    <details class="plus" id="plus">
      <summary class="btn icone" data-t-label="plus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg></summary>
      <div class="menu">
        <button type="button" class="btn" id="b-recommencer" data-t="recommencer"></button>
        <button type="button" class="btn" id="b-regles" data-t="regles"></button>
      </div>
    </details>
  </header>

  <div class="board">
    <section class="plan" aria-labelledby="etage">
      <h2 class="sr" id="etage"></h2>
      <div class="maquette"><div class="gridwrap" id="grille" role="grid"></div></div>

      <div class="choix" id="choix" role="group" data-t-label="personneAPlacer"></div>
      <p class="temoin vide" id="temoin"></p>

      <div class="tools">
        <div class="seg" role="group" data-t-label="mode">
          <button type="button" id="m-placer" aria-pressed="true" data-t="placer"></button>
          <button type="button" id="m-crayon" aria-pressed="false" data-t="crayon"></button>
          <button type="button" id="m-barrer" aria-pressed="false" data-t="barrer"></button>
        </div>
        <button type="button" class="btn icone" id="b-annuler" data-t-label="annuler"></button>
        <button type="button" class="btn icone" id="b-retablir" data-t-label="retablir"></button>
      </div>
      <div class="tools">
        <button type="button" class="btn principal" id="b-indice" data-t="indice"></button>
        <button type="button" class="btn" id="b-verifier" data-t="verifier"></button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>

      <div class="accuse" id="accuse" hidden>
        <h3 data-t="accuser"></h3>
        <p id="accuse-question"></p>
        <div class="acc" id="acc"></div>
        <div class="verdict" id="verdict" hidden></div>
      </div>
    </section>
  </div>
</div>
<dialog class="fiche dossier" id="dossier" aria-labelledby="d-titre">
  <div class="feuille">
    <button type="button" class="fermer" data-fermer data-t-label="fermer">×</button>
    <p class="k" id="d-k"></p>
    <h2 id="d-titre"></h2>
    <div class="vict" id="d-victime"></div>
    <p class="intro" id="intro"></p>
    <h3 data-t="temoignages"></h3>
    <div class="list" id="liste"></div>
    <h3 data-t="legende"></h3>
    <div class="legend" id="legende"></div>
    <h3 id="regles-bloc" data-t="regles"></h3>
    <ul class="regles" id="regles"></ul>
    <div class="cta"><button type="button" class="btn principal" id="b-ouvrir" data-fermer></button></div>
  </div>
</dialog>
<p class="erreur" id="erreur" hidden></p>
<div class="pawn ghost" id="fantome" aria-hidden="true" hidden></div>
<div class="toast" id="maj" role="status" hidden><span data-t="nouvelleVersion"></span><button type="button" class="btn principal" id="recharger" data-t="recharger"></button></div>
</body>
</html>
