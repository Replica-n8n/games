<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Icône du chevalier</title><style>
html,body{margin:0;padding:0;background:#fff}
.icone,.masquable{width:512px;height:512px}
.icone svg,.masquable svg{display:block;width:512px;height:512px}

<!-- Le blason de l'écran « Qui es-tu ? » avec le heaume du jeu, sur le vert forêt du voile de départ (#1f3d1c).
     Remplace le casque jaune sur damier (jusqu'à v77) : il ressemblait à un seau, et au chargement
     le damier formait un disque plus clair que le fond, plume coupée.
     tools/chevalier-icones.mjs photographie .icone (192 et 512, « any ») et
     .masquable (512, « maskable ») : Android découpe celle-ci en rond, et
     l'écran de chargement la pose sur `background_color` du manifeste. Son fond
     doit donc être EXACTEMENT cette couleur, et le dessin tenir dans le cercle
     central (rayon ~170 px sur 512), sinon on voit un disque collé au milieu. -->
