<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#fff}
.icone{width:512px;height:512px}
</style></head>
<body>
<div class="icone">
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pre" cx="42%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#9ad673"/>
      <stop offset="60%" stop-color="#83c766"/>
      <stop offset="100%" stop-color="#4f8f3e"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#pre)"/>

  <!-- le damier du sol, discret -->
  <g fill="#76bc57" opacity=".5">
    <rect x="0"   y="0"   width="64" height="64"/><rect x="128" y="0"   width="64" height="64"/>
    <rect x="256" y="0"   width="64" height="64"/><rect x="384" y="0"   width="64" height="64"/>
    <rect x="64"  y="64"  width="64" height="64"/><rect x="192" y="64"  width="64" height="64"/>
    <rect x="320" y="64"  width="64" height="64"/><rect x="448" y="64"  width="64" height="64"/>
    <rect x="0"   y="128" width="64" height="64"/><rect x="128" y="128" width="64" height="64"/>
    <rect x="256" y="128" width="64" height="64"/><rect x="384" y="128" width="64" height="64"/>
    <rect x="64"  y="192" width="64" height="64"/><rect x="192" y="192" width="64" height="64"/>
    <rect x="320" y="192" width="64" height="64"/><rect x="448" y="192" width="64" height="64"/>
    <rect x="0"   y="256" width="64" height="64"/><rect x="128" y="256" width="64" height="64"/>
    <rect x="256" y="256" width="64" height="64"/><rect x="384" y="256" width="64" height="64"/>
    <rect x="64"  y="320" width="64" height="64"/><rect x="192" y="320" width="64" height="64"/>
    <rect x="320" y="320" width="64" height="64"/><rect x="448" y="320" width="64" height="64"/>
    <rect x="0"   y="384" width="64" height="64"/><rect x="128" y="384" width="64" height="64"/>
    <rect x="256" y="384" width="64" height="64"/><rect x="384" y="384" width="64" height="64"/>
    <rect x="64"  y="448" width="64" height="64"/><rect x="192" y="448" width="64" height="64"/>
    <rect x="320" y="448" width="64" height="64"/><rect x="448" y="448" width="64" height="64"/>
  </g>

  <!-- deux bestioles, sombres, comme dans le jeu -->
  <g>
    <circle cx="404" cy="150" r="30" fill="#3f4a6b"/>
    <circle cx="396" cy="141" r="9" fill="#ffffff"/><circle cx="415" cy="144" r="9" fill="#ffffff"/>
    <circle cx="397" cy="142" r="4" fill="#11131f"/><circle cx="416" cy="145" r="4" fill="#11131f"/>
    <circle cx="108" cy="392" r="26" fill="#2f5d63"/>
    <circle cx="101" cy="384" r="8" fill="#ffffff"/><circle cx="117" cy="386" r="8" fill="#ffffff"/>
    <circle cx="102" cy="385" r="3.5" fill="#11131f"/><circle cx="118" cy="387" r="3.5" fill="#11131f"/>
  </g>

  <!-- le heaume, de face : ca se reconnait d'un coup d'oeil a 192 pixels -->
  <g>
    <ellipse cx="256" cy="436" rx="122" ry="26" fill="rgba(0,0,0,.20)"/>

    <!-- le plumet -->
    <path d="M 256 96 C 300 40, 372 44, 392 92 C 348 78, 300 92, 276 128 Z" fill="#ff6b3d"/>
    <path d="M 256 96 C 292 56, 344 58, 360 92 C 324 82, 292 96, 272 122 Z" fill="#ff8f5e"/>

    <!-- le heaume -->
    <path d="M 256 104
             C 340 104, 384 168, 384 250
             L 384 344
             C 384 396, 332 424, 256 424
             C 180 424, 128 396, 128 344
             L 128 250
             C 128 168, 172 104, 256 104 Z"
          fill="#ffc233" stroke="#c98f14" stroke-width="12" stroke-linejoin="round"/>

    <!-- la visiere -->
    <rect x="150" y="236" width="212" height="46" rx="20" fill="#20263a"/>
    <rect x="238" y="282" width="36" height="86" rx="16" fill="#20263a"/>
    <rect x="176" y="322" width="42" height="20" rx="10" fill="#20263a"/>
    <rect x="294" y="322" width="42" height="20" rx="10" fill="#20263a"/>

    <!-- un reflet, pour que ce soit du metal -->
    <path d="M 196 140 C 168 176, 160 216, 160 254 L 190 254 C 190 214, 200 176, 222 148 Z"
          fill="rgba(255,255,255,.45)"/>
  </g>

</svg>
</div>
</body></html>
