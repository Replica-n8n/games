<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Le chevalier</title>
<meta name="description" content="Un chevalier, une prairie, et beaucoup de bestioles. Sans publicité, sans achat, hors ligne.">
<meta name="theme-color" content="#4f8f3e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#83c766;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #jeu{position:fixed;inset:0;display:block;width:100%;height:100%}

  .voile{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:20px;box-sizing:border-box;
    background:rgba(20,32,14,.78);color:#fff;text-align:center;
  }
  .voile[hidden]{display:none}
  .titre{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.02em}
  .n{font-size:3.6rem;font-weight:800;line-height:1}
  .u{margin-top:8px;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
  .gros{
    font:inherit;font-size:1.35rem;font-weight:700;
    color:#1d3b12;background:#fff;border:0;border-radius:999px;
    padding:18px 48px;min-height:60px;
    box-shadow:0 10px 24px rgba(0,0,0,.38);cursor:pointer;
  }
  .gros:active{transform:translateY(2px)}

  #cartes{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
  /* l'interrupteur du mode d'essai : deux moities, celle qui est choisie est
     pleine. Assez gros pour un pouce, comme tout le reste. */
  /* les deux personnages, cote a cote, assez gros pour un pouce */
  #persos{display:flex;gap:12px;justify-content:center;margin:6px 0 20px;
    flex-wrap:wrap}
  .perso{flex:0 1 150px;padding:14px 10px;border-radius:20px;border:3px solid transparent;
    background:rgba(255,255,255,.12);color:#fff;cursor:pointer;text-align:center}
  .perso.pris{background:#fff;color:#243018;border-color:#ffd166}
  .perso .ic{font-size:2.6rem;line-height:1.1}
  .perso b{display:block;font-size:1.1rem;margin-top:2px}
  .perso span{display:block;font-size:.82rem;opacity:.8;line-height:1.25;margin-top:4px}
  .perso .sorts{font-size:1.2rem;letter-spacing:3px;margin-top:6px}

  .bascule{display:flex;gap:0;margin:0 auto 14px;max-width:320px;
    border-radius:999px;overflow:hidden;border:2px solid rgba(255,255,255,.35)}
  .bascule button{flex:1 1 0;padding:12px 8px;font:600 15px system-ui,-apple-system,sans-serif;
    border:0;background:transparent;color:#fff;cursor:pointer}
  .bascule button.pris{background:#ffd166;color:#243018}
  #essaiQuoi{margin:-8px auto 16px;max-width:320px;font-size:13px;
    line-height:1.35;opacity:.8}

  .carte{
    display:flex;align-items:center;gap:16px;
    background:#fffaf0;color:#20301a;border:0;border-radius:20px;
    padding:16px 18px;min-height:88px;text-align:left;font:inherit;
    box-shadow:0 8px 18px rgba(0,0,0,.32);cursor:pointer;
  }
  .carte:active{transform:translateY(2px)}
  .carte .ic{font-size:2.5rem;line-height:1;flex:0 0 auto;width:52px;text-align:center}
  .carte .t{flex:1 1 auto;min-width:0}
  .carte b{display:block;font-size:1.16rem;line-height:1.15}
  .carte span{display:block;font-size:.9rem;opacity:.72;margin-top:3px}
  .carte em{font-style:normal;font-weight:700;color:#a06a12}

  #menuBouton{
    position:fixed;top:10px;right:10px;z-index:3;
    width:46px;height:46px;border:0;border-radius:50%;
    background:rgba(0,0,0,.34);color:#fff;
    font:700 22px/1 system-ui,sans-serif;cursor:pointer;
  }
  #menuBouton[hidden]{display:none}
  #menu .gros{min-width:250px}
  #astuce{max-width:300px;font-size:.95rem;line-height:1.5;opacity:.85}
  #astuce[hidden]{display:none}

  #finTable{
    border-collapse:collapse;font-size:1.02rem;
    background:rgba(255,255,255,.08);border-radius:14px;overflow:hidden;
  }
  #finTable th,#finTable td{padding:9px 16px;text-align:left}
  #finTable th{font-weight:400;opacity:.7}
  #finTable td{font-weight:700;text-align:right}
  #finTable tr+tr{border-top:1px solid rgba(255,255,255,.12)}

  #roue canvas{width:min(78vw,320px);height:min(78vw,320px);display:block}
  #roueNom{min-height:2.6rem;display:flex;align-items:center;gap:12px}
  #roueNom .ic{font-size:2.2rem}
  #roueNom.vide{opacity:0}
</style>
</head>
<body>
<canvas id="jeu"></canvas>

<div id="depart" class="voile">
  <div class="titre">Qui es-tu ?</div>
  <div id="persos"></div>
  <button id="jouer" class="gros" type="button">Jouer</button>
</div>

<button id="menuBouton" type="button" aria-label="Menu">⋯</button>

<div id="menu" class="voile" hidden>
  <div class="u" id="menuVersion">version</div>
  <button id="installer" class="gros" type="button">Installer le jeu</button>
  <p id="astuce" hidden>Dans Chrome, les 3 points en haut à droite, puis « Ajouter à l'écran d'accueil ».</p>
  <div class="bascule" id="bascule">
    <button id="modeNormal" type="button">Normal</button>
    <button id="modeEssai" type="button">Tout voir</button>
  </div>
  <p id="essaiQuoi"></p>
  <button id="recommencer" class="gros" type="button">Recommencer</button>
  <button id="fermer" class="gros" type="button">Continuer</button>
</div>

<div id="roue" class="voile" hidden>
  <div class="u">Ton arme</div>
  <canvas id="roueDessin" width="620" height="620"></canvas>
  <div id="roueNom" class="titre vide"></div>
</div>

<div id="montee" class="voile" hidden>
  <div class="u">Choisis</div>
  <div id="cartes"></div>
</div>

<div id="fin" class="voile" hidden>
  <div>
    <div class="titre" id="finTitre">Perdu</div>
    <div class="n" id="finScore">0</div>
    <div class="u">graines ramassées</div>
  </div>
  <table id="finTable">
    <tr><th>Temps tenu</th><td id="finTemps">0:00</td></tr>
    <tr><th>Bestioles battues</th><td id="finTues">0</td></tr>
    <tr><th>Niveau atteint</th><td id="finNiveau">1</td></tr>
    <tr><th>Armes</th><td id="finArmes">-</td></tr>
  </table>
  <button id="rejouer" class="gros" type="button">Rejouer</button>
</div>

<script src="./bestioles.js"></script>
<script src="./meteo.js"></script>
<script src="./souvenirs.js"></script>
<script src="./mondes.js"></script>
<script src="./moteur.js"></script>
<script src="./armes.js"></script>
<script>
/* L'affichage.

   Il ne connait aucune regle : il lit l'etat que lui donne le moteur, le peint
   avec la palette du monde, et laisse les armes et les bestioles se dessiner
   elles memes. Ajouter une arme, une bestiole ou un monde ne doit rien changer
   ici. */
(function(){
  "use strict";

  /* ⚠️ Doit rester identique a VERSION dans sw.js : un essai le verifie.
     Affichee dans le menu, pour qu'on sache toujours ce qui tourne. */
  var VERSION = "chevalier-v27";

  var cv = document.getElementById("jeu"),
      ctx = cv.getContext("2d"),
      L = 0, H = 0, DPR = 1;

  var monde = Mondes.prairie,
      partie = null, armes = null, armeDeDepart = null,
      perso = Souvenirs.perso(),
      /* le mode d'essai, retenu : voir marqueEssai */
      enEssai = Souvenirs.essai(),
      camera = { x: 0, y: 0 },
      dernier = 0,
      enPause = true,
      choixEnCours = null;

  var ecranDepart = document.getElementById("depart"),
      ecranMontee = document.getElementById("montee"),
      ecranFin = document.getElementById("fin"),
      boiteCartes = document.getElementById("cartes"),
      finTitre = document.getElementById("finTitre"),
      finScore = document.getElementById("finScore");

  function demarrer(quoi, graine){
    monde = (typeof quoi === "string") ? Mondes.tous[quoi] : (quoi || monde);
    /* ce que les parties precedentes ont appris, invisible pour l'enfant */
    var appris = Souvenirs.reglage();
    partie = Moteur.creer({
      monde: monde,
      graine: graine || ((Date.now() % 100000) + 1),
      aide: appris.aide,
      legumeChaque: appris.legumeChaque
    });
    armes = Armes.creer(partie, perso);
    /* Une arme au hasard a chaque partie, comme dans un rogue lite : deux
       parties ne se ressemblent pas. ⚠️ Parmi les siennes a lui : un magicien
       ne doit jamais commencer avec une epee. */
    var possibles = armes.catalogue;
    armeDeDepart = possibles[Math.floor(partie.alea() * possibles.length)];
    armes.donner(armeDeDepart);
    camera.x = partie.joueur.x;
    camera.y = partie.joueur.y;
    choixEnCours = null;
    choixApres = 0;
    niveauxDus = 0;
    malus = null;
    dureeRetenue = false;
    ecranMontee.hidden = true;
    ecranFin.hidden = true;
    finProgrammee = null;
    manche.actif = false; manche.id = null;
    enPause = false;
    return partie;
  }

  function taille(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    L = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(L * DPR);
    cv.height = Math.round(H * DPR);
  }

  /* ---------------------------------------------------------- le decor */

  function sol(g, d, h, b){
    var pas = 48;
    ctx.fillStyle = monde.sol;
    var x0 = Math.floor(g / pas) * pas, y0 = Math.floor(h / pas) * pas;
    for(var x = x0; x < d + pas; x += pas){
      for(var y = y0; y < b + pas; y += pas){
        if(((Math.round(x / pas) + Math.round(y / pas)) & 1) === 0) continue;
        ctx.fillRect(x, y, pas, pas);
      }
    }
    ctx.strokeStyle = monde.ligne;
    ctx.globalAlpha = .45;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(var x2 = x0; x2 < d + pas; x2 += pas){ ctx.moveTo(x2, h); ctx.lineTo(x2, b); }
    for(var y2 = y0; y2 < b + pas; y2 += pas){ ctx.moveTo(g, y2); ctx.lineTo(d, y2); }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function haie(){
    ctx.strokeStyle = monde.haie;
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.arc(0, 0, partie.rayon, 0, 6.2832);
    ctx.stroke();
  }

  function buissons(g, d, h, b){
    var marge = 40;
    for(var i = 0; i < partie.obstacles.length; i++){
      var o = partie.obstacles[i];
      if(o.x < g - marge || o.x > d + marge || o.y < h - marge || o.y > b + marge) continue;
      monde.dessinerObstacle(ctx, o, o.x, o.y, o.r);
    }
  }

  function graines(g, d, h, b){
    var t = partie.temps;
    for(var i = 0; i < partie.graines.length; i++){
      var s = partie.graines[i];
      if(s.x < g - 20 || s.x > d + 20 || s.y < h - 20 || s.y > b + 20) continue;
      var r = s.r * (1 + .12 * Math.sin(t * 6 + s.x));
      /* dorees comme la barre d'experience qu'elles remplissent : une graine
         verte sur de l'herbe verte ne disait pas ce qu'elle faisait */
      ctx.globalAlpha = .3;
      ctx.fillStyle = "#ffe9a8";
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.3, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(60,40,0,.35)";
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 1.28, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "#ffd166";
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.beginPath(); ctx.arc(s.x - r * .3, s.y - r * .3, r * .34, 0, 6.2832); ctx.fill();
    }
  }

  /* Les objets au sol. Chacun se dessine differemment : un enfant doit savoir
     ce qu'il ramasse avant de marcher dessus. */
  function feuille(x, y, r, angle){
    ctx.fillStyle = "#3f8a3a";
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle || 0);
    ctx.beginPath();
    ctx.ellipse(0, 0, r * .5, r * .2, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  var DESSINS = {
    /* un coeur, pas une fraise : c'est un coeur qu'il rend */
    coeur: function(x, y, r){
      ctx.fillStyle = "#ff4d5e";
      ctx.beginPath();
      ctx.moveTo(x, y + r * .95);
      ctx.bezierCurveTo(x - r * 1.45, y - r * .35, x - r * .4, y - r * 1.2, x, y - r * .38);
      ctx.bezierCurveTo(x + r * .4, y - r * 1.2, x + r * 1.45, y - r * .35, x, y + r * .95);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.beginPath();
      ctx.ellipse(x - r * .38, y - r * .3, r * .2, r * .12, -0.6, 0, 6.2832);
      ctx.fill();
    },

    piment: function(x, y, r){
      ctx.fillStyle = "#d81e2c";
      ctx.beginPath();
      ctx.moveTo(x - r * .1, y - r * .5);
      ctx.quadraticCurveTo(x + r * .95, y - r * .1, x + r * .1, y + r);
      ctx.quadraticCurveTo(x - r * .5, y + r * .25, x - r * .1, y - r * .5);
      ctx.fill();
      ctx.strokeStyle = "#3f8a3a";
      ctx.lineWidth = Math.max(2, r * .22);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x - r * .1, y - r * .45);
      ctx.lineTo(x - r * .55, y - r * .85);
      ctx.stroke();
    },

    carotte: function(x, y, r){
      ctx.fillStyle = "#ff8c1a";
      ctx.beginPath();
      ctx.moveTo(x, y + r * 1.05);
      ctx.lineTo(x - r * .5, y - r * .45);
      ctx.lineTo(x + r * .5, y - r * .45);
      ctx.closePath();
      ctx.fill();
      feuille(x - r * .22, y - r * .62, r * 1.1, -0.7);
      feuille(x + r * .22, y - r * .62, r * 1.1, 0.7);
    },

    tomate: function(x, y, r){
      ctx.fillStyle = "#e8352f";
      ctx.beginPath(); ctx.arc(x, y + r * .1, r * .82, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.45)";
      ctx.beginPath(); ctx.arc(x - r * .3, y - r * .2, r * .18, 0, 6.2832); ctx.fill();
      feuille(x, y - r * .62, r * 1.1, 0);
      feuille(x, y - r * .62, r * 1.1, 1.2);
    },

    brocoli: function(x, y, r){
      ctx.fillStyle = "#2f8f4a";
      for(var i = 0; i < 5; i++){
        var a = i * 1.256;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * r * .38, y - r * .2 + Math.sin(a) * r * .3, r * .42, 0, 6.2832);
        ctx.fill();
      }
      ctx.fillStyle = "#a7d98a";
      ctx.fillRect(x - r * .18, y + r * .25, r * .36, r * .7);
    },

    pomme: function(x, y, r){
      ctx.fillStyle = "#d33b5c";
      ctx.beginPath(); ctx.arc(x - r * .28, y + r * .12, r * .6, 0, 6.2832); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * .28, y + r * .12, r * .6, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "#7a4a24";
      ctx.fillRect(x - r * .07, y - r * .85, r * .14, r * .5);
      feuille(x + r * .3, y - r * .78, r * .9, -0.5);
    },

    raisin: function(x, y, r){
      ctx.fillStyle = "#7b3fa0";
      var pos = [[0, -.3], [-.42, .05], [.42, .05], [-.2, .5], [.2, .5], [0, .1]];
      for(var i = 0; i < pos.length; i++){
        ctx.beginPath();
        ctx.arc(x + pos[i][0] * r, y + pos[i][1] * r, r * .3, 0, 6.2832);
        ctx.fill();
      }
      feuille(x + r * .1, y - r * .68, r * .9, -0.4);
    },
    coffre: function(x, y, r){
      ctx.fillStyle = "#a4622a";
      ctx.fillRect(x - r, y - r * .55, r * 2, r * 1.35);
      ctx.fillStyle = "#c87a35";
      ctx.beginPath();
      ctx.arc(x, y - r * .55, r, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "#ffd166";
      ctx.fillRect(x - r, y - r * .2, r * 2, r * .3);
      ctx.fillRect(x - r * .22, y - r * .55, r * .44, r * 1.35);
    },
    bombe: function(x, y, r){
      ctx.fillStyle = "#2b3550";
      ctx.beginPath(); ctx.arc(x, y + r * .15, r * .92, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = "#a4622a";
      ctx.lineWidth = r * .26;
      ctx.beginPath();
      ctx.moveTo(x + r * .45, y - r * .5);
      ctx.quadraticCurveTo(x + r * 1.1, y - r * 1.1, x + r * .7, y - r * 1.5);
      ctx.stroke();
      ctx.fillStyle = "#ff9f1c";
      ctx.beginPath(); ctx.arc(x + r * .68, y - r * 1.62, r * .3, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.arc(x - r * .3, y - r * .18, r * .2, 0, 6.2832); ctx.fill();
    },
    glace: function(x, y, r){
      ctx.strokeStyle = "#8fe6ff";
      ctx.lineWidth = r * .3;
      ctx.lineCap = "round";
      for(var i = 0; i < 3; i++){
        var a = i * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r);
        ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        ctx.stroke();
      }
      ctx.fillStyle = "#e8fbff";
      ctx.beginPath(); ctx.arc(x, y, r * .34, 0, 6.2832); ctx.fill();
    }
  };

  function objets(g, d, h, b){
    var t = partie.temps;
    for(var i = 0; i < partie.objets.length; i++){
      var o = partie.objets[i];
      if(o.x < g - 40 || o.x > d + 40 || o.y < h - 40 || o.y > b + 40) continue;
      var y = o.y + Math.sin(t * 3 + o.x) * 2.5;
      ctx.fillStyle = "rgba(0,0,0,.2)";
      ctx.beginPath(); ctx.ellipse(o.x, o.y + o.r, o.r * .8, o.r * .3, 0, 0, 6.2832); ctx.fill();
      /* le halo : ils doivent se voir de loin, c'est ce qui donne le rythme */
      ctx.globalAlpha = .32 + .14 * Math.sin(t * 4 + o.x);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(o.x, y, o.r * 2, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      (DESSINS[o.sorte] || DESSINS.coeur)(o.x, y, o.r);
    }
  }

  /* ce qui vient de souffler */
  function explosions(){
    for(var i = 0; i < partie.explosions.length; i++){
      var e = partie.explosions[i];
      var part = (partie.temps - e.debut) / e.duree;
      if(part < 0 || part > 1) continue;
      ctx.globalAlpha = (1 - part) * .45;
      ctx.fillStyle = "#ff7a3d";
      ctx.beginPath(); ctx.arc(e.x, e.y, e.rayon * (0.35 + part * 0.65), 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1 - part;
      ctx.strokeStyle = "#ffd166";
      ctx.lineWidth = 12 * (1 - part) + 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.rayon * (0.35 + part * 0.65), 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  /* ce que les bestioles envoient, et l'onde de la montee de niveau */
  function tirs(){
    for(var i = 0; i < partie.tirs.length; i++){
      var t = partie.tirs[i];
      ctx.fillStyle = "rgba(0,0,0,.2)";
      ctx.beginPath(); ctx.arc(t.x, t.y + 2, t.r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = t.couleur;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.beginPath(); ctx.arc(t.x - t.r * .3, t.y - t.r * .3, t.r * .34, 0, 6.2832); ctx.fill();
    }
  }

  function onde(){
    var o = partie.onde;
    if(!o) return;
    var part = (partie.temps - o.debut) / o.duree;
    if(part < 0 || part > 1){ partie.onde = null; return; }
    var j = partie.joueur;
    ctx.globalAlpha = (1 - part) * .55;
    ctx.fillStyle = "#ffe9a8";
    ctx.beginPath(); ctx.arc(j.x, j.y, o.rayon * part, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1 - part;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 10 * (1 - part) + 3;
    ctx.beginPath(); ctx.arc(j.x, j.y, o.rayon * part, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------------------- le chevalier */

  /* ⚠️ Les deux personnages sont CLAIRS ET CHAUDS, comme les armes : c'est ce
     qui garde la foule sombre lisible quand l'ecran se remplit. Le magicien
     n'echappe pas a la regle, meme si ses sorts sont bleus : c'est son
     chapeau et sa robe qui doivent ressortir, pas se fondre. */
  function corpsChevalier(r){
    ctx.fillStyle = "#f6ecd4";
    ctx.beginPath();
    ctx.arc(0, 0, r * .92, 0, 6.2832);
    ctx.fill();

    /* le heaume dore, tourne vers la marche */
    ctx.fillStyle = "#ffc233";
    ctx.beginPath();
    ctx.arc(r * .12, 0, r * .82, -2.1, 2.1);
    ctx.closePath();
    ctx.fill();

    /* la fente des yeux */
    ctx.fillStyle = "#20263a";
    ctx.fillRect(r * .46, -r * .34, r * .3, r * .68);

    /* le plumet */
    ctx.fillStyle = "#ff6b3d";
    ctx.beginPath();
    ctx.ellipse(-r * .5, -r * .78, r * .5, r * .24, -0.5, 0, 6.2832);
    ctx.fill();
  }

  /* Le magicien : une robe, une barbe, et surtout un GRAND CHAPEAU POINTU.
     C'est le chapeau qui le distingue du chevalier d'un coup d'oeil, meme
     quand tout bouge. */
  function corpsMagicien(r){
    /* la robe */
    ctx.fillStyle = "#f0e6ff";
    ctx.beginPath();
    ctx.arc(0, 0, r * .92, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = "#7b5cd6";
    ctx.beginPath();
    ctx.moveTo(-r * .95, r * .1);
    ctx.quadraticCurveTo(-r * .2, r * 1.15, r * .8, r * .45);
    ctx.quadraticCurveTo(r * .2, r * .95, -r * .95, r * .1);
    ctx.fill();

    /* la barbe blanche, devant */
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(r * .18, -r * .3);
    ctx.quadraticCurveTo(r * 1.15, 0, r * .18, r * .55);
    ctx.quadraticCurveTo(r * .5, r * .1, r * .18, -r * .3);
    ctx.fill();

    /* les yeux, sous le bord du chapeau */
    ctx.fillStyle = "#20263a";
    ctx.beginPath();
    ctx.arc(r * .34, -r * .3, r * .12, 0, 6.2832);
    ctx.arc(r * .34, r * .02, r * .12, 0, 6.2832);
    ctx.fill();

    /* le chapeau : un bord large, puis une pointe qui retombe en arriere */
    ctx.fillStyle = "#5b3fb0";
    ctx.beginPath();
    ctx.ellipse(r * .05, -r * .5, r * 1.05, r * .3, -0.25, 0, 6.2832);
    ctx.fill();
    ctx.fillStyle = "#7b5cd6";
    ctx.beginPath();
    ctx.moveTo(-r * .55, -r * .48);
    ctx.quadraticCurveTo(-r * .55, -r * 1.5, -r * 1.5, -r * 1.35);
    ctx.quadraticCurveTo(-r * .6, -r * 1.05, r * .35, -r * .62);
    ctx.fill();
    /* une etoile sur le chapeau */
    ctx.fillStyle = "#ffd166";
    etoileA(-r * .35, -r * .78, r * .26, 0.4);
    /* le pompon au bout */
    ctx.fillStyle = "#ffd166";
    ctx.beginPath();
    ctx.arc(-r * 1.45, -r * 1.33, r * .18, 0, 6.2832);
    ctx.fill();
  }

  /* une etoile a cinq branches, pour la couronne de l'invincibilite */
  function etoileA(x, y, r, tour){
    ctx.beginPath();
    for(var i = 0; i < 10; i++){
      var a = tour + i * (6.2832 / 10) - 1.5708;
      var d = (i % 2) ? r * .45 : r;
      var px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
      if(i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
  }

  function chevalier(){
    var j = partie.joueur, r = j.rayon, a = j.angle;
    /* les cinq reunis : il brille, et il balaye tout ce qu'il touche */
    if(partie.temps < partie.etoileJusqua){
      /* ⚠️ C'est la recompense des CINQ fruits, elle doit se voir de loin.
         Trois choses a la fois : une aura qui bat, deux anneaux qui partent
         vers l'exterieur comme une onde, et une couronne d'etoiles qui
         tourne. Le chevalier lui-meme change de couleur juste apres. */
      var pulse = 1 + .22 * Math.sin(partie.temps * 16);
      for(var e = ETOILE_TEINTES.length - 1; e >= 0; e--){
        ctx.globalAlpha = .12 + .07 * e;
        ctx.fillStyle = ETOILE_TEINTES[e];
        ctx.beginPath();
        ctx.arc(j.x, j.y, r * (4 - e * .5) * pulse, 0, 6.2832);
        ctx.fill();
      }
      /* deux ondes qui s'echappent, decalees d'une demi-periode */
      for(var w = 0; w < 2; w++){
        var phase = (partie.temps * 1.6 + w * .5) % 1;
        ctx.globalAlpha = (1 - phase) * .8;
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 6 * (1 - phase) + 1;
        ctx.beginPath();
        ctx.arc(j.x, j.y, r * (1.6 + phase * 3.2), 0, 6.2832);
        ctx.stroke();
      }
      ctx.globalAlpha = .95;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(j.x, j.y, r * 1.85 * pulse, 0, 6.2832); ctx.stroke();
      /* une couronne de six etoiles qui tourne autour de lui */
      for(var k = 0; k < 6; k++){
        var ak = partie.temps * 3 + k * 1.047;
        ctx.globalAlpha = .6 + .4 * Math.sin(partie.temps * 9 + k);
        ctx.fillStyle = ETOILE_TEINTES[k % ETOILE_TEINTES.length];
        etoileA(j.x + Math.cos(ak) * r * 2.9, j.y + Math.sin(ak) * r * 2.9,
                7, partie.temps * 4 + k);
      }
      ctx.globalAlpha = 1;
    }
    var clignote = partie.temps < j.invincibleJusqua &&
                   Math.floor(partie.temps * 12) % 2 === 0;
    ctx.globalAlpha = clignote ? .4 : 1;

    ctx.fillStyle = "rgba(0,0,0,.26)";
    ctx.beginPath();
    ctx.ellipse(j.x, j.y + r * .92, r * 1.02, r * .42, 0, 0, 6.2832);
    ctx.fill();

    ctx.save();
    ctx.translate(j.x, j.y);
    ctx.rotate(a);

    /* ⚠️ La cape appartient au PERSONNAGE, pas au dessin commun : le magicien
       gardait la cape rouge du chevalier derriere sa robe violette. */
    ctx.fillStyle = perso === "magicien" ? "#5b3fb0" : "#d94f2b";
    ctx.beginPath();
    ctx.ellipse(-r * .45, 0, r * 1.05, r * .95, 0, 0, 6.2832);
    ctx.fill();

    if(perso === "magicien") corpsMagicien(r);
    else corpsChevalier(r);

    ctx.restore();

    /* ⚠️ Il faut VOIR qu'on est freine. La glaire de la limace divisait la
       vitesse par deux sans le moindre signe sur le personnage : on croyait a
       un jeu qui rame. Mesure : on passe 1,2 % du temps freine, mais on y
       prend 5,4 % des coups — c'est le moment le plus dangereux de la partie,
       il ne peut pas etre le plus muet. */
    if(partie.temps < partie.freineJusqua){
      ctx.fillStyle = "rgba(46,143,108,.75)";
      for(var gl = 0; gl < 4; gl++){
        var ag = partie.temps * 2.2 + gl * 1.571;
        var pend = (Math.sin(partie.temps * 3 + gl * 1.9) + 1) / 2;
        ctx.beginPath();
        ctx.ellipse(j.x + Math.cos(ag) * r * .8,
                    j.y + r * .55 + pend * r * .5,
                    r * .17, r * (.22 + .18 * pend), 0, 0, 6.2832);
        ctx.fill();
      }
      ctx.strokeStyle = "rgba(46,143,108,.6)";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(j.x, j.y + r * .5, r * 1.15, r * .45, 0, 0, 6.2832);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function dessiner(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = monde.fond;
    ctx.fillRect(0, 0, L, H);

    ctx.save();
    ctx.translate(L / 2, H / 2);
    ctx.translate(-camera.x, -camera.y);

    var g = camera.x - L / 2, d = camera.x + L / 2,
        h = camera.y - H / 2, b = camera.y + H / 2;

    sol(g, d, h, b);
    haie();
    /* ⚠️ Le voile du temps se pose ICI, sur le sol et sous les bestioles :
       la nuit assombrit le decor, jamais ce qui peut tuer. */
    var temps = Meteo.TEMPS[partie.meteo.nom];
    if(temps && temps.teinte){
      ctx.fillStyle = temps.teinte;
      ctx.fillRect(g, h, d - g, b - h);
    }
    /* l'ombre des nuages qui passe sur le sol */
    if(temps && temps.dessinerOmbre){
      for(var w = 0; w < partie.ombres.length; w++){
        var om = partie.ombres[w];
        if(om.x < g - om.r - 40 || om.x > d + om.r + 40 ||
           om.y < h - om.r - 40 || om.y > b + om.r + 40) continue;
        temps.dessinerOmbre(ctx, om);
      }
    }
    /* ⚠️ La glace au sol se dessine MEME quand il ne neige plus : elle survit
       au temps qui l'a posee et fond au soleil. La dessiner seulement pendant
       la neige rendait la fonte invisible. */
    var dessinerGlace = (temps && temps.dessinerPlaque) ||
                        (Meteo.TEMPS.neige && Meteo.TEMPS.neige.dessinerPlaque);
    if(dessinerGlace){
      for(var q = 0; q < partie.plaques.length; q++){
        var pq = partie.plaques[q];
        if(pq.x < g - 160 || pq.x > d + 160 || pq.y < h - 160 || pq.y > b + 160) continue;
        dessinerGlace(ctx, pq);
      }
    }
    /* pendant la roue, on ne montre que la prairie : l'enfant voit son arme
       avant de voir ce qui l'attend */
    if(!ecranRoue.hidden){ ctx.restore(); return; }
    flaques(g, d, h, b);
    feu(g, d, h, b);
    semerEtincelles();
    dessinerEtincelles();
    graines(g, d, h, b);
    objets(g, d, h, b);
    buissons(g, d, h, b);

    var t = partie.temps;
    var gele = partie.temps < partie.gelJusqua;
    for(var i = 0; i < partie.bestioles.length; i++){
      var be = partie.bestioles[i];
      if(be.x < g - 40 || be.x > d + 40 || be.y < h - 40 || be.y > b + 40) continue;
      /* la nuit detache les bestioles du fond : un LISERE, pas un disque
         bleu, qui se confondait avec le gel. Voir meteo.js. */
      if(temps && temps.contour){
        ctx.strokeStyle = temps.contour;
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(be.x, be.y, be.rayon * 1.16, 0, 6.2832); ctx.stroke();
      }
      /* elle a froid : un halo bleu, et elle avance au ralenti */
      if(temps && temps.halo){
        ctx.fillStyle = temps.halo;
        ctx.beginPath();
        ctx.arc(be.x, be.y, be.rayon + 6, 0, 6.2832);
        ctx.fill();
      }
      /* ⚠️ GELEE PAR UN SORT. « Les ennemis touches ne sont pas ralentis et
         aucun halo bleu sur eux. » Ils l'etaient — ils s'arretaient net — mais
         RIEN ne le disait, et sur un escargot deja lent ca ne se voyait pas.
         Un effet qu'on ne voit pas n'existe pas. */
      if(be.geleJusqua > partie.temps){
        var reste = Math.min(1, (be.geleJusqua - partie.temps) / 0.6);
        ctx.globalAlpha = .5 + .3 * reste;
        ctx.fillStyle = "rgba(150,210,255,.75)";
        ctx.beginPath();
        ctx.arc(be.x, be.y, be.rayon + 8, 0, 6.2832);
        ctx.fill();
        /* des eclats de givre autour, qui scintillent */
        ctx.strokeStyle = "#dff2ff";
        ctx.lineWidth = 2.5;
        ctx.lineCap = "round";
        for(var eg = 0; eg < 6; eg++){
          var ag = eg * 1.047 + be.phase;
          var lg = be.rayon * (0.9 + 0.35 * Math.sin(t * 6 + eg));
          ctx.globalAlpha = (.45 + .45 * Math.sin(t * 5 + eg * 1.7)) * reste;
          ctx.beginPath();
          ctx.moveTo(be.x + Math.cos(ag) * be.rayon * .7,
                     be.y + Math.sin(ag) * be.rayon * .7);
          ctx.lineTo(be.x + Math.cos(ag) * lg * 1.35,
                     be.y + Math.sin(ag) * lg * 1.35);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      if(be.espece.dessiner) be.espece.dessiner(ctx, be, gele ? 0 : t);
      /* la glace en bleu, le souffle de la bombe en rouge : on voit ce qui
         leur arrive avant qu'elles ne tombent */
      if(be.brule){
        ctx.globalAlpha = .7;
        ctx.fillStyle = "#ff3b2f";
        ctx.beginPath(); ctx.arc(be.x, be.y, be.rayon * 1.25, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 1;
        continue;
      }
      if(!gele) continue;
      /* un vrai bloc de glace, a facettes : un rond bleu translucide ne
         disait pas que la bestiole etait figee */
      var rg = be.rayon * 1.55;
      ctx.globalAlpha = .78;
      ctx.fillStyle = "#bfe9ff";
      ctx.beginPath();
      ctx.moveTo(be.x, be.y - rg);
      ctx.lineTo(be.x + rg * .82, be.y - rg * .34);
      ctx.lineTo(be.x + rg * .62, be.y + rg * .86);
      ctx.lineTo(be.x - rg * .62, be.y + rg * .86);
      ctx.lineTo(be.x - rg * .82, be.y - rg * .34);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = .95;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.globalAlpha = .55;
      ctx.beginPath();
      ctx.moveTo(be.x - rg * .3, be.y - rg * .6);
      ctx.lineTo(be.x - rg * .1, be.y + rg * .5);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    tirs();
    explosions();
    if(temps && temps.dessinerFoudre){
      for(var fi = 0; fi < partie.foudres.length; fi++){
        var fo = partie.foudres[fi];
        if(!fo.frappee) temps.dessinerFoudre(ctx, fo, fo.tombe - partie.temps);
        else temps.dessinerEclair(ctx, fo, partie.temps - fo.tombe);
      }
    }
    chevalier();
    signeMalus();
    crachats();
    armes.dessiner(ctx);
    onde();
    ctx.restore();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    /* la pluie et les lucioles passent devant le jeu, mais derriere le HUD */
    if(temps && temps.devant) temps.devant(ctx, L, H, partie.temps);
    /* ⚠️ Tout l'ecran vire a l'or pendant l'invincibilite : c'est ce qui fait
       comprendre d'un coup d'oeil que ce moment n'est pas ordinaire. Le voile
       reste faible, sinon on ne verrait plus ce qui approche. */
    if(partie.temps < partie.etoileJusqua){
      var reste = partie.etoileJusqua - partie.temps;
      /* il clignote sur la derniere seconde et demie : l'enfant est prevenu
         que ca se termine, comme le preavis des bestioles */
      var force = reste < 1.5 ? (Math.sin(reste * 18) > 0 ? .16 : .04) : .12;
      ctx.fillStyle = "rgba(255,196,60," + force + ")";
      ctx.fillRect(0, 0, L, H);
    }
    hud();
    commandes();
    if(afficheMesure) compteur();
  }

  /* ------------------------------------------------------------- le HUD */

  function coeur(x, y, r, plein){
    ctx.fillStyle = plein ? "#ff4d5e" : "rgba(255,255,255,.28)";
    ctx.beginPath();
    ctx.moveTo(x, y + r * .85);
    ctx.bezierCurveTo(x - r * 1.3, y - r * .3, x - r * .35, y - r * 1.1, x, y - r * .35);
    ctx.bezierCurveTo(x + r * .35, y - r * 1.1, x + r * 1.3, y - r * .3, x, y + r * .85);
    ctx.fill();
  }

  /* ⚠️ « En cas de downgrade il faut que l'enfant le comprenne visuellement. »
     Trois choses en meme temps, parce qu'une seule passe inapercue :
     la pastille de l'arme touchee clignote en rouge, une fleche vers le bas
     monte depuis elle, et une banniere dit laquelle et a quel niveau elle
     tombe. C'est le seul moment du jeu ou l'on recule. */
  var malus = null;

  function montrerMalus(perdu){
    malus = perdu ? { perdu: perdu, ne: partie.temps } : null;
  }

  function banniereMalus(){
    if(!malus) return;
    var age = partie.temps - malus.ne;
    if(age > 2.2){ malus = null; return; }
    var monte = Math.min(1, age / .35);
    var part = age > 1.7 ? 1 - (age - 1.7) / .5 : 1;
    ctx.globalAlpha = Math.max(0, part);
    var y = 150 - (1 - monte) * 20;
    ctx.fillStyle = "rgba(120,20,40,.88)";
    var texte = malus.perdu.titre + "  niveau " + malus.perdu.niveau;
    ctx.font = "700 19px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    var l = ctx.measureText(texte).width + 74;
    arrondi(L / 2 - l / 2, y - 21, l, 42, 21);
    ctx.fill();
    ctx.fillStyle = "#ffd9e0";
    ctx.fillText(malus.perdu.emoji + " \u25bc " + texte, L / 2, y + 1);
    ctx.globalAlpha = 1;
  }

  function arrondi(x, y, l, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + l, y, x + l, y + h, r);
    ctx.arcTo(x + l, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + l, y, r);
    ctx.closePath();
  }

  function hud(){
    var j = partie.joueur, i;

    /* la barre d'experience, tout en haut, sur toute la largeur */
    var part = Math.max(0, Math.min(1, partie.xpNiveau / partie.xpProchain));
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(0, 0, L, 8);
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(0, 0, L * part, 8);

    /* les coeurs */
    for(i = 0; i < j.coeursMax; i++){
      coeur(20 + i * 22, 30, 9, i < j.coeurs);
    }

    /* les armes : sans elles, on ne sait pas ce qu'on a deja */
    ctx.font = "18px system-ui,-apple-system,sans-serif";
    ctx.textBaseline = "middle";
    for(i = 0; i < armes.armes.length; i++){
      var a = armes.armes[i], x = 14 + i * 32;
      /* celle qui vient d'etre retrogradee clignote en rouge */
      var frappee = malus && malus.perdu.nom === a.nom &&
                    partie.temps - malus.ne < 1.6;
      if(frappee){
        var bat = .5 + .5 * Math.sin((partie.temps - malus.ne) * 22);
        ctx.fillStyle = "rgba(214,40,70," + (.35 + .55 * bat) + ")";
        ctx.beginPath(); ctx.arc(x + 12, 62, 15 + 5 * bat, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = "#ff8fa3";
        ctx.lineWidth = 2;
        ctx.beginPath();
        var fy = 62 - 22 - 14 * (partie.temps - malus.ne);
        ctx.moveTo(x + 12, fy - 8); ctx.lineTo(x + 12, fy + 8);
        ctx.moveTo(x + 6, fy + 2); ctx.lineTo(x + 12, fy + 8);
        ctx.moveTo(x + 18, fy + 2); ctx.lineTo(x + 12, fy + 8);
        ctx.stroke();
      }
      ctx.fillStyle = "rgba(0,0,0,.32)";
      ctx.beginPath(); ctx.arc(x + 12, 62, 15, 0, 6.2832); ctx.fill();
      ctx.textAlign = "center";
      ctx.fillText(a.def.emoji, x + 12, 63);
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 10px system-ui,sans-serif";
      ctx.fillText(a.niveau, x + 24, 74);
      ctx.font = "18px system-ui,-apple-system,sans-serif";
    }

    cadran();
    panier();
    banniereMalus();
    marqueEssai();

    /* le chronometre */
    var reste = Math.max(0, partie.duree - partie.temps);
    var m = Math.floor(reste / 60), s = Math.floor(reste % 60);
    ctx.font = "700 20px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillText(m + ":" + (s < 10 ? "0" : "") + s, L / 2 + 1, 33);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(m + ":" + (s < 10 ? "0" : "") + s, L / 2, 32);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  /* ⚠️ Les etincelles de l'etoile. Elles vivent ICI et pas dans le moteur :
     c'est de la decoration pure, elle ne touche personne. Le moteur n'a pas a
     porter ce qui ne change rien au jeu. */
  var ETOILE_TEINTES = ["#fff0a8", "#ffd166", "#ff9f1c", "#7be0ff", "#ff7ad9", "#b8ff7a"];
  var etincelles = [];
  var prochaineEtincelle = 0;

  function semerEtincelles(){
    if(partie.temps >= partie.etoileJusqua){
      if(etincelles.length && partie.temps > prochaineEtincelle + 1) etincelles.length = 0;
      return;
    }
    if(partie.temps >= prochaineEtincelle){
      prochaineEtincelle = partie.temps + .035;
      var a = Math.random() * 6.2832, d = Math.random() * partie.joueur.rayon * 1.4;
      etincelles.push({
        x: partie.joueur.x + Math.cos(a) * d,
        y: partie.joueur.y + Math.sin(a) * d,
        vx: Math.cos(a) * 40, vy: Math.sin(a) * 40 - 30,
        ne: partie.temps,
        teinte: ETOILE_TEINTES[Math.floor(Math.random() * ETOILE_TEINTES.length)]
      });
    }
    for(var i = etincelles.length - 1; i >= 0; i--){
      if(partie.temps - etincelles[i].ne > .75) etincelles.splice(i, 1);
    }
  }

  function dessinerEtincelles(){
    for(var i = 0; i < etincelles.length; i++){
      var e = etincelles[i], age = (partie.temps - e.ne) / .75;
      if(age >= 1) continue;
      ctx.globalAlpha = 1 - age;
      ctx.fillStyle = e.teinte;
      var x = e.x + e.vx * age * .75, y = e.y + e.vy * age * .75 + age * age * 60;
      ctx.beginPath();
      ctx.arc(x, y, 4.5 * (1 - age * .6), 0, 6.2832);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ⚠️ Les deux flaques doivent se distinguer d'un coup d'oeil, sinon l'enfant
     ne peut pas choisir laquelle eviter. La glaire est verte et bouillonne ;
     l'acide est violet et porte une grosse fleche vers le bas, le meme signe
     que celui qui monte de l'arme touchee. Les deux palissent en fin de vie :
     on voit qu'elles vont partir. */
  function flaques(g, d, h, b){
    var vie = Moteur.REGLAGES.dureeFlaque;
    for(var i = 0; i < partie.flaques.length; i++){
      var f = partie.flaques[i];
      if(f.x < g - 80 || f.x > d + 80 || f.y < h - 80 || f.y > b + 80) continue;
      var reste = 1 - (partie.temps - f.ne) / vie;
      var acide = f.sorte === "acide";
      var jeune = Math.min(1, (partie.temps - f.ne) * 4);   /* elle s'etale */
      var fondu = Math.min(1, reste * 2.5);
      var large = f.r * (0.55 + 0.45 * jeune);

      /* ⚠️ ELLE DOIT SE LIRE COMME UN LIQUIDE. Dessinee en ronds verts qui se
         chevauchent, la glaire etait la copie exacte d'un buisson — meme
         construction, meme vert — et elle passait pour du decor : « j'ai vu
         des crachats tomber a terre mais jamais apparaitre en flaque ».
         Trois choses la distinguent maintenant : elle est BLEUE, elle est
         ECRASEE au sol, et elle BRILLE. Rien de tout ca n'arrive a un
         buisson. */
      ctx.globalAlpha = (acide ? .78 : .72) * fondu;
      ctx.fillStyle = acide ? "#6b21a8" : "#0e5f7a";
      ctx.beginPath();
      for(var k = 0; k < 7; k++){
        var a = f.i + k * (6.2832 / 7);
        var d2 = large * (0.32 + 0.14 * Math.sin(f.i * 3 + k * 2.1));
        var rr = large * (0.5 + 0.1 * Math.sin(f.i * 2 + k * 1.7));
        ctx.moveTo(f.x + Math.cos(a) * d2 + rr, f.y + Math.sin(a) * d2 * .42);
        ctx.arc(f.x + Math.cos(a) * d2, f.y + Math.sin(a) * d2 * .42, rr, 0, 6.2832);
      }
      ctx.fill();

      /* le bord mouille, qui accroche la lumiere */
      ctx.globalAlpha = .85 * fondu;
      ctx.strokeStyle = acide ? "#d4a5ff" : "#7fe6ff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(f.x, f.y, large * .92, large * .46, 0, 0, 6.2832);
      ctx.stroke();

      /* le reflet : une flaque renvoie le ciel, pas un buisson */
      ctx.globalAlpha = .55 * fondu;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.ellipse(f.x - large * .26, f.y - large * .16,
                  large * .3, large * .1, -0.3, 0, 6.2832);
      ctx.fill();

      if(acide){
        /* les bulles qui crevent : c'est autre chose que la glaire */
        ctx.fillStyle = "rgba(255,217,224,.7)";
        for(var jb = 0; jb < 5; jb++){
          var ac = f.i * 3 + jb * 1.27 + partie.temps * .9;
          var pulse = (Math.sin(partie.temps * 3 + jb * 2.1) + 1) / 2;
          ctx.globalAlpha = fondu * (0.3 + 0.5 * pulse);
          ctx.beginPath();
          ctx.arc(f.x + Math.cos(ac) * large * .42,
                  f.y + Math.sin(ac) * large * .22,
                  2 + 4 * pulse, 0, 6.2832);
          ctx.fill();
        }
      }else{
        /* des rides qui s'ecartent : ca bouge, donc c'est liquide */
        ctx.strokeStyle = "rgba(190,240,255,.5)";
        ctx.lineWidth = 2;
        for(var w = 0; w < 2; w++){
          var ph = ((partie.temps * .5 + w * .5 + f.i) % 1);
          ctx.globalAlpha = (1 - ph) * .5 * fondu;
          ctx.beginPath();
          ctx.ellipse(f.x, f.y, large * (.25 + ph * .6),
                      large * (.12 + ph * .3), 0, 0, 6.2832);
          ctx.stroke();
        }
      }
      ctx.globalAlpha = 1;
    }
  }

  /* Ce qui vole en cloche. Son ombre au sol dit OU ca va tomber : c'est le
     preavis, comme la boule du herisson. */
  function crachats(){
    for(var i = 0; i < partie.crachats.length; i++){
      var c = partie.crachats[i];
      var acide = c.sorte === "acide";
      ctx.fillStyle = "rgba(0,0,0,.22)";
      ctx.beginPath();
      ctx.ellipse(c.butX, c.butY, 22, 12, 0, 0, 6.2832);
      ctx.fill();
      ctx.strokeStyle = acide ? "rgba(190,140,255,.85)" : "rgba(127,230,255,.85)";
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.ellipse(c.butX, c.butY, 26, 14, 0, 0, 6.2832);
      ctx.stroke();
      ctx.setLineDash([]);
      /* la goutte en vol, de la couleur exacte de la flaque qu'elle va faire :
         on doit pouvoir anticiper laquelle des deux arrive */
      ctx.fillStyle = acide ? "#6b21a8" : "#0e5f7a";
      ctx.beginPath();
      ctx.arc(c.x, c.y - (c.haut || 0), 9, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = acide ? "rgba(212,165,255,.85)" : "rgba(127,230,255,.85)";
      ctx.beginPath();
      ctx.arc(c.x - 3, c.y - (c.haut || 0) - 3, 3.4, 0, 6.2832);
      ctx.fill();
    }
  }

  /* La trainee de feu du piment. Elle s'eteint par le bout le plus vieux :
     la flammee palit et retrecit a mesure qu'elle vieillit. */
  function feu(g, d, h, b){
    var vie = Moteur.REGLAGES.feuVie, R = Moteur.REGLAGES.feuRayon;
    for(var i = 0; i < partie.feux.length; i++){
      var f = partie.feux[i];
      if(f.x < g - 60 || f.x > d + 60 || f.y < h - 60 || f.y > b + 60) continue;
      var reste = 1 - (partie.temps - f.ne) / vie;
      if(reste <= 0) continue;
      var r = R * (0.45 + 0.55 * reste);
      var vacille = 1 + .12 * Math.sin(partie.temps * 11 + f.tourne * 5);
      ctx.globalAlpha = .30 * reste;
      ctx.fillStyle = "#ff7a18";
      ctx.beginPath(); ctx.arc(f.x, f.y, r * 1.35 * vacille, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = .62 * reste;
      ctx.fillStyle = "#ff9f1c";
      ctx.beginPath(); ctx.arc(f.x, f.y, r * .85 * vacille, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = .8 * reste;
      ctx.fillStyle = "#ffe9a8";
      ctx.beginPath(); ctx.arc(f.x, f.y, r * .38 * vacille, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ⚠️ « Je n'ai pas compris que j'avais un downgrade d'arme. » Le signal ne
     doit pas etre au sol ni dans un coin du HUD : il doit etre LA OU L'ENFANT
     REGARDE, c'est-a-dire sur son personnage. L'arme touchee monte au dessus
     de lui, en gros, avec une fleche vers le bas, et elle clignote. */
  function signeMalus(){
    if(!malus) return;
    var age = partie.temps - malus.ne;
    if(age > 2.4) return;
    var j = partie.joueur;
    var monte = Math.min(1, age / .3);
    var y = j.y - j.rayon - 34 - monte * 26 - Math.max(0, age - .3) * 6;
    var part = age > 1.9 ? 1 - (age - 1.9) / .5 : 1;
    var bat = .55 + .45 * Math.sin(age * 20);

    ctx.globalAlpha = Math.max(0, part);
    /* la pastille rouge qui bat */
    ctx.fillStyle = "rgba(200,30,60," + (.55 + .35 * bat) + ")";
    ctx.beginPath();
    ctx.arc(j.x, y, 26 + 3 * bat, 0, 6.2832);
    ctx.fill();
    /* l'arme touchee, en gros */
    ctx.font = "30px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(malus.perdu.emoji, j.x, y + 1);
    /* la fleche vers le bas, a cote */
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(j.x + 26, y - 12);
    ctx.lineTo(j.x + 40, y - 12);
    ctx.lineTo(j.x + 40, y + 1);
    ctx.lineTo(j.x + 47, y + 1);
    ctx.lineTo(j.x + 33, y + 17);
    ctx.lineTo(j.x + 19, y + 1);
    ctx.lineTo(j.x + 26, y + 1);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ⚠️ Le mode d'essai doit SE VOIR. Sans marque, on rejoue trois parties en
     se demandant pourquoi le jeu est devenu injouable. */
  function marqueEssai(){
    /* ⚠️ `Souvenirs.essai()` lit le stockage du telephone. Mesure dans Chrome :
       0,05 ms par seconde de jeu, donc ce n'etait pas un probleme — mais rien
       de synchrone n'a sa place dans la boucle de dessin, et un vieux telephone
       n'est pas un Chrome de bureau. On le retient. */
    if(!enEssai) return;
    ctx.font = "700 11px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    var texte = "TOUT VOIR";
    var l = ctx.measureText(texte).width;
    /* ⚠️ SOUS le bouton du menu, pas a cote : place en haut a droite, la
       pastille passait derriere le rond des trois points. */
    ctx.globalAlpha = .85;
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(L - l - 22, 76, l + 12, 18);
    ctx.fillStyle = "#243018";
    ctx.fillText(texte, L - 16, 80);
    ctx.globalAlpha = 1;
    ctx.textBaseline = "middle";
  }

  /* Les cinq fruits et legumes a reunir, en haut au centre.

     ⚠️ Ils sont visibles DES LE DEPART, en pale : un enfant doit comprendre
     qu'il y a quelque chose a chercher avant de l'avoir trouve. Une fois
     ramasses ils se colorient, et apres le super pouvoir ils redeviennent
     pales, ce qui dit tout seul « recommence ». */
  function panier(){
    /* ⚠️ L'ecart doit depasser le DIAMETRE de la pastille (r + 4), sinon les
       cinq se chevauchent et on ne les compte plus. */
    var n = Moteur.LEGUMES.length, r = 12, ecart = 38;
    var x0 = L / 2 - (n - 1) * ecart / 2, y = 96;
    for(var i = 0; i < n; i++){
      var nom = Moteur.LEGUMES[i], x = x0 + i * ecart;
      var pris = !!partie.panier[nom];
      ctx.globalAlpha = .3;
      ctx.fillStyle = "#000000";
      ctx.beginPath(); ctx.arc(x, y, r + 4, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = pris ? 1 : .34;
      (DESSINS[nom] || DESSINS.coeur)(x, y, r);
      ctx.globalAlpha = 1;
    }
  }

  /* Le cadran du temps, en haut a gauche. Il montre le temps qui vient une
     seconde avant qu'il arrive : on le voit tourner, puis le ciel change. */
  function cadran(){
    var x = 32, y = 120, r = 19;
    var annonce = partie.meteoProchaine;
    var nom = annonce ? annonce.nom : partie.meteo.nom;
    var t = Meteo.TEMPS[nom];
    if(!t || !t.icone) return;

    ctx.globalAlpha = .34;
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(x, y, r + 7, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;

    t.icone(ctx, x, y, r, partie.temps);

    /* pendant l'annonce, l'anneau se remplit : on voit le temps tourner */
    if(annonce){
      var part = 1 - Math.max(0, Math.min(1,
        (annonce.quand - partie.temps) / Moteur.REGLAGES.preavisMeteo));
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, r + 7, -Math.PI / 2, -Math.PI / 2 + part * 6.2832);
      ctx.stroke();
    }
  }

  /* -------------------------------------------------------------- le doigt

     Le manche flotte : il apparait la ou le pouce se pose. Il n'y a pas
     d'autre commande, les armes frappent toutes seules. */

  var RAYON_MANCHE = 46, SEUIL_MANCHE = 8, MARGE_BAS = 100, MARGE_COTE = 62,
      manche = { actif: false, id: null, ox: 0, oy: 0, x: 0, y: 0, angle: 0, tire: 0 };

  function repos(){ return { x: MARGE_COTE, y: H - MARGE_BAS, r: 34 }; }

  function doigtPose(e){
    e.preventDefault();
    if(manche.actif) return;
    manche.actif = true;
    manche.id = e.pointerId;
    manche.ox = manche.x = e.clientX;
    manche.oy = manche.y = e.clientY;
    manche.tire = 0;
  }

  function doigtBouge(e){
    if(!manche.actif || e.pointerId !== manche.id) return;
    manche.x = e.clientX;
    manche.y = e.clientY;
    var dx = manche.x - manche.ox, dy = manche.y - manche.oy;
    manche.tire = Math.hypot(dx, dy);
    if(manche.tire >= SEUIL_MANCHE) manche.angle = Math.atan2(dy, dx);
  }

  function doigtLeve(e){
    if(manche.actif && e.pointerId === manche.id){
      manche.actif = false; manche.id = null; manche.tire = 0;
    }
  }

  cv.addEventListener("pointerdown", doigtPose);
  window.addEventListener("pointermove", doigtBouge);
  window.addEventListener("pointerup", doigtLeve);
  window.addEventListener("pointercancel", doigtLeve);

  function anneau(x, y, r, fond, trait){
    ctx.globalAlpha = trait * .6;
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = fond;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = trait;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function pastille(x, y, r, a){
    ctx.globalAlpha = a * .4;
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(x, y + 1.5, r + 1.5, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function commandes(){
    if(manche.actif){
      var dx = manche.x - manche.ox, dy = manche.y - manche.oy, d = Math.hypot(dx, dy);
      if(d > RAYON_MANCHE){ dx = dx / d * RAYON_MANCHE; dy = dy / d * RAYON_MANCHE; }
      anneau(manche.ox, manche.oy, RAYON_MANCHE, .18, .34);
      pastille(manche.ox + dx, manche.oy + dy, 20, .88);
    }else{
      var r = repos();
      anneau(r.x, r.y, r.r, .10, .22);
      pastille(r.x, r.y, 14, .26);
    }
  }

  /* ------------------------------------------------------------- la roue

     Elle ne decide rien : la partie a deja tire son arme, la roue la montre.
     Un enfant doit voir avec quoi il commence, sinon il ne comprend pas
     pourquoi deux parties ne se jouent pas pareil. */

  var ecranRoue = document.getElementById("roue"),
      roueDessin = document.getElementById("roueDessin"),
      roueNom = document.getElementById("roueNom"),
      rc = roueDessin.getContext("2d"),
      roue = { tourne: false, debut: 0, duree: 2.8, fin: 0, nom: null, fait: null };

  var DUREE_ROUE = 2.8, PAUSE_ROUE = 1100;

  function segmentsDeLaRoue(){
    /* ⚠️ Les armes de CE personnage. Avec `Object.keys(Armes.CATALOGUE)`, la
       roue montrait les six : un magicien y voyait defiler l'epee, le bouclier
       et l'arc qu'il n'aura jamais. La roue doit dire la verite sur ce qui
       peut sortir. */
    var noms = (armes && armes.catalogue) || Armes.PERSOS[perso].armes;
    return noms.concat(noms);          /* deux tours d'armes : six parts */
  }

  function lancerRoue(nom, apres){
    var parts = segmentsDeLaRoue();
    var i = parts.indexOf(nom);
    var pas = Math.PI * 2 / parts.length;
    var centre = i * pas + pas / 2;
    roue.nom = nom;
    roue.fait = apres;
    roue.debut = performance.now();
    roue.fin = (-Math.PI / 2 - centre) + Math.PI * 2 * 5;   /* cinq tours */
    roue.tourne = true;
    roueNom.className = "titre vide";
    roueNom.innerHTML = "";
    ecranRoue.hidden = false;
    dessinerRoue(0);
  }

  function finirRoue(){
    if(!roue.tourne) return;
    roue.tourne = false;
    var def = Armes.CATALOGUE[roue.nom];
    roueNom.className = "titre";
    roueNom.innerHTML = '<span class="ic">' + def.emoji + '</span>' + def.nom;
    var suite = roue.fait;
    roue.fait = null;
    setTimeout(function(){
      ecranRoue.hidden = true;
      if(suite) suite();
    }, PAUSE_ROUE);
  }

  function dessinerRoue(part){
    var parts = segmentsDeLaRoue();
    var pas = Math.PI * 2 / parts.length;
    var rot = roue.fin * (1 - Math.pow(1 - part, 3));      /* vite, puis lentement */
    var L2 = roueDessin.width / 2, R2 = L2 - 34;

    rc.clearRect(0, 0, roueDessin.width, roueDessin.height);
    rc.save();
    rc.translate(L2, L2);
    rc.rotate(rot);
    for(var i = 0; i < parts.length; i++){
      var def = Armes.CATALOGUE[parts[i]];
      rc.fillStyle = i % 2 ? def.couleur : ombrer(def.couleur);
      rc.beginPath();
      rc.moveTo(0, 0);
      rc.arc(0, 0, R2, i * pas, (i + 1) * pas);
      rc.closePath();
      rc.fill();
      rc.strokeStyle = "rgba(0,0,0,.18)";
      rc.lineWidth = 3;
      rc.stroke();
      /* l'arme, toujours droite pour rester lisible */
      var a = i * pas + pas / 2;
      rc.save();
      rc.translate(Math.cos(a) * R2 * .66, Math.sin(a) * R2 * .66);
      rc.rotate(-rot);
      rc.font = "64px system-ui,-apple-system,sans-serif";
      rc.textAlign = "center";
      rc.textBaseline = "middle";
      rc.fillText(def.emoji, 0, 0);
      rc.restore();
    }
    rc.restore();

    /* le moyeu et le pointeur */
    rc.fillStyle = "#20301a";
    rc.beginPath(); rc.arc(L2, L2, 44, 0, 6.2832); rc.fill();
    rc.fillStyle = "#ffd166";
    rc.beginPath(); rc.arc(L2, L2, 30, 0, 6.2832); rc.fill();
    rc.strokeStyle = "#ffffff";
    rc.lineWidth = 10;
    rc.beginPath(); rc.arc(L2, L2, R2 + 8, 0, 6.2832); rc.stroke();
    rc.fillStyle = "#ffffff";
    rc.beginPath();
    rc.moveTo(L2, 40);
    rc.lineTo(L2 - 26, 0);
    rc.lineTo(L2 + 26, 0);
    rc.closePath();
    rc.fill();
  }

  function ombrer(couleur){
    /* une teinte plus sombre, pour que les parts se distinguent */
    var n = parseInt(couleur.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * .52),
        v = Math.round(((n >> 8) & 255) * .52),
        b = Math.round((n & 255) * .52);
    return "rgb(" + r + "," + v + "," + b + ")";
  }

  function imageRoue(maintenant){
    if(!roue.tourne) return;
    var part = Math.min(1, (maintenant - roue.debut) / 1000 / DUREE_ROUE);
    dessinerRoue(part);
    if(part >= 1) finirRoue();
  }

  /* on touche, on abrege : au bout de vingt parties, l'attente lasse */
  ecranRoue.addEventListener("pointerdown", function(){
    if(roue.tourne){ dessinerRoue(1); finirRoue(); }
  });

  /* --------------------------------------------------- monter de niveau */

  function montrerChoix(){
    if(niveauxDus > 0) niveauxDus--;
    var choix = armes.propositions(3);
    if(!choix.length){                       /* tout est deja au maximum */
      niveauxDus = 0;
      enPause = false;
      dernier = 0;
      return;
    }
    choixEnCours = choix;
    boiteCartes.innerHTML = "";
    choix.forEach(function(c, i){
      var b = document.createElement("button");
      b.className = "carte";
      b.type = "button";
      b.setAttribute("data-choix", i);
      /* la carte dit ce que CE niveau change, pas ce que l'arme fait en
         general : sinon « Epee niveau 3 » ne veut rien dire */
      b.innerHTML = '<span class="ic">' + c.def.emoji + '</span>' +
        '<span class="t"><b>' + c.def.nom +
        (c.niveau > 1 ? ' <em>niveau ' + c.niveau + '</em>' : '') +
        '</b><span>' + Armes.resume(c) + '</span></span>';
      b.addEventListener("click", function(){
        armes.appliquer(choixEnCours[i]);
        choixEnCours = null;
        ecranMontee.hidden = true;
        if(niveauxDus > 0){ montrerChoix(); return; }   /* il en reste un du */
        enPause = false;
        dernier = 0;
      });
      boiteCartes.appendChild(b);
    });
    ecranMontee.hidden = false;
    enPause = true;
  }

  /* --------------------------------------------------------- fin de partie */

  var finProgrammee = null, DELAI_FIN = 900;
  var choixApres = 0, ATTENTE_ONDE = 0.6, niveauxDus = 0;

  var dureeRetenue = false;

  function montrerFin(){
    /* on retient la duree de cette partie, une seule fois, pour regler la
       suivante. Rien ne sort du telephone. */
    if(!dureeRetenue){
      dureeRetenue = true;
      Souvenirs.ajouter(partie.temps);
    }
    finTitre.textContent = partie.gagne ? "Gagné !" : "Perdu";
    finScore.textContent = partie.xp.toLocaleString("fr-FR");
    var s = Math.floor(partie.temps), m = Math.floor(s / 60);
    document.getElementById("finTemps").textContent =
      m + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
    document.getElementById("finTues").textContent = partie.tues.toLocaleString("fr-FR");
    document.getElementById("finNiveau").textContent = partie.niveau;
    document.getElementById("finArmes").textContent =
      armes.armes.map(function(a){ return a.def.emoji + a.niveau; }).join(" ") || "-";
    ecranFin.hidden = false;
  }

  /* On prepare la partie, la roue montre l'arme tiree, et le jeu ne demarre
     qu'apres : l'enfant voit avec quoi il part avant de voir les bestioles. */
  function partirEnJeu(){
    if(finProgrammee){ clearTimeout(finProgrammee); finProgrammee = null; }
    demarrer(monde);
    enPause = true;
    lancerRoue(armeDeDepart, function(){
      enPause = false;
      dernier = 0;
    });
  }

  document.getElementById("rejouer").addEventListener("click", partirEnJeu);

  document.getElementById("jouer").addEventListener("click", function(){
    ecranDepart.hidden = true;
    partirEnJeu();
  });

  /* ------------------------------------------------------------- le menu

     L'invitation d'installation de Chrome n'apparait qu'une fois, et jamais
     si elle a ete ignoree. On la garde sous la main et on la propose ici.
     Si le navigateur ne la donne pas, on dit ou la trouver : mieux vaut une
     phrase dans un menu qu'un jeu qu'on ne peut pas installer. */

  var ecranMenu = document.getElementById("menu"),
      boutonMenu = document.getElementById("menuBouton"),
      boutonInstaller = document.getElementById("installer"),
      astuce = document.getElementById("astuce"),
      invitation = null,
      pauseAvantMenu = false;

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    invitation = e;
  });
  window.addEventListener("appinstalled", function(){
    invitation = null;
    boutonInstaller.hidden = true;
  });

  document.getElementById("menuVersion").textContent = VERSION;

  boutonMenu.addEventListener("click", function(){
    pauseAvantMenu = enPause;
    enPause = true;
    astuce.hidden = true;
    ecranMenu.hidden = false;
  });

  document.getElementById("fermer").addEventListener("click", function(){
    ecranMenu.hidden = true;
    enPause = pauseAvantMenu;
    dernier = 0;
  });

  /* ⚠️ « Je n'ai pas envie d'attendre six minutes pour rencontrer la limace et
     le scarabee. » Le mode « Tout voir » fait arriver TOUTES les bestioles des
     la premiere seconde, y compris celles qui attendaient un niveau. Il est
     garde d'une fois sur l'autre, il se voit pendant la partie, et surtout une
     partie d'essai NE COMPTE PAS dans les souvenirs qui reglent la difficulte
     (voir souvenirs.js) : sinon quelques parties d'essai, ou l'on meurt en une
     minute, adouciraient le vrai jeu pour de bon. */
  /* ⚠️ Le personnage se choisit AVANT la roue : la roue tire ensuite parmi SES
     armes a lui. Le choix se garde d'une fois sur l'autre, parce qu'un enfant
     qui aime le magicien ne veut pas le rechoisir a chaque partie. */
  var boitePersos = document.getElementById("persos");

  function dessinerChoixPersos(){
    boitePersos.innerHTML = "";
    Object.keys(Armes.PERSOS).forEach(function(nom){
      var d = Armes.PERSOS[nom];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "perso" + (nom === perso ? " pris" : "");
      b.setAttribute("data-perso", nom);
      b.innerHTML = '<div class="ic">' + d.emoji + '</div><b>' + d.nom + '</b>' +
        '<span>' + d.dit + '</span><div class="sorts">' +
        d.armes.map(function(a){ return Armes.CATALOGUE[a].emoji; }).join(" ") +
        '</div>';
      b.addEventListener("click", function(){
        choisirPerso(nom);
      });
      boitePersos.appendChild(b);
    });
  }

  function choisirPerso(nom){
    if(!Armes.PERSOS[nom]) return;
    perso = nom;
    Souvenirs.reglerPerso(nom);
    dessinerChoixPersos();
  }

  var modeNormal = document.getElementById("modeNormal"),
      modeEssai = document.getElementById("modeEssai"),
      essaiQuoi = document.getElementById("essaiQuoi");

  function montrerBascule(){
    var actif = enEssai;
    modeNormal.classList.toggle("pris", !actif);
    modeEssai.classList.toggle("pris", actif);
    essaiQuoi.textContent = actif
      ? "Toutes les bestioles arrivent tout de suite, limace et lucane compris. Ces parties ne comptent pas."
      : "Les bestioles arrivent au fil des minutes, comme prévu.";
  }

  function choisirMode(actif){
    if(enEssai === actif) return;
    enEssai = Souvenirs.reglerEssai(actif);
    Bestioles.reglerEssai(actif);
    montrerBascule();
    /* le changement ne prend qu'a la partie suivante : on relance tout de
       suite plutot que de laisser croire qu'il ne s'est rien passe */
    ecranMenu.hidden = true;
    partirEnJeu();
  }

  modeNormal.addEventListener("click", function(){ choisirMode(false); });
  modeEssai.addEventListener("click", function(){ choisirMode(true); });

  Bestioles.reglerEssai(enEssai);
  montrerBascule();
  dessinerChoixPersos();

  document.getElementById("recommencer").addEventListener("click", function(){
    ecranMenu.hidden = true;
    partirEnJeu();
  });

  boutonInstaller.addEventListener("click", function(){
    if(!invitation){ astuce.hidden = false; return; }
    invitation.prompt();
    invitation.userChoice.then(function(){
      invitation = null;
      boutonInstaller.hidden = true;
      ecranMenu.hidden = true;
      enPause = pauseAvantMenu;
      dernier = 0;
    });
  });

  /* ------------------------------------------------------------ la mesure */

  var horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 }, bilan = null;

  function chronometrer(dt, t0, t1, t2){
    horloge.n++; horloge.dt += dt;
    horloge.moteur += t1 - t0;
    horloge.dessin += t2 - t1;
    if(horloge.n < 120) return;
    bilan = {
      images: Math.round(horloge.n / horloge.dt),
      moteur: +(horloge.moteur / horloge.n).toFixed(2),
      dessin: +(horloge.dessin / horloge.n).toFixed(2),
      bestioles: partie.bestioles.length,
      graines: partie.graines.length,
      projectiles: armes.projectiles.length
    };
    horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 };
  }

  function compteur(){
    if(!bilan) return;
    ctx.globalAlpha = .55;
    ctx.fillStyle = "#000000";
    ctx.fillRect(8, 84, 196, 44);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffffff";
    ctx.font = "600 12px system-ui,-apple-system,sans-serif";
    ctx.fillText(bilan.images + " images/s   " + bilan.bestioles + " bestioles", 18, 102);
    ctx.fillText("moteur " + bilan.moteur + " ms   dessin " + bilan.dessin + " ms", 18, 120);
  }

  /* ------------------------------------------------------------- la boucle */

  function image(maintenant){
    var dt = Math.min(1 / 20, (maintenant - dernier) / 1000 || 0);
    dernier = maintenant;
    imageRoue(maintenant);
    var t0 = performance.now();

    if(!enPause && partie){
      partie.commander({
        angle: manche.angle,
        avance: manche.actif && manche.tire >= SEUIL_MANCHE
      });
      var faits = partie.pas(dt);
      armes.pas(dt);

      for(var i = 0; i < faits.length; i++){
        /* Un ecran de choix PAR niveau gagne : un coffre peut en faire gagner
           trois d'un coup, et deux cartes disparaissaient en silence.
           L'onde souffle les bestioles ; les cartes attendent qu'elle soit
           passee, sinon on ne la voit pas. */
        if(faits[i].type === "malus"){
          /* le tirage du moteur, pas Math.random : une partie doit rester
             rejouable a l'identique */
          montrerMalus(armes.retrograder(partie.alea));
          continue;
        }
        if(faits[i].type !== "niveau") continue;
        niveauxDus++;
        if(!choixApres) choixApres = partie.temps + ATTENTE_ONDE;
      }
      var k = Math.min(1, dt * 10);
      camera.x += (partie.joueur.x - camera.x) * k;
      camera.y += (partie.joueur.y - camera.y) * k;

      if(partie.fini && ecranFin.hidden && !finProgrammee){
        finProgrammee = setTimeout(function(){ finProgrammee = null; montrerFin(); }, DELAI_FIN);
      }else if(choixApres && partie.temps >= choixApres && !partie.fini){
        choixApres = 0;
        montrerChoix();
      }
    }

    var t1 = performance.now();
    if(partie) dessiner();
    if(partie && !enPause) chronometrer(dt, t0, t1, performance.now());
    requestAnimationFrame(image);
  }

  var afficheMesure = new URLSearchParams(location.search).get("mesure") === "1";
  window.addEventListener("resize", taille);
  taille();
  demarrer(Mondes.prairie);
  enPause = true;              /* on attend le bouton Jouer */
  requestAnimationFrame(image);

  /* pour les scripts de controle */
  window.jeu = {
    version: VERSION,
    taille: function(){ return [L, H]; },
    partie: function(){ return partie; },
    armes: function(){ return armes; },
    monde: function(){ return monde; },
    meteo: function(){ return partie.meteo; },
    changerLeTemps: function(nom){
      /* on passe par le moteur : c'est lui qui seme la glace et arme la
         foudre. Un raccourci qui posait juste le nom mentait. */
      partie.changerMeteo(nom);
      partie.meteo.jusqua = partie.temps + 999;
      return nom;
    },
    armeDeDepart: function(){ return armeDeDepart; },
    roue: function(){
      return {
        visible: !ecranRoue.hidden,
        tourne: roue.tourne,
        montre: roueNom.textContent,
        nom: roue.nom
      };
    },
    tournerLaRoue: function(){
      ecranDepart.hidden = true;
      partirEnJeu();
      return armeDeDepart;
    },
    reglages: function(){ return { valeurs: Moteur.REGLAGES }; },
    mesure: function(){ return bilan; },
    souvenirs: function(){ return Souvenirs.reglage(); },
    essai: function(){ return enEssai; },
    perso: function(){ return perso; },
    choisirPerso: choisirPerso,
    choisirMode: choisirMode,
    commencer: function(graine){
      ecranDepart.hidden = true;
      demarrer(monde, graine);
      dernier = 0;
      return true;
    },
    ecrans: function(){
      return {
        niveauxDus: niveauxDus,
        depart: !ecranDepart.hidden,
        montee: !ecranMontee.hidden,
        roue: !ecranRoue.hidden,
        fin: !ecranFin.hidden,
        menu: !ecranMenu.hidden,
        astuce: !astuce.hidden,
        pause: enPause,
        cartes: choixEnCours ? choixEnCours.length : 0
      };
    },
    menu: function(quoi){
      var b = document.getElementById(quoi);
      if(b) b.click();
      return !!b;
    },
    choisir: function(i){
      var b = boiteCartes.querySelector('[data-choix="' + i + '"]');
      if(b) b.click();
      return !!b;
    }
  };
  window.serpentin = window.jeu;   /* l'ancien nom, pour les scripts existants */
})();

/* La mise a jour.

   ⚠️ Sans ca, une version installee sert son cache indefiniment : elle a joue
   pendant deux corrections sans les avoir. Le nouveau service worker prend la
   main tout seul (skipWaiting et claim), mais la page DEJA CHARGEE garde son
   ancien code en memoire. On la recharge donc une fois, au moment precis ou
   le nouveau prend le controle. */
if("serviceWorker" in navigator){
  var rechargeFaite = false;
  /* ⚠️ A la toute PREMIERE visite il n'y a pas encore de controleur : quand
     le service worker prend la main, il n'y a rien de perime a recharger, et
     recharger la relancait au milieu de sa premiere partie. On ne recharge
     donc que s'il y en avait deja un, c'est a dire pour une mise a jour. */
  var avaitUnControleur = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(rechargeFaite || !avaitUnControleur) return;
    rechargeFaite = true;
    location.reload();
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      reg.update();          /* on demande tout de suite s'il y a du neuf */
    });
  });
}
</script>
