<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Le chevalier</title>
<meta name="description" content="Un chevalier, une prairie, et beaucoup de bestioles. Sans publicité, sans achat, hors ligne.">
<meta name="theme-color" content="#4f8f3e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#83c766;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #jeu{position:fixed;inset:0;display:block;width:100%;height:100%}

  .voile{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:20px;box-sizing:border-box;
    background:rgba(20,32,14,.78);color:#fff;text-align:center;
  }
  .voile[hidden]{display:none}
  .titre{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.02em}
  .n{font-size:3.6rem;font-weight:800;line-height:1}
  .u{margin-top:8px;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
  .gros{
    font:inherit;font-size:1.35rem;font-weight:700;
    color:#1d3b12;background:#fff;border:0;border-radius:999px;
    padding:18px 48px;min-height:60px;
    box-shadow:0 10px 24px rgba(0,0,0,.38);cursor:pointer;
  }
  .gros:active{transform:translateY(2px)}

  #cartes{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
  .carte{
    display:flex;align-items:center;gap:16px;
    background:#fffaf0;color:#20301a;border:0;border-radius:20px;
    padding:16px 18px;min-height:88px;text-align:left;font:inherit;
    box-shadow:0 8px 18px rgba(0,0,0,.32);cursor:pointer;
  }
  .carte:active{transform:translateY(2px)}
  .carte .ic{font-size:2.5rem;line-height:1;flex:0 0 auto;width:52px;text-align:center}
  .carte .t{flex:1 1 auto;min-width:0}
  .carte b{display:block;font-size:1.16rem;line-height:1.15}
  .carte span{display:block;font-size:.9rem;opacity:.72;margin-top:3px}
  .carte em{font-style:normal;font-weight:700;color:#a06a12}
</style>
</head>
<body>
<canvas id="jeu"></canvas>

<div id="depart" class="voile">
  <div class="titre">Le chevalier</div>
  <button id="jouer" class="gros" type="button">Jouer</button>
</div>

<div id="montee" class="voile" hidden>
  <div class="u">Choisis</div>
  <div id="cartes"></div>
</div>

<div id="fin" class="voile" hidden>
  <div>
    <div class="titre" id="finTitre">Perdu</div>
    <div class="n" id="finScore">0</div>
    <div class="u">points</div>
  </div>
  <button id="rejouer" class="gros" type="button">Rejouer</button>
</div>

<script src="./bestioles.js"></script>
<script src="./mondes.js"></script>
<script src="./moteur.js"></script>
<script src="./armes.js"></script>
<script>
/* L'affichage.

   Il ne connait aucune regle : il lit l'etat que lui donne le moteur, le peint
   avec la palette du monde, et laisse les armes et les bestioles se dessiner
   elles memes. Ajouter une arme, une bestiole ou un monde ne doit rien changer
   ici. */
(function(){
  "use strict";

  var cv = document.getElementById("jeu"),
      ctx = cv.getContext("2d"),
      L = 0, H = 0, DPR = 1;

  var monde = Mondes.prairie,
      partie = null, armes = null,
      camera = { x: 0, y: 0 },
      dernier = 0,
      enPause = true,
      choixEnCours = null;

  var ecranDepart = document.getElementById("depart"),
      ecranMontee = document.getElementById("montee"),
      ecranFin = document.getElementById("fin"),
      boiteCartes = document.getElementById("cartes"),
      finTitre = document.getElementById("finTitre"),
      finScore = document.getElementById("finScore");

  /* Reglage a chaud pour les essais sur le telephone : n'importe quelle valeur
     de REGLAGES se remplace par un parametre d'adresse, ...?vitesse=190 */
  function reglagesDeLAdresse(){
    var q = new URLSearchParams(location.search), faits = {};
    q.forEach(function(valeur, cle){
      if(!(cle in Moteur.REGLAGES)) return;
      var n = parseFloat(valeur);
      if(isNaN(n)) return;
      Moteur.REGLAGES[cle] = n;
      faits[cle] = n;
    });
    return faits;
  }

  function demarrer(quoi, graine){
    monde = (typeof quoi === "string") ? Mondes.tous[quoi] : (quoi || monde);
    partie = Moteur.creer({
      monde: monde,
      graine: graine || ((Date.now() % 100000) + 1)
    });
    armes = Armes.creer(partie);
    armes.donner("epee");          /* on ne commence jamais les mains vides */
    camera.x = partie.joueur.x;
    camera.y = partie.joueur.y;
    choixEnCours = null;
    ecranMontee.hidden = true;
    ecranFin.hidden = true;
    finProgrammee = null;
    manche.actif = false; manche.id = null;
    enPause = false;
    return partie;
  }

  function taille(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    L = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(L * DPR);
    cv.height = Math.round(H * DPR);
  }

  /* ---------------------------------------------------------- le decor */

  function sol(g, d, h, b){
    var pas = 48;
    ctx.fillStyle = monde.sol;
    var x0 = Math.floor(g / pas) * pas, y0 = Math.floor(h / pas) * pas;
    for(var x = x0; x < d + pas; x += pas){
      for(var y = y0; y < b + pas; y += pas){
        if(((Math.round(x / pas) + Math.round(y / pas)) & 1) === 0) continue;
        ctx.fillRect(x, y, pas, pas);
      }
    }
    ctx.strokeStyle = monde.ligne;
    ctx.globalAlpha = .45;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(var x2 = x0; x2 < d + pas; x2 += pas){ ctx.moveTo(x2, h); ctx.lineTo(x2, b); }
    for(var y2 = y0; y2 < b + pas; y2 += pas){ ctx.moveTo(g, y2); ctx.lineTo(d, y2); }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function haie(){
    ctx.strokeStyle = monde.haie;
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.arc(0, 0, partie.rayon, 0, 6.2832);
    ctx.stroke();
  }

  function buissons(g, d, h, b){
    var marge = 40;
    for(var i = 0; i < partie.obstacles.length; i++){
      var o = partie.obstacles[i];
      if(o.x < g - marge || o.x > d + marge || o.y < h - marge || o.y > b + marge) continue;
      monde.dessinerObstacle(ctx, o, o.x, o.y, o.r);
    }
  }

  function graines(g, d, h, b){
    var t = partie.temps;
    for(var i = 0; i < partie.graines.length; i++){
      var s = partie.graines[i];
      if(s.x < g - 20 || s.x > d + 20 || s.y < h - 20 || s.y > b + 20) continue;
      var r = s.r * (1 + .12 * Math.sin(t * 6 + s.x));
      ctx.globalAlpha = .35;
      ctx.fillStyle = "#7cff9b";
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.2, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#39e06a";
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.beginPath(); ctx.arc(s.x - r * .3, s.y - r * .3, r * .35, 0, 6.2832); ctx.fill();
    }
  }

  function fraises(g, d, h, b){
    var t = partie.temps;
    for(var i = 0; i < partie.fraises.length; i++){
      var f = partie.fraises[i];
      if(f.x < g - 30 || f.x > d + 30 || f.y < h - 30 || f.y > b + 30) continue;
      var y = f.y + Math.sin(t * 3 + f.x) * 2;
      ctx.fillStyle = "rgba(0,0,0,.2)";
      ctx.beginPath(); ctx.ellipse(f.x, f.y + f.r * .9, f.r * .8, f.r * .3, 0, 0, 6.2832); ctx.fill();
      /* elle brille : c'est le seul soin de la partie, elle doit se voir */
      ctx.globalAlpha = .3 + .12 * Math.sin(t * 4);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(f.x, y, f.r * 1.9, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#ff3b52";
      ctx.beginPath();
      ctx.moveTo(f.x, y + f.r);
      ctx.bezierCurveTo(f.x - f.r * 1.25, y - f.r * .1, f.x - f.r * .55, y - f.r, f.x, y - f.r * .5);
      ctx.bezierCurveTo(f.x + f.r * .55, y - f.r, f.x + f.r * 1.25, y - f.r * .1, f.x, y + f.r);
      ctx.fill();
      ctx.fillStyle = "#3f8a3a";
      ctx.beginPath();
      ctx.ellipse(f.x, y - f.r * .72, f.r * .62, f.r * .26, 0, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.beginPath(); ctx.arc(f.x - f.r * .32, y - f.r * .12, f.r * .17, 0, 6.2832); ctx.fill();
    }
  }

  /* ------------------------------------------------------- le chevalier */

  function chevalier(){
    var j = partie.joueur, r = j.rayon, a = j.angle;
    var clignote = partie.temps < j.invincibleJusqua &&
                   Math.floor(partie.temps * 12) % 2 === 0;
    ctx.globalAlpha = clignote ? .4 : 1;

    ctx.fillStyle = "rgba(0,0,0,.26)";
    ctx.beginPath();
    ctx.ellipse(j.x, j.y + r * .92, r * 1.02, r * .42, 0, 0, 6.2832);
    ctx.fill();

    ctx.save();
    ctx.translate(j.x, j.y);
    ctx.rotate(a);

    /* la cape, derriere, bien visible */
    ctx.fillStyle = "#d94f2b";
    ctx.beginPath();
    ctx.ellipse(-r * .45, 0, r * 1.05, r * .95, 0, 0, 6.2832);
    ctx.fill();

    /* le corps */
    ctx.fillStyle = "#f6ecd4";
    ctx.beginPath();
    ctx.arc(0, 0, r * .92, 0, 6.2832);
    ctx.fill();

    /* le heaume dore, tourne vers la marche */
    ctx.fillStyle = "#ffc233";
    ctx.beginPath();
    ctx.arc(r * .12, 0, r * .82, -2.1, 2.1);
    ctx.closePath();
    ctx.fill();

    /* la fente des yeux */
    ctx.fillStyle = "#20263a";
    ctx.fillRect(r * .46, -r * .34, r * .3, r * .68);

    /* le plumet */
    ctx.fillStyle = "#ff6b3d";
    ctx.beginPath();
    ctx.ellipse(-r * .5, -r * .78, r * .5, r * .24, -0.5, 0, 6.2832);
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function dessiner(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = monde.fond;
    ctx.fillRect(0, 0, L, H);

    ctx.save();
    ctx.translate(L / 2, H / 2);
    ctx.translate(-camera.x, -camera.y);

    var g = camera.x - L / 2, d = camera.x + L / 2,
        h = camera.y - H / 2, b = camera.y + H / 2;

    sol(g, d, h, b);
    haie();
    graines(g, d, h, b);
    fraises(g, d, h, b);
    buissons(g, d, h, b);

    var t = partie.temps;
    for(var i = 0; i < partie.bestioles.length; i++){
      var be = partie.bestioles[i];
      if(be.x < g - 40 || be.x > d + 40 || be.y < h - 40 || be.y > b + 40) continue;
      if(be.espece.dessiner) be.espece.dessiner(ctx, be, t);
    }

    chevalier();
    armes.dessiner(ctx);
    ctx.restore();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    hud();
    commandes();
    if(afficheMesure) compteur();
  }

  /* ------------------------------------------------------------- le HUD */

  function coeur(x, y, r, plein){
    ctx.fillStyle = plein ? "#ff4d5e" : "rgba(255,255,255,.28)";
    ctx.beginPath();
    ctx.moveTo(x, y + r * .85);
    ctx.bezierCurveTo(x - r * 1.3, y - r * .3, x - r * .35, y - r * 1.1, x, y - r * .35);
    ctx.bezierCurveTo(x + r * .35, y - r * 1.1, x + r * 1.3, y - r * .3, x, y + r * .85);
    ctx.fill();
  }

  function hud(){
    var j = partie.joueur, i;

    /* la barre d'experience, tout en haut, sur toute la largeur */
    var part = Math.max(0, Math.min(1, partie.xpNiveau / partie.xpProchain));
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(0, 0, L, 8);
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(0, 0, L * part, 8);

    /* les coeurs */
    for(i = 0; i < j.coeursMax; i++){
      coeur(20 + i * 22, 30, 9, i < j.coeurs);
    }

    /* les armes : sans elles, on ne sait pas ce qu'on a deja */
    ctx.font = "18px system-ui,-apple-system,sans-serif";
    ctx.textBaseline = "middle";
    for(i = 0; i < armes.armes.length; i++){
      var a = armes.armes[i], x = 14 + i * 32;
      ctx.fillStyle = "rgba(0,0,0,.32)";
      ctx.beginPath(); ctx.arc(x + 12, 62, 15, 0, 6.2832); ctx.fill();
      ctx.textAlign = "center";
      ctx.fillText(a.def.emoji, x + 12, 63);
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 10px system-ui,sans-serif";
      ctx.fillText(a.niveau, x + 24, 74);
      ctx.font = "18px system-ui,-apple-system,sans-serif";
    }

    /* le chronometre */
    var reste = Math.max(0, partie.duree - partie.temps);
    var m = Math.floor(reste / 60), s = Math.floor(reste % 60);
    ctx.font = "700 20px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillText(m + ":" + (s < 10 ? "0" : "") + s, L / 2 + 1, 33);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(m + ":" + (s < 10 ? "0" : "") + s, L / 2, 32);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  /* -------------------------------------------------------------- le doigt

     Le manche flotte : il apparait la ou le pouce se pose. Il n'y a pas
     d'autre commande, les armes frappent toutes seules. */

  var RAYON_MANCHE = 46, SEUIL_MANCHE = 8, MARGE_BAS = 100, MARGE_COTE = 62,
      manche = { actif: false, id: null, ox: 0, oy: 0, x: 0, y: 0, angle: 0, tire: 0 };

  function repos(){ return { x: MARGE_COTE, y: H - MARGE_BAS, r: 34 }; }

  function doigtPose(e){
    e.preventDefault();
    if(manche.actif) return;
    manche.actif = true;
    manche.id = e.pointerId;
    manche.ox = manche.x = e.clientX;
    manche.oy = manche.y = e.clientY;
    manche.tire = 0;
  }

  function doigtBouge(e){
    if(!manche.actif || e.pointerId !== manche.id) return;
    manche.x = e.clientX;
    manche.y = e.clientY;
    var dx = manche.x - manche.ox, dy = manche.y - manche.oy;
    manche.tire = Math.hypot(dx, dy);
    if(manche.tire >= SEUIL_MANCHE) manche.angle = Math.atan2(dy, dx);
  }

  function doigtLeve(e){
    if(manche.actif && e.pointerId === manche.id){
      manche.actif = false; manche.id = null; manche.tire = 0;
    }
  }

  cv.addEventListener("pointerdown", doigtPose);
  window.addEventListener("pointermove", doigtBouge);
  window.addEventListener("pointerup", doigtLeve);
  window.addEventListener("pointercancel", doigtLeve);

  function anneau(x, y, r, fond, trait){
    ctx.globalAlpha = trait * .6;
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = fond;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = trait;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function pastille(x, y, r, a){
    ctx.globalAlpha = a * .4;
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(x, y + 1.5, r + 1.5, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function commandes(){
    if(manche.actif){
      var dx = manche.x - manche.ox, dy = manche.y - manche.oy, d = Math.hypot(dx, dy);
      if(d > RAYON_MANCHE){ dx = dx / d * RAYON_MANCHE; dy = dy / d * RAYON_MANCHE; }
      anneau(manche.ox, manche.oy, RAYON_MANCHE, .18, .34);
      pastille(manche.ox + dx, manche.oy + dy, 20, .88);
    }else{
      var r = repos();
      anneau(r.x, r.y, r.r, .10, .22);
      pastille(r.x, r.y, 14, .26);
    }
  }

  /* --------------------------------------------------- monter de niveau */

  function montrerChoix(){
    var choix = armes.propositions(3);
    if(!choix.length) return;          /* tout est deja au maximum */
    choixEnCours = choix;
    boiteCartes.innerHTML = "";
    choix.forEach(function(c, i){
      var b = document.createElement("button");
      b.className = "carte";
      b.type = "button";
      b.setAttribute("data-choix", i);
      b.innerHTML = '<span class="ic">' + c.def.emoji + '</span>' +
        '<span class="t"><b>' + c.def.nom +
        (c.niveau > 1 ? ' <em>niveau ' + c.niveau + '</em>' : '') +
        '</b><span>' + c.def.dit + '</span></span>';
      b.addEventListener("click", function(){
        armes.appliquer(choixEnCours[i]);
        choixEnCours = null;
        ecranMontee.hidden = true;
        enPause = false;
        dernier = 0;
      });
      boiteCartes.appendChild(b);
    });
    ecranMontee.hidden = false;
    enPause = true;
  }

  /* --------------------------------------------------------- fin de partie */

  var finProgrammee = null, DELAI_FIN = 900;

  function montrerFin(){
    finTitre.textContent = partie.gagne ? "Gagné !" : "Perdu";
    finScore.textContent = partie.xp.toLocaleString("fr-FR");
    ecranFin.hidden = false;
  }

  document.getElementById("rejouer").addEventListener("click", function(){
    if(finProgrammee){ clearTimeout(finProgrammee); finProgrammee = null; }
    demarrer(monde);
  });

  document.getElementById("jouer").addEventListener("click", function(){
    ecranDepart.hidden = true;
    demarrer(monde);
    dernier = 0;
  });

  /* ------------------------------------------------------------ la mesure */

  var horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 }, bilan = null;

  function chronometrer(dt, t0, t1, t2){
    horloge.n++; horloge.dt += dt;
    horloge.moteur += t1 - t0;
    horloge.dessin += t2 - t1;
    if(horloge.n < 120) return;
    bilan = {
      images: Math.round(horloge.n / horloge.dt),
      moteur: +(horloge.moteur / horloge.n).toFixed(2),
      dessin: +(horloge.dessin / horloge.n).toFixed(2),
      bestioles: partie.bestioles.length,
      graines: partie.graines.length,
      projectiles: armes.projectiles.length
    };
    horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 };
  }

  function compteur(){
    if(!bilan) return;
    ctx.globalAlpha = .55;
    ctx.fillStyle = "#000000";
    ctx.fillRect(8, 84, 196, 44);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffffff";
    ctx.font = "600 12px system-ui,-apple-system,sans-serif";
    ctx.fillText(bilan.images + " images/s   " + bilan.bestioles + " bestioles", 18, 102);
    ctx.fillText("moteur " + bilan.moteur + " ms   dessin " + bilan.dessin + " ms", 18, 120);
  }

  /* ------------------------------------------------------------- la boucle */

  function image(maintenant){
    var dt = Math.min(1 / 20, (maintenant - dernier) / 1000 || 0);
    dernier = maintenant;
    var t0 = performance.now();

    if(!enPause && partie){
      partie.commander({
        angle: manche.angle,
        avance: manche.actif && manche.tire >= SEUIL_MANCHE
      });
      var faits = partie.pas(dt);
      armes.pas(dt);

      var monteDeNiveau = false;
      for(var i = 0; i < faits.length; i++){
        if(faits[i].type === "niveau") monteDeNiveau = true;
      }
      var k = Math.min(1, dt * 10);
      camera.x += (partie.joueur.x - camera.x) * k;
      camera.y += (partie.joueur.y - camera.y) * k;

      if(partie.fini && ecranFin.hidden && !finProgrammee){
        finProgrammee = setTimeout(function(){ finProgrammee = null; montrerFin(); }, DELAI_FIN);
      }else if(monteDeNiveau && !partie.fini){
        montrerChoix();
      }
    }

    var t1 = performance.now();
    if(partie) dessiner();
    if(partie && !enPause) chronometrer(dt, t0, t1, performance.now());
    requestAnimationFrame(image);
  }

  var regles = reglagesDeLAdresse();
  var afficheMesure = new URLSearchParams(location.search).get("mesure") === "1";
  window.addEventListener("resize", taille);
  taille();
  demarrer(Mondes.prairie);
  enPause = true;              /* on attend le bouton Jouer */
  requestAnimationFrame(image);

  /* pour les scripts de controle */
  window.jeu = {
    version: "chevalier-1",
    taille: function(){ return [L, H]; },
    partie: function(){ return partie; },
    armes: function(){ return armes; },
    monde: function(){ return monde; },
    reglages: function(){ return { valeurs: Moteur.REGLAGES, adresse: regles }; },
    mesure: function(){ return bilan; },
    commencer: function(graine){
      ecranDepart.hidden = true;
      demarrer(monde, graine);
      dernier = 0;
      return true;
    },
    ecrans: function(){
      return {
        depart: !ecranDepart.hidden,
        montee: !ecranMontee.hidden,
        fin: !ecranFin.hidden,
        pause: enPause,
        cartes: choixEnCours ? choixEnCours.length : 0
      };
    },
    choisir: function(i){
      var b = boiteCartes.querySelector('[data-choix="' + i + '"]');
      if(b) b.click();
      return !!b;
    }
  };
  window.serpentin = window.jeu;   /* l'ancien nom, pour les scripts existants */
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
