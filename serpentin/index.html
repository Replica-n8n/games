<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Serpentin</title>
<meta name="description" content="Un serpent dans la prairie. Sans publicité, sans achat, hors ligne.">
<meta name="theme-color" content="#4f8f3e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#83c766;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #jeu{position:fixed;inset:0;display:block;width:100%;height:100%}
  #fin{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
    background:rgba(20,32,14,.72);color:#fff;text-align:center;
  }
  #fin[hidden]{display:none}
  #fin .n{font-size:4rem;font-weight:800;line-height:1;letter-spacing:-.02em}
  #fin .u{margin-top:10px;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
  #rejouer{
    font:inherit;font-size:1.35rem;font-weight:700;
    color:#1d3b12;background:#fff;border:0;border-radius:999px;
    padding:18px 48px;min-height:60px;
    box-shadow:0 10px 24px rgba(0,0,0,.38);cursor:pointer;
  }
  #rejouer:active{transform:translateY(2px)}
</style>
</head>
<body>
<canvas id="jeu"></canvas>
<div id="fin" hidden>
  <div>
    <div class="n" id="finScore">0</div>
    <div class="u">points</div>
  </div>
  <button id="rejouer" type="button">Rejouer</button>
</div>
<script src="./moteur.js"></script>
<script src="./mondes.js"></script>
<script>
/* Serpentin : l'affichage.

   Ce fichier ne connait aucune regle et aucune couleur : il lit l'etat que lui
   donne le moteur et le peint avec la palette que lui donne le monde. Ajouter
   un monde ne doit rien changer ici. */
(function(){
  "use strict";

  var cv = document.getElementById("jeu"),
      ctx = cv.getContext("2d"),
      L = 0, H = 0, DPR = 1;

  var monde = Mondes.prairie,
      partie = null,
      camera = { x: 0, y: 0 },
      echelle = 1,
      dernier = 0;

  /* Reglage a chaud, pour les essais sur le telephone : n'importe quelle
     valeur de REGLAGES se remplace par un parametre d'adresse, par exemple
     ...serpentin/?virage=8&vitesse=160. Rien dans l'interface, c'est un outil
     de reglage, pas une option du jeu. */
  function reglagesDeLAdresse(){
    var q = new URLSearchParams(location.search), changes = {};
    q.forEach(function(valeur, cle){
      if(!(cle in Moteur.REGLAGES)) return;
      var n = parseFloat(valeur);
      if(isNaN(n)) return;
      Moteur.REGLAGES[cle] = n;
      changes[cle] = n;
    });
    return changes;
  }

  function demarrer(quoi, graine){
    monde = (typeof quoi === "string") ? Mondes.tous[quoi] : (quoi || monde);
    partie = Moteur.creer({
      monde: monde,
      graine: graine || ((Date.now() % 100000) + 1)
    });
    camera.x = partie.joueur.x;
    camera.y = partie.joueur.y;
    return partie;
  }

  function taille(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    L = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(L * DPR);
    cv.height = Math.round(H * DPR);
  }

  /* le serpent grossit, on recule un peu la camera */
  function zoom(){
    var R = Moteur.REGLAGES;
    var r = Moteur.rayonSerpent(partie.joueur) - R.rayonBase;
    return 1 - 0.3 * Math.min(1, r / R.rayonMax);
  }

  /* ------------------------------------------------------------------ dessin */

  function sol(g, d, h, b){
    var pas = 48;
    ctx.fillStyle = monde.sol;
    var x0 = Math.floor(g / pas) * pas, y0 = Math.floor(h / pas) * pas;
    for(var x = x0; x < d + pas; x += pas){
      for(var y = y0; y < b + pas; y += pas){
        if(((Math.round(x / pas) + Math.round(y / pas)) & 1) === 0) continue;
        ctx.fillRect(x, y, pas, pas);
      }
    }
    ctx.strokeStyle = monde.ligne;
    ctx.globalAlpha = .5;
    ctx.lineWidth = 1 / echelle;
    ctx.beginPath();
    for(var x = x0; x < d + pas; x += pas){ ctx.moveTo(x, h); ctx.lineTo(x, b); }
    for(var y = y0; y < b + pas; y += pas){ ctx.moveTo(g, y); ctx.lineTo(d, y); }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function haie(){
    ctx.strokeStyle = monde.haie;
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.arc(0, 0, partie.rayon, 0, 6.2832);
    ctx.stroke();
  }

  function fleurs(g, d, h, b){
    var f, i, marge = 10;
    for(i = 0; i < partie.fleurs.length; i++){
      f = partie.fleurs[i];
      if(f.x < g - marge || f.x > d + marge || f.y < h - marge || f.y > b + marge) continue;
      ctx.fillStyle = monde.ombre;
      ctx.beginPath();
      ctx.arc(f.x + 1, f.y + 1.6, f.r, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = monde.couleursFleurs[f.i % monde.couleursFleurs.length];
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 6.2832);
      ctx.fill();
    }
  }

  function obstacles(g, d, h, b){
    var o, i, marge = 40;
    for(i = 0; i < partie.obstacles.length; i++){
      o = partie.obstacles[i];
      if(o.x < g - marge || o.x > d + marge || o.y < h - marge || o.y > b + marge) continue;
      monde.dessinerObstacle(ctx, o, o.x, o.y, o.r);
    }
  }

  function serpent(s){
    if(s.corps.length < 2) return;
    var r = Moteur.rayonSerpent(s),
        couleur = (s === partie.joueur) ? monde.couleurJoueur
                                        : monde.couleursBots[s.teinte % monde.couleursBots.length],
        ventre = (s === partie.joueur) ? monde.ventreJoueur : null;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(s.corps[0].x, s.corps[0].y);
    for(var i = 1; i < s.corps.length; i++) ctx.lineTo(s.corps[i].x, s.corps[i].y);

    ctx.strokeStyle = monde.ombre;
    ctx.lineWidth = r * 2.28;
    ctx.stroke();
    ctx.strokeStyle = couleur;
    ctx.lineWidth = r * 2;
    ctx.stroke();
    if(ventre){
      ctx.strokeStyle = ventre;
      ctx.globalAlpha = .45;
      ctx.lineWidth = r * .72;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* la tete et les yeux */
    var t = s.corps[0];
    ctx.fillStyle = couleur;
    ctx.beginPath();
    ctx.arc(t.x, t.y, r * 1.12, 0, 6.2832);
    ctx.fill();
    var e1 = s.angle + 1.05, e2 = s.angle - 1.05, d1 = r * .62, oe = r * .42;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(t.x + Math.cos(e1) * d1, t.y + Math.sin(e1) * d1, oe, 0, 6.2832);
    ctx.arc(t.x + Math.cos(e2) * d1, t.y + Math.sin(e2) * d1, oe, 0, 6.2832);
    ctx.fill();
    var av = r * .18;
    ctx.fillStyle = "#16233a";
    ctx.beginPath();
    ctx.arc(t.x + Math.cos(e1) * d1 + Math.cos(s.angle) * av,
            t.y + Math.sin(e1) * d1 + Math.sin(s.angle) * av, oe * .48, 0, 6.2832);
    ctx.arc(t.x + Math.cos(e2) * d1 + Math.cos(s.angle) * av,
            t.y + Math.sin(e2) * d1 + Math.sin(s.angle) * av, oe * .48, 0, 6.2832);
    ctx.fill();
  }

  function dessiner(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = monde.fond;
    ctx.fillRect(0, 0, L, H);

    ctx.save();
    ctx.translate(L / 2, H / 2);
    ctx.scale(echelle, echelle);
    ctx.translate(-camera.x, -camera.y);

    var demiL = L / (2 * echelle), demiH = H / (2 * echelle);
    var g = camera.x - demiL, d = camera.x + demiL,
        h = camera.y - demiH, b = camera.y + demiH;

    sol(g, d, h, b);
    haie();
    fleurs(g, d, h, b);
    obstacles(g, d, h, b);
    for(var i = 0; i < partie.serpents.length; i++){
      if(partie.serpents[i].vivant) serpent(partie.serpents[i]);
    }
    ctx.restore();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    commandes();
  }

  /* -------------------------------------------------------------- le doigt */

  /* Le manche flotte : il apparait la ou le pouce se pose, et le serpent va
     dans la direction ou l'on tire. Au repos, un anneau pale reste en bas a
     gauche : une commande que rien n'annonce n'existe pas.
     Le bouton pour foncer est toujours visible, en bas a droite. */

  var RAYON_MANCHE = 46, SEUIL_MANCHE = 10, MARGE_BAS = 100, MARGE_COTE = 62,
      RAYON_BOUTON = 34;

  var manche = { actif: false, id: null, ox: 0, oy: 0, x: 0, y: 0, angle: 0 },
      boost  = { actif: false, id: null };

  function bouton(){ return { x: L - MARGE_COTE, y: H - MARGE_BAS, r: RAYON_BOUTON }; }
  function repos(){  return { x: MARGE_COTE,     y: H - MARGE_BAS, r: RAYON_BOUTON }; }

  function surBouton(x, y){
    var b = bouton();
    return Math.hypot(x - b.x, y - b.y) <= b.r + 16;
  }

  function doigtPose(e){
    e.preventDefault();
    if(!boost.actif && surBouton(e.clientX, e.clientY)){
      boost.actif = true;
      boost.id = e.pointerId;
      return;
    }
    if(!manche.actif){
      manche.actif = true;
      manche.id = e.pointerId;
      manche.ox = manche.x = e.clientX;
      manche.oy = manche.y = e.clientY;
    }
  }

  function doigtBouge(e){
    if(!manche.actif || e.pointerId !== manche.id) return;
    manche.x = e.clientX;
    manche.y = e.clientY;
    var dx = manche.x - manche.ox, dy = manche.y - manche.oy;
    if(Math.hypot(dx, dy) >= SEUIL_MANCHE) manche.angle = Math.atan2(dy, dx);
  }

  function doigtLeve(e){
    if(manche.actif && e.pointerId === manche.id){ manche.actif = false; manche.id = null; }
    if(boost.actif  && e.pointerId === boost.id ){ boost.actif  = false; boost.id  = null; }
  }

  cv.addEventListener("pointerdown", doigtPose);
  window.addEventListener("pointermove", doigtBouge);
  window.addEventListener("pointerup", doigtLeve);
  window.addEventListener("pointercancel", doigtLeve);

  /* Un liset sombre sous le blanc : sans lui les commandes se perdent sur un
     fond clair comme la prairie, et il n'y a pas de couleur de commande qui
     marche dans tous les mondes. */
  function anneau(x, y, r, fond, trait){
    ctx.globalAlpha = trait * .6;
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = fond;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = trait;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function pastille(x, y, r, a){
    ctx.globalAlpha = a * .4;
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(x, y + 1.5, r + 1.5, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function commandes(){
    var r = repos(), b = bouton();

    if(manche.actif){
      var dx = manche.x - manche.ox, dy = manche.y - manche.oy,
          d = Math.hypot(dx, dy);
      if(d > RAYON_MANCHE){ dx = dx / d * RAYON_MANCHE; dy = dy / d * RAYON_MANCHE; }
      anneau(manche.ox, manche.oy, RAYON_MANCHE, .18, .34);
      pastille(manche.ox + dx, manche.oy + dy, 20, .88);
    }else{
      anneau(r.x, r.y, r.r, .10, .22);
      pastille(r.x, r.y, 14, .26);
    }

    var rb = b.r + (boost.actif ? 3 : 0);
    ctx.globalAlpha = .28;
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(b.x, b.y + 2, rb + 2, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = boost.actif ? 1 : .9;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(b.x, b.y, rb, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = monde.haie;
    ctx.font = "700 13px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("FONCE", b.x, b.y);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  /* ------------------------------------------------------- fin de partie */

  var ecranFin = document.getElementById("fin"),
      finScore = document.getElementById("finScore"),
      finProgrammee = null;

  /* On attend avant de couvrir l'ecran : un enfant doit voir ce qui l'a tue,
     sinon la mort a l'air d'arriver toute seule. Meme delai qu'aux echecs. */
  var DELAI_FIN = 900;

  function montrerFin(){
    finScore.textContent = partie.score.toLocaleString("fr-FR");
    ecranFin.hidden = false;
  }

  function rejouer(){
    if(finProgrammee){ clearTimeout(finProgrammee); finProgrammee = null; }
    ecranFin.hidden = true;
    manche.actif = false; manche.id = null; manche.angle = 0;
    boost.actif = false;  boost.id = null;
    demarrer(monde);
    echelle = zoom();
  }

  document.getElementById("rejouer").addEventListener("click", rejouer);

  /* ------------------------------------------------------------- la boucle */

  function image(maintenant){
    var dt = Math.min(1 / 20, (maintenant - dernier) / 1000 || 0);
    dernier = maintenant;
    partie.commander({ angle: manche.angle, fonce: boost.actif });
    partie.pas(dt);
    if(partie.fini && ecranFin.hidden && !finProgrammee){
      finProgrammee = setTimeout(function(){ finProgrammee = null; montrerFin(); }, DELAI_FIN);
    }
    var j = partie.joueur, k = Math.min(1, dt * 12);
    camera.x += (j.x - camera.x) * k;
    camera.y += (j.y - camera.y) * k;
    echelle += (zoom() - echelle) * Math.min(1, dt * 2);
    dessiner();
    requestAnimationFrame(image);
  }

  var regles = reglagesDeLAdresse();
  window.addEventListener("resize", taille);
  taille();
  demarrer(Mondes.prairie);
  echelle = zoom();
  requestAnimationFrame(image);

  /* pour les scripts de controle */
  window.serpentin = {
    version: "etape-5",
    reglages: function(){ return { valeurs: Moteur.REGLAGES, adresse: regles }; },
    fin: function(){ return { visible: !ecranFin.hidden, score: finScore.textContent }; },
    taille: function(){ return [L, H]; },
    partie: function(){ return partie; },
    monde: function(){ return monde; },
    demarrer: function(quoi, graine){ demarrer(quoi, graine); echelle = zoom(); return monde.nom; },
    commandes: function(){
      var r = repos(), b = bouton();
      return {
        manche: {
          actif: manche.actif,
          angle: manche.angle,
          x: manche.actif ? manche.ox : r.x,
          y: manche.actif ? manche.oy : r.y,
          rayon: manche.actif ? RAYON_MANCHE : r.r
        },
        bouton: { x: b.x, y: b.y, rayon: b.r, actif: boost.actif }
      };
    }
  };
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
