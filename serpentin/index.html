<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Serpentin</title>
<meta name="description" content="Un serpent dans la prairie. Sans publicité, sans achat, hors ligne.">
<meta name="theme-color" content="#4f8f3e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#83c766;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #jeu{position:fixed;inset:0;display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="jeu"></canvas>
<script src="./moteur.js"></script>
<script src="./mondes.js"></script>
<script>
/* Serpentin : l'affichage.

   Ce fichier ne connait aucune regle et aucune couleur : il lit l'etat que lui
   donne le moteur et le peint avec la palette que lui donne le monde. Ajouter
   un monde ne doit rien changer ici. */
(function(){
  "use strict";

  var cv = document.getElementById("jeu"),
      ctx = cv.getContext("2d"),
      L = 0, H = 0, DPR = 1;

  var monde = Mondes.prairie,
      partie = null,
      camera = { x: 0, y: 0 },
      echelle = 1,
      dernier = 0;

  function demarrer(quoi){
    monde = (typeof quoi === "string") ? Mondes.tous[quoi] : (quoi || monde);
    partie = Moteur.creer({
      monde: monde,
      graine: (Date.now() % 100000) + 1
    });
    camera.x = partie.joueur.x;
    camera.y = partie.joueur.y;
    return partie;
  }

  function taille(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    L = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(L * DPR);
    cv.height = Math.round(H * DPR);
  }

  /* le serpent grossit, on recule un peu la camera */
  function zoom(){
    var R = Moteur.REGLAGES;
    var r = Moteur.rayonSerpent(partie.joueur) - R.rayonBase;
    return 1 - 0.3 * Math.min(1, r / R.rayonMax);
  }

  /* ------------------------------------------------------------------ dessin */

  function sol(g, d, h, b){
    var pas = 48;
    ctx.fillStyle = monde.sol;
    var x0 = Math.floor(g / pas) * pas, y0 = Math.floor(h / pas) * pas;
    for(var x = x0; x < d + pas; x += pas){
      for(var y = y0; y < b + pas; y += pas){
        if(((Math.round(x / pas) + Math.round(y / pas)) & 1) === 0) continue;
        ctx.fillRect(x, y, pas, pas);
      }
    }
    ctx.strokeStyle = monde.ligne;
    ctx.globalAlpha = .5;
    ctx.lineWidth = 1 / echelle;
    ctx.beginPath();
    for(var x = x0; x < d + pas; x += pas){ ctx.moveTo(x, h); ctx.lineTo(x, b); }
    for(var y = y0; y < b + pas; y += pas){ ctx.moveTo(g, y); ctx.lineTo(d, y); }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function haie(){
    ctx.strokeStyle = monde.haie;
    ctx.lineWidth = 18;
    ctx.beginPath();
    ctx.arc(0, 0, partie.rayon, 0, 6.2832);
    ctx.stroke();
  }

  function fleurs(g, d, h, b){
    var f, i, marge = 10;
    for(i = 0; i < partie.fleurs.length; i++){
      f = partie.fleurs[i];
      if(f.x < g - marge || f.x > d + marge || f.y < h - marge || f.y > b + marge) continue;
      ctx.fillStyle = monde.ombre;
      ctx.beginPath();
      ctx.arc(f.x + 1, f.y + 1.6, f.r, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = monde.couleursFleurs[f.i % monde.couleursFleurs.length];
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, 6.2832);
      ctx.fill();
    }
  }

  function obstacles(g, d, h, b){
    var o, i, marge = 40;
    for(i = 0; i < partie.obstacles.length; i++){
      o = partie.obstacles[i];
      if(o.x < g - marge || o.x > d + marge || o.y < h - marge || o.y > b + marge) continue;
      monde.dessinerObstacle(ctx, o, o.x, o.y, o.r);
    }
  }

  function serpent(s){
    if(s.corps.length < 2) return;
    var r = Moteur.rayonSerpent(s),
        couleur = (s === partie.joueur) ? monde.couleurJoueur
                                        : monde.couleursBots[s.teinte % monde.couleursBots.length],
        ventre = (s === partie.joueur) ? monde.ventreJoueur : null;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(s.corps[0].x, s.corps[0].y);
    for(var i = 1; i < s.corps.length; i++) ctx.lineTo(s.corps[i].x, s.corps[i].y);

    ctx.strokeStyle = monde.ombre;
    ctx.lineWidth = r * 2.28;
    ctx.stroke();
    ctx.strokeStyle = couleur;
    ctx.lineWidth = r * 2;
    ctx.stroke();
    if(ventre){
      ctx.strokeStyle = ventre;
      ctx.globalAlpha = .45;
      ctx.lineWidth = r * .72;
      ctx.stroke();
      ctx.globalAlpha = 1;
    }

    /* la tete et les yeux */
    var t = s.corps[0];
    ctx.fillStyle = couleur;
    ctx.beginPath();
    ctx.arc(t.x, t.y, r * 1.12, 0, 6.2832);
    ctx.fill();
    var e1 = s.angle + 1.05, e2 = s.angle - 1.05, d1 = r * .62, oe = r * .42;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(t.x + Math.cos(e1) * d1, t.y + Math.sin(e1) * d1, oe, 0, 6.2832);
    ctx.arc(t.x + Math.cos(e2) * d1, t.y + Math.sin(e2) * d1, oe, 0, 6.2832);
    ctx.fill();
    var av = r * .18;
    ctx.fillStyle = "#16233a";
    ctx.beginPath();
    ctx.arc(t.x + Math.cos(e1) * d1 + Math.cos(s.angle) * av,
            t.y + Math.sin(e1) * d1 + Math.sin(s.angle) * av, oe * .48, 0, 6.2832);
    ctx.arc(t.x + Math.cos(e2) * d1 + Math.cos(s.angle) * av,
            t.y + Math.sin(e2) * d1 + Math.sin(s.angle) * av, oe * .48, 0, 6.2832);
    ctx.fill();
  }

  function dessiner(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = monde.fond;
    ctx.fillRect(0, 0, L, H);

    ctx.save();
    ctx.translate(L / 2, H / 2);
    ctx.scale(echelle, echelle);
    ctx.translate(-camera.x, -camera.y);

    var demiL = L / (2 * echelle), demiH = H / (2 * echelle);
    var g = camera.x - demiL, d = camera.x + demiL,
        h = camera.y - demiH, b = camera.y + demiH;

    sol(g, d, h, b);
    haie();
    fleurs(g, d, h, b);
    obstacles(g, d, h, b);
    for(var i = 0; i < partie.serpents.length; i++){
      if(partie.serpents[i].vivant) serpent(partie.serpents[i]);
    }
    ctx.restore();
  }

  /* ------------------------------------------------------------- la boucle */

  /* provisoire : le serpent vise la fleur la plus proche.
     Le doigt prend la main a l'etape 4. */
  function piloteAutomatique(){
    var j = partie.joueur, meilleure = null, dm = Infinity;
    for(var i = 0; i < partie.fleurs.length; i++){
      var f = partie.fleurs[i];
      var dx = f.x - j.x, dy = f.y - j.y, d = dx * dx + dy * dy;
      if(d < dm){ dm = d; meilleure = f; }
    }
    if(!meilleure) return;
    var vise = Math.atan2(meilleure.y - j.y, meilleure.x - j.x);
    if(Math.hypot(j.x, j.y) > partie.rayon * .82) vise = Math.atan2(-j.y, -j.x);
    partie.commander({ angle: vise });
  }

  function image(maintenant){
    var dt = Math.min(1 / 20, (maintenant - dernier) / 1000 || 0);
    dernier = maintenant;
    piloteAutomatique();
    partie.pas(dt);
    var j = partie.joueur, k = Math.min(1, dt * 12);
    camera.x += (j.x - camera.x) * k;
    camera.y += (j.y - camera.y) * k;
    echelle += (zoom() - echelle) * Math.min(1, dt * 2);
    dessiner();
    requestAnimationFrame(image);
  }

  window.addEventListener("resize", taille);
  taille();
  demarrer(Mondes.prairie);
  echelle = zoom();
  requestAnimationFrame(image);

  /* pour les scripts de controle */
  window.serpentin = {
    version: "etape-3",
    taille: function(){ return [L, H]; },
    partie: function(){ return partie; },
    monde: function(){ return monde; },
    demarrer: function(quoi){ demarrer(quoi); echelle = zoom(); return monde.nom; }
  };
})();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
