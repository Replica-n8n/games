<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Le chevalier</title>
<meta name="description" content="Un chevalier, une prairie, et beaucoup de bestioles. Sans publicité, sans achat, hors ligne.">
<meta name="theme-color" content="#4f8f3e">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icone-192.png">
<style>
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;background:#83c766;
    touch-action:none;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  #jeu{position:fixed;inset:0;display:block;width:100%;height:100%}

  .voile{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:20px;box-sizing:border-box;
    background:rgba(20,32,14,.78);color:#fff;text-align:center;
  }
  .voile[hidden]{display:none}
  .titre{font-size:2.6rem;font-weight:800;line-height:1;letter-spacing:-.02em}
  .n{font-size:3.6rem;font-weight:800;line-height:1}
  .u{margin-top:8px;font-size:.8rem;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
  .gros{
    font:inherit;font-size:1.35rem;font-weight:700;
    color:#1d3b12;background:#fff;border:0;border-radius:999px;
    padding:18px 48px;min-height:60px;
    box-shadow:0 10px 24px rgba(0,0,0,.38);cursor:pointer;
  }
  .gros:active{transform:translateY(2px)}

  #cartes{display:flex;flex-direction:column;gap:14px;width:100%;max-width:340px}
  .carte{
    display:flex;align-items:center;gap:16px;
    background:#fffaf0;color:#20301a;border:0;border-radius:20px;
    padding:16px 18px;min-height:88px;text-align:left;font:inherit;
    box-shadow:0 8px 18px rgba(0,0,0,.32);cursor:pointer;
  }
  .carte:active{transform:translateY(2px)}
  .carte .ic{font-size:2.5rem;line-height:1;flex:0 0 auto;width:52px;text-align:center}
  .carte .t{flex:1 1 auto;min-width:0}
  .carte b{display:block;font-size:1.16rem;line-height:1.15}
  .carte span{display:block;font-size:.9rem;opacity:.72;margin-top:3px}
  .carte em{font-style:normal;font-weight:700;color:#a06a12}

  #menuBouton{
    position:fixed;top:10px;right:10px;z-index:3;
    width:46px;height:46px;border:0;border-radius:50%;
    background:rgba(0,0,0,.34);color:#fff;
    font:700 22px/1 system-ui,sans-serif;cursor:pointer;
  }
  #menuBouton[hidden]{display:none}
  #menu .gros{min-width:250px}
  #astuce{max-width:300px;font-size:.95rem;line-height:1.5;opacity:.85}
  #astuce[hidden]{display:none}

  #finTable{
    border-collapse:collapse;font-size:1.02rem;
    background:rgba(255,255,255,.08);border-radius:14px;overflow:hidden;
  }
  #finTable th,#finTable td{padding:9px 16px;text-align:left}
  #finTable th{font-weight:400;opacity:.7}
  #finTable td{font-weight:700;text-align:right}
  #finTable tr+tr{border-top:1px solid rgba(255,255,255,.12)}

  #roue canvas{width:min(78vw,320px);height:min(78vw,320px);display:block}
  #roueNom{min-height:2.6rem;display:flex;align-items:center;gap:12px}
  #roueNom .ic{font-size:2.2rem}
  #roueNom.vide{opacity:0}
</style>
</head>
<body>
<canvas id="jeu"></canvas>

<div id="depart" class="voile">
  <div class="titre">Le chevalier</div>
  <button id="jouer" class="gros" type="button">Jouer</button>
</div>

<button id="menuBouton" type="button" aria-label="Menu">⋯</button>

<div id="menu" class="voile" hidden>
  <div class="u" id="menuVersion">version</div>
  <button id="installer" class="gros" type="button">Installer le jeu</button>
  <p id="astuce" hidden>Dans Chrome, les 3 points en haut à droite, puis « Ajouter à l'écran d'accueil ».</p>
  <button id="recommencer" class="gros" type="button">Recommencer</button>
  <button id="fermer" class="gros" type="button">Continuer</button>
</div>

<div id="roue" class="voile" hidden>
  <div class="u">Ton arme</div>
  <canvas id="roueDessin" width="620" height="620"></canvas>
  <div id="roueNom" class="titre vide"></div>
</div>

<div id="montee" class="voile" hidden>
  <div class="u">Choisis</div>
  <div id="cartes"></div>
</div>

<div id="fin" class="voile" hidden>
  <div>
    <div class="titre" id="finTitre">Perdu</div>
    <div class="n" id="finScore">0</div>
    <div class="u">graines ramassées</div>
  </div>
  <table id="finTable">
    <tr><th>Temps tenu</th><td id="finTemps">0:00</td></tr>
    <tr><th>Bestioles battues</th><td id="finTues">0</td></tr>
    <tr><th>Niveau atteint</th><td id="finNiveau">1</td></tr>
    <tr><th>Armes</th><td id="finArmes">-</td></tr>
  </table>
  <button id="rejouer" class="gros" type="button">Rejouer</button>
</div>

<script src="./bestioles.js"></script>
<script src="./meteo.js"></script>
<script src="./mondes.js"></script>
<script src="./moteur.js"></script>
<script src="./armes.js"></script>
<script>
/* L'affichage.

   Il ne connait aucune regle : il lit l'etat que lui donne le moteur, le peint
   avec la palette du monde, et laisse les armes et les bestioles se dessiner
   elles memes. Ajouter une arme, une bestiole ou un monde ne doit rien changer
   ici. */
(function(){
  "use strict";

  /* ⚠️ Doit rester identique a VERSION dans sw.js : un essai le verifie.
     Affichee dans le menu, pour qu'on sache toujours ce qui tourne. */
  var VERSION = "chevalier-v14";

  var cv = document.getElementById("jeu"),
      ctx = cv.getContext("2d"),
      L = 0, H = 0, DPR = 1;

  var monde = Mondes.prairie,
      partie = null, armes = null, armeDeDepart = null,
      camera = { x: 0, y: 0 },
      dernier = 0,
      enPause = true,
      choixEnCours = null;

  var ecranDepart = document.getElementById("depart"),
      ecranMontee = document.getElementById("montee"),
      ecranFin = document.getElementById("fin"),
      boiteCartes = document.getElementById("cartes"),
      finTitre = document.getElementById("finTitre"),
      finScore = document.getElementById("finScore");

  function demarrer(quoi, graine){
    monde = (typeof quoi === "string") ? Mondes.tous[quoi] : (quoi || monde);
    partie = Moteur.creer({
      monde: monde,
      graine: graine || ((Date.now() % 100000) + 1)
    });
    armes = Armes.creer(partie);
    /* Une arme au hasard a chaque partie, comme dans un rogue lite : deux
       parties ne se ressemblent pas. */
    var possibles = Object.keys(Armes.CATALOGUE);
    armeDeDepart = possibles[Math.floor(partie.alea() * possibles.length)];
    armes.donner(armeDeDepart);
    camera.x = partie.joueur.x;
    camera.y = partie.joueur.y;
    choixEnCours = null;
    choixApres = 0;
    niveauxDus = 0;
    ecranMontee.hidden = true;
    ecranFin.hidden = true;
    finProgrammee = null;
    manche.actif = false; manche.id = null;
    enPause = false;
    return partie;
  }

  function taille(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    L = window.innerWidth;
    H = window.innerHeight;
    cv.width  = Math.round(L * DPR);
    cv.height = Math.round(H * DPR);
  }

  /* ---------------------------------------------------------- le decor */

  function sol(g, d, h, b){
    var pas = 48;
    ctx.fillStyle = monde.sol;
    var x0 = Math.floor(g / pas) * pas, y0 = Math.floor(h / pas) * pas;
    for(var x = x0; x < d + pas; x += pas){
      for(var y = y0; y < b + pas; y += pas){
        if(((Math.round(x / pas) + Math.round(y / pas)) & 1) === 0) continue;
        ctx.fillRect(x, y, pas, pas);
      }
    }
    ctx.strokeStyle = monde.ligne;
    ctx.globalAlpha = .45;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for(var x2 = x0; x2 < d + pas; x2 += pas){ ctx.moveTo(x2, h); ctx.lineTo(x2, b); }
    for(var y2 = y0; y2 < b + pas; y2 += pas){ ctx.moveTo(g, y2); ctx.lineTo(d, y2); }
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function haie(){
    ctx.strokeStyle = monde.haie;
    ctx.lineWidth = 20;
    ctx.beginPath();
    ctx.arc(0, 0, partie.rayon, 0, 6.2832);
    ctx.stroke();
  }

  function buissons(g, d, h, b){
    var marge = 40;
    for(var i = 0; i < partie.obstacles.length; i++){
      var o = partie.obstacles[i];
      if(o.x < g - marge || o.x > d + marge || o.y < h - marge || o.y > b + marge) continue;
      monde.dessinerObstacle(ctx, o, o.x, o.y, o.r);
    }
  }

  function graines(g, d, h, b){
    var t = partie.temps;
    for(var i = 0; i < partie.graines.length; i++){
      var s = partie.graines[i];
      if(s.x < g - 20 || s.x > d + 20 || s.y < h - 20 || s.y > b + 20) continue;
      var r = s.r * (1 + .12 * Math.sin(t * 6 + s.x));
      /* dorees comme la barre d'experience qu'elles remplissent : une graine
         verte sur de l'herbe verte ne disait pas ce qu'elle faisait */
      ctx.globalAlpha = .3;
      ctx.fillStyle = "#ffe9a8";
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.3, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "rgba(60,40,0,.35)";
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 1.28, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "#ffd166";
      ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.85)";
      ctx.beginPath(); ctx.arc(s.x - r * .3, s.y - r * .3, r * .34, 0, 6.2832); ctx.fill();
    }
  }

  /* Les objets au sol. Chacun se dessine differemment : un enfant doit savoir
     ce qu'il ramasse avant de marcher dessus. */
  var DESSINS = {
    fraise: function(x, y, r){
      ctx.fillStyle = "#ff3b52";
      ctx.beginPath();
      ctx.moveTo(x, y + r);
      ctx.bezierCurveTo(x - r * 1.25, y - r * .1, x - r * .55, y - r, x, y - r * .5);
      ctx.bezierCurveTo(x + r * .55, y - r, x + r * 1.25, y - r * .1, x, y + r);
      ctx.fill();
      ctx.fillStyle = "#3f8a3a";
      ctx.beginPath();
      ctx.ellipse(x, y - r * .72, r * .62, r * .26, 0, 0, 6.2832);
      ctx.fill();
    },
    coffre: function(x, y, r){
      ctx.fillStyle = "#a4622a";
      ctx.fillRect(x - r, y - r * .55, r * 2, r * 1.35);
      ctx.fillStyle = "#c87a35";
      ctx.beginPath();
      ctx.arc(x, y - r * .55, r, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = "#ffd166";
      ctx.fillRect(x - r, y - r * .2, r * 2, r * .3);
      ctx.fillRect(x - r * .22, y - r * .55, r * .44, r * 1.35);
    },
    bombe: function(x, y, r){
      ctx.fillStyle = "#2b3550";
      ctx.beginPath(); ctx.arc(x, y + r * .15, r * .92, 0, 6.2832); ctx.fill();
      ctx.strokeStyle = "#a4622a";
      ctx.lineWidth = r * .26;
      ctx.beginPath();
      ctx.moveTo(x + r * .45, y - r * .5);
      ctx.quadraticCurveTo(x + r * 1.1, y - r * 1.1, x + r * .7, y - r * 1.5);
      ctx.stroke();
      ctx.fillStyle = "#ff9f1c";
      ctx.beginPath(); ctx.arc(x + r * .68, y - r * 1.62, r * .3, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.5)";
      ctx.beginPath(); ctx.arc(x - r * .3, y - r * .18, r * .2, 0, 6.2832); ctx.fill();
    },
    glace: function(x, y, r){
      ctx.strokeStyle = "#8fe6ff";
      ctx.lineWidth = r * .3;
      ctx.lineCap = "round";
      for(var i = 0; i < 3; i++){
        var a = i * Math.PI / 3;
        ctx.beginPath();
        ctx.moveTo(x - Math.cos(a) * r, y - Math.sin(a) * r);
        ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
        ctx.stroke();
      }
      ctx.fillStyle = "#e8fbff";
      ctx.beginPath(); ctx.arc(x, y, r * .34, 0, 6.2832); ctx.fill();
    }
  };

  function objets(g, d, h, b){
    var t = partie.temps;
    for(var i = 0; i < partie.objets.length; i++){
      var o = partie.objets[i];
      if(o.x < g - 40 || o.x > d + 40 || o.y < h - 40 || o.y > b + 40) continue;
      var y = o.y + Math.sin(t * 3 + o.x) * 2.5;
      ctx.fillStyle = "rgba(0,0,0,.2)";
      ctx.beginPath(); ctx.ellipse(o.x, o.y + o.r, o.r * .8, o.r * .3, 0, 0, 6.2832); ctx.fill();
      /* le halo : ils doivent se voir de loin, c'est ce qui donne le rythme */
      ctx.globalAlpha = .32 + .14 * Math.sin(t * 4 + o.x);
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(o.x, y, o.r * 2, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
      (DESSINS[o.sorte] || DESSINS.fraise)(o.x, y, o.r);
    }
  }

  /* ce qui vient de souffler */
  function explosions(){
    for(var i = 0; i < partie.explosions.length; i++){
      var e = partie.explosions[i];
      var part = (partie.temps - e.debut) / e.duree;
      if(part < 0 || part > 1) continue;
      ctx.globalAlpha = (1 - part) * .45;
      ctx.fillStyle = "#ff7a3d";
      ctx.beginPath(); ctx.arc(e.x, e.y, e.rayon * (0.35 + part * 0.65), 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1 - part;
      ctx.strokeStyle = "#ffd166";
      ctx.lineWidth = 12 * (1 - part) + 3;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.rayon * (0.35 + part * 0.65), 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  /* ce que les bestioles envoient, et l'onde de la montee de niveau */
  function tirs(){
    for(var i = 0; i < partie.tirs.length; i++){
      var t = partie.tirs[i];
      ctx.fillStyle = "rgba(0,0,0,.2)";
      ctx.beginPath(); ctx.arc(t.x, t.y + 2, t.r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = t.couleur;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, 6.2832); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.6)";
      ctx.beginPath(); ctx.arc(t.x - t.r * .3, t.y - t.r * .3, t.r * .34, 0, 6.2832); ctx.fill();
    }
  }

  function onde(){
    var o = partie.onde;
    if(!o) return;
    var part = (partie.temps - o.debut) / o.duree;
    if(part < 0 || part > 1){ partie.onde = null; return; }
    var j = partie.joueur;
    ctx.globalAlpha = (1 - part) * .55;
    ctx.fillStyle = "#ffe9a8";
    ctx.beginPath(); ctx.arc(j.x, j.y, o.rayon * part, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1 - part;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 10 * (1 - part) + 3;
    ctx.beginPath(); ctx.arc(j.x, j.y, o.rayon * part, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  /* ------------------------------------------------------- le chevalier */

  function chevalier(){
    var j = partie.joueur, r = j.rayon, a = j.angle;
    var clignote = partie.temps < j.invincibleJusqua &&
                   Math.floor(partie.temps * 12) % 2 === 0;
    ctx.globalAlpha = clignote ? .4 : 1;

    ctx.fillStyle = "rgba(0,0,0,.26)";
    ctx.beginPath();
    ctx.ellipse(j.x, j.y + r * .92, r * 1.02, r * .42, 0, 0, 6.2832);
    ctx.fill();

    ctx.save();
    ctx.translate(j.x, j.y);
    ctx.rotate(a);

    /* la cape, derriere, bien visible */
    ctx.fillStyle = "#d94f2b";
    ctx.beginPath();
    ctx.ellipse(-r * .45, 0, r * 1.05, r * .95, 0, 0, 6.2832);
    ctx.fill();

    /* le corps */
    ctx.fillStyle = "#f6ecd4";
    ctx.beginPath();
    ctx.arc(0, 0, r * .92, 0, 6.2832);
    ctx.fill();

    /* le heaume dore, tourne vers la marche */
    ctx.fillStyle = "#ffc233";
    ctx.beginPath();
    ctx.arc(r * .12, 0, r * .82, -2.1, 2.1);
    ctx.closePath();
    ctx.fill();

    /* la fente des yeux */
    ctx.fillStyle = "#20263a";
    ctx.fillRect(r * .46, -r * .34, r * .3, r * .68);

    /* le plumet */
    ctx.fillStyle = "#ff6b3d";
    ctx.beginPath();
    ctx.ellipse(-r * .5, -r * .78, r * .5, r * .24, -0.5, 0, 6.2832);
    ctx.fill();

    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function dessiner(){
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = monde.fond;
    ctx.fillRect(0, 0, L, H);

    ctx.save();
    ctx.translate(L / 2, H / 2);
    ctx.translate(-camera.x, -camera.y);

    var g = camera.x - L / 2, d = camera.x + L / 2,
        h = camera.y - H / 2, b = camera.y + H / 2;

    sol(g, d, h, b);
    haie();
    /* ⚠️ Le voile du temps se pose ICI, sur le sol et sous les bestioles :
       la nuit assombrit le decor, jamais ce qui peut tuer. */
    var temps = Meteo.TEMPS[partie.meteo.nom];
    if(temps && temps.teinte){
      ctx.fillStyle = temps.teinte;
      ctx.fillRect(g, h, d - g, b - h);
    }
    /* pendant la roue, on ne montre que la prairie : l'enfant voit son arme
       avant de voir ce qui l'attend */
    if(!ecranRoue.hidden){ ctx.restore(); return; }
    graines(g, d, h, b);
    objets(g, d, h, b);
    buissons(g, d, h, b);

    var t = partie.temps;
    var gele = partie.temps < partie.gelJusqua;
    for(var i = 0; i < partie.bestioles.length; i++){
      var be = partie.bestioles[i];
      if(be.x < g - 40 || be.x > d + 40 || be.y < h - 40 || be.y > b + 40) continue;
      /* la nuit detache les bestioles du fond : voir meteo.js */
      if(temps && temps.contour){
        ctx.fillStyle = temps.contour;
        ctx.beginPath(); ctx.arc(be.x, be.y, be.rayon * 1.5, 0, 6.2832); ctx.fill();
      }
      if(be.espece.dessiner) be.espece.dessiner(ctx, be, gele ? 0 : t);
      /* la glace en bleu, le souffle de la bombe en rouge : on voit ce qui
         leur arrive avant qu'elles ne tombent */
      var teinte = be.brule ? "#ff3b2f" : (gele ? "#8fe6ff" : null);
      if(!teinte) continue;
      ctx.globalAlpha = be.brule ? .7 : .55;
      ctx.fillStyle = teinte;
      ctx.beginPath(); ctx.arc(be.x, be.y, be.rayon * 1.25, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = 1;
    }

    tirs();
    explosions();
    chevalier();
    armes.dessiner(ctx);
    onde();
    ctx.restore();

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    /* la pluie et les lucioles passent devant le jeu, mais derriere le HUD */
    if(temps && temps.devant) temps.devant(ctx, L, H, partie.temps);
    hud();
    commandes();
    if(afficheMesure) compteur();
  }

  /* ------------------------------------------------------------- le HUD */

  function coeur(x, y, r, plein){
    ctx.fillStyle = plein ? "#ff4d5e" : "rgba(255,255,255,.28)";
    ctx.beginPath();
    ctx.moveTo(x, y + r * .85);
    ctx.bezierCurveTo(x - r * 1.3, y - r * .3, x - r * .35, y - r * 1.1, x, y - r * .35);
    ctx.bezierCurveTo(x + r * .35, y - r * 1.1, x + r * 1.3, y - r * .3, x, y + r * .85);
    ctx.fill();
  }

  function hud(){
    var j = partie.joueur, i;

    /* la barre d'experience, tout en haut, sur toute la largeur */
    var part = Math.max(0, Math.min(1, partie.xpNiveau / partie.xpProchain));
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillRect(0, 0, L, 8);
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(0, 0, L * part, 8);

    /* les coeurs */
    for(i = 0; i < j.coeursMax; i++){
      coeur(20 + i * 22, 30, 9, i < j.coeurs);
    }

    /* les armes : sans elles, on ne sait pas ce qu'on a deja */
    ctx.font = "18px system-ui,-apple-system,sans-serif";
    ctx.textBaseline = "middle";
    for(i = 0; i < armes.armes.length; i++){
      var a = armes.armes[i], x = 14 + i * 32;
      ctx.fillStyle = "rgba(0,0,0,.32)";
      ctx.beginPath(); ctx.arc(x + 12, 62, 15, 0, 6.2832); ctx.fill();
      ctx.textAlign = "center";
      ctx.fillText(a.def.emoji, x + 12, 63);
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 10px system-ui,sans-serif";
      ctx.fillText(a.niveau, x + 24, 74);
      ctx.font = "18px system-ui,-apple-system,sans-serif";
    }

    /* le chronometre */
    var reste = Math.max(0, partie.duree - partie.temps);
    var m = Math.floor(reste / 60), s = Math.floor(reste % 60);
    ctx.font = "700 20px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(0,0,0,.35)";
    ctx.fillText(m + ":" + (s < 10 ? "0" : "") + s, L / 2 + 1, 33);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(m + ":" + (s < 10 ? "0" : "") + s, L / 2, 32);
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
  }

  /* -------------------------------------------------------------- le doigt

     Le manche flotte : il apparait la ou le pouce se pose. Il n'y a pas
     d'autre commande, les armes frappent toutes seules. */

  var RAYON_MANCHE = 46, SEUIL_MANCHE = 8, MARGE_BAS = 100, MARGE_COTE = 62,
      manche = { actif: false, id: null, ox: 0, oy: 0, x: 0, y: 0, angle: 0, tire: 0 };

  function repos(){ return { x: MARGE_COTE, y: H - MARGE_BAS, r: 34 }; }

  function doigtPose(e){
    e.preventDefault();
    if(manche.actif) return;
    manche.actif = true;
    manche.id = e.pointerId;
    manche.ox = manche.x = e.clientX;
    manche.oy = manche.y = e.clientY;
    manche.tire = 0;
  }

  function doigtBouge(e){
    if(!manche.actif || e.pointerId !== manche.id) return;
    manche.x = e.clientX;
    manche.y = e.clientY;
    var dx = manche.x - manche.ox, dy = manche.y - manche.oy;
    manche.tire = Math.hypot(dx, dy);
    if(manche.tire >= SEUIL_MANCHE) manche.angle = Math.atan2(dy, dx);
  }

  function doigtLeve(e){
    if(manche.actif && e.pointerId === manche.id){
      manche.actif = false; manche.id = null; manche.tire = 0;
    }
  }

  cv.addEventListener("pointerdown", doigtPose);
  window.addEventListener("pointermove", doigtBouge);
  window.addEventListener("pointerup", doigtLeve);
  window.addEventListener("pointercancel", doigtLeve);

  function anneau(x, y, r, fond, trait){
    ctx.globalAlpha = trait * .6;
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = fond;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = trait;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function pastille(x, y, r, a){
    ctx.globalAlpha = a * .4;
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(x, y + 1.5, r + 1.5, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function commandes(){
    if(manche.actif){
      var dx = manche.x - manche.ox, dy = manche.y - manche.oy, d = Math.hypot(dx, dy);
      if(d > RAYON_MANCHE){ dx = dx / d * RAYON_MANCHE; dy = dy / d * RAYON_MANCHE; }
      anneau(manche.ox, manche.oy, RAYON_MANCHE, .18, .34);
      pastille(manche.ox + dx, manche.oy + dy, 20, .88);
    }else{
      var r = repos();
      anneau(r.x, r.y, r.r, .10, .22);
      pastille(r.x, r.y, 14, .26);
    }
  }

  /* ------------------------------------------------------------- la roue

     Elle ne decide rien : la partie a deja tire son arme, la roue la montre.
     Un enfant doit voir avec quoi il commence, sinon il ne comprend pas
     pourquoi deux parties ne se jouent pas pareil. */

  var ecranRoue = document.getElementById("roue"),
      roueDessin = document.getElementById("roueDessin"),
      roueNom = document.getElementById("roueNom"),
      rc = roueDessin.getContext("2d"),
      roue = { tourne: false, debut: 0, duree: 2.8, fin: 0, nom: null, fait: null };

  var DUREE_ROUE = 2.8, PAUSE_ROUE = 1100;

  function segmentsDeLaRoue(){
    var noms = Object.keys(Armes.CATALOGUE);
    return noms.concat(noms);          /* deux tours d'armes : six parts */
  }

  function lancerRoue(nom, apres){
    var parts = segmentsDeLaRoue();
    var i = parts.indexOf(nom);
    var pas = Math.PI * 2 / parts.length;
    var centre = i * pas + pas / 2;
    roue.nom = nom;
    roue.fait = apres;
    roue.debut = performance.now();
    roue.fin = (-Math.PI / 2 - centre) + Math.PI * 2 * 5;   /* cinq tours */
    roue.tourne = true;
    roueNom.className = "titre vide";
    roueNom.innerHTML = "";
    ecranRoue.hidden = false;
    dessinerRoue(0);
  }

  function finirRoue(){
    if(!roue.tourne) return;
    roue.tourne = false;
    var def = Armes.CATALOGUE[roue.nom];
    roueNom.className = "titre";
    roueNom.innerHTML = '<span class="ic">' + def.emoji + '</span>' + def.nom;
    var suite = roue.fait;
    roue.fait = null;
    setTimeout(function(){
      ecranRoue.hidden = true;
      if(suite) suite();
    }, PAUSE_ROUE);
  }

  function dessinerRoue(part){
    var parts = segmentsDeLaRoue();
    var pas = Math.PI * 2 / parts.length;
    var rot = roue.fin * (1 - Math.pow(1 - part, 3));      /* vite, puis lentement */
    var L2 = roueDessin.width / 2, R2 = L2 - 34;

    rc.clearRect(0, 0, roueDessin.width, roueDessin.height);
    rc.save();
    rc.translate(L2, L2);
    rc.rotate(rot);
    for(var i = 0; i < parts.length; i++){
      var def = Armes.CATALOGUE[parts[i]];
      rc.fillStyle = i % 2 ? def.couleur : ombrer(def.couleur);
      rc.beginPath();
      rc.moveTo(0, 0);
      rc.arc(0, 0, R2, i * pas, (i + 1) * pas);
      rc.closePath();
      rc.fill();
      rc.strokeStyle = "rgba(0,0,0,.18)";
      rc.lineWidth = 3;
      rc.stroke();
      /* l'arme, toujours droite pour rester lisible */
      var a = i * pas + pas / 2;
      rc.save();
      rc.translate(Math.cos(a) * R2 * .66, Math.sin(a) * R2 * .66);
      rc.rotate(-rot);
      rc.font = "64px system-ui,-apple-system,sans-serif";
      rc.textAlign = "center";
      rc.textBaseline = "middle";
      rc.fillText(def.emoji, 0, 0);
      rc.restore();
    }
    rc.restore();

    /* le moyeu et le pointeur */
    rc.fillStyle = "#20301a";
    rc.beginPath(); rc.arc(L2, L2, 44, 0, 6.2832); rc.fill();
    rc.fillStyle = "#ffd166";
    rc.beginPath(); rc.arc(L2, L2, 30, 0, 6.2832); rc.fill();
    rc.strokeStyle = "#ffffff";
    rc.lineWidth = 10;
    rc.beginPath(); rc.arc(L2, L2, R2 + 8, 0, 6.2832); rc.stroke();
    rc.fillStyle = "#ffffff";
    rc.beginPath();
    rc.moveTo(L2, 40);
    rc.lineTo(L2 - 26, 0);
    rc.lineTo(L2 + 26, 0);
    rc.closePath();
    rc.fill();
  }

  function ombrer(couleur){
    /* une teinte plus sombre, pour que les parts se distinguent */
    var n = parseInt(couleur.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * .52),
        v = Math.round(((n >> 8) & 255) * .52),
        b = Math.round((n & 255) * .52);
    return "rgb(" + r + "," + v + "," + b + ")";
  }

  function imageRoue(maintenant){
    if(!roue.tourne) return;
    var part = Math.min(1, (maintenant - roue.debut) / 1000 / DUREE_ROUE);
    dessinerRoue(part);
    if(part >= 1) finirRoue();
  }

  /* on touche, on abrege : au bout de vingt parties, l'attente lasse */
  ecranRoue.addEventListener("pointerdown", function(){
    if(roue.tourne){ dessinerRoue(1); finirRoue(); }
  });

  /* --------------------------------------------------- monter de niveau */

  function montrerChoix(){
    if(niveauxDus > 0) niveauxDus--;
    var choix = armes.propositions(3);
    if(!choix.length){                       /* tout est deja au maximum */
      niveauxDus = 0;
      enPause = false;
      dernier = 0;
      return;
    }
    choixEnCours = choix;
    boiteCartes.innerHTML = "";
    choix.forEach(function(c, i){
      var b = document.createElement("button");
      b.className = "carte";
      b.type = "button";
      b.setAttribute("data-choix", i);
      /* la carte dit ce que CE niveau change, pas ce que l'arme fait en
         general : sinon « Epee niveau 3 » ne veut rien dire */
      b.innerHTML = '<span class="ic">' + c.def.emoji + '</span>' +
        '<span class="t"><b>' + c.def.nom +
        (c.niveau > 1 ? ' <em>niveau ' + c.niveau + '</em>' : '') +
        '</b><span>' + Armes.resume(c) + '</span></span>';
      b.addEventListener("click", function(){
        armes.appliquer(choixEnCours[i]);
        choixEnCours = null;
        ecranMontee.hidden = true;
        if(niveauxDus > 0){ montrerChoix(); return; }   /* il en reste un du */
        enPause = false;
        dernier = 0;
      });
      boiteCartes.appendChild(b);
    });
    ecranMontee.hidden = false;
    enPause = true;
  }

  /* --------------------------------------------------------- fin de partie */

  var finProgrammee = null, DELAI_FIN = 900;
  var choixApres = 0, ATTENTE_ONDE = 0.6, niveauxDus = 0;

  function montrerFin(){
    finTitre.textContent = partie.gagne ? "Gagné !" : "Perdu";
    finScore.textContent = partie.xp.toLocaleString("fr-FR");
    var s = Math.floor(partie.temps), m = Math.floor(s / 60);
    document.getElementById("finTemps").textContent =
      m + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
    document.getElementById("finTues").textContent = partie.tues.toLocaleString("fr-FR");
    document.getElementById("finNiveau").textContent = partie.niveau;
    document.getElementById("finArmes").textContent =
      armes.armes.map(function(a){ return a.def.emoji + a.niveau; }).join(" ") || "-";
    ecranFin.hidden = false;
  }

  /* On prepare la partie, la roue montre l'arme tiree, et le jeu ne demarre
     qu'apres : l'enfant voit avec quoi il part avant de voir les bestioles. */
  function partirEnJeu(){
    if(finProgrammee){ clearTimeout(finProgrammee); finProgrammee = null; }
    demarrer(monde);
    enPause = true;
    lancerRoue(armeDeDepart, function(){
      enPause = false;
      dernier = 0;
    });
  }

  document.getElementById("rejouer").addEventListener("click", partirEnJeu);

  document.getElementById("jouer").addEventListener("click", function(){
    ecranDepart.hidden = true;
    partirEnJeu();
  });

  /* ------------------------------------------------------------- le menu

     L'invitation d'installation de Chrome n'apparait qu'une fois, et jamais
     si elle a ete ignoree. On la garde sous la main et on la propose ici.
     Si le navigateur ne la donne pas, on dit ou la trouver : mieux vaut une
     phrase dans un menu qu'un jeu qu'on ne peut pas installer. */

  var ecranMenu = document.getElementById("menu"),
      boutonMenu = document.getElementById("menuBouton"),
      boutonInstaller = document.getElementById("installer"),
      astuce = document.getElementById("astuce"),
      invitation = null,
      pauseAvantMenu = false;

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    invitation = e;
  });
  window.addEventListener("appinstalled", function(){
    invitation = null;
    boutonInstaller.hidden = true;
  });

  document.getElementById("menuVersion").textContent = VERSION;

  boutonMenu.addEventListener("click", function(){
    pauseAvantMenu = enPause;
    enPause = true;
    astuce.hidden = true;
    ecranMenu.hidden = false;
  });

  document.getElementById("fermer").addEventListener("click", function(){
    ecranMenu.hidden = true;
    enPause = pauseAvantMenu;
    dernier = 0;
  });

  document.getElementById("recommencer").addEventListener("click", function(){
    ecranMenu.hidden = true;
    partirEnJeu();
  });

  boutonInstaller.addEventListener("click", function(){
    if(!invitation){ astuce.hidden = false; return; }
    invitation.prompt();
    invitation.userChoice.then(function(){
      invitation = null;
      boutonInstaller.hidden = true;
      ecranMenu.hidden = true;
      enPause = pauseAvantMenu;
      dernier = 0;
    });
  });

  /* ------------------------------------------------------------ la mesure */

  var horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 }, bilan = null;

  function chronometrer(dt, t0, t1, t2){
    horloge.n++; horloge.dt += dt;
    horloge.moteur += t1 - t0;
    horloge.dessin += t2 - t1;
    if(horloge.n < 120) return;
    bilan = {
      images: Math.round(horloge.n / horloge.dt),
      moteur: +(horloge.moteur / horloge.n).toFixed(2),
      dessin: +(horloge.dessin / horloge.n).toFixed(2),
      bestioles: partie.bestioles.length,
      graines: partie.graines.length,
      projectiles: armes.projectiles.length
    };
    horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 };
  }

  function compteur(){
    if(!bilan) return;
    ctx.globalAlpha = .55;
    ctx.fillStyle = "#000000";
    ctx.fillRect(8, 84, 196, 44);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffffff";
    ctx.font = "600 12px system-ui,-apple-system,sans-serif";
    ctx.fillText(bilan.images + " images/s   " + bilan.bestioles + " bestioles", 18, 102);
    ctx.fillText("moteur " + bilan.moteur + " ms   dessin " + bilan.dessin + " ms", 18, 120);
  }

  /* ------------------------------------------------------------- la boucle */

  function image(maintenant){
    var dt = Math.min(1 / 20, (maintenant - dernier) / 1000 || 0);
    dernier = maintenant;
    imageRoue(maintenant);
    var t0 = performance.now();

    if(!enPause && partie){
      partie.commander({
        angle: manche.angle,
        avance: manche.actif && manche.tire >= SEUIL_MANCHE
      });
      var faits = partie.pas(dt);
      armes.pas(dt);

      for(var i = 0; i < faits.length; i++){
        /* Un ecran de choix PAR niveau gagne : un coffre peut en faire gagner
           trois d'un coup, et deux cartes disparaissaient en silence.
           L'onde souffle les bestioles ; les cartes attendent qu'elle soit
           passee, sinon on ne la voit pas. */
        if(faits[i].type !== "niveau") continue;
        niveauxDus++;
        if(!choixApres) choixApres = partie.temps + ATTENTE_ONDE;
      }
      var k = Math.min(1, dt * 10);
      camera.x += (partie.joueur.x - camera.x) * k;
      camera.y += (partie.joueur.y - camera.y) * k;

      if(partie.fini && ecranFin.hidden && !finProgrammee){
        finProgrammee = setTimeout(function(){ finProgrammee = null; montrerFin(); }, DELAI_FIN);
      }else if(choixApres && partie.temps >= choixApres && !partie.fini){
        choixApres = 0;
        montrerChoix();
      }
    }

    var t1 = performance.now();
    if(partie) dessiner();
    if(partie && !enPause) chronometrer(dt, t0, t1, performance.now());
    requestAnimationFrame(image);
  }

  var afficheMesure = new URLSearchParams(location.search).get("mesure") === "1";
  window.addEventListener("resize", taille);
  taille();
  demarrer(Mondes.prairie);
  enPause = true;              /* on attend le bouton Jouer */
  requestAnimationFrame(image);

  /* pour les scripts de controle */
  window.jeu = {
    version: VERSION,
    taille: function(){ return [L, H]; },
    partie: function(){ return partie; },
    armes: function(){ return armes; },
    monde: function(){ return monde; },
    meteo: function(){ return partie.meteo; },
    changerLeTemps: function(nom){
      partie.meteo = { nom: nom, debut: partie.temps, jusqua: partie.temps + 999 };
      return nom;
    },
    armeDeDepart: function(){ return armeDeDepart; },
    roue: function(){
      return {
        visible: !ecranRoue.hidden,
        tourne: roue.tourne,
        montre: roueNom.textContent,
        nom: roue.nom
      };
    },
    tournerLaRoue: function(){
      ecranDepart.hidden = true;
      partirEnJeu();
      return armeDeDepart;
    },
    reglages: function(){ return { valeurs: Moteur.REGLAGES }; },
    mesure: function(){ return bilan; },
    commencer: function(graine){
      ecranDepart.hidden = true;
      demarrer(monde, graine);
      dernier = 0;
      return true;
    },
    ecrans: function(){
      return {
        niveauxDus: niveauxDus,
        depart: !ecranDepart.hidden,
        montee: !ecranMontee.hidden,
        roue: !ecranRoue.hidden,
        fin: !ecranFin.hidden,
        menu: !ecranMenu.hidden,
        astuce: !astuce.hidden,
        pause: enPause,
        cartes: choixEnCours ? choixEnCours.length : 0
      };
    },
    menu: function(quoi){
      var b = document.getElementById(quoi);
      if(b) b.click();
      return !!b;
    },
    choisir: function(i){
      var b = boiteCartes.querySelector('[data-choix="' + i + '"]');
      if(b) b.click();
      return !!b;
    }
  };
  window.serpentin = window.jeu;   /* l'ancien nom, pour les scripts existants */
})();

/* La mise a jour.

   ⚠️ Sans ca, une version installee sert son cache indefiniment : elle a joue
   pendant deux corrections sans les avoir. Le nouveau service worker prend la
   main tout seul (skipWaiting et claim), mais la page DEJA CHARGEE garde son
   ancien code en memoire. On la recharge donc une fois, au moment precis ou
   le nouveau prend le controle. */
if("serviceWorker" in navigator){
  var rechargeFaite = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(rechargeFaite) return;
    rechargeFaite = true;
    location.reload();
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      reg.update();          /* on demande tout de suite s'il y a du neuf */
    });
  });
}
</script>
</body>
</html>
