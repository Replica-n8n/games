    pauseAvantMenu = enPause;
    enPause = true;
    astuce.hidden = true;
    ecranMenu.hidden = false;
  });

  document.getElementById("fermer").addEventListener("click", function(){
    ecranMenu.hidden = true;
    enPause = pauseAvantMenu;
    dernier = 0;
  });

  /* ⚠️ Le mode DIFFICILE. Il est ne comme un mode d'essai — « je n'ai pas
     envie d'attendre six minutes pour rencontrer la limace et le scarabee » —
     et il s'est avere etre exactement un mode difficile : toutes les bestioles
     des la premiere seconde, y compris celles qui attendaient un niveau, et un
     ciel qui tourne toutes les 30 s.

     Dans le code il garde son nom d'origine, `essai`, parce que la cle du
     stockage s'appelle deja comme ca et qu'un enfant qui a choisi son mode ne
     doit pas le perdre parce qu'on a renomme une variable.

     ⚠️ Une partie difficile NE COMPTE PAS dans les souvenirs qui reglent la
     difficulte (voir souvenirs.js) : sinon quelques parties ou l'on meurt en
     une minute adouciraient le VRAI jeu pour de bon. */
  /* ⚠️ Le personnage se choisit AVANT la roue : la roue tire ensuite parmi SES
     armes a lui. Le choix se garde d'une fois sur l'autre, parce qu'un enfant
     qui aime le magicien ne veut pas le rechoisir a chaque partie. */
  var boitePersos = document.getElementById("persos");

  function dessinerChoixPersos(){
    boitePersos.innerHTML = "";
    Object.keys(Armes.PERSOS).forEach(function(nom){
      var d = Armes.PERSOS[nom];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "perso" + (nom === perso ? " pris" : "");
      b.setAttribute("data-perso", nom);
      b.innerHTML = '<div class="ic">' + d.emoji + '</div><b>' + d.nom + '</b>' +
        '<span>' + d.dit + '</span><div class="sorts">' +
        d.armes.map(function(a){ return Armes.CATALOGUE[a].emoji; }).join(" ") +
        '</div>';
      b.addEventListener("click", function(){
        choisirPerso(nom);
      });
      boitePersos.appendChild(b);
    });
  }

  function choisirPerso(nom){
    if(!Armes.PERSOS[nom]) return;
    perso = nom;
    Souvenirs.reglerPerso(nom);
    dessinerChoixPersos();
  }

  var modeNormal = document.getElementById("modeNormal"),
      modeEssai = document.getElementById("modeEssai");

  /* ⚠️ « Enleve les textes dans les options, garde que les boutons. » Les deux
     paragraphes qui expliquaient « Difficile » et « Affronter la reine » sont
     partis. Ce qui reste : la version, les bascules et les boutons. L'astuce
     d'installation reste elle aussi, mais elle est cachee tant qu'on n'a pas
     appuye sur « Installer le jeu » — sans elle il n'y a plus aucun moyen
     d'installer le jeu depuis un navigateur qui ne propose rien. */
  function montrerBascule(){
    var actif = enEssai;
    modeNormal.classList.toggle("pris", !actif);
    modeEssai.classList.toggle("pris", actif);
  }

  function choisirMode(actif){
    if(enEssai === actif) return;
    enEssai = Souvenirs.reglerEssai(actif);
    Bestioles.reglerEssai(actif);
    montrerBascule();
    /* le changement ne prend qu'a la partie suivante : on relance tout de
       suite plutot que de laisser croire qu'il ne s'est rien passe */
    ecranMenu.hidden = true;
    partirEnJeu();
  }

  var sonOui = document.getElementById("sonOui"),
      sonNon = document.getElementById("sonNon");

  function montrerSon(){
    sonOui.classList.toggle("pris", !Sons.muet());
    sonNon.classList.toggle("pris", Sons.muet());
  }

  function choisirSon(actif){
    Sons.reglerMuet(!actif);
    if(actif){ Sons.reveiller(); Sons.jouer("ramasse"); }
    montrerSon();
  }

  sonOui.addEventListener("click", function(){ choisirSon(true); });
  sonNon.addEventListener("click", function(){ choisirSon(false); });
  montrerSon();

  modeNormal.addEventListener("click", function(){ choisirMode(false); });
  modeEssai.addEventListener("click", function(){ choisirMode(true); });

  Bestioles.reglerEssai(enEssai);
  montrerBascule();
  dessinerChoixPersos();

  document.getElementById("recommencer").addEventListener("click", function(){
    /* ⚠️ Recommencer ramene au CHOIX DU PERSONNAGE, pas directement en jeu :
       c'est le moment ou l'on veut changer d'avis. Repartir de force avec le
       meme personnage obligeait a passer par le menu pour en changer. */
    ecranMenu.hidden = true;
    ecranFin.hidden = true;
    enPause = true;
    dessinerChoixPersos();
    ecranDepart.hidden = false;
  });

  /* ⚠️ « Pas envie d'esperer atteindre 8 min pour le tester. » Une repetition
     du combat de fin : equipement de milieu-fin de partie, et la reine tout de
     suite, sans la roue.

     La force passee a `invoquerBoss` n'est pas inventee : c'est la mesure du
     joueur « normal » a huit minutes (20 degats par seconde, entre les 8 du
     joueur modeste et les 42 du plus arme). Sans elle, le moteur lirait les
     degats de la derniere minute — qui n'existe pas — et donnerait a la reine
     sa vie minimale, donc un combat de dix secondes qui ne prouverait rien.

     ⚠️ Et cette partie NE COMPTE PAS dans les souvenirs : on y arrive avec un
     equipement qu'on n'a pas gagne, et on y meurt ou on y gagne pour des
     raisons qui ne disent rien du vrai jeu. */
  var FORCE_REPETITION = 20;

  document.getElementById("laReine").addEventListener("click", function(){
    ecranMenu.hidden = true;
    if(finProgrammee){ clearTimeout(finProgrammee); finProgrammee = null; }
    demarrer(monde);
    partieCompte = false;
    /* de quoi se battre : trois armes montees et deux objets, comme apres huit
       minutes de vraie partie */
    armes.armes.length = 0;
    Armes.PERSOS[perso].armes.forEach(function(nom){
      for(var i = 0; i < 4; i++) armes.donner(nom);
    });
    for(var k = 0; k < 3; k++){ armes.donnerObjet("gantelets"); armes.donnerObjet("bottes"); }
    partie.temps = partie.duree;
    partie.invoquerBoss(FORCE_REPETITION);
    enPause = false;
    dernier = 0;
  });

  boutonInstaller.addEventListener("click", function(){
    if(!invitation){ astuce.hidden = false; return; }
    invitation.prompt();
    invitation.userChoice.then(function(){
      invitation = null;
      boutonInstaller.hidden = true;
      ecranMenu.hidden = true;
      enPause = pauseAvantMenu;
      dernier = 0;
    });
  });

  /* ------------------------------------------------------------ la mesure */

  var horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 }, bilan = null;

  function chronometrer(dt, t0, t1, t2){
    horloge.n++; horloge.dt += dt;
    horloge.moteur += t1 - t0;
    horloge.dessin += t2 - t1;
    if(horloge.n < 120) return;
    bilan = {
      images: Math.round(horloge.n / horloge.dt),
      moteur: +(horloge.moteur / horloge.n).toFixed(2),
      dessin: +(horloge.dessin / horloge.n).toFixed(2),
      bestioles: partie.bestioles.length,
      graines: partie.graines.length,
      projectiles: armes.projectiles.length
    };
    horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 };
  }

  function compteur(){
    if(!bilan) return;
    ctx.globalAlpha = .55;
    ctx.fillStyle = "#000000";
    ctx.fillRect(8, 84, 196, 44);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffffff";
    ctx.font = "600 12px system-ui,-apple-system,sans-serif";
    ctx.fillText(bilan.images + " images/s   " + bilan.bestioles + " bestioles", 18, 102);
    ctx.fillText("moteur " + bilan.moteur + " ms   dessin " + bilan.dessin + " ms", 18, 120);
  }

  /* ------------------------------------------------------------- la boucle */

  function image(maintenant){
    var dt = Math.min(1 / 20, (maintenant - dernier) / 1000 || 0);
    dernier = maintenant;
    imageRoue(maintenant);
    var t0 = performance.now();

    if(!enPause && partie){
      partie.commander({
        angle: manche.angle,
        avance: manche.actif && manche.tire >= SEUIL_MANCHE
      });
      var faits = partie.pas(dt);
      armes.pas(dt);

      /* ⚠️ Les sons se branchent ICI, sur les evenements que le moteur emet
         deja. Le moteur ne connait pas le son, et `sons.js` ne connait pas le
         jeu : chacun reste chez soi. */
      for(var i = 0; i < faits.length; i++) Sons.jouer(SON_DE[faits[i].type] || faits[i].type);
      for(var i = 0; i < faits.length; i++){
        /* Un ecran de choix PAR niveau gagne : un coffre peut en faire gagner
           trois d'un coup, et deux cartes disparaissaient en silence.
           L'onde souffle les bestioles ; les cartes attendent qu'elle soit
           passee, sinon on ne la voit pas. */
        if(faits[i].type === "malus"){
          /* le tirage du moteur, pas Math.random : une partie doit rester
             rejouable a l'identique */
          montrerMalus(armes.retrograder(partie.alea));
          continue;
        }
        if(faits[i].type !== "niveau") continue;
        niveauxDus++;
        if(!choixApres) choixApres = partie.temps + ATTENTE_ONDE;
      }
      /* ⚠️ Le moteur n'emet rien quand une graine est ramassee — il n'y a que
         l'experience qui monte. On l'entend donc a ca. Sans le repos de 45 ms
         de `sons.js`, dix graines aspirees d'un coup feraient un grondement. */
      if(partie.xp > xpEntendu){ Sons.jouer("graine"); }
      xpEntendu = partie.xp;

      var k = Math.min(1, dt * 10);
      camera.x += (partie.joueur.x - camera.x) * k;
      camera.y += (partie.joueur.y - camera.y) * k;

      if(partie.fini && ecranFin.hidden && !finProgrammee){
        finProgrammee = setTimeout(function(){ finProgrammee = null; montrerFin(); }, DELAI_FIN);
      }else if(choixApres && partie.temps >= choixApres && !partie.fini){
        choixApres = 0;
        montrerChoix();
      }
    }

    var t1 = performance.now();
    if(partie) dessiner();
    if(partie && !enPause) chronometrer(dt, t0, t1, performance.now());
    requestAnimationFrame(image);
  }

  var afficheMesure = new URLSearchParams(location.search).get("mesure") === "1";
  window.addEventListener("resize", taille);
  taille();
  demarrer(Mondes.prairie);
  enPause = true;              /* on attend le bouton Jouer */
  requestAnimationFrame(image);

  /* pour les scripts de controle */
  window.jeu = {
    version: VERSION,
    taille: function(){ return [L, H]; },
    partie: function(){ return partie; },
    armes: function(){ return armes; },
    monde: function(){ return monde; },
    meteo: function(){ return partie.meteo; },
    changerLeTemps: function(nom){
      /* on passe par le moteur : c'est lui qui seme la glace et arme la
         foudre. Un raccourci qui posait juste le nom mentait. */
      partie.changerMeteo(nom);
      partie.meteo.jusqua = partie.temps + 999;
      return nom;
    },
    armeDeDepart: function(){ return armeDeDepart; },
    roue: function(){
      return {
        visible: !ecranRoue.hidden,
        tourne: roue.tourne,
        montre: roueNom.textContent,
        nom: roue.nom
      };
    },
    tournerLaRoue: function(){
      ecranDepart.hidden = true;
      partirEnJeu();
      return armeDeDepart;
    },
    reglages: function(){ return { valeurs: Moteur.REGLAGES }; },
    mesure: function(){ return bilan; },
    souvenirs: function(){ return Souvenirs.reglage(); },
    essai: function(){ return enEssai; },
    perso: function(){ return perso; },
    choisirPerso: choisirPerso,
    son: function(){ return { muet: Sons.muet(), pret: Sons.pret(), voix: Sons.voix() }; },
    compte: function(){ return partieCompte; },
    choisirMode: choisirMode,
    commencer: function(graine){
      ecranDepart.hidden = true;
      demarrer(monde, graine);
      dernier = 0;
      return true;
    },
    ecrans: function(){
      return {
        niveauxDus: niveauxDus,
        depart: !ecranDepart.hidden,
        montee: !ecranMontee.hidden,
        roue: !ecranRoue.hidden,
        fin: !ecranFin.hidden,
        menu: !ecranMenu.hidden,
        astuce: !astuce.hidden,
        pause: enPause,
        cartes: choixEnCours ? choixEnCours.length : 0
      };
    },
    menu: function(quoi){
      var b = document.getElementById(quoi);
      if(b) b.click();
      return !!b;
    },
    choisir: function(i){
      var b = boiteCartes.querySelector('[data-choix="' + i + '"]');
      if(b) b.click();
      return !!b;
    }
  };
  window.serpentin = window.jeu;   /* l'ancien nom, pour les scripts existants */
})();

/* La mise a jour.

   ⚠️ Sans ca, une version installee sert son cache indefiniment : elle a joue
   pendant deux corrections sans les avoir. Le nouveau service worker prend la
   main tout seul (skipWaiting et claim), mais la page DEJA CHARGEE garde son
   ancien code en memoire. On la recharge donc une fois, au moment precis ou
   le nouveau prend le controle. */
if("serviceWorker" in navigator){
  var rechargeFaite = false;
  /* ⚠️ A la toute PREMIERE visite il n'y a pas encore de controleur : quand
     le service worker prend la main, il n'y a rien de perime a recharger, et
     recharger la relancait au milieu de sa premiere partie. On ne recharge
     donc que s'il y en avait deja un, c'est a dire pour une mise a jour. */
  var avaitUnControleur = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(rechargeFaite || !avaitUnControleur) return;
    rechargeFaite = true;
    location.reload();
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      reg.update();          /* on demande tout de suite s'il y a du neuf */
    });
  });
}
</script>
</body>
