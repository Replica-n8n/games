        var an = k * .349 + a.r * .008;
        var saut = a.r + ep * .5 + (k % 4) * 5;
        ctx.beginPath();
        ctx.arc(a.x + Math.cos(an) * saut, a.y + Math.sin(an) * saut,
                3 + (k % 3) * 2.5, 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  /* LES ROCHERS DE LAVE du dragon.

     ⚠️ ON NE LES VOYAIT PAS TOMBER. « On ne les voit jamais tomber du ciel et
     s'ecraser, on voit juste un rond par terre. » Deux causes, et les deux
     etaient dans ce dessin :

     - il partait de 75 unites au-dessus du sol, soit deux fois son rayon. A
       cette hauteur-la, sur une seconde, ca ne fait pas une chute, ca fait un
       point qui grossit un peu. Il tombe maintenant de 480 unites, plus haut
       que l'ecran, avec une chute qui ACCELERE — une pierre ne descend pas a
       vitesse constante, et l'oeil le sait.
     - il etait peint en brun sombre (#3A2A24) sur du basalte sombre. Meme
       faute que la vague bleu pale sur le sable : invisible par manque de
       contraste. C'est un METEORE, il brule — noyau sombre, bord incandescent,
       et une trainee derriere lui.

     Et il s'ECRASE : un eclair blanc et une couronne de debris au moment de
     l'impact. Sans ca, l'atterrissage n'existe pas, il y a juste un objet qui
     etait en l'air puis un objet qui est par terre.

     ⚠️ L'ombre au sol reste, et c'est elle le vrai preavis : la regle du jeu
     veut qu'on sache OU une seconde avant, et une chose qui tombe du ciel ne
     dit pas ou elle va atterrir. */
  /* ⚠️ 300, ET PAS 480. Trop haut, le meteore et son ombre se retrouvent aux
     deux bouts de l'ecran et on ne peut plus dire lequel va tomber ou —
     capture a l'appui, la premiere version en mettait un tout en haut de
     l'ecran pendant que sa cible etait au milieu. Une chute doit se LIRE, pas
     seulement exister. Et un fil tendu de l'un a l'autre le dit tout a fait. */
  var HAUT_ROCHER = 300;

  function rochers(){
    if(!partie.rochers) return;
    var pre = Moteur.REGLAGES.rocherPreavis, duree = Moteur.REGLAGES.rocherDuree;
    var R = Moteur.REGLAGES.rocherRayon;
    for(var i = 0; i < partie.rochers.length; i++){
      var o = partie.rochers[i];
      var age = partie.temps - o.ne;

      if(age < pre){
        var t = age / pre;
        var haut = HAUT_ROCHER * (1 - t * t);   /* la chute ACCELERE */
        var ry = o.y - haut;
        var gros = R * (.55 + .45 * t);

        /* LA CIBLE AU SOL. Une ombre douce, et un cercle orange qui SE
           REFERME jusqu'au rayon exact du rocher : c'est lui le preavis, et
           c'est la meme langue que la marque de la foudre. Au premier essai il
           n'y avait qu'une ellipse noire, et elle se lisait comme un TROU dans
           le basalte. */
        ctx.globalAlpha = .16 + .3 * t;
        ctx.fillStyle = "#0A0604";
        ctx.beginPath();
        ctx.ellipse(o.x, o.y, R * (1.1 - .2 * t), R * (.5 - .1 * t), 0, 0, 6.2832);
        ctx.fill();
        ctx.globalAlpha = .35 + .55 * t;
        ctx.strokeStyle = "#FF9A3A";
        ctx.lineWidth = 2 + 3 * t;
        ctx.beginPath();
        ctx.arc(o.x, o.y, R * (2.1 - 1.15 * t), 0, 6.2832);
        ctx.stroke();

        /* LE FIL entre le rocher et sa cible : sans lui on ne sait pas quelle
           ombre appartient a quel rocher quand il en tombe neuf */
        ctx.globalAlpha = .22 + .2 * t;
        ctx.strokeStyle = "#FFB870";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(o.x, o.y);
        ctx.lineTo(o.x, ry + gros);
        ctx.stroke();

        /* la trainee, qui s'efface vers le haut */
        for(var k = 4; k >= 1; k--){
          ctx.globalAlpha = .09 * k * (1 - t * .3);
          ctx.fillStyle = k > 2 ? "#FF7A2B" : "#FFD27A";
          ctx.beginPath();
          ctx.arc(o.x, ry - k * gros * .85, gros * (.95 - k * .17), 0, 6.2832);
          ctx.fill();
        }

        /* LE ROCHER : une PIERRE, avec des angles. Deux essais rates avant
           celui-ci, et la meme faute les deux fois — trop de rond. Un gros
           halo orange autour d'un disque noir faisait un beignet ; y ajouter
           un demi-disque jaune en dessous faisait un bol. Ce qui dit
           « caillou », ce sont les ARETES : un polygone irregulier, sombre,
           cercle d'un trait incandescent, comme les rochers du volcan qu'il
           vient rejoindre. */
        ctx.globalAlpha = .38;
        ctx.fillStyle = "#FF7A2B";
        ctx.beginPath(); ctx.arc(o.x, ry, gros * 1.35, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 1;

        ctx.beginPath();
        for(var v = 0; v < 7; v++){
          var av2 = v * .8976 + o.x * .05;
          var rv = gros * (.78 + .34 * (Math.sin(o.x * .7 + v * 2.3) * .5 + .5));
          var vx = o.x + Math.cos(av2) * rv, vy = ry + Math.sin(av2) * rv;
          if(v) ctx.lineTo(vx, vy); else ctx.moveTo(vx, vy);
        }
        ctx.closePath();
        ctx.fillStyle = "#241715";
        ctx.fill();
        ctx.strokeStyle = "#FF9A3A";
        ctx.lineWidth = Math.max(2.5, gros * .2);
        ctx.lineJoin = "round";
        ctx.stroke();

        /* deux fissures chaudes, pour qu'elle brule aussi a l'interieur */
        ctx.strokeStyle = "#FFD27A";
        ctx.lineWidth = Math.max(1.5, gros * .1);
        ctx.beginPath();
        ctx.moveTo(o.x - gros * .4, ry - gros * .1);
        ctx.lineTo(o.x + gros * .05, ry + gros * .2);
        ctx.lineTo(o.x + gros * .42, ry - gros * .18);
        ctx.stroke();
        ctx.globalAlpha = 1;
        continue;
      }

      var vieux = Math.min(1, (pre + duree - age) / 3);

      /* L'IMPACT : un quart de seconde d'eclair et de debris. C'est ce qui
         manquait pour qu'on voie qu'il ARRIVE, et pas qu'il est la. */
      var choc = age - pre;
      if(choc < .35){
        var c = choc / .35;
        ctx.globalAlpha = (1 - c) * .9;
        ctx.strokeStyle = "#FFE0A0";
        ctx.lineWidth = 7 * (1 - c) + 2;
        ctx.beginPath();
        ctx.arc(o.x, o.y, R * (.8 + c * 2.6), 0, 6.2832);
        ctx.stroke();
        ctx.fillStyle = "#FF9A3A";
        for(var d = 0; d < 8; d++){
          var ad = d * .7854 + o.x * .01;
          var loin = R * (.9 + c * 2.2);
          ctx.globalAlpha = (1 - c) * .85;
          ctx.beginPath();
          ctx.arc(o.x + Math.cos(ad) * loin, o.y + Math.sin(ad) * loin * .6,
                  4 * (1 - c) + 2, 0, 6.2832);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      /* ⚠️ IL BRULE, il ne rougeoie plus. « Les meteores devraient rester en
         feu une fois ecrases. » Avant : deux disques oranges qui battaient sur
         place. Ca disait « chaud », ca ne disait pas « feu » — et une chose
         qui brule pendant douze secondes au milieu de l'arene doit se lire
         comme un danger vivant, pas comme une braise decorative.

         Ce qui fait un feu, ce sont des LANGUES qui montent, qui changent de
         hauteur chacune a son rythme, et qui s'affinent vers le haut. Quatre
         suffisent : au-dela on ne les distingue plus, et il peut y avoir
         trente rochers a l'ecran.

         ⚠️ Les phases viennent de `o.x`, pas d'un tirage : deux rochers
         voisins ne battent jamais ensemble, et le meme rocher garde son
         rythme d'une image a l'autre. Un feu qui se retire au hasard a chaque
         image grelotte au lieu de brancher. */
      var chaud = vieux;                     /* il palit sur ses 3 dernieres s */

      /* la lueur au sol : c'est elle qui dit « n'approche pas » de loin */
      var pouls = .78 + .22 * Math.sin(partie.temps * 4.5 + o.x * .05);
      ctx.globalAlpha = chaud * .3 * pouls;
      ctx.fillStyle = "#FF7A2B";
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, R * 1.5, R * 1.1, 0, 0, 6.2832);
      ctx.fill();

      /* la roche, sombre : le feu ne se voit que s'il a un fond noir */
      ctx.globalAlpha = chaud;
      ctx.fillStyle = "#241715";
      ctx.beginPath();
      ctx.arc(o.x, o.y, R * .88, 0, 6.2832);
      ctx.fill();

      /* les langues. Deux couches par langue : le corps orange, le coeur
         clair plus court — c'est ce decalage qui fait la profondeur. */
      for(var f = 0; f < 4; f++){
        var ph = o.x * .07 + f * 1.9;
        var bat = .5 + .5 * Math.sin(partie.temps * (5.5 + f * .7) + ph);
        var hx = o.x + Math.cos(ph) * R * .34;
        var hy = o.y + Math.sin(ph) * R * .26;
        var haut = R * (.75 + .55 * bat);
        var large = R * (.3 + .1 * bat);
        var couche;
        for(couche = 0; couche < 2; couche++){
          var k = couche === 0 ? 1 : .55;
          ctx.globalAlpha = chaud * (couche === 0 ? .95 : 1);
          ctx.fillStyle = couche === 0 ? "#FF7A2B" : "#FFD880";
          ctx.beginPath();
          ctx.moveTo(hx - large * k, hy);
          ctx.quadraticCurveTo(hx - large * k * .9, hy - haut * k * .72,
                               hx + Math.sin(partie.temps * 3 + ph) * R * .1,
                               hy - haut * k);
          ctx.quadraticCurveTo(hx + large * k * .9, hy - haut * k * .72,
                               hx + large * k, hy);
          ctx.quadraticCurveTo(hx, hy + large * k * .5, hx - large * k, hy);
          ctx.closePath();
          ctx.fill();
        }
      }

      /* deux braises qui montent et s'eteignent */
      for(var e2 = 0; e2 < 2; e2++){
        var cy = ((partie.temps * .8 + o.x * .013 + e2 * .5) % 1);
        ctx.globalAlpha = chaud * (1 - cy) * .8;
        ctx.fillStyle = "#FFC24A";
        ctx.beginPath();
        ctx.arc(o.x + Math.sin(cy * 6 + o.x + e2) * R * .5,
                o.y - cy * R * 1.9, R * .09 * (1 - cy * .6), 0, 6.2832);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }

  /* Les salamandres qui courent. Elles remplacent le piment : ce n'est plus le
     chevalier qui seme le feu, c'est elles. Corps allonge, ventre clair, et une
     queue qui ondule — une silhouette basse que rien d'autre du jeu ne porte. */
  function salamandres(){
    if(!partie.salamandres) return;
    for(var i = 0; i < partie.salamandres.length; i++){
      var s = partie.salamandres[i];
      var reste = s.jusqua - partie.temps;
      /* la derniere seconde, elle palit : on voit qu'elle va s'eteindre */
      var vif = Math.min(1, reste);
      /* ⚠️ 19 et non 15 : a 15 elle se noyait dans sa propre trainee, dont
         les flammees font 26 de rayon. Capture a l'appui. */
      var r = 19;
      var t = partie.temps * 9 + s.phase;

      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.angle);
      ctx.globalAlpha = vif;

      /* ⚠️ ELLE EST PLUS CLAIRE QUE SON PROPRE FEU. Deux essais rates avant :
         orange, elle se noyait dans sa trainee ; cerclee de sombre, elle
         avait l'air d'une cage. Ce qui la detache, c'est d'etre le point le
         plus BLANC de l'image — le coeur d'un feu est toujours plus clair que
         ses flammes, et le jeu n'a rien d'autre de blanc chaud au sol. */

      /* la queue, en trois segments qui ondulent */
      ctx.strokeStyle = "#ff9f1c";
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-r * .3, 0);
      for(var k = 1; k <= 3; k++){
        ctx.lineWidth = r * (.5 - k * .11);
        ctx.lineTo(-r * (.3 + k * .42), Math.sin(t - k) * r * .3);
      }
      ctx.stroke();

      /* les quatre pattes, ecartees, qui battent */
      ctx.strokeStyle = "#ff7a2e";
      ctx.lineWidth = Math.max(2, r * .16);
      for(var q = 0; q < 4; q++){
        var px = (q < 2 ? r * .34 : -r * .18);
        var cote = q % 2 ? 1 : -1;
        ctx.beginPath();
        ctx.moveTo(px, cote * r * .28);
        ctx.lineTo(px + Math.sin(t + q * 1.6) * r * .2, cote * r * .62);
        ctx.stroke();
      }

      /* le corps : blanc chaud, borde d'orange */
      ctx.fillStyle = "#ff9f1c";
      ctx.beginPath();
      ctx.ellipse(r * .1, 0, r * .72, r * .42, 0, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = "#fff3c4";
      ctx.beginPath();
      ctx.ellipse(r * .1, 0, r * .58, r * .3, 0, 0, 6.2832);
      ctx.fill();
      /* trois taches de braise sur le dos, elles, bien oranges */
      ctx.fillStyle = "#ff7a2e";
      for(var d2 = 0; d2 < 3; d2++){
        ctx.beginPath();
        ctx.arc(r * (.42 - d2 * .3), -r * .05, r * .09, 0, 6.2832);
        ctx.fill();
      }
      /* la tete, la plus claire de tout */
      ctx.fillStyle = "#ff9f1c";
      ctx.beginPath();
      ctx.ellipse(r * .82, 0, r * .36, r * .3, 0, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = "#fffdf2";
      ctx.beginPath();
      ctx.ellipse(r * .84, 0, r * .26, r * .2, 0, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = "#3a1200";
      ctx.beginPath();
      ctx.arc(r * .92, -r * .09, r * .08, 0, 6.2832);
      ctx.fill();
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  /* La trainee de feu des salamandres. Elle s'eteint par le bout le plus vieux :
     la flammee palit et retrecit a mesure qu'elle vieillit. */
  function feu(g, d, h, b){
    var vie = Moteur.REGLAGES.feuVie, R = Moteur.REGLAGES.feuRayon;
    for(var i = 0; i < partie.feux.length; i++){
      var f = partie.feux[i];
      if(f.x < g - 60 || f.x > d + 60 || f.y < h - 60 || f.y > b + 60) continue;
      var reste = 1 - (partie.temps - f.ne) / vie;
      if(reste <= 0) continue;
      var r = R * (0.45 + 0.55 * reste);
      var vacille = 1 + .12 * Math.sin(partie.temps * 11 + f.tourne * 5);
      ctx.globalAlpha = .30 * reste;
      ctx.fillStyle = "#ff7a18";
      ctx.beginPath(); ctx.arc(f.x, f.y, r * 1.35 * vacille, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = .62 * reste;
      ctx.fillStyle = "#ff9f1c";
      ctx.beginPath(); ctx.arc(f.x, f.y, r * .85 * vacille, 0, 6.2832); ctx.fill();
      ctx.globalAlpha = .8 * reste;
      ctx.fillStyle = "#ffe9a8";
      ctx.beginPath(); ctx.arc(f.x, f.y, r * .38 * vacille, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ⚠️ « Je n'ai pas compris que j'avais un downgrade d'arme. » Le signal ne
     doit pas etre au sol ni dans un coin du HUD : il doit etre LA OU L'ENFANT
     REGARDE, c'est-a-dire sur son personnage. L'arme touchee monte au dessus
     de lui, en gros, avec une fleche vers le bas, et elle clignote. */
  function signeMalus(){
    if(!malus) return;
    var age = partie.temps - malus.ne;
    if(age > 2.4) return;
    var j = partie.joueur;
    var monte = Math.min(1, age / .3);
    var y = j.y - j.rayon - 34 - monte * 26 - Math.max(0, age - .3) * 6;
    var part = age > 1.9 ? 1 - (age - 1.9) / .5 : 1;
    var bat = .55 + .45 * Math.sin(age * 20);

    ctx.globalAlpha = Math.max(0, part);
    /* la pastille rouge qui bat */
    ctx.fillStyle = "rgba(200,30,60," + (.55 + .35 * bat) + ")";
    ctx.beginPath();
    ctx.arc(j.x, y, 26 + 3 * bat, 0, 6.2832);
    ctx.fill();
    /* l'arme touchee, en gros */
    ctx.font = "30px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(malus.perdu.emoji, j.x, y + 1);
    /* la fleche vers le bas, a cote */
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.moveTo(j.x + 26, y - 12);
    ctx.lineTo(j.x + 40, y - 12);
    ctx.lineTo(j.x + 40, y + 1);
    ctx.lineTo(j.x + 47, y + 1);
    ctx.lineTo(j.x + 33, y + 17);
    ctx.lineTo(j.x + 19, y + 1);
    ctx.lineTo(j.x + 26, y + 1);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  /* ⚠️ La barre de vie de la reine. Sans elle, un enfant tape pendant trente
     secondes sans savoir s'il avance : c'est ce qui transforme un boss en mur.
     Elle remplace le chronometre, qui n'a plus rien a compter. */
  function barreDeLaReine(){
    var b = partie.boss;
    if(!b || !b.vivante) return;
    var part = Math.max(0, Math.min(1, b.vie / (b.vieMax || b.vie)));
    /* ⚠️ SOUS les pastilles d'armes, qui vont de 47 a 77 : posee a 44, la
       barre passait dessus et on ne voyait plus ses niveaux. */
    var l = L - 56, x = 28, y = 90;

    ctx.fillStyle = "rgba(0,0,0,.42)";
    arrondi(x - 3, y - 3, l + 6, 20, 10);
    ctx.fill();
    ctx.fillStyle = "#8b1f5e";
    arrondi(x, y, l * part, 14, 7);
    ctx.fill();
    /* une lueur au bout, pour voir la barre bouger a chaque coup */
    if(part > 0.02){
      ctx.fillStyle = "rgba(255,190,230,.85)";
      arrondi(x + l * part - 6, y, 6, 14, 3);
      ctx.fill();
    }
    ctx.font = "700 12px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    /* ⚠️ Le nom vient de la BESTIOLE, il n'est plus ecrit ici. Il l'etait, et
       le crabe de l'ile s'annoncait « LA REINE DES TOILES » — capture a
       l'appui. Un boss par monde veut dire un titre par boss. */
    ctx.fillText((partie.boss.espece.titre || "LE BOSS").toUpperCase(), L / 2, y + 7);
  }

  /* ⚠️ Le mode d'essai doit SE VOIR. Sans marque, on rejoue trois parties en
     se demandant pourquoi le jeu est devenu injouable. */
  function marqueEssai(){
    /* ⚠️ `Souvenirs.essai()` lit le stockage du telephone. Mesure dans Chrome :
       0,05 ms par seconde de jeu, donc ce n'etait pas un probleme — mais rien
       de synchrone n'a sa place dans la boucle de dessin, et un vieux telephone
       n'est pas un Chrome de bureau. On le retient. */
    if(!enEssai) return;
    ctx.font = "700 11px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    var texte = "DIFFICILE";
    var l = ctx.measureText(texte).width;
    /* ⚠️ SOUS le bouton du menu, pas a cote : place en haut a droite, la
       pastille passait derriere le rond des trois points. */
    ctx.globalAlpha = .85;
    ctx.fillStyle = "#ffd166";
    ctx.fillRect(L - l - 22, 76, l + 12, 18);
    ctx.fillStyle = "#243018";
    ctx.fillText(texte, L - 16, 80);
    ctx.globalAlpha = 1;
    ctx.textBaseline = "middle";
  }

  /* Les cinq fruits et legumes a reunir, en haut au centre.

     ⚠️ Ils sont visibles DES LE DEPART, en pale : un enfant doit comprendre
     qu'il y a quelque chose a chercher avant de l'avoir trouve. Une fois
     ramasses ils se colorient, et apres le super pouvoir ils redeviennent
     pales, ce qui dit tout seul « recommence ». */
  function panier(){
    /* pendant le combat de la reine, le panier n'a plus rien a remplir et il
       est juste sous la barre de vie : on lui laisse la place */
    if(partie.boss) return;
    /* ⚠️ « On distingue difficilement un fruit recupere d'un qui manque. »
       L'ecart n'etait qu'une transparence : 0,34 contre 1. Trois choses les
       separent maintenant — le fruit manquant est une SILHOUETTE NOIRE dans un
       cercle vide en pointilles, le fruit trouve est en couleurs pleines dans
       un cercle dore plein, et il porte une coche. */
    var n = Moteur.LEGUMES.length, r = 12, ecart = 38;
    var x0 = L / 2 - (n - 1) * ecart / 2, y = 96;
    for(var i = 0; i < n; i++){
      var nom = Moteur.LEGUMES[i], x = x0 + i * ecart;
      var pris = !!partie.panier[nom];

      if(pris){
        ctx.fillStyle = "rgba(255,209,102,.92)";
        ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 6.2832); ctx.fill();
        ctx.fillStyle = "rgba(0,0,0,.28)";
        ctx.beginPath(); ctx.arc(x, y, r + 2, 0, 6.2832); ctx.fill();
        (DESSINS[nom] || DESSINS.coeur)(x, y, r);
        /* la coche, en bas a droite */
        ctx.strokeStyle = "#8fe37a";
        ctx.lineWidth = 3.5;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x + r * .18, y + r * .78);
        ctx.lineTo(x + r * .62, y + r * 1.2);
        ctx.lineTo(x + r * 1.35, y + r * .18);
        ctx.stroke();
      }else{
        /* le trou : un cercle en pointilles, et l'ombre du fruit dedans */
        ctx.fillStyle = "rgba(0,0,0,.34)";
        ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.55)";
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 6.2832); ctx.stroke();
        ctx.setLineDash([]);
        /* ⚠️ Une SILHOUETTE, pas le fruit en pale : on doit reconnaitre lequel
           manque sans le confondre avec un fruit deja pris. On le dessine, puis
           on l'assombrit d'un disque — `ctx.filter` ferait la meme chose mais
           il coute cher a chaque image et tous les navigateurs ne le suivent
           pas. */
        ctx.globalAlpha = .8;
        (DESSINS[nom] || DESSINS.coeur)(x, y, r);
        ctx.globalAlpha = .72;
        ctx.fillStyle = "#0d1420";
        ctx.beginPath(); ctx.arc(x, y, r + 5, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
    ctx.globalAlpha = 1;
  }

  /* Le cadran du temps, en haut a gauche. Il montre le temps qui vient une
     seconde avant qu'il arrive : on le voit tourner, puis le ciel change. */
  function cadran(){
    var x = 32, y = 120, r = 19;
    var annonce = partie.meteoProchaine;
    var nom = annonce ? annonce.nom : partie.meteo.nom;
    var t = Meteo.TEMPS[nom];
    if(!t || !t.icone) return;

    ctx.globalAlpha = .34;
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(x, y, r + 7, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;

    t.icone(ctx, x, y, r, partie.temps);

    /* pendant l'annonce, l'anneau se remplit : on voit le temps tourner */
    if(annonce){
      var part = 1 - Math.max(0, Math.min(1,
        (annonce.quand - partie.temps) / Moteur.REGLAGES.preavisMeteo));
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, r + 7, -Math.PI / 2, -Math.PI / 2 + part * 6.2832);
      ctx.stroke();
    }
  }

  /* -------------------------------------------------------------- le doigt

     Le manche flotte : il apparait la ou le pouce se pose. Il n'y a pas
     d'autre commande, les armes frappent toutes seules. */

  var RAYON_MANCHE = 46, SEUIL_MANCHE = 8, MARGE_BAS = 100, MARGE_COTE = 62,
      manche = { actif: false, id: null, ox: 0, oy: 0, x: 0, y: 0, angle: 0, tire: 0 };

  function repos(){ return { x: MARGE_COTE, y: H - MARGE_BAS, r: 34 }; }

  function doigtPose(e){
    e.preventDefault();
    if(manche.actif) return;
    manche.actif = true;
    manche.id = e.pointerId;
    manche.ox = manche.x = e.clientX;
    manche.oy = manche.y = e.clientY;
    manche.tire = 0;
  }

  function doigtBouge(e){
    if(!manche.actif || e.pointerId !== manche.id) return;
    manche.x = e.clientX;
    manche.y = e.clientY;
    var dx = manche.x - manche.ox, dy = manche.y - manche.oy;
    manche.tire = Math.hypot(dx, dy);
    if(manche.tire >= SEUIL_MANCHE) manche.angle = Math.atan2(dy, dx);
  }

  function doigtLeve(e){
    if(manche.actif && e.pointerId === manche.id){
      manche.actif = false; manche.id = null; manche.tire = 0;
    }
  }

  cv.addEventListener("pointerdown", doigtPose);
  window.addEventListener("pointermove", doigtBouge);
  window.addEventListener("pointerup", doigtLeve);
  window.addEventListener("pointercancel", doigtLeve);

  function anneau(x, y, r, fond, trait){
    ctx.globalAlpha = trait * .6;
    ctx.strokeStyle = "#000000"; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = fond;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = trait;
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  function pastille(x, y, r, a){
    ctx.globalAlpha = a * .4;
    ctx.fillStyle = "#000000";
    ctx.beginPath(); ctx.arc(x, y + 1.5, r + 1.5, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = a;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function commandes(){
    if(manche.actif){
      var dx = manche.x - manche.ox, dy = manche.y - manche.oy, d = Math.hypot(dx, dy);
      if(d > RAYON_MANCHE){ dx = dx / d * RAYON_MANCHE; dy = dy / d * RAYON_MANCHE; }
      anneau(manche.ox, manche.oy, RAYON_MANCHE, .18, .34);
      pastille(manche.ox + dx, manche.oy + dy, 20, .88);
    }else{
      var r = repos();
      anneau(r.x, r.y, r.r, .10, .22);
      pastille(r.x, r.y, 14, .26);
    }
  }

  /* ------------------------------------------------------------- la roue

     Elle ne decide rien : la partie a deja tire son arme, la roue la montre.
     Un enfant doit voir avec quoi il commence, sinon il ne comprend pas
     pourquoi deux parties ne se jouent pas pareil. */

  var ecranRoue = document.getElementById("roue"),
      roueDessin = document.getElementById("roueDessin"),
      roueNom = document.getElementById("roueNom"),
      rc = roueDessin.getContext("2d"),
      roue = { tourne: false, debut: 0, duree: 2.8, fin: 0, nom: null, fait: null };

  var DUREE_ROUE = 2.8, PAUSE_ROUE = 1100;

  function segmentsDeLaRoue(){
    /* ⚠️ Les armes de CE personnage. Avec `Object.keys(Armes.CATALOGUE)`, la
       roue montrait les six : un magicien y voyait defiler l'epee, le bouclier
       et l'arc qu'il n'aura jamais. La roue doit dire la verite sur ce qui
       peut sortir. */
    var noms = (armes && armes.catalogue) || Armes.PERSOS[perso].armes;
    /* deux tours d'armes : six parts pour le chevalier, huit pour le magicien
       depuis qu'il a le vent. Le compte reste PAIR, donc les parts continuent
       d'alterner clair et sombre. */
    return noms.concat(noms);
  }

  function lancerRoue(nom, apres){
    var parts = segmentsDeLaRoue();
    var i = parts.indexOf(nom);
    var pas = Math.PI * 2 / parts.length;
    var centre = i * pas + pas / 2;
    roue.nom = nom;
    roue.fait = apres;
    roue.debut = performance.now();
    roue.fin = (-Math.PI / 2 - centre) + Math.PI * 2 * 5;   /* cinq tours */
    roue.tourne = true;
    roue.dernierCran = -1;
    roueNom.className = "titre vide";
    roueNom.innerHTML = "";
    ecranRoue.hidden = false;
    dessinerRoue(0);
  }

  function finirRoue(){
    if(!roue.tourne) return;
    roue.tourne = false;
    Sons.jouer("roue");
    var def = Armes.CATALOGUE[roue.nom];
    roueNom.className = "titre";
    roueNom.innerHTML = '<span class="ic">' + def.emoji + '</span>' + def.nom;
    var suite = roue.fait;
    roue.fait = null;
    setTimeout(function(){
      ecranRoue.hidden = true;
      if(suite) suite();
    }, PAUSE_ROUE);
  }

  function dessinerRoue(part){
    var parts = segmentsDeLaRoue();
    var pas = Math.PI * 2 / parts.length;
    var rot = roue.fin * (1 - Math.pow(1 - part, 3));      /* vite, puis lentement */
    var L2 = roueDessin.width / 2, R2 = L2 - 34;

    rc.clearRect(0, 0, roueDessin.width, roueDessin.height);
    rc.save();
    rc.translate(L2, L2);
    rc.rotate(rot);
    for(var i = 0; i < parts.length; i++){
      var def = Armes.CATALOGUE[parts[i]];
      rc.fillStyle = i % 2 ? def.couleur : ombrer(def.couleur);
      rc.beginPath();
      rc.moveTo(0, 0);
      rc.arc(0, 0, R2, i * pas, (i + 1) * pas);
      rc.closePath();
      rc.fill();
      rc.strokeStyle = "rgba(0,0,0,.18)";
      rc.lineWidth = 3;
      rc.stroke();
      /* l'arme, toujours droite pour rester lisible */
      var a = i * pas + pas / 2;
      rc.save();
      rc.translate(Math.cos(a) * R2 * .66, Math.sin(a) * R2 * .66);
      rc.rotate(-rot);
      rc.font = "64px system-ui,-apple-system,sans-serif";
      rc.textAlign = "center";
      rc.textBaseline = "middle";
      rc.fillText(def.emoji, 0, 0);
      rc.restore();
    }
    rc.restore();

    /* le moyeu et le pointeur */
    rc.fillStyle = "#20301a";
    rc.beginPath(); rc.arc(L2, L2, 44, 0, 6.2832); rc.fill();
    rc.fillStyle = "#ffd166";
    rc.beginPath(); rc.arc(L2, L2, 30, 0, 6.2832); rc.fill();
    rc.strokeStyle = "#ffffff";
    rc.lineWidth = 10;
    rc.beginPath(); rc.arc(L2, L2, R2 + 8, 0, 6.2832); rc.stroke();
    rc.fillStyle = "#ffffff";
    rc.beginPath();
    rc.moveTo(L2, 40);
    rc.lineTo(L2 - 26, 0);
    rc.lineTo(L2 + 26, 0);
    rc.closePath();
    rc.fill();
  }

  function ombrer(couleur){
    /* une teinte plus sombre, pour que les parts se distinguent */
    var n = parseInt(couleur.slice(1), 16);
    var r = Math.round(((n >> 16) & 255) * .52),
        v = Math.round(((n >> 8) & 255) * .52),
        b = Math.round((n & 255) * .52);
    return "rgb(" + r + "," + v + "," + b + ")";
  }

  function imageRoue(maintenant){
    if(!roue.tourne) return;
    var part = Math.min(1, (maintenant - roue.debut) / 1000 / DUREE_ROUE);
    dessinerRoue(part);
    /* ⚠️ Le cran de la roue. On ne le joue pas a intervalle regulier mais a
       CHAQUE PART FRANCHIE : c'est ce qui fait entendre le ralentissement, et
       c'est tout l'interet du son d'une roue de la fortune. */
    var parts = segmentsDeLaRoue().length;
    var ou = Math.floor(((roue.fin * part) / (Math.PI * 2)) * parts);
    if(ou !== roue.dernierCran){
      roue.dernierCran = ou;
      Sons.jouer("cran");
    }
    if(part >= 1) finirRoue();
  }

  /* on touche, on abrege : au bout de vingt parties, l'attente lasse */
  ecranRoue.addEventListener("pointerdown", function(){
    if(roue.tourne){ dessinerRoue(1); finirRoue(); }
  });

  /* --------------------------------------------------- monter de niveau */

  /* ⚠️ CHAQUE NIVEAU DEMANDE SA CARTE. AUCUN N'EST APPLIQUE EN SILENCE.

     Ca l'a ete pendant deux jours, et c'etait mon erreur, pas un accident :
     j'avais MESURE qu'un tiers des montees arrivent a moins de deux secondes
     de la precedente, et j'en avais conclu tout seul qu'il fallait n'en
     demander qu'une et OFFRIR les autres. Personne n'avait demande ca.

     Ce que ca donnait en jeu, rapporte le 2026-09-03, capture a l'appui :
     « a chaque niveau 3 et 4 j'ai une barre verte qui me dit que j'ai gagne
     une amelioration alors que ce n'est pas celle que j'ai choisi ». Et c'est
     exactement ce que le code faisait : elle cliquait sur « Arc », et dans la
     MEME poignee de millisecondes une banniere verte annoncait « Heaume ».
     Rien ne confirmait jamais son choix a elle ; le seul retour qu'elle
     recevait nommait autre chose.

     Et ca tombait pile au pire moment. Les trois premiers niveaux coutent 6,
     8 et 10 points ; tuer les deux ou trois premieres bestioles en laisse une
     vingtaine par terre, ramasses en un seul passage. Les niveaux 2, 3 et 4
     naissent donc souvent dans LA MEME IMAGE — ce ne sont pas des cas rares,
     ce sont les upgrades qui decident de toute la partie, et c'etaient
     justement ceux qu'on lui prenait.

     Alors on rend tout. Une grappe de trois niveaux montre trois ecrans, et
     l'ecran DIT combien il en reste (« 1 sur 3 ») : trois cartes d'affilee
     sans explication, ca ressemble a un bug ; « 1 sur 3 », ca ressemble a un
     cadeau. C'est la seule chose qui manquait vraiment. */
  var deLaGrappe = 0;

  function montrerChoix(){
    if(niveauxDus > 0) niveauxDus--;
    var choix = armes.propositions(3);
    if(!choix.length){                       /* tout est deja au maximum */
      niveauxDus = 0;
      deLaGrappe = 0;
      enPause = false;
      dernier = 0;
      return;
    }
    deLaGrappe++;
    var total = deLaGrappe + niveauxDus;
    uMontee.textContent = total > 1 ? "Choisis · " + deLaGrappe + " sur " + total
                                    : "Choisis";
    choixEnCours = choix;
    boiteCartes.innerHTML = "";
    choix.forEach(function(c, i){
      var b = document.createElement("button");
      b.className = "carte";
      b.type = "button";
      b.setAttribute("data-choix", i);
      /* la carte dit ce que CE niveau change, pas ce que l'arme fait en
         general : sinon « Epee niveau 3 » ne veut rien dire */
      b.innerHTML = '<span class="ic">' + c.def.emoji + '</span>' +
        '<span class="t"><b>' + c.def.nom +
        (c.niveau > 1 ? ' <em>niveau ' + c.niveau + '</em>' : '') +
        '</b><span>' + Armes.resume(c) + '</span></span>';
      b.addEventListener("click", function(){
        armes.appliquer(choixEnCours[i]);
        choixEnCours = null;
        ecranMontee.hidden = true;
        /* le reste de la grappe revient, une carte a la fois. Le jeu reste en
           pause pendant le quart de seconde qui separe deux ecrans : sans ce
           temps mort, la deuxieme carte apparait dans la meme image que le
           clic et on la choisit sans l'avoir vue. */
        if(niveauxDus > 0){
          /* ⚠️ on retient LA partie en cours : recommencer ou mourir pendant
             ce quart de seconde ne doit pas faire surgir une carte par dessus
             l'ecran de fin, ni dans la partie suivante */
          var lot = partie;
          setTimeout(function(){
            if(partie === lot && !partie.fini) return montrerChoix();
            niveauxDus = 0;
            deLaGrappe = 0;
            /* meme partie mais finie : on rend la main, sinon l'ecran de fin
               n'arriverait jamais — la boucle le programme, et elle est en
               pause */
            if(partie === lot){ enPause = false; dernier = 0; }
          }, 260);
          return;
        }
        deLaGrappe = 0;
        enPause = false;
        dernier = 0;
      });
      boiteCartes.appendChild(b);
    });
    ecranMontee.hidden = false;
    enPause = true;
  }

  /* --------------------------------------------------------- fin de partie */

  var finProgrammee = null, DELAI_FIN = 900;
  var choixApres = 0, ATTENTE_ONDE = 0.6, niveauxDus = 0;

  /* ⚠️ Deux evenements du moteur ne portent pas le nom du son qu'ils doivent
     declencher : `objet` couvre tout ce qu'on ramasse au sol, et la glace n'a
     pas d'evenement a elle. On traduit ici plutot que de renommer des
     evenements dont d'autres parties du jeu dependent. */
  var xpEntendu = 0;
  var SON_DE = { objet: "ramasse", "meteo annoncee": "", "foudre annoncee": "",
                 naissance: "", buisson: "", onde: "", crachat: "", flaque: "",
                 legume: "", tir: "tir" };

  var dureeRetenue = false;
  /* une repetition du boss ne nourrit pas les souvenirs : voir le bouton */
  var partieCompte = true;

  function montrerFin(){
    /* on retient la duree de cette partie, une seule fois, pour regler la
       suivante. Rien ne sort du telephone. */
    if(!dureeRetenue && partieCompte){
      dureeRetenue = true;
      Souvenirs.ajouter(partie.temps);
    }
    finTitre.textContent = partie.gagne ? "Gagné !" : "Perdu";
    finScore.textContent = partie.xp.toLocaleString("fr-FR");
    var s = Math.floor(partie.temps), m = Math.floor(s / 60);
    document.getElementById("finTemps").textContent =
      m + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
    document.getElementById("finTues").textContent = partie.tues.toLocaleString("fr-FR");
    document.getElementById("finNiveau").textContent = partie.niveau;
    document.getElementById("finArmes").textContent =
      armes.armes.map(function(a){ return a.def.emoji + a.niveau; }).join(" ") || "-";
    ecranFin.hidden = false;
  }

  /* On prepare la partie, la roue montre l'arme tiree, et le jeu ne demarre
     qu'apres : l'enfant voit avec quoi il part avant de voir les bestioles. */
  /* Le monde est tire au sort a chaque partie : prairie, ile ou volcan.

     ⚠️ Le tirage est ICI et pas dans `demarrer`, qui sert aussi aux outils de
     controle et a la reprise d'une graine : eux doivent garder la main sur le
     monde, sinon une partie cesse d'etre rejouable a l'identique. */
  function mondeAuHasard(){
    var tous = Mondes.liste();
    return tous[Math.floor(Math.random() * tous.length)] || Mondes.prairie;
  }

  function partirEnJeu(){
    if(finProgrammee){ clearTimeout(finProgrammee); finProgrammee = null; }
    demarrer(mondeAuHasard());
    enPause = true;
    lancerRoue(armeDeDepart, function(){
      enPause = false;
      dernier = 0;
    });
  }

  document.getElementById("rejouer").addEventListener("click", partirEnJeu);

  document.getElementById("jouer").addEventListener("click", function(){
    /* ⚠️ Un navigateur REFUSE de faire du son avant un geste : c'est ici, et
       nulle part ailleurs, qu'on peut reveiller l'audio. */
    Sons.reveiller();
    ecranDepart.hidden = true;
    partirEnJeu();
  });

  /* ------------------------------------------------------------- le menu

     L'invitation d'installation de Chrome n'apparait qu'une fois, et jamais
     si elle a ete ignoree. On la garde sous la main et on la propose ici.
     Si le navigateur ne la donne pas, on dit ou la trouver : mieux vaut une
     phrase dans un menu qu'un jeu qu'on ne peut pas installer. */

  var ecranMenu = document.getElementById("menu"),
      boutonMenu = document.getElementById("menuBouton"),
      boutonInstaller = document.getElementById("installer"),
      astuce = document.getElementById("astuce"),
      invitation = null,
      pauseAvantMenu = false;

  /* ⚠️ « Retire le bouton installer une fois qu'on a detecte que le jeu est
     installe » — et, si elle le desinstalle, il doit revenir.

     ON NE RETIENT RIEN. La tentation etait d'ecrire « installe » dans
     `localStorage` : ca survivrait a la desinstallation, et le bouton
     disparaitrait POUR TOUJOURS sans qu'aucune manipulation ne le ramene.
     On REDEMANDE donc au navigateur a chaque ouverture du menu, ce qui coute
     une promesse et ne peut pas se tromper longtemps.

     Trois signaux, du plus sur au moins sur :

     1. ON TOURNE DEJA DANS L'APPLICATION (`display-mode: standalone`, ou
        `navigator.standalone` sur iOS). Proposer d'installer ce qui est
        ouvert n'a aucun sens.
     2. `getInstalledRelatedApps()` — le seul qui reponde alors qu'on est dans
        un ONGLET. Il faut pour ca que le manifeste se declare lui-meme dans
        `related_applications`, avec son adresse absolue : sans cette
        declaration la liste revient toujours vide et on ne detecte rien.
        Chromium seulement.
     3. `beforeinstallprompt` : le recevoir PROUVE qu'on n'est pas installe,
        et Chrome le reemet apres une desinstallation. C'est ce qui fait
        revenir le bouton. Son ABSENCE, elle, ne prouve rien : iOS n'en emet
        jamais, d'ou l'astuce ecrite en toutes lettres.

     ⚠️ Dans le doute, on MONTRE le bouton. Un bouton en trop se ferme ; un
     bouton manquant est une fonction qui n'existe pas pour le joueur. */
  function dansLApplication(){
    return navigator.standalone === true ||
      ["standalone", "fullscreen", "minimal-ui"].some(function(mode){
        return window.matchMedia("(display-mode: " + mode + ")").matches;
      });
  }

  /* ⚠️ CE QU'ON A VU DE NOS YEUX GAGNE SUR CE QU'ON REDEMANDE. `appinstalled`
     est un fait ; `getInstalledRelatedApps()` peut tres bien rendre une liste
     vide alors que l'installation vient d'avoir lieu — c'est le cas des qu'on
     n'est pas servi depuis l'adresse declaree dans le manifeste, et donc de
     TOUS les controles locaux. Sans cette priorite, le bouton se recachait
     puis reapparaissait a l'ouverture suivante du menu, mesure a l'appui.
     Ce drapeau ne survit pas a la session, et c'est voulu : au prochain
     lancement, on redemande au navigateur plutot que de croire une memoire. */
  var installeCetteFois = false;

  function verifierInstalle(){
    if(dansLApplication() || installeCetteFois){
      boutonInstaller.hidden = true;
      astuce.hidden = true;
      return;
    }
    boutonInstaller.hidden = false;
    if(!navigator.getInstalledRelatedApps) return;
    navigator.getInstalledRelatedApps().then(function(liste){
      if(dansLApplication() || installeCetteFois) return;
      var installe = !!(liste && liste.length);
      boutonInstaller.hidden = installe;
      if(installe) astuce.hidden = true;
    }).catch(function(){ /* pas de reponse : on laisse le bouton */ });
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    invitation = e;
    /* il vient de nous dire qu'on est installable : le jeu n'est donc PAS
       installe, et c'est comme ca que le bouton revient apres une
       desinstallation */
    installeCetteFois = false;
    boutonInstaller.hidden = false;
  });
  window.addEventListener("appinstalled", function(){
    invitation = null;
    installeCetteFois = true;
    boutonInstaller.hidden = true;
    astuce.hidden = true;
  });
  verifierInstalle();

  document.getElementById("menuVersion").textContent = VERSION;

  boutonMenu.addEventListener("click", function(){
    pauseAvantMenu = enPause;
    enPause = true;
    astuce.hidden = true;
    /* on REDEMANDE a chaque ouverture : c'est ce qui fait revenir le bouton
       apres une desinstallation, sans rien retenir de faux entre-temps */
    verifierInstalle();
    ecranMenu.hidden = false;
  });

  document.getElementById("fermer").addEventListener("click", function(){
    ecranMenu.hidden = true;
    enPause = pauseAvantMenu;
    dernier = 0;
  });

  /* ⚠️ Le mode DIFFICILE. Il est ne comme un mode d'essai — « je n'ai pas
     envie d'attendre six minutes pour rencontrer la limace et le scarabee » —
     et il s'est avere etre exactement un mode difficile : toutes les bestioles
     des la premiere seconde, y compris celles qui attendaient un niveau, et un
     ciel qui tourne toutes les 30 s.

     Dans le code il garde son nom d'origine, `essai`, parce que la cle du
     stockage s'appelle deja comme ca et qu'un enfant qui a choisi son mode ne
     doit pas le perdre parce qu'on a renomme une variable.

     ⚠️ Une partie difficile NE COMPTE PAS dans les souvenirs qui reglent la
     difficulte (voir souvenirs.js) : sinon quelques parties ou l'on meurt en
     une minute adouciraient le VRAI jeu pour de bon. */
  /* ⚠️ Le personnage se choisit AVANT la roue : la roue tire ensuite parmi SES
     armes a lui. Le choix se garde d'une fois sur l'autre, parce qu'un enfant
     qui aime le magicien ne veut pas le rechoisir a chaque partie. */
  var boitePersos = document.getElementById("persos");

  function dessinerChoixPersos(){
    boitePersos.innerHTML = "";
    Object.keys(Armes.PERSOS).forEach(function(nom){
      var d = Armes.PERSOS[nom];
      var b = document.createElement("button");
      b.type = "button";
      b.className = "perso" + (nom === perso ? " pris" : "");
      b.setAttribute("data-perso", nom);
      b.innerHTML = '<div class="ic">' + d.emoji + '</div><b>' + d.nom + '</b>' +
        '<span>' + d.dit + '</span><div class="sorts">' +
        d.armes.map(function(a){ return Armes.CATALOGUE[a].emoji; }).join(" ") +
        '</div>';
      b.addEventListener("click", function(){
        choisirPerso(nom);
      });
      boitePersos.appendChild(b);
    });
  }

  function choisirPerso(nom){
    if(!Armes.PERSOS[nom]) return;
    perso = nom;
    Souvenirs.reglerPerso(nom);
    dessinerChoixPersos();
  }

  var modeNormal = document.getElementById("modeNormal"),
      modeEssai = document.getElementById("modeEssai");

  /* ⚠️ « Enleve les textes dans les options, garde que les boutons. » Les deux
     paragraphes qui expliquaient « Difficile » et « Affronter la reine » sont
     partis. Ce qui reste : la version, les bascules et les boutons. L'astuce
     d'installation reste elle aussi, mais elle est cachee tant qu'on n'a pas
     appuye sur « Installer le jeu » — sans elle il n'y a plus aucun moyen
     d'installer le jeu depuis un navigateur qui ne propose rien. */
  function montrerBascule(){
    var actif = enEssai;
    modeNormal.classList.toggle("pris", !actif);
    modeEssai.classList.toggle("pris", actif);
  }

  function choisirMode(actif){
    if(enEssai === actif) return;
    enEssai = Souvenirs.reglerEssai(actif);
    Bestioles.reglerEssai(actif);
    montrerBascule();
    /* ⚠️ ON NE RELANCE QUE SI UNE PARTIE TOURNE DEJA. La bascule vit
       maintenant sur l'ecran de choix du personnage, juste au dessus du bouton
       Jouer : y toucher la ne doit pas lancer la partie a la place de
       l'enfant, qui n'a peut-etre pas encore choisi son personnage. En cours
       de partie, en revanche, le reglage ne prend qu'a la partie suivante —
       on relance donc tout de suite plutot que de laisser croire qu'il ne
       s'est rien passe. */
    if(ecranDepart.hidden){
      ecranMenu.hidden = true;
      partirEnJeu();
    }
  }

  var sonOui = document.getElementById("sonOui"),
      sonNon = document.getElementById("sonNon");

  function montrerSon(){
    sonOui.classList.toggle("pris", !Sons.muet());
    sonNon.classList.toggle("pris", Sons.muet());
  }

  function choisirSon(actif){
    Sons.reglerMuet(!actif);
    if(actif){ Sons.reveiller(); Sons.jouer("ramasse"); }
    montrerSon();
  }

  sonOui.addEventListener("click", function(){ choisirSon(true); });
  sonNon.addEventListener("click", function(){ choisirSon(false); });
  montrerSon();

  modeNormal.addEventListener("click", function(){ choisirMode(false); });
  modeEssai.addEventListener("click", function(){ choisirMode(true); });

  Bestioles.reglerEssai(enEssai);
  montrerBascule();
  dessinerChoixPersos();

  document.getElementById("recommencer").addEventListener("click", function(){
    /* ⚠️ Recommencer ramene au CHOIX DU PERSONNAGE, pas directement en jeu :
       c'est le moment ou l'on veut changer d'avis. Repartir de force avec le
       meme personnage obligeait a passer par le menu pour en changer. */
    ecranMenu.hidden = true;
    ecranFin.hidden = true;
    enPause = true;
    dessinerChoixPersos();
    ecranDepart.hidden = false;
  });

  /* ⚠️ « Pas envie d'esperer atteindre 8 min pour le tester. » Une repetition
     du combat de fin : equipement de milieu-fin de partie, et la reine tout de
     suite, sans la roue.

     La force passee a `invoquerBoss` n'est pas inventee : c'est la mesure du
     joueur « normal » a huit minutes (20 degats par seconde, entre les 8 du
     joueur modeste et les 42 du plus arme). Sans elle, le moteur lirait les
     degats de la derniere minute — qui n'existe pas — et donnerait a la reine
     sa vie minimale, donc un combat de dix secondes qui ne prouverait rien.

     ⚠️ Et cette partie NE COMPTE PAS dans les souvenirs : on y arrive avec un
     equipement qu'on n'a pas gagne, et on y meurt ou on y gagne pour des
     raisons qui ne disent rien du vrai jeu. */
  var FORCE_REPETITION = 20;

  /* ⚠️ UN BOUTON PAR BOSS, PAS UN SEUL. Il n'y en avait qu'un, « Affronter la
     reine », et il invoquait le boss du monde EN COURS : pour voir le crabe il
     fallait tomber sur l'ile au tirage, et pour le dragon sur le volcan. Elle
     n'a donc jamais pu essayer ni l'un ni l'autre, alors que c'est exactement
     ce que ce bouton existe pour eviter.

     La rangee se remplit depuis `Mondes.tous` et le titre vient de la
     BESTIOLE : ajouter un monde avec un boss ajoute son bouton tout seul, sans
     toucher a cette fonction. C'est la meme raison qui a fait ecrire le titre
     dans `bestioles.js` le jour ou la banniere du crabe s'annoncait « LA REINE
     DES TOILES ». */
  var basculeBoss = document.getElementById("basculeBoss");

  Object.keys(Mondes.tous).forEach(function(nomMonde){
    var m = Mondes.tous[nomMonde];
    if(!m.boss) return;
    var b = document.createElement("button");
    b.type = "button";
    b.id = "boss-" + m.boss;
    var esp = Bestioles.ESPECES[m.boss];
    /* « Le roi crabe » tient sur un bouton, « Le dragon d'obsidienne » non :
       on garde le nom, pas l'article */
    b.textContent = (esp && esp.titre ? esp.titre.replace(/^L[ae] |^L'/, "") : m.boss);
    b.addEventListener("click", function(){ affronter(nomMonde); });
    basculeBoss.appendChild(b);
  });

  function affronter(nomMonde){
    ecranMenu.hidden = true;
    if(finProgrammee){ clearTimeout(finProgrammee); finProgrammee = null; }
    /* ⚠️ ON CHANGE DE MONDE. C'est tout ce qui manquait : le combat se joue
       chez le boss, avec son sol, ses obstacles et sa lave. */
    monde = Mondes.tous[nomMonde];
    demarrer(monde);
    partieCompte = false;
    /* de quoi se battre : trois armes montees et deux objets, comme apres huit
       minutes de vraie partie */
    armes.armes.length = 0;
    Armes.PERSOS[perso].armes.forEach(function(nom){
      for(var i = 0; i < 4; i++) armes.donner(nom);
    });
    for(var k = 0; k < 3; k++){ armes.donnerObjet("gantelets"); armes.donnerObjet("bottes"); }
    partie.temps = partie.duree;
    partie.invoquerBoss(FORCE_REPETITION);
    enPause = false;
    dernier = 0;
  }

  boutonInstaller.addEventListener("click", function(){
    if(!invitation){ astuce.hidden = false; return; }
    invitation.prompt();
    invitation.userChoice.then(function(){
      invitation = null;
      boutonInstaller.hidden = true;
      ecranMenu.hidden = true;
      enPause = pauseAvantMenu;
      dernier = 0;
    });
  });

  /* ------------------------------------------------------------ la mesure */

  var horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 }, bilan = null;

  function chronometrer(dt, t0, t1, t2){
    horloge.n++; horloge.dt += dt;
    horloge.moteur += t1 - t0;
    horloge.dessin += t2 - t1;
    if(horloge.n < 120) return;
    bilan = {
      images: Math.round(horloge.n / horloge.dt),
      moteur: +(horloge.moteur / horloge.n).toFixed(2),
      dessin: +(horloge.dessin / horloge.n).toFixed(2),
      bestioles: partie.bestioles.length,
      graines: partie.graines.length,
      projectiles: armes.projectiles.length
    };
    horloge = { n: 0, dt: 0, moteur: 0, dessin: 0 };
  }

  function compteur(){
    if(!bilan) return;
    ctx.globalAlpha = .55;
    ctx.fillStyle = "#000000";
    ctx.fillRect(8, 84, 196, 44);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffffff";
    ctx.font = "600 12px system-ui,-apple-system,sans-serif";
    ctx.fillText(bilan.images + " images/s   " + bilan.bestioles + " bestioles", 18, 102);
    ctx.fillText("moteur " + bilan.moteur + " ms   dessin " + bilan.dessin + " ms", 18, 120);
  }

  /* ------------------------------------------------------------- la boucle */

  /* 1 en jeu ; un banc peut le monter avec `jeu.accelerer(n)` */
  var TOURS = 1;

  function image(maintenant){
    var dt = Math.min(1 / 20, (maintenant - dernier) / 1000 || 0);
    dernier = maintenant;
    imageRoue(maintenant);
    var t0 = performance.now();

    /* ⚠️ UN ACCELERATEUR, ET IL NE SERT QU'AUX CONTROLES. `TOURS` vaut 1 en
       jeu : la boucle avance d'un pas par image, comme avant. Un banc peut
       demander `jeu.accelerer(12)` et le moteur avance alors de douze pas par
       image DESSINEE — une partie de huit minutes tient en quarante secondes
       au lieu de huit minutes, sans toucher a une seule regle du jeu.

       C'est le dessin qui coute, pas le moteur : `chevalier-foule.mjs` mesure
       0,98 ms de moteur pour soixante bestioles. Multiplier les pas est donc
       presque gratuit ; multiplier les images ne l'est pas.

       ⚠️ Deux choses a ne pas oublier en s'en servant :
       - on SORT de la boucle des qu'un ecran se leve, sinon les onze pas
         suivants se joueraient pendant que le jeu est cense etre arrete ;
       - `chevalier-foule.mjs` ne doit JAMAIS l'utiliser : il mesure des
         millisecondes par image, et douze pas dans une image donneraient
         douze fois le vrai chiffre. */
    for(var tour = 0; tour < TOURS; tour++){
      if(enPause || !partie) break;
      /* ⚠️ Accelere, le pas est FIXE a 1/60 s. Sinon il vaudrait le temps
         reel de l'image — qui s'allonge justement parce qu'on fait douze pas —
         et chaque pas ferait 50 ms de jeu, plafonne par `Math.min`. Un banc
         mesurerait alors un jeu plus grossier que celui qui tourne sur son
         telephone, et deux passages du meme banc ne donneraient pas la meme
         partie. */
      var pas = TOURS > 1 ? 1 / 60 : dt;
      partie.commander({
        angle: manche.angle,
        avance: manche.actif && manche.tire >= SEUIL_MANCHE
      });
      var faits = partie.pas(pas);
      armes.pas(pas);

      /* ⚠️ Les sons se branchent ICI, sur les evenements que le moteur emet
         deja. Le moteur ne connait pas le son, et `sons.js` ne connait pas le
         jeu : chacun reste chez soi. */
      for(var i = 0; i < faits.length; i++) Sons.jouer(SON_DE[faits[i].type] || faits[i].type);
      for(var i = 0; i < faits.length; i++){
        /* Un ecran de choix PAR niveau gagne : un coffre peut en faire gagner
           trois d'un coup, et deux cartes disparaissaient en silence.
           L'onde souffle les bestioles ; les cartes attendent qu'elle soit
           passee, sinon on ne la voit pas. */
        if(faits[i].type === "malus"){
          /* le tirage du moteur, pas Math.random : une partie doit rester
             rejouable a l'identique */
          montrerMalus(armes.retrograder(partie.alea));
          continue;
        }
        if(faits[i].type !== "niveau") continue;
        niveauxDus++;
        if(!choixApres) choixApres = partie.temps + ATTENTE_ONDE;
      }
      /* ⚠️ Le moteur n'emet rien quand une graine est ramassee — il n'y a que
         l'experience qui monte. On l'entend donc a ca. Sans le repos de 45 ms
         de `sons.js`, dix graines aspirees d'un coup feraient un grondement. */
      if(partie.xp > xpEntendu){ Sons.jouer("graine"); }
      xpEntendu = partie.xp;

      var k = Math.min(1, pas * 10);
      camera.x += (partie.joueur.x - camera.x) * k;
      camera.y += (partie.joueur.y - camera.y) * k;

      if(partie.fini && ecranFin.hidden && !finProgrammee){
        finProgrammee = setTimeout(function(){ finProgrammee = null; montrerFin(); }, DELAI_FIN);
      }else if(choixApres && partie.temps >= choixApres && !partie.fini){
        choixApres = 0;
        montrerChoix();
      }
    }

    var t1 = performance.now();
    if(partie) dessiner();
    if(partie && !enPause) chronometrer(dt, t0, t1, performance.now());
    requestAnimationFrame(image);
  }

  var afficheMesure = new URLSearchParams(location.search).get("mesure") === "1";
  window.addEventListener("resize", taille);
  taille();
  demarrer(Mondes.prairie);
  enPause = true;              /* on attend le bouton Jouer */
  requestAnimationFrame(image);

  /* pour les scripts de controle */
  window.jeu = {
    version: VERSION,
    taille: function(){ return [L, H]; },
    partie: function(){ return partie; },
    armes: function(){ return armes; },
    monde: function(){ return monde; },
    meteo: function(){ return partie.meteo; },
    changerLeTemps: function(nom){
      /* on passe par le moteur : c'est lui qui seme la glace et arme la
         foudre. Un raccourci qui posait juste le nom mentait. */
      partie.changerMeteo(nom);
      partie.meteo.jusqua = partie.temps + 999;
      return nom;
    },
    armeDeDepart: function(){ return armeDeDepart; },
    roue: function(){
      return {
        visible: !ecranRoue.hidden,
        tourne: roue.tourne,
        montre: roueNom.textContent,
        nom: roue.nom
      };
    },
    tournerLaRoue: function(){
      ecranDepart.hidden = true;
      partirEnJeu();
      return armeDeDepart;
    },
    reglages: function(){ return { valeurs: Moteur.REGLAGES }; },
    mesure: function(){ return bilan; },
    souvenirs: function(){ return Souvenirs.reglage(); },
    essai: function(){ return enEssai; },
    perso: function(){ return perso; },
    choisirPerso: choisirPerso,
    son: function(){ return { muet: Sons.muet(), pret: Sons.pret(), voix: Sons.voix() }; },
    compte: function(){ return partieCompte; },
    choisirMode: choisirMode,
    /* ⚠️ L'ACCELERATEUR DES CONTROLES. Voir la note dans `image()` : le
       moteur avance de n pas par image dessinee. Refuse au dela de 40, parce
       qu'un pas de plus, c'est un pas de 1/60 s de jeu en plus dans la meme
       image, et qu'a un moment la mesure ne ressemble plus a une partie. */
    accelerer: function(n){
      TOURS = Math.max(1, Math.min(40, n | 0));
      return TOURS;
    },
    /* Fixer le monde, pour les controles : `commencer` s'en sert, alors que
       le bouton Jouer le tire au sort. Sans ca, aucun outil ne peut regarder
       un monde precis, et une partie cesse d'etre rejouable. */
    choisirMonde: function(nom){
      if(!Mondes.tous[nom]) return false;
      monde = Mondes.tous[nom];
      return true;
    },
    mondeCourant: function(){ return monde.nom; },
    commencer: function(graine){
      ecranDepart.hidden = true;
      demarrer(monde, graine);
      dernier = 0;
      return true;
    },
    ecrans: function(){
      return {
        niveauxDus: niveauxDus,
        depart: !ecranDepart.hidden,
        montee: !ecranMontee.hidden,
        roue: !ecranRoue.hidden,
        fin: !ecranFin.hidden,
        menu: !ecranMenu.hidden,
        astuce: !astuce.hidden,
        pause: enPause,
        cartes: choixEnCours ? choixEnCours.length : 0
      };
    },
    menu: function(quoi){
      var b = document.getElementById(quoi);
      if(b) b.click();
      return !!b;
    },
    choisir: function(i){
      var b = boiteCartes.querySelector('[data-choix="' + i + '"]');
      if(b) b.click();
      return !!b;
    }
  };
  window.serpentin = window.jeu;   /* l'ancien nom, pour les scripts existants */
})();

/* La mise a jour.

   ⚠️ Sans ca, une version installee sert son cache indefiniment : elle a joue
   pendant deux corrections sans les avoir. Le nouveau service worker prend la
   main tout seul (skipWaiting et claim), mais la page DEJA CHARGEE garde son
   ancien code en memoire. On la recharge donc une fois, au moment precis ou
   le nouveau prend le controle. */
if("serviceWorker" in navigator){
  var rechargeFaite = false;
  /* ⚠️ A la toute PREMIERE visite il n'y a pas encore de controleur : quand
     le service worker prend la main, il n'y a rien de perime a recharger, et
     recharger la relancait au milieu de sa premiere partie. On ne recharge
     donc que s'il y en avait deja un, c'est a dire pour une mise a jour. */
  var avaitUnControleur = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(rechargeFaite || !avaitUnControleur) return;
    rechargeFaite = true;
    location.reload();
  });
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(reg){
      reg.update();          /* on demande tout de suite s'il y a du neuf */
    });
  });
}
</script>
</body>
