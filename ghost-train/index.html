<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Ce que la page a le droit de charger et de contacter : ses propres fichiers, et
     aucun script venu d'ailleurs. Rien ne peut partir vers un autre serveur. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ghostel</title>
<meta name="description" content="Un vieil hôtel hanté, salle après salle : surveille les cachettes et aspire les fantômes avant qu'ils t'atteignent.">
<meta name="theme-color" content="#2c1c40">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="scene">
  <div id="cadre">
    <canvas id="toile" width="320" height="180" aria-label="Ghostel : les salles de l'hôtel hanté"></canvas>
    <div id="zones"></div>
    <button id="b-torche" class="commande rond" type="button" aria-label="Torche (garder appuyé)" hidden></button>
    <button id="b-super" class="commande rond" type="button" aria-label="Super-attaque" hidden></button>
    <button id="b-pause" class="commande" type="button" aria-label="Pause" hidden></button>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
