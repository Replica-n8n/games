<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>One Piece</title>
<!-- Planche des personnages One Piece (ui/onepiece.js) : calme, démasqué, qui proteste, victime, et en pion.
     Capture : node tools/mockup-conviction-onepiece.mjs -->
<style>
body { margin: 0; background: #c9d0d6; font: 13px system-ui; color: #1b2430; }
#planche { padding: 16px; width: max-content; display: grid; grid-template-columns: 100px repeat(4, 140px) 70px; gap: 10px; align-items: center; }
.face { width: 140px; height: 140px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px #fff; display: block; }
.pion { width: 56px; height: 56px; }
.face svg { width: 100%; height: 100%; display: block; }
b { font-size: 14px; }
</style></head><body><div id="planche"></div>
<script type="module">
import { onepiece, PERSOS_CONNUS } from '../conviction/ui/onepiece.js';
const c = (s, k = '') => `<span class="face ${k}">${s}</span>`;
document.getElementById('planche').innerHTML = '<span></span><b>Calme</b><b>Démasqué</b><b>Proteste</b><b>Victime</b><b>Pion</b>' + PERSOS_CONNUS.map((e) => {
  const p = { id: 'x', name: e, role: '', color: 'sapin', look: { perso: e } };
  return `<b>${e}</b>${c(onepiece(p))}${c(onepiece(p, 'choc'))}${c(onepiece(p, 'fier'))}${c(onepiece({ ...p, victim: true }))}${c(onepiece(p, '', true), 'pion')}`;
}).join('');
document.body.dataset.pret = '1';
</script></body></html>
