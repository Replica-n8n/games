<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bataille rejouable</title>
<style>
/* MAQUETTE : rendre La Bataille rejouable seul. Trois idées validées par Julie
   (2026-10-28) : 1. les cartes se GRAVENT (la gravure reste sur la carte et
   change de camp avec elle), 2. des atouts qui changent une RÈGLE et se
   combinent avec les gravures, 3. l'atlas du ciel et les années maudites.
   Mêmes couleurs, polices et feuilles que bataille/index.html. Rien n'est dans le jeu. */
@font-face{font-family:'Fraunces';font-weight:600;src:url(../bataille/polices/fraunces-600-latin.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:500 700;src:url(../bataille/polices/outfit-latin.woff2) format('woff2')}
:root{color-scheme:dark;--ciel1:#000644;--ciel2:#202a6b;--texte:#f4f2ff;--texte2:#caceff;--accent:#feca63;--lui:#cdacff;--luiPlein:#a57ce5;
  --display:'Fraunces',Georgia,serif;--corps:'Outfit',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#05082a;color:var(--texte);font-family:var(--corps);font-weight:500;padding:24px}
.rangee{display:flex;gap:24px;align-items:flex-start}
.ecran{width:360px;flex:none}
.legende{font:600 20px/1.2 var(--display);margin:0 0 4px;color:var(--accent)}
.sous{font-size:15px;line-height:1.3;color:var(--texte2);margin:0 0 12px;min-height:58px}
.tel{position:relative;width:360px;height:732px;border-radius:28px;overflow:hidden;background:linear-gradient(var(--ciel1),var(--ciel2));box-shadow:0 0 0 2px #2a3380}
.tel::before{content:"";position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff8,transparent),radial-gradient(1px 1px at 70% 12%,#fff6,transparent),radial-gradient(1px 1px at 45% 60%,#fff5,transparent),radial-gradient(1px 1px at 85% 75%,#fff6,transparent),radial-gradient(1px 1px at 10% 85%,#fff5,transparent);pointer-events:none}
.mois{position:absolute;left:16px;top:12px}
.mois h2{margin:0;font:600 36px/1 var(--display);opacity:.45}
.mois p{margin:8px 0 0;font-size:15px;width:190px;opacity:.45}
.compte{position:absolute;left:10px;right:10px;top:124px;height:34px;border-radius:17px;display:flex;align-items:center;gap:8px;padding:0 14px;background:rgba(6,10,44,.66);opacity:.5}
.compte b{font-size:22px}.compte .moi{color:var(--accent)}.compte .lui{color:var(--lui)}
.barre{flex:1;height:8px;border-radius:4px;background:var(--luiPlein);overflow:hidden}.barre span{display:block;height:100%;background:var(--accent)}
.fond{position:absolute;inset:0;background:rgba(0,6,68,.6);display:flex;align-items:flex-end;padding:12px}
.feuille{width:100%;background:rgb(8,13,58);border-radius:28px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 8px 18px rgba(0,0,0,.35)}
.feuille h3{margin:0;font:600 26px/1.05 var(--display);text-align:center;text-wrap:balance}
.feuille p.note{margin:0;font-size:14px;line-height:1.3;color:var(--texte2);text-align:center;text-wrap:balance}
.option{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.08);border:1.5px solid rgba(254,202,99,.5);min-height:68px}
.option.choisi{background:rgba(254,202,99,.16);border-color:var(--accent)}
.option svg{width:40px;height:40px;flex:none}
.option strong{display:block;font:600 18px/1.1 var(--display);color:var(--accent)}
.option span{display:block;font-size:15px;line-height:1.3;margin-top:3px}
.option em{display:inline-block;font-style:normal;font-size:13px;font-weight:700;color:#0a104a;background:#a8f0b0;border-radius:8px;padding:1px 7px;margin-top:5px}
.etiq{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--texte2)}
.action{display:flex;align-items:center;justify-content:center;width:100%;height:56px;border-radius:28px;background:var(--accent);color:#010c53;font:600 20px var(--display)}
.action.second{background:rgba(255,255,255,.08);color:var(--texte);border:1.5px solid rgba(255,255,255,.25)}
/* cartes */
.paquet{display:grid;grid-template-columns:repeat(6,1fr);gap:8px 6px;padding:4px 2px}
.carte{position:relative;height:66px;border-radius:6px;background:#f6efe0;border:2px solid #120c08;color:#1a1410;padding:2px 4px;font:600 16px/1 var(--display)}
.carte.r{color:#b8242c}
.carte i{display:block;font:15px Georgia,serif;font-style:normal;margin-top:2px}
.carte.choisie{outline:3px solid var(--accent);outline-offset:2px;transform:translateY(-4px)}
.carte.terne{opacity:.45}
.grav{position:absolute;right:-7px;bottom:-7px;width:26px;height:26px;border-radius:50%;background:#0a104a;border:2px solid var(--accent);display:flex;align-items:center;justify-content:center}
.grav svg{width:16px;height:16px}
.grav.lui{border-color:var(--lui)}
/* atlas */
.titre{position:absolute;inset:0;padding:22px 16px 16px;display:flex;flex-direction:column}
.titre h1{margin:0;font:600 34px/1 var(--display);text-align:center}
.titre .soust{font-size:15px;color:var(--texte2);text-align:center;margin:6px 0 12px}
.ciel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.signe{border-radius:14px;background:rgba(255,255,255,.05);padding:4px 2px 6px;text-align:center}
.signe svg{width:100%;height:58px}
.signe b{display:block;font:600 14px/1 var(--display);color:var(--texte2)}
.signe small{display:block;font-size:12px;color:var(--texte2);opacity:.75;margin-top:2px}
.signe.allume{background:rgba(254,202,99,.1);box-shadow:inset 0 0 0 1.5px rgba(254,202,99,.55)}
.signe.allume b{color:var(--accent)}
.palier{margin-top:12px;border-radius:18px;padding:10px 14px;background:rgba(165,124,229,.16);border:1.5px solid rgba(205,172,255,.45)}
.palier strong{display:block;font:600 18px/1.1 var(--display);color:var(--lui)}
.palier span{display:block;font-size:14px;line-height:1.3;margin-top:3px}
.marches{display:flex;gap:5px;margin-top:8px}.marches i{flex:1;height:7px;border-radius:4px;background:rgba(205,172,255,.25)}.marches i.fait{background:var(--lui)}
.pousse{flex:1}
</style>
</head>
<body>
<div class="rangee" id="rangee"></div>
<script>
(async function(){
var OR='#feca63',CLAIR='#f4f2ff',NUIT='#0a104a',VIOLET='#cdacff';
/* Les gravures : un petit dessin chacune, le même sur la carte et dans le choix. */
var G={
  epine:'<path d="M4 20L8 8l4 12 4-12 4 12" fill="none" stroke="'+OR+'" stroke-width="2.4" stroke-linejoin="round"/>',
  ailes:'<path d="M12 18C8 10 4 8 2 8c2 4 2 8 4 10zM12 18c4-8 8-10 10-10-2 4-2 8-4 10z" fill="'+OR+'"/>',
  phenix:'<path d="M12 22c-5 0-7-4-6-8 1 2 2 3 3 3-1-4 1-8 5-11-1 3 0 5 2 7 1-2 1-3 1-4 2 2 3 5 3 7 0 4-3 6-8 6z" fill="'+OR+'"/>',
  bouclier:'<path d="M12 2l8 3v6c0 6-4 10-8 11-4-1-8-5-8-11V5z" fill="'+OR+'"/>'};
var ico=function(id,taille,coul){var s=G[id];if(coul)s=s.split(OR).join(coul);return '<svg viewBox="0 0 24 24" aria-hidden="true">'+s+'</svg>';};
var grand=function(id){return '<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="'+NUIT+'" stroke="'+OR+'" stroke-width="2"/><g transform="translate(8 8)">'+G[id]+'</g></svg>';};
/* atouts : une icône simple par règle */
var A={
  echo:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="'+NUIT+'" stroke="'+OR+'" stroke-width="2"/><circle cx="20" cy="20" r="4" fill="'+OR+'"/><circle cx="20" cy="20" r="9" fill="none" stroke="'+OR+'" stroke-width="2"/><circle cx="20" cy="20" r="14" fill="none" stroke="'+OR+'" stroke-width="2" opacity=".55"/></svg>',
  colere:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="'+NUIT+'" stroke="'+OR+'" stroke-width="2"/><text x="20" y="27" text-anchor="middle" font-family="Fraunces,Georgia" font-size="20" fill="'+OR+'">A</text><path d="M7 20h5M28 20h5" stroke="'+OR+'" stroke-width="2.4"/></svg>',
  coeurs:'<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="'+NUIT+'" stroke="'+OR+'" stroke-width="2"/><text x="20" y="28" text-anchor="middle" font-family="Georgia" font-size="22" fill="#ff8098">♥</text><path d="M30 10v6M27 13h6" stroke="#a8f0b0" stroke-width="2.4"/></svg>'};
var carte=function(r,s,o){o=o||{};var rouge=s==='♥'||s==='♦';return '<div class="carte'+(rouge?' r':'')+(o.choisie?' choisie':'')+(o.terne?' terne':'')+'">'+r+'<i>'+s+'</i>'+(o.g?'<span class="grav'+(o.lui?' lui':'')+'">'+ico(o.g,16,o.lui?VIOLET:null)+'</span>':'')+'</div>';};
var dessus='<div class="mois"><h2>Avril</h2><p>Le premier coup de chaque carte fait double dégâts.</p></div><div class="compte"><span class="moi">Toi</span><b class="moi">19</b><span class="barre"><span style="width:59%"></span></span><b class="lui">13</b><span class="lui">Maudit</span></div>';
var ecran=function(titre,sous,corps){return '<div class="ecran"><p class="legende">'+titre+'</p><p class="sous">'+sous+'</p><div class="tel">'+corps+'</div></div>';};

/* 1. la récompense d'un mois gagné : une gravure parmi trois */
var e1=ecran('1 · Un mois gagné','Tu choisis une gravure parmi trois. Elle se pose sur une de tes cartes, pour toute l\'année.',
 dessus+'<div class="fond"><div class="feuille"><h3>Avril est à toi&nbsp;:<br>une gravure</h3>'+
 '<div class="option">'+grand('epine')+'<div><strong>Épine</strong><span>Qui la frappe prend 3 dégâts en retour.</span></div></div>'+
 '<div class="option choisi">'+grand('phenix')+'<div><strong>Phénix</strong><span>Elle revient une fois, à moitié de sa vie.</span></div></div>'+
 '<div class="option">'+grand('ailes')+'<div><strong>Ailes</strong><span>Elle frappe aussi la carte de la colonne voisine.</span></div></div>'+
 '<p class="note">Un mois perdu ne donne pas de gravure. Le Maudit en grave une quand il gagne.</p></div></div>');

/* 2. où la poser : ton paquet entier */
var paquet=[['A','♠',{g:'bouclier'}],['R','♥'],['D','♣',{choisie:true,g:'phenix'}],['V','♦'],['10','♠'],['10','♥',{g:'epine'}],['9','♣'],['9','♦'],['8','♠'],['8','♥'],['7','♣'],['7','♦'],['R','♠',{g:'ailes',lui:true}],['V','♣'],['9','♥'],['8','♣'],['7','♠'],['7','♥'],['A','♦'],];
var e2=ecran('2 · Sur quelle carte ?','Touche une carte de ton paquet. Une carte gravée reste gravée. Si le Maudit la prend, la gravure passe chez lui.',
 dessus+'<div class="fond"><div class="feuille"><h3>Le Phénix, sur quelle carte ?</h3>'+
 '<div class="paquet">'+paquet.map(function(c){return carte(c[0],c[1],c[2]);}).join('')+'</div>'+
 '<p class="note">Ton Roi de Pique porte des Ailes violettes&nbsp;: tu l\'as repris au Maudit, avec sa gravure.</p>'+
 '<div class="action">Graver la Dame de Trèfle</div></div></div>');

/* 3. l'atout du mois : il change une règle et se combine avec les gravures */
var e3=ecran('3 · Un atout pour mai','Les atouts changent une règle au lieu d\'ajouter des chiffres. Ils durent un mois, comme aujourd\'hui. Le vert dit ce qui va avec ton paquet.',
 dessus+'<div class="fond"><div class="feuille"><h3>Un atout pour mai</h3>'+
 '<div class="option">'+A.echo+'<div><strong>Écho</strong><span>Tes gravures agissent deux fois.</span><em>Va avec tes 4 gravures</em></div></div>'+
 '<div class="option">'+A.colere+'<div><strong>Colère</strong><span>Quand un de tes As tombe, ses voisines frappent deux fois plus fort.</span></div></div>'+
 '<div class="option">'+A.coeurs+'<div><strong>Cœurs qui soignent</strong><span>Chaque coup d\'un Cœur soigne sa voisine.</span><em>Va avec ton 10 ♥ Épine</em></div></div>'+
 '<p class="note">Il vaut pour mai seulement. Le Maudit tire aussi le sien.</p></div></div>');

/* 4. l'atlas : lu depuis le vrai ciel du jeu */
var html=await (await fetch('../bataille/index.html')).text();
var CIEL=JSON.parse(html.slice(html.indexOf('/*CIEL*/var CIEL=')+17,html.indexOf(';/*FIN CIEL*/')));
var SIGNES=[['capricorne','Capricorne','Janvier'],['verseau','Verseau','Février'],['poissons','Poissons','Mars'],['belier','Bélier','Avril'],['taureau','Taureau','Mai'],['gemeaux','Gémeaux','Juin'],['cancer','Cancer','Juillet'],['lion','Lion','Août'],['vierge','Vierge','Septembre'],['balance','Balance','Octobre'],['scorpion','Scorpion','Novembre'],['sagittaire','Sagittaire','Décembre']];
var ALLUME={belier:'Épine',taureau:'Phénix',lion:'Crinière',vierge:'Écho',capricorne:'Bouclier'};
var fig=function(id,on){var f=CIEL[id],c=on?OR:'#5b64a8',s='';var X=function(p){return (10+p[0]*80).toFixed(1);},Y=function(p){return (6+p[1]*46).toFixed(1);};
  f.ln.forEach(function(l){var a=f.st[l[0]],b=f.st[l[1]];s+='<line x1="'+X(a)+'" y1="'+Y(a)+'" x2="'+X(b)+'" y2="'+Y(b)+'" stroke="'+c+'" stroke-width="1.3" opacity="'+(on?.8:.6)+'"/>';});
  f.st.forEach(function(p){s+='<circle cx="'+X(p)+'" cy="'+Y(p)+'" r="'+(on?2.4:1.8)+'" fill="'+(on?OR:'#8890c8')+'"/>';});
  return '<svg viewBox="0 0 100 58" aria-hidden="true">'+s+'</svg>';};
var e4=ecran('4 · L\'atlas du ciel','Chaque mois gagné allume sa constellation pour de bon et ajoute une gravure ou un atout au jeu. Une année gagnée ouvre l\'année maudite suivante.',
 '<div class="titre"><h1>Ton atlas</h1><div class="soust">5 constellations sur 12 &middot; 2 années gagnées</div><div class="ciel">'+
 SIGNES.map(function(s){var on=ALLUME[s[0]];return '<div class="signe'+(on?' allume':'')+'">'+fig(s[0],on)+'<b>'+s[1]+'</b><small>'+(on?'+ '+on:'à gagner en '+s[2].toLowerCase())+'</small></div>';}).join('')+
 '</div><div class="palier"><strong>Année maudite 3</strong><span>Nouveau : le Maudit commence l\'année avec deux gravures.</span><div class="marches"><i class="fait"></i><i class="fait"></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>'+
 '<div class="pousse"></div><div class="action">Jouer l\'année maudite 3</div></div>');

document.getElementById('rangee').innerHTML=e1+e2+e3+e4;
await document.fonts.ready;document.body.dataset.pret='1';
})();
</script>
</body>
</html>
