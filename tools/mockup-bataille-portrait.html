<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Bataille · maquette portrait v2</title>
<!-- MAQUETTE v2 : trois directions (matière, formes, typo), trois écrans chacune,
     sur 360 × 732 (Pixel 9). Disposition A : tes cartes en bas, elles montent.
     Couleurs : mockup-bataille-palette.js, écrit par tools/bataille-couleurs.mjs
     (contrastes calculés). Les cartes à jouer gardent leurs couleurs d'objet.
     Les polices viennent de Google Fonts ICI SEULEMENT : celles de la direction
     retenue seront hébergées dans bataille/polices/.
     Capture : node tools/bataille-maquette.mjs -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&family=Alegreya+Sans:wght@500;800&family=IM+Fell+French+Canon+SC&family=Alegreya:ital,wght@0,500;0,800;1,500&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<script src="mockup-bataille-palette.js"></script>
<style>
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:#0b0a10;color:#e9e6f2;font-family:'Alegreya Sans',system-ui,sans-serif;padding:28px 32px 40px}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:34px;margin:0 0 4px;color:#f2bf59}
.sous{margin:0 0 26px;font-size:17px;color:#b9b4cc;max-width:86ch}
.rang{margin:0 0 40px;padding:0 0 4px;width:max-content}
.rang h2{font:700 26px 'Cormorant Garamond',Georgia,serif;margin:0;color:#f2bf59}
.rang > p{margin:2px 0 14px;font-size:16px;color:#b9b4cc;max-width:100ch}
.planche{display:flex;gap:32px;align-items:flex-start}
figure{margin:0}
figcaption{font-size:16px;margin:0 0 10px;color:#e9e6f2}

.tel{position:relative;width:360px;height:732px;border-radius:28px;overflow:hidden;background:var(--surface);
  box-shadow:0 0 0 3px #2b2838,0 18px 40px rgba(0,0,0,.6);font-family:var(--corps);color:var(--texte);user-select:none}
.tel canvas.fond{position:absolute;inset:0;width:360px;height:732px}
.tel svg{display:block}

.mois{position:absolute;left:16px;top:12px;width:186px}
.mois h2{margin:0;font:var(--titre);line-height:1;color:var(--texte)}
.mois p{margin:8px 0 0;font-size:15px;line-height:1.25;color:var(--texte);text-wrap:balance}
.mois p b{color:var(--texte);font-weight:800}
.signe{position:absolute;left:206px;width:138px;top:80px;text-align:center;font:var(--italique);color:var(--texte2)}
.annee{position:absolute;left:0;right:0;top:104px;display:flex;justify-content:center;gap:9px}
.annee i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--texte2);opacity:.55}
.annee i.fait{background:var(--texte2);opacity:.8}
.annee i.ici{background:var(--texte);border-color:var(--texte);opacity:1;transform:scale(1.5)}

.compte{position:absolute;left:0;right:0;top:122px;height:36px;display:flex;align-items:center;gap:8px;padding:0 14px}
.compte .n{font-weight:800;font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.compte .qui{font-size:14px}
.compte .moi{color:var(--moi)}.compte .lui{color:var(--lui)}
.barre{flex:1;height:12px;position:relative;overflow:hidden;background:var(--luiPlein)}
.barre span{position:absolute;left:0;top:0;bottom:0;background:var(--moiPlein)}
.arcanesLui{position:absolute;right:16px;top:94px;display:flex;gap:4px}
.arcanesLui i{width:14px;height:21px;border-radius:3px;border:1.5px solid #120c08;background:repeating-linear-gradient(45deg,#6a46a8 0 3px,#4c2f80 3px 6px)}

.astuce{position:absolute;left:0;right:0;top:366px;text-align:center;font-size:15px;color:var(--marque)}
.ruban{position:absolute;left:50%;top:484px;transform:translateX(-50%);padding:5px 20px 7px;font:var(--titre);font-size:24px;white-space:nowrap}

.main{position:absolute;left:0;right:0;top:546px;display:flex;justify-content:center;gap:12px}
.arcane{position:relative;width:92px;height:86px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 4px 7px;font-family:var(--display)}
.arcane .num{font-size:14px;line-height:1}
.arcane svg{width:34px;height:34px}
.arcane .nom{font-size:14px;line-height:1;white-space:nowrap}
.action{position:absolute;left:16px;right:16px;top:656px;height:60px;display:flex;align-items:center;justify-content:center;font:800 21px var(--corps)}
.vitesse{position:absolute;left:16px;right:16px;top:662px;height:48px;display:flex;overflow:hidden;font:800 16px var(--corps)}
.vitesse span{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.vitesse svg{width:16px;height:16px}
.page{position:absolute;left:32px;right:32px;top:272px;padding:20px 16px 18px;text-align:center}
.page h3{margin:0;font:var(--titre);font-size:30px;line-height:1.05}
.page p{margin:10px 0 0;font-size:16px;font-weight:800}

/* ---------- 1. Le tapis : feutre, bois, laiton ---------- */
.d-tapis{--display:'Cormorant Garamond',Georgia,serif;--corps:'Alegreya Sans',sans-serif;--titre:700 36px 'Cormorant Garamond',Georgia,serif;--italique:italic 600 17px 'Cormorant Garamond',Georgia,serif}
.d-tapis .compte{background:linear-gradient(var(--surface),var(--bande));border-top:2px solid var(--encre);border-bottom:2px solid var(--encre)}
.d-tapis .barre{border-radius:6px;border:2px solid var(--encre)}
.d-tapis .barre span{border-right:2px solid var(--encre)}
.d-tapis .ruban{color:var(--accent);background:var(--surface2);border:2px solid var(--encre);border-radius:8px;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.d-tapis .arcane{border-radius:8px;border:2.5px solid var(--encre);background:var(--papier);color:var(--encre);font-weight:700;
  box-shadow:inset 0 0 0 3px var(--papier),inset 0 0 0 4px var(--encre2),0 3px 0 var(--encre),0 9px 14px rgba(0,0,0,.4)}
.d-tapis .arcane.dort{filter:brightness(.55) saturate(.6);transform:translateY(3px)}
.d-tapis .arcane.pret{outline:3px solid var(--accent);outline-offset:1px}
.d-tapis .arcane.joue{opacity:.25;transform:translateY(3px)}
.d-tapis .action{border-radius:12px;border:2.5px solid var(--encre);background:var(--accent);color:var(--surAccent);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 4px 0 var(--encre),0 10px 16px rgba(0,0,0,.4)}
.d-tapis .vitesse{border-radius:12px;border:2.5px solid var(--encre);background:var(--surface2);color:var(--surTexte)}
.d-tapis .vitesse .oui{background:var(--surface);color:var(--accent)}
.d-tapis .page{background:var(--papier);color:var(--encre);border:2.5px solid var(--encre);border-radius:10px;box-shadow:inset 0 0 0 4px var(--papier),inset 0 0 0 5px var(--encre2),0 12px 22px rgba(0,0,0,.45)}

/* ---------- 2. La lame : gravure du tarot de Marseille ---------- */
.d-lame{--display:'IM Fell French Canon SC',Georgia,serif;--corps:'Alegreya',Georgia,serif;--titre:400 34px 'IM Fell French Canon SC',Georgia,serif;--italique:italic 500 16px 'Alegreya',Georgia,serif;border-radius:10px}
.d-lame .mois{left:22px;top:18px;width:182px}
.d-lame .signe{top:78px}.d-lame .annee{top:100px;gap:8px}
.d-lame .annee i{border-radius:0;transform:rotate(45deg)}
.d-lame .annee i.ici{transform:rotate(45deg) scale(1.5)}
.d-lame .arcanesLui{right:22px;top:88px}
.d-lame .compte{top:124px;color:var(--surTexte)}
.d-lame .compte .qui{font-family:var(--display);font-size:15px}
.d-lame .barre{border:2.5px solid var(--encre);height:14px}
.d-lame .barre span{border-right:2.5px solid var(--encre)}
.d-lame .ruban{color:var(--encre);background:var(--papier);border:2.5px solid var(--encre);box-shadow:4px 4px 0 var(--encre)}
.d-lame .arcane{padding:0;border:2.5px solid var(--encre);background:var(--moiPlein);color:var(--encre);box-shadow:3px 3px 0 var(--encre)}
.d-lame .arcane .num,.d-lame .arcane .nom{align-self:stretch;text-align:center;background:var(--papier);padding:3px 0 4px;font-size:14px}
.d-lame .arcane .num{border-bottom:2px solid var(--encre)}.d-lame .arcane .nom{border-top:2px solid var(--encre)}
.d-lame .arcane.dort{filter:grayscale(1) contrast(.75);opacity:.75;box-shadow:none}
.d-lame .arcane.pret{box-shadow:3px 3px 0 var(--encre),0 0 0 3px var(--accent)}
.d-lame .arcane.joue{opacity:.25;box-shadow:none}
.d-lame .action{border:3px solid var(--encre);background:var(--accent);color:var(--surAccent);box-shadow:4px 4px 0 var(--encre);font:400 24px var(--display);letter-spacing:1px}
.d-lame .vitesse{border:3px solid var(--encre);background:var(--surface2);color:var(--encre)}
.d-lame .vitesse .oui{background:var(--encre);color:var(--papier)}
.d-lame .page{background:var(--papier);color:var(--encre);border:3px solid var(--encre);box-shadow:5px 5px 0 var(--encre);outline:1px solid var(--encre);outline-offset:-8px}

/* ---------- 3. Nuit claire : le ciel partout, le verre par-dessus ---------- */
.d-nuit{--display:'Fraunces',Georgia,serif;--corps:'Outfit',sans-serif;--titre:600 36px 'Fraunces',Georgia,serif;--italique:italic 500 16px 'Fraunces',Georgia,serif;
  --verre:rgba(6,10,44,.62)}
.d-nuit .verre,.d-nuit .compte,.d-nuit .arcane,.d-nuit .vitesse,.d-nuit .page,.d-nuit .ruban{background:var(--verre);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
  border:1px solid rgba(0,0,0,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 0 0 1px rgba(255,255,255,.08),0 8px 18px rgba(0,0,0,.35)}
.d-nuit .compte{left:10px;right:10px;top:124px;height:34px;border-radius:17px}
.d-nuit .barre{height:8px;border-radius:4px}
.d-nuit .barre span{border-radius:4px 0 0 4px}
.d-nuit .ruban{color:var(--accent);border-radius:22px;font-size:22px}
.d-nuit .arcane{border-radius:22px;color:var(--texte);font-weight:600;--iconeAccent:var(--accent)}
.d-nuit .arcane .nom{font-family:var(--corps);font-weight:500}
.d-nuit .arcane.dort{opacity:.5}
.d-nuit .arcane.pret{border:1.5px solid var(--accent);background:rgba(40,46,110,.72)}
.d-nuit .arcane.joue{opacity:.22}
.d-nuit .action{border-radius:30px;background:var(--accent);color:var(--surAccent);font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px rgba(0,0,0,.4)}
.d-nuit .vitesse{border-radius:24px;color:var(--texte2);font-weight:500}
.d-nuit .vitesse .oui{background:rgba(255,255,255,.14);color:var(--accent);font-weight:700;border-radius:24px}
.d-nuit .page{border-radius:28px;color:var(--texte)}
/* Sans transparence ou en contraste renforcé : le verre devient une plaque pleine. */
@media (prefers-reduced-transparency:reduce),(prefers-contrast:more){
  .d-nuit .compte,.d-nuit .arcane,.d-nuit .vitesse,.d-nuit .page,.d-nuit .ruban{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}}
</style>
</head>
<body>
<h1>La Bataille en portrait · trois directions</h1>
<p class="sous">Même disposition (tes cartes en bas, elles montent), même mois d'août, mêmes cartes. Ce qui change d'une ligne à l'autre : la matière, les formes et la typographie.</p>
<div id="rangs"></div>
<script>
