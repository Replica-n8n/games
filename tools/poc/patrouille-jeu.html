<title>Star Patrol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Star Patrol, en formes simples. Écran de jeu sombre par choix ;
   les vraies couleurs et la police viendront avec la direction B (livre illustré). */
:root{
  --fond:#0a0f2e; --panneau:#141c4a; --trait:#2a3570; --texte:#eef0ff; --doux:#b8c0f0;
  --accent:#fabc41; --sur-accent:#271900; --fini:#5fd68a;
  --police:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--texte);font-family:var(--police);overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#cadre{position:relative;height:100%;display:grid;place-items:center}
#jeu{position:relative;touch-action:none}
canvas{display:block;touch-action:none}
button{font:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ecran{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:20px 16px;background:rgba(6,9,30,.94);text-align:center;overflow:auto}
.ecran h1{font-size:26px;line-height:1.1;font-weight:800;margin:0;text-wrap:balance}
.ecran h2{font-size:24px;font-weight:800;margin:0}
.ecran p{color:var(--doux);font-size:15px;line-height:1.4;max-width:32ch;margin:0}
.gros{min-height:60px;min-width:240px;padding:0 20px;border:0;border-radius:18px;background:var(--accent);color:var(--sur-accent);
  font-size:19px;font-weight:800;box-shadow:0 5px 0 #8a6200}
.moyen{min-height:48px;min-width:180px;padding:0 18px;border:2px solid var(--doux);border-radius:14px;background:transparent;color:var(--texte);font-size:17px;font-weight:700}
/* Carte */
#carte{justify-content:flex-start}
/* L'action principale reste collée en bas, toujours visible */
#b-continuer{position:sticky;bottom:4px;margin-top:auto;flex-shrink:0}
.resume{font-size:14px;color:var(--doux)}
#planetes{display:grid;gap:10px;width:min(340px,100%)}
.planete{border:2px solid var(--c);border-radius:16px;padding:8px 10px 10px;background:var(--panneau);text-align:left}
.planete.lointaine{opacity:.6;padding:8px 10px}
.planete.lointaine h2{margin:0}
.planete h2{font-size:17px;color:var(--c);display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.planete h2 small{font-size:14px;color:var(--doux);font-weight:600}
.chemin{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mission{min-height:48px;border-radius:12px;border:2px solid var(--trait);background:#0f1640;color:var(--doux);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;font-size:15px}
.mission small{font-size:14px;line-height:1}
.bientot{margin:6px 0 0;font-size:14px;color:var(--doux)}
.mission.ouverte{border-color:var(--accent);color:var(--texte);box-shadow:0 0 12px rgba(250,188,65,.35)}
.mission.finie{border-color:var(--fini);color:var(--texte)}
.mission:disabled{cursor:default}
.points{font-size:14px;line-height:1;color:var(--fini)}
details{width:min(340px,100%);text-align:left;border:1px solid var(--trait);border-radius:12px;padding:4px 12px}
summary{min-height:40px;display:flex;align-items:center;color:var(--doux);font-size:15px;cursor:pointer}
label{display:flex;align-items:center;gap:10px;font-size:15px;min-height:36px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.petit{min-height:40px;padding:0 12px;border:1px solid var(--doux);border-radius:10px;background:transparent;color:var(--texte);font-size:14px;margin:4px 0}
.secrete{grid-column:1/-1;margin-top:6px;min-height:48px;font-size:15px}
.secrete small{font-size:14px}
/* Hangar */
.ameliorations{display:grid;gap:10px;width:min(320px,100%)}
.amelioration{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;padding:12px;border-radius:14px;background:var(--panneau)}
.amelioration b{font-size:17px}
.amelioration small{grid-column:1;color:var(--doux);font-size:14px}
.niveaux{color:var(--accent);letter-spacing:2px}
.acheter{grid-row:1/3;grid-column:2;min-height:48px;min-width:104px;border:0;border-radius:12px;background:var(--accent);color:var(--sur-accent);font-weight:800;font-size:15px}
.acheter:disabled{background:#3a426e;color:#c8cdf0}
.rangee{display:flex;gap:8px;width:min(340px,100%)}
.rangee .moyen{flex:1;min-width:0}
/* Hangar : une pastille dit qu'une amélioration est à portée (texte pour les lecteurs d'écran) */
.moyen.achat{border-color:var(--accent);color:var(--accent)}
.moyen.achat::after{content:"";display:inline-block;width:10px;height:10px;margin-left:8px;border-radius:50%;background:var(--accent);vertical-align:1px}
.aide-installer{font-size:14px;color:var(--doux);max-width:34ch;margin:0}
.maj{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 12px;border-radius:12px;background:var(--panneau);border:1px solid var(--accent)}
.version{font-size:14px;color:var(--doux);margin:0}
/* Bilan */
.bilan{display:grid;gap:6px;width:min(300px,100%);text-align:left;font-size:16px;padding:12px;border-radius:14px;background:var(--panneau)}
.bilan .bon{color:var(--fini);font-weight:700}
/* Boutons posés sur la mission */
.rond{position:absolute;border:0;border-radius:50%;display:grid;place-items:center;font-weight:800}
#b-pause{top:8px;right:8px;width:44px;height:44px;background:rgba(20,28,74,.85);color:var(--texte);font-size:18px}
#b-super{right:12px;bottom:12px;width:76px;height:76px;background:#3a426e;color:#9aa3d0;font-size:13px;line-height:1.1;box-shadow:0 4px 0 #1a1f40}
#b-super.pret{background:var(--accent);color:var(--sur-accent);box-shadow:0 4px 0 #8a6200,0 0 24px rgba(250,188,65,.8)}
@media (prefers-reduced-motion:reduce){#b-super.pret{box-shadow:0 4px 0 #8a6200}}

</style>

<div id="cadre">
  <div id="jeu">
    <canvas id="toile" aria-label="La mission"></canvas>
    <button id="b-pause" class="rond" aria-label="Pause" hidden>II</button>
    <button id="b-super" class="rond" aria-label="Super-pouvoir" hidden>SUPER</button>

    <section id="carte" class="ecran">
      <h1>Star Patrol</h1>
      <div class="maj" id="maj" hidden>Une nouvelle version est prête. <button class="petit" id="recharger">Recharger</button></div>
      <div class="resume" id="c-resume"></div>
      <div id="planetes"></div>
      <div class="rangee">
        <button class="moyen" id="b-hangar">Hangar</button>
        <button class="moyen" id="installer" hidden>Installer</button>
      </div>
      <p class="aide-installer" id="aide-installer" hidden></p>
      <button class="gros" id="b-continuer">Continuer</button>
      <details>
        <summary>Réglages de test</summary>
        <label><input type="checkbox" id="o-invincible"> Invincible</label>
        <label><input type="checkbox" id="o-zones"> Voir les zones touchées</label>
        <label><input type="checkbox" id="o-vite"> Vitesse x2</label>
        <label><input type="checkbox" id="o-ouvert"> Toutes les missions ouvertes</label>
        <button class="petit" id="o-effacer">Effacer la sauvegarde</button>
      </details>
      <p class="version" id="version"></p>
    </section>

    <section id="hangar" class="ecran" hidden>
      <h2>Hangar</h2>
      <p id="h-resume"></p>
      <div id="h-liste" class="ameliorations"></div>
      <button class="gros" id="h-retour">Retour à la carte</button>
    </section>

    <section id="pause" class="ecran" hidden>
      <h2>Pause</h2>
      <button class="gros" id="p-reprendre">Reprendre</button>
      <button class="moyen" id="p-carte">Abandonner la mission</button>
    </section>

    <section id="mort" class="ecran" hidden>
      <h2>Oups, plus de cœurs !</h2>
      <p id="m-texte">La mission est courte : on la recommence. Les astronautes délivrés retournent dans leurs bulles.</p>
      <button class="gros" id="m-recommencer">Recommencer la mission</button>
      <div class="rangee">
        <button class="moyen" id="m-hangar">Hangar</button>
        <button class="moyen" id="m-carte">Carte</button>
      </div>
    </section>

    <section id="bilan" class="ecran" hidden>
      <h2>Mission réussie !</h2>
      <div class="bilan" id="bilan-liste"></div>
      <button class="gros" id="g-suite">Mission suivante</button>
      <div class="rangee">
        <button class="moyen" id="g-hangar">Hangar</button>
        <button class="moyen" id="g-carte">Carte</button>
      </div>
    </section>
  </div>
</div>

__def("moteur/constantes.js", function (__req) {
// Dimensions et rythme du jeu. Tout le moteur compte en pixels « logiques »
// d'un écran 360 × 640 et en images à 60 par seconde.
const W = 360;
const H = 640;
const FPS = 60;
const SEC = 60;
/** Vitesse du décor qui défile, en px par image. */
const DEFIL = 1.2;
/** Rayon de la zone touchée par un tir rouge (le cœur du module). */
const ZT = 4;
/** Rayon qui avale un tir bleu (tout le corps du module). */
const ZB = 15;

return { W, H, FPS, SEC, DEFIL, ZT, ZB };
});
__def("moteur/partie.js", function (__req) {
// Une mission, image par image. Pur : aucun DOM, aucun canvas, aucun Math.random.
// L'écran lit l'état (p.j, p.ennemis, p.tirsE…) et vide p.evenements (messages, vibrations).
const { W, H, SEC, ZT, ZB, DEFIL } = __req("moteur/constantes.js");
const { creeHasard } = __req("moteur/hasard.js");
const { MODULES, nouveauJoueur, piloter } = __req("moteur/pilotage.js");
const { ARMES, tirBase } = __req("moteur/tirs.js");
const { COMPORTEMENTS } = __req("moteur/ennemis.js");
const { POIDS_BONUS, NOM_BONUS, appliquerBonus } = __req("moteur/bonus.js");
const { majMilieux, forces, solDuRover, dansRocher } = __req("moteur/milieux.js");
const { FORMATIONS } = __req("moteur/vagues.js");
const { majCopain, attraperCopain, monterRobot, descendreRobot } = __req("moteur/allies.js");
const { ENNEMIS } = __req("contenu/ennemis.js");
const { PLANETES } = __req("contenu/planetes.js");

const RECOLTE = { petit: 1, moyen: 3, gros: 12, porteur: 2, cage: 0 };
const JAUGE = { petit: 4, moyen: 10, gros: 25, porteur: 6, cage: 0 };
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

/**
 * @param {{ mission: any, graine?: number, sauvegarde: any, options?: { invincible?: boolean } }} reglages
 */
function creePartie({ mission, graine = 1, sauvegarde, options = {} }) {
  const planete = PLANETES[mission.planete];
  const module = planete.module, M = MODULES[module];
  const hangar = sauvegarde.hangar[module];
  const p = {
    mission, planete, module, M, options,
    h: creeHasard(graine),                    // le jeu
    hv: creeHasard((graine ^ 0x9e3779b9) >>> 0), // les effets visuels, pour ne pas changer la partie
    t: 0, idx: 0, vagues: mission.vagues, fin: false, finT: 0, etat: 'jeu',
    j: nouveauJoueur(M),
    coeursMax: 3 + hangar.coeur, coeurs: 3 + hangar.coeur,
    niveauTir: hangar.tir, rayonAimant: 30 + 30 * hangar.aimant,
    arme: null, bouclier: false, aimant: 0, compagnons: 0, etoile: 0,
    jauge: 0, cristaux: 0, coups: 0,
    armesConnues: [...sauvegarde.armes], nouvellesArmes: [], cagesLibres: [],
    ennemis: [], tirsJ: [], tirsE: [], objets: [], effets: [], terrain: [],
    evenements: [], secousse: 0, bilan: null, vus: {},
    copain: null, copainSauve: false, robot: null, boss: null, auDrapeau: null, alerte: 0, actif: false,
    // Intensité de la mission (1 = normale) : tirs plus rapides, moins de tirs bleus, petits qui tirent
    intensite: mission.intensite ?? 1,
  };
  p.ajouter = (type, x, y, extra = {}) => {
    const def = ENNEMIS[type];
    if (!def) throw new Error(`ennemi inconnu : ${type}`);
    const solide = def.taille === 'moyen' || def.taille === 'gros';
    const pv = solide ? Math.round(def.pv * (0.6 + 0.4 * p.intensite)) : def.pv;
    const e = { type, def, x, y, x0: x, y0: y, vx: 0, vy: 0, pv, pvMax: pv, r: def.r, age: 0, ph: p.h.entre(0, 6), rot: 0, flash: 0, ...extra };
    p.ennemis.push(e);
    return e;
  };
  p.ajouterCage = (id, x, y) => p.ajouter('cage', x, y, { cid: id });
  p.tirer = (x, y, a, v, b = false) => tirEnnemi(p, x, y, a, v * (0.8 + 0.2 * p.intensite), b);
  p.attraperCopain = () => attraperCopain(p);
  p.blesserBoss = (d) => blesserBoss(p, d);
  // Le drapeau garde l'état utile pour repartir d'ici (mission du boss seulement)
  p.poserDrapeau = () => {
    p.auDrapeau = { t: p.t, idx: p.idx, cristaux: p.cristaux, cages: [...p.cagesLibres], nouvellesArmes: [...p.nouvellesArmes] };
    p.message("Drapeau : tu repartiras d'ici", 2.5 * SEC);
  };
  p.message = (texte, duree = 3 * SEC) => p.evenements.push({ type: 'message', texte, duree });
  const bleu = (e) => p.h.suivant() < (e.def.pBleu ?? 0.3) * Math.max(0.4, 1.4 - 0.4 * p.intensite);
  const vitesse = (v) => v * (0.8 + 0.2 * p.intensite);
  p.vise = (e, v, n = 1, ecart = 0.22) => {
    const a = Math.atan2(p.j.y - e.y, p.j.x - e.x);
    for (let i = 0; i < n; i++) tirEnnemi(p, e.x, e.y, a + (i - (n - 1) / 2) * ecart, vitesse(v), bleu(e));
  };
  p.anneau = (e, n, v, dec = 0, tousLesN = 0) => {
    for (let i = 0; i < n; i++) tirEnnemi(p, e.x, e.y, dec + (i / n) * Math.PI * 2, vitesse(v), tousLesN ? i % tousLesN === 0 : bleu(e));
  };
  return p;
}

/** Un tir ennemi : bleu (s'avale, charge le super) ou rouge (blesse). */
function tirEnnemi(p, x, y, angle, v, bleu = false) {
  p.tirsE.push({ x, y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, r: 5, bleu });
}

/** Ramasser un cadeau : { arme } remplace l'arme (munitions pleines), { bonus } l'applique. */
function prendreCadeau(p, c) {
  if (c.robot) { monterRobot(p); return; }
  if (c.arme) { p.arme = { k: c.arme, mun: ARMES[c.arme].mun }; p.message(ARMES[c.arme].nom, 1.5 * SEC); }
  else if (c.bonus) { appliquerBonus(p, c.bonus); p.message(NOM_BONUS[c.bonus], 2 * SEC); }
}

const balle = (p, o) => p.tirsJ.push({ vx: 0, vy: -9, dmg: 1, r: 4, ...o });

/** Un ennemi qu'on peut toucher est à l'écran (cages et ennemis cachés exclus). */
function cibleVisible(p) {
  return p.ennemis.some((e) => !e.cache && !e.mort && e.def.taille !== 'cage' && e.y > 0 && e.y < H)
    || !!(p.boss && !p.boss.cache && p.boss.y > 0);
}

function tirer(p) {
  const j = p.j;
  if (--j.cad > 0) return;
  if (p.robot) { // le robot de combat : tir lourd
    j.cad = 7;
    for (let i = -1; i <= 1; i++) balle(p, { x: j.x + i * 10, y: j.y - 24, vx: i * 0.8, vy: -10, dmg: 2, r: 5, forme: 'rond' });
    return;
  }
  // Arme spéciale en pause pendant un calme : le tir de base prend le relais, les munitions
  // attendent le prochain ennemi (retour de Julie : un cadeau ouvert devant un écran vide
  // se gaspillait ; mesuré, 70 à 87 % des munitions partaient dans le vide).
  if (p.arme && p.actif) {
    const A = ARMES[p.arme.k];
    j.cad = A.cad; A.tir(j, (b) => balle(p, b), p.h);
    if (--p.arme.mun <= 0) { p.arme = null; p.message('Plus de munitions : retour au tir de base', 2 * SEC); }
    return;
  }
  const base = tirBase(p.module, p.niveauTir);
  j.cad = base.cad; base.tir(j, (b) => balle(p, b));
}

function tirCompagnons(p) {
  if (p.compagnons <= 0) return;
  for (let k = 0; k < 2; k++) {
    const a = p.t * 0.08 + k * Math.PI;
    if (p.t % 18 === k * 9) balle(p, { x: p.j.x + Math.cos(a) * 30, y: p.j.y + Math.sin(a) * 30 - 6 });
  }
}

function remplit(p, n) {
  const avant = p.jauge;
  p.jauge = Math.min(100, p.jauge + n);
  if (p.jauge >= 100 && avant < 100 && !p.vus.super) { p.vus.super = true; p.message('Super-pouvoir prêt : touche le bouton'); }
}

function eclats(p, x, y, couleur, n = 8, v = 3) {
  for (let i = 0; i < n; i++) {
    const a = p.hv.suivant() * Math.PI * 2, s = (0.5 + p.hv.suivant() * 0.5) * v;
    p.effets.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vie: 30, couleur });
  }
}

function lacherCadeau(p, x, y, contenu) { p.objets.push({ k: 'cadeau', x, y, vx: 0, vy: 0.9, ...contenu }); }

function liberer(p, e) {
  const def = p.mission.cages[e.cid] ?? { bonus: true };
  if (!p.cagesLibres.includes(e.cid)) p.cagesLibres.push(e.cid);
  p.effets.push({ astronaute: true, x: e.x, y: e.y, vie: 70, dore: !!def.dore });
  eclats(p, e.x, e.y, '#5fd68a', 14);
  if (def.arme) {
    const neuve = !p.armesConnues.includes(def.arme) && !p.nouvellesArmes.includes(def.arme);
    if (neuve) { p.nouvellesArmes.push(def.arme); p.message(`Nouvelle arme : ${ARMES[def.arme].nom} !`); }
    else p.message('Astronaute délivré !', 1.5 * SEC);
    lacherCadeau(p, e.x, e.y, { arme: def.arme });
  } else {
    p.message('Astronaute délivré !', 1.5 * SEC);
    lacherCadeau(p, e.x, e.y, { bonus: p.h.pondere(POIDS_BONUS) });
  }
}

function blesse(p, e, d) {
  if (e.mort || e.cache) return;
  e.pv -= d; e.flash = 4;
  if (e.pv > 0) return;
  e.mort = true;
  const taille = e.def.taille;
  if (taille === 'cage') { liberer(p, e); return; }
  eclats(p, e.x, e.y, e.def.couleur, taille === 'gros' ? 30 : 10, taille === 'gros' ? 5 : 3);
  for (let i = 0; i < RECOLTE[taille]; i++) p.objets.push({ k: 'cristal', x: e.x + p.h.entre(-8, 8), y: e.y, vx: p.h.entre(-1.2, 1.2), vy: p.h.entre(-1.5, 0.5) });
  remplit(p, JAUGE[taille]);
  if (e.type === 'porteur') {
    const connues = [...p.armesConnues, ...p.nouvellesArmes];
    if (connues.length && p.h.suivant() < 0.5) lacherCadeau(p, e.x, e.y, { arme: p.h.choix(connues) });
    else lacherCadeau(p, e.x, e.y, { bonus: p.h.pondere(POIDS_BONUS) });
    if (!p.vus.cadeau) { p.vus.cadeau = true; p.message('Un cadeau ! Attrape-le'); }
  }
}

function blesserBoss(p, d) {
  const b = p.boss;
  if (!b || b.cache || b.y < 0) return;
  b.pv -= d; b.flash = 4;
  if (b.pv > 0) return;
  eclats(p, b.x, b.y, '#ffd23f', 60, 6);
  for (let i = 0; i < 40; i++) p.objets.push({ k: 'cristal', x: b.x + p.h.entre(-30, 30), y: b.y + p.h.entre(-20, 20), vx: p.h.entre(-2, 2), vy: p.h.entre(-2, 1) });
  for (const e of p.ennemis) if (e.def.taille !== 'cage') e.mort = true;
  p.boss = null; p.tirsE = []; p.aimant = 3 * SEC;
  p.message(`Bravo, ${b.def.nom} est battu !`, 3 * SEC);
}

const bossTouchable = (p) => p.boss && !p.boss.cache && p.boss.y > 0;

function touche(p) {
  if (p.j.inv > 0 || p.options.invincible || p.etoile > 0 || p.j.z > 0.3 || p.etat !== 'jeu') return;
  if (p.robot) { // le robot encaisse à la place des cœurs
    p.robot.pv--; p.j.inv = 30; p.secousse = 6;
    eclats(p, p.j.x, p.j.y, '#ff9a3d', 8);
    if (p.robot.pv <= 0) descendreRobot(p);
    return;
  }
  if (p.bouclier) { p.bouclier = false; p.j.inv = 60; eclats(p, p.j.x, p.j.y, '#8ff', 14); p.message('Le bouclier t\'a protégé', 2 * SEC); return; }
  p.coeurs--; p.coups++; p.j.inv = 100; p.secousse = 10;
  eclats(p, p.j.x, p.j.y, '#ffffff', 16, 4);
  p.tirsE = p.tirsE.filter((b) => dist2(b, p.j) > 90 * 90); // gentil : les tirs tout près disparaissent
  p.evenements.push({ type: 'vibre' });
  if (p.coeurs <= 0) p.etat = 'mort';
}

function superPouvoir(p) {
  if (p.jauge < 100) return;
  p.jauge = 0;
  p.effets.push({ onde: 0 });
  p.tirsE = [];
  for (const e of p.ennemis) if (e.def.taille !== 'cage') blesse(p, e, 15);
  blesserBoss(p, 25);
}

const vivants = (p) => p.ennemis.filter((e) => !e.mort && !e.cache && e.y > -10);

function majTirsJoueur(p) {
  for (const b of p.tirsJ) {
    if (b.acc) b.vy = Math.max(-10, b.vy + b.acc);
    if (b.guide) {
      let cible = null, meilleur = 1e9;
      for (const e of vivants(p)) { if (e.def.taille === 'cage') continue; const d = dist2(b, e); if (d < meilleur) { meilleur = d; cible = e; } }
      if (bossTouchable(p) && dist2(b, p.boss) < meilleur) cible = p.boss;
      if (cible) {
        const a = Math.atan2(b.vy, b.vx), v = Math.hypot(b.vx, b.vy), c = Math.atan2(cible.y - b.y, cible.x - b.x);
        const da = Math.max(-0.12, Math.min(0.12, ((c - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI));
        const nv = Math.min(7, v + 0.15);
        b.vx = Math.cos(a + da) * nv; b.vy = Math.sin(a + da) * nv;
      }
    }
    b.x += b.vx; b.y += b.vy;
    if (b.rebond !== undefined) {
      if ((b.x < 4 && b.vx < 0) || (b.x > W - 4 && b.vx > 0)) { b.vx *= -1; b.rebond--; }
      if (b.y < 4 && b.vy < 0) { b.vy *= -1; b.rebond--; }
      if (b.rebond < 0) b.mort = true;
    }
    if (b.vie !== undefined && --b.vie <= 0) b.mort = true;
    if (!b.mort && dansRocher(p, b)) { b.mort = true; p.effets.push({ x: b.x, y: b.y, vx: 0, vy: 0, vie: 8, couleur: '#d9b07a' }); } // le rocher arrête le tir
  }
  p.tirsJ = p.tirsJ.filter((b) => !b.mort && b.y > -30 && b.y < H + 30 && b.x > -30 && b.x < W + 30);
}

function collisionsTirs(p) {
  for (const b of p.tirsJ) {
    for (const e of vivants(p)) {
      if (dist2(b, e) >= (e.r + b.r) ** 2) continue;
      if (b.perce) { if (!b.perce.has(e)) { b.perce.add(e); blesse(p, e, b.dmg); } continue; }
      if (b.zone) {
        p.effets.push({ zone: true, x: b.x, y: b.y, r: b.zone, vie: 16 });
        for (const f of vivants(p)) if (dist2(b, f) < (b.zone + f.r) ** 2) blesse(p, f, b.dmg);
      } else blesse(p, e, b.dmg);
      b.mort = true;
      break;
    }
    if (!b.mort && bossTouchable(p) && dist2(b, p.boss) < (p.boss.r + b.r) ** 2) {
      if (b.perce) { if (!b.perce.has(p.boss)) { b.perce.add(p.boss); blesserBoss(p, b.dmg); } }
      else {
        if (b.zone) p.effets.push({ zone: true, x: b.x, y: b.y, r: b.zone, vie: 16 });
        blesserBoss(p, b.dmg); b.mort = true;
      }
    }
  }
  p.tirsJ = p.tirsJ.filter((b) => !b.mort);
}

function majTirsEnnemis(p) {
  const j = p.j;
  for (const b of p.tirsE) {
    b.x += b.vx; b.y += b.vy;
    if (dansRocher(p, b)) { b.mort = true; continue; } // abrité derrière un rocher
    if (b.bleu) { if (dist2(b, j) < (b.r + ZB) ** 2) { b.mort = true; remplit(p, 5); p.effets.push({ x: b.x, y: b.y, vx: 0, vy: 0, vie: 12, couleur: '#4fd6ff' }); } }
    else if (dist2(b, j) < (b.r + ZT) ** 2) { b.mort = true; touche(p); }
  }
  p.tirsE = p.tirsE.filter((b) => !b.mort && b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);
}

function contacts(p) {
  for (const e of p.ennemis) {
    if (e.mort || e.cache || e.def.taille === 'cage') continue;
    if (dist2(e, p.j) < (e.r * 0.7 + (p.robot ? 16 : ZT)) ** 2) {
      if (p.etoile > 0) { if (p.t % 6 === 0) blesse(p, e, 1); }
      else if (p.robot) { if (p.t % 6 === 0) blesse(p, e, 2); touche(p); }
      else { touche(p); blesse(p, e, 2); }
    }
  }
  if (bossTouchable(p) && dist2(p.boss, p.j) < (p.boss.r * 0.7 + ZT) ** 2) touche(p);
}

function majObjets(p) {
  const j = p.j;
  for (const o of p.objets) {
    const d2 = dist2(o, j);
    // Cristal en l'air, au-dessus d'un tremplin : il défile avec le sol, l'aimant ne
    // l'attire pas, on ne l'attrape qu'en plein saut
    if (o.k === 'cristalHaut') { o.y += DEFIL; if (j.z > 0.3 && d2 < 22 * 22) { o.mort = true; p.cristaux++; remplit(p, 1); } continue; }
    if (o.k === 'cristal' && (p.aimant > 0 || d2 < p.rayonAimant ** 2)) {
      const d = Math.sqrt(d2) || 1; o.x += ((j.x - o.x) / d) * 7; o.y += ((j.y - o.y) / d) * 7;
    } else {
      o.vy = Math.min(o.vy + 0.05, o.k === 'cristal' ? 1.6 : 0.9); o.vx *= 0.97; o.x += o.vx; o.y += o.vy;
    }
    if (d2 < (o.k === 'cristal' ? 16 : 24) ** 2) { o.mort = true; if (o.k === 'cristal') p.cristaux++; else if (o.k === 'caisse') monterRobot(p); else prendreCadeau(p, o); }
  }
  p.objets = p.objets.filter((o) => !o.mort && o.y < H + 20);
}

function majEffets(p) {
  for (const f of p.effets) {
    if (f.onde !== undefined) { f.onde += 14; if (f.onde > 800) f.mort = true; continue; }
    if (f.astronaute) { f.y -= 3; if (--f.vie <= 0) f.mort = true; continue; }
    if (f.zone) { if (--f.vie <= 0) f.mort = true; continue; }
    if (f.poussiere) f.r += 0.15;
    if (f.atterrit) { if (--f.vie <= 0) f.mort = true; continue; }
    f.x += f.vx; f.y += f.vy; f.vx *= 0.94; f.vy *= 0.94;
    if (--f.vie <= 0) f.mort = true;
  }
  p.effets = p.effets.filter((f) => !f.mort);
}

function terminer(p) {
  p.etat = 'fini';
  p.bilan = { mission: p.mission.id, cristaux: p.cristaux, cages: [...p.cagesLibres], nouvellesArmes: [...p.nouvellesArmes], coups: p.coups, duree: p.t,
    copainSauve: p.copainSauve, ouvreSecret: p.mission.ouvreSecret ?? null, avecCopain: p.vagues.some((v) => v[1].f === 'copain') };
}

/**
 * Une image de jeu.
 * @param {any} p
 * @param {{ touche: boolean, dx: number, dy: number, super?: boolean }} entree
 */
function pasPartie(p, entree) {
  if (p.etat !== 'jeu') return;
  p.t++;
  while (p.idx < p.vagues.length && p.vagues[p.idx][0] * SEC <= p.t) {
    const v = p.vagues[p.idx++][1], f = FORMATIONS[v.f];
    if (!f) throw new Error(`formation inconnue : ${v.f}`);
    f(p, v);
  }
  // Le temps des bonus ne coule que s'il y a un ennemi à toucher (l'aimant : ou des cristaux
  // à ramasser). Sinon il attend, comme les munitions.
  p.actif = cibleVisible(p);
  const aimantUtile = p.actif || p.objets.some((o) => o.k === 'cristal');
  if (p.aimant > 0 && aimantUtile) p.aimant--;
  if (p.compagnons > 0 && p.actif) p.compagnons--;
  if (p.etoile > 0 && p.actif) p.etoile--;
  for (const k of ['secousse', 'alerte']) if (p[k] > 0) p[k]--;
  if (p.robot && --p.robot.t <= 0) descendreRobot(p);
  majMilieux(p);
  piloter(p.j, p.M, entree, forces(p));
  solDuRover(p);
  if (p.j.inv > 0) p.j.inv--;
  if (entree.super) superPouvoir(p);
  const calme = p.fin && !p.boss && !p.ennemis.some((e) => e.def.taille !== 'cage');
  if (!calme) { tirer(p); tirCompagnons(p); }
  majCopain(p, (o) => balle(p, o));
  majTirsJoueur(p);
  for (const e of p.ennemis) {
    e.age++; if (e.flash) e.flash--;
    // Sonné par l'atterrissage du rover : il ne bouge plus (il défile avec le sol) et ne tire pas
    if (e.etourdi > 0) { e.etourdi--; e.y += DEFIL; continue; }
    COMPORTEMENTS[e.def.comportement](e, p);
    if (e.def.tir && !e.aTire && !e.cache && e.y > 90 && e.y < 260) {
      e.aTire = true;

 * @param {number} graine

  return {
    suivant,
    /** @param {number} a @param {number} b */
    entre: (a, b) => a + suivant() * (b - a),
    /** @param {number} n */
    entier: (n) => Math.floor(suivant() * n),
    /** @template T @param {T[]} t @returns {T} */
    choix: (t) => t[Math.floor(suivant() * t.length)],
    /** Tire une clé selon ses poids. @param {Record<string, number>} poids */
    pondere(poids) {
      let total = 0;
      for (const k in poids) total += poids[k];
      let r = suivant() * total;
      for (const k in poids) if ((r -= poids[k]) < 0) return k;
      return Object.keys(poids)[0];
    },
  };
}

//
// direct (avion) : le module glisse vers la cible que le doigt déplace (lissage).

function graine(n) { let a = n >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hachage = (s) => [...s].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619) >>> 0, 2166136261);

// ---------- pinceaux ----------
function tache(x, r, cx, cy, rx, ry, couleur) {
  x.beginPath();
  for (let i = 0; i <= 18; i++) { const a = i / 18 * Math.PI * 2, k = 0.85 + r() * 0.3; i ? x.lineTo(cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k) : x.moveTo(cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k); }
  x.closePath(); x.fillStyle = couleur; x.fill();
}
function courbe(x, pts) { // passe par chaque point (Catmull-Rom)
  x.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    x.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);

}
function trait(x, pts, larg, coul, tirets) { x.save(); x.strokeStyle = coul; x.lineWidth = larg; x.lineCap = 'round'; x.lineJoin = 'round'; if (tirets) x.setLineDash(tirets); x.beginPath(); courbe(x, pts); x.stroke(); x.restore(); }
function fleurette(x, cx, cy, c, s = 1) { x.fillStyle = c; for (let k = 0; k < 5; k++) { const a = k * 1.256; x.beginPath(); x.arc(cx + Math.cos(a) * 2.6 * s, cy + Math.sin(a) * 2.6 * s, 2.2 * s, 0, Math.PI * 2); x.fill(); } x.fillStyle = '#ffd36a'; x.beginPath(); x.arc(cx, cy, 1.6 * s, 0, Math.PI * 2); x.fill(); }
function ombre(x, cx, cy, rx, ry) { x.fillStyle = 'rgba(0,0,0,.28)'; x.beginPath(); x.ellipse(cx + rx * 0.25, cy + ry * 0.3, rx, ry, 0, 0, Math.PI * 2); x.fill(); }
function rocher(x, r, cx, cy, s) {

}
function tronc(x, cx, cy, long, ang) {

  x.strokeStyle = '#8a6a3c'; x.lineWidth = 1.2; x.beginPath(); x.ellipse(long / 2 - 2, 0, 2.5, 5, 0, 0, Math.PI * 2); x.stroke();
  x.fillStyle = 'rgba(90,150,70,.7)'; x.beginPath(); x.ellipse(-long / 6, -4, 10, 4, 0, 0, Math.PI * 2); x.fill();

}
function eau(x, r, cx, cy, rx, ry, bord = '#8a7a4a') { tache(x, r, cx, cy, rx + 6, ry + 6, bord); tache(x, r, cx, cy, rx, ry, '#2a6e7d'); tache(x, r, cx - rx * 0.15, cy - ry * 0.15, rx * 0.6, ry * 0.55, '#3a8a97'); }
function nenuphar(x, cx, cy, s, ang) {

function etang(x, r, cx, cy, rx, ry) {

function fougere(x, r, cx, cy, s, coul = '#2f7d3c') {

    x.strokeStyle = 'rgba(160,220,150,.5)'; x.lineWidth = 1; x.beginPath(); x.moveTo(2, 0); x.lineTo(s * 0.9, 0); x.stroke();

}
function dalles(x, cx, cy, w, h, mousse, r) {
  x.save(); x.translate(cx, cy);
  x.fillStyle = 'rgba(0,0,0,.3)'; x.fillRect(-w / 2 + 6, -h / 2 + 8, w, h);
  x.fillStyle = '#6f7a63'; x.fillRect(-w / 2, -h / 2, w, h);

  for (let j = -h / 2; j <= h / 2 + 1; j += 24) { x.beginPath(); x.moveTo(-w / 2, j); x.lineTo(w / 2, j); x.stroke(); }

}
function pilier(x, cx, cy, s = 11, casse = false) {

  x.fillStyle = casse ? '#848d7a' : '#9aa38a'; x.beginPath(); x.arc(cx, cy, s, 0, Math.PI * 2); x.fill();

  if (casse) { x.strokeStyle = '#5c6652'; x.beginPath(); x.moveTo(cx - s * 0.6, cy - s * 0.2); x.lineTo(cx + s * 0.1, cy + s * 0.3); x.lineTo(cx + s * 0.5, cy - s * 0.1); x.stroke(); }
}
function statue(x, cx, cy) { // tête de caméléon en pierre, vue de haut : l'annonce du boss
  ombre(x, cx, cy, 22, 18);
  x.fillStyle = '#848d7a'; x.beginPath(); x.ellipse(cx, cy, 22, 17, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#9aa38a'; x.beginPath(); x.moveTo(cx - 20, cy - 4); x.quadraticCurveTo(cx, cy - 30, cx + 20, cy - 4); x.closePath(); x.fill(); // crête
  for (const s of [-1, 1]) { x.fillStyle = '#6f7a63'; x.beginPath(); x.arc(cx + s * 13, cy + 2, 6, 0, Math.PI * 2); x.fill(); x.fillStyle = '#c9b56a'; x.beginPath(); x.arc(cx + s * 13, cy + 2, 2.6, 0, Math.PI * 2); x.fill(); }
  x.fillStyle = 'rgba(80,140,60,.55)'; x.beginPath(); x.ellipse(cx - 8, cy + 10, 9, 4, 0.3, 0, Math.PI * 2); x.fill();
}
function brume(x, r, cx, cy, rx, ry) { for (let k = 0; k < 4; k++) tache(x, r, cx + (r() - 0.5) * rx * 0.6, cy + (r() - 0.5) * ry * 0.6, rx * (0.6 + r() * 0.4), ry * (0.6 + r() * 0.4), 'rgba(220,240,230,.05)'); }
function cime(x, r, cx, cy, R, coul) { // la cime d'un arbre géant, tout en bas sous l'avion
  for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2 + r() * 0.5; tache(x, r, cx + Math.cos(a) * R * 0.5, cy + Math.sin(a) * R * 0.5, R * 0.5, R * 0.45, coul); }

function liane(x, r, pts) { trait(x, pts, 3, '#2a4a20'); for (let k = 1; k < pts.length; k++) { const [a, b] = pts[k]; x.fillStyle = '#3f7a3a'; x.beginPath(); x.ellipse(a + 5, b, 5, 2.6, 0.6, 0, Math.PI * 2); x.fill(); x.beginPath(); x.ellipse(a - 5, b + 4, 5, 2.6, -0.6, 0, Math.PI * 2); x.fill(); } }

function hutte(x, r, cx, cy) { // la hutte d'un explorateur, vue de haut : un toit de chaume rond
  ombre(x, cx, cy, 30, 28);
  x.fillStyle = '#b08a45'; x.beginPath(); x.arc(cx, cy, 30, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#c9a35a'; x.beginPath(); x.arc(cx - 3, cy - 3, 24, 0, Math.PI * 2); x.fill();
  x.strokeStyle = 'rgba(110,80,35,.6)'; x.lineWidth = 1.4;
  for (let k = 0; k < 28; k++) { const a = k / 28 * Math.PI * 2; x.beginPath(); x.moveTo(cx + Math.cos(a) * 6, cy + Math.sin(a) * 6); x.lineTo(cx + Math.cos(a) * 29, cy + Math.sin(a) * 29); x.stroke(); }

function feuDeCamp(x, r, cx, cy) { // un rond de pierres, la cendre et quelques braises : on était là
  x.fillStyle = '#3a342c'; x.beginPath(); x.arc(cx, cy, 12, 0, Math.PI * 2); x.fill();
  for (let k = 0; k < 9; k++) { const a = k / 9 * Math.PI * 2; x.fillStyle = k % 2 ? '#848d7a' : '#9aa38a'; x.beginPath(); x.ellipse(cx + Math.cos(a) * 15, cy + Math.sin(a) * 15, 4.4, 3.4, a, 0, Math.PI * 2); x.fill(); }

function racine(x, r, pts, larg) { // épaisse au départ, fine au bout, à moitié dans la terre
  for (let i = 0; i < pts.length - 1; i++) {
    const t = i / (pts.length - 1);
    x.globalAlpha = 1 - t * 0.55; // elle s'enfonce dans le sol en s'éloignant
    x.strokeStyle = '#3e2f1e'; x.lineWidth = larg * (1 - t * 0.8) + 1.5; x.lineCap = 'round';

// Une grosse souche vue de haut. Ses racines, peu nombreuses et inégales, partent surtout vers
// la mare (vers, en radians) : régulières tout autour, elles faisaient des pattes d'araignée.
function souche(x, r, cx, cy, R, vers) {
  const angles = [vers - 0.5, vers, vers + 0.45, vers + 2.4, vers - 2.2];
  angles.forEach((a0, k) => {
    const l = R * (k < 3 ? 2.4 + r() * 1.4 : 1 + r() * 0.6), courbe = (r() - 0.5) * 1.2;
    const pts = []; for (let j = 0; j <= 7; j++) { const t = j / 7, aa = a0 + courbe * t + Math.sin(t * 6 + k) * 0.12; pts.push([cx + Math.cos(aa) * (R * 0.75 + l * t), cy + Math.sin(aa) * (R * 0.75 + l * t)]); }
    racine(x, r, pts, R * (k < 3 ? 0.42 : 0.3));
    if (k === 1) { x.fillStyle = 'rgba(90,150,70,.55)'; const [mx, my] = pts[2]; x.beginPath(); x.ellipse(mx, my, 7, 3, a0, 0, Math.PI * 2); x.fill(); } // mousse
  });
  for (let k = 0; k < 10; k++) { const a = r() * Math.PI * 2, d = R * (1 + r() * 0.8); x.strokeStyle = '#2d6b3b'; x.lineWidth = 1.4; const px = cx + Math.cos(a) * d, py = cy + Math.sin(a) * d; x.beginPath(); x.moveTo(px, py); x.lineTo(px - 2, py - 4); x.moveTo(px, py); x.lineTo(px + 2, py - 4); x.stroke(); } // l'herbe pousse sur les racines
  ombre(x, cx, cy, R, R);
  x.fillStyle = '#4e3824'; x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#9a7a4e'; x.beginPath(); x.arc(cx - 2, cy - 2, R * 0.78, 0, Math.PI * 2); x.fill();
  x.strokeStyle = '#7a5e3a'; x.lineWidth = 1.3; for (let k = 1; k <= 3; k++) { x.beginPath(); x.arc(cx - 2 + k * 0.6, cy - 2, R * 0.78 * k / 4, 0, Math.PI * 2); x.stroke(); }
  x.fillStyle = 'rgba(90,150,70,.75)'; x.beginPath(); x.ellipse(cx + R * 0.3, cy - R * 0.45, R * 0.5, R * 0.28, 0.5, 0, Math.PI * 2); x.fill();
}

// ---------- les tuiles ----------
// Le sol de base : la couleur de la mission en taches, des touffes d'herbe, des fleurs
function sol(x, r, pal, fleurs) {
  x.fillStyle = pal[0]; x.fillRect(0, 0, W, TH);
  for (let i = 0; i < 26; i++) tache(x, r, 40 + r() * (W - 80), 70 + r() * (TH - 140), 30 + r() * 46, 20 + r() * 32, r() < 0.5 ? pal[1] : pal[2]);
  for (let i = 0; i < 180; i++) { const px = r() * W, py = 6 + r() * (TH - 12); x.strokeStyle = r() < 0.5 ? pal[3] : pal[1]; x.lineWidth = 1.4; x.beginPath(); x.moveTo(px, py); x.lineTo(px - 2, py - 4); x.moveTo(px, py); x.lineTo(px + 2, py - 4); x.stroke(); }
  for (let i = 0; i < fleurs; i++) fleurette(x, 10 + r() * (W - 20), 10 + r() * (TH - 20), ['#c8362b', '#ffd36a', '#e58ab0', '#f2ead3'][i % 4]);
}
// La rivière d'une tuile : elle entre et sort à x = 250, toute droite, pour se raccorder à la suivante
function riviere(x, r, ondule, larg = 50) {
  const pts = [[250, -40], [250, 0], [250 - ondule, TH * 0.3], [250 + ondule * 0.6, TH * 0.62], [250, TH], [250, TH + 40]];
  trait(x, pts, larg + 20, '#0f2c18'); trait(x, pts, larg + 12, '#8a7a4a'); trait(x, pts, larg, '#2a6e7d'); trait(x, pts, larg * 0.56, '#3a8a97');
  x.save(); x.strokeStyle = 'rgba(210,240,240,.55)'; x.lineWidth = 2; x.lineCap = 'round';
  for (let k = 0; k < 14; k++) { const t = (k + 0.5) / 14, y = t * TH, cx = 250 + (t < 0.3 ? -ondule * t / 0.3 : t < 0.62 ? -ondule + (ondule * 1.6) * (t - 0.3) / 0.32 : ondule * 0.6 * (1 - (t - 0.62) / 0.38)) + (r() - 0.5) * 14; x.beginPath(); x.moveTo(cx - 7, y); x.quadraticCurveTo(cx, y - 4, cx + 7, y); x.stroke(); }
  x.restore();
  return (y) => { const t = y / TH; return 250 + (t < 0.3 ? -ondule * t / 0.3 : t < 0.62 ? -ondule + (ondule * 1.6) * (t - 0.3) / 0.32 : ondule * 0.6 * (1 - (t - 0.62) / 0.38)); };
}
// Un chemin ou une route reste DANS sa tuile : sinon il serait coupé net au raccord.
const TUILES = {
  prairie(x, r, d) { sol(x, r, d.pal, 40); for (let k = 0; k < 6; k++) buisson(x, r, 30 + r() * (W - 60), 40 + r() * (TH - 80), 10 + r() * 8, '#2c7a3a'); },
  sentier(x, r, d) { // un vrai chemin : il part de la hutte et monte jusqu'au feu de camp
    sol(x, r, d.pal, 26);
    const chemin = [[118, 118], [150, 220], [96, 330], [150, 440], [120, 528]];
    trait(x, chemin, 26, '#4e3c22'); trait(x, chemin, 20, '#9a8456'); trait(x, chemin, 7, '#b5a070', [10, 16]);
    for (let k = 0; k < 18; k++) { const t = r(), q = chemin[Math.min(chemin.length - 1, Math.floor(t * (chemin.length - 1)) + (r() < 0.5 ? 0 : 1))]; x.fillStyle = r() < 0.5 ? '#7d7a68' : '#a39d84'; x.beginPath(); x.ellipse(q[0] + (r() - 0.5) * 16, q[1] + (r() - 0.5) * 60, 2 + r() * 2, 1.6 + r(), r() * 3, 0, Math.PI * 2); x.fill(); } // cailloux

// ---------- Désert : le sol du rover ----------
// Le sable du décor est uni et mat ; le SABLE MOU, lui, est plus clair, ridé et pointillé
// (dessiné par rendu.js) : il ne faut jamais confondre les deux. Aucun cactus dans le
// décor : un cactus, c'est un ennemi (le cactus-tourelle).
function sable0(x, r, pal) {
  x.fillStyle = pal[0]; x.fillRect(0, 0, W, TH);
  // des taches douces (à demi transparentes) : franches, elles brouillaient l'écran
  x.globalAlpha = 0.4; for (let i = 0; i < 18; i++) tache(x, r, 40 + r() * (W - 80), 70 + r() * (TH - 140), 36 + r() * 50, 22 + r() * 30, r() < 0.5 ? pal[1] : pal[2]); x.globalAlpha = 1;
  for (let i = 0; i < 140; i++) { x.fillStyle = r() < 0.5 ? pal[3] : pal[1]; x.beginPath(); x.arc(r() * W, 6 + r() * (TH - 12), 0.8 + r() * 1.2, 0, Math.PI * 2); x.fill(); } // grains
}
function rides(x, r, n, coul) { // les rides du vent sur le sable
  x.strokeStyle = coul; x.lineWidth = 1.6; x.lineCap = 'round';
  for (let k = 0; k < n; k++) { const cx = r() * W, cy = 20 + r() * (TH - 40), l = 30 + r() * 50; x.beginPath(); x.moveTo(cx - l / 2, cy); x.quadraticCurveTo(cx, cy - 6, cx + l / 2, cy + 2); x.stroke(); }
}
function dune(x, r, cx, cy, rx, ry, pal) { // une dune vue de haut : la crête claire, le versant à l'ombre
  tache(x, r, cx + rx * 0.15, cy + ry * 0.2, rx, ry, pal[2]);
  tache(x, r, cx - rx * 0.1, cy - ry * 0.1, rx * 0.85, ry * 0.75, pal[1]);
  x.strokeStyle = 'rgba(255,240,210,.55)'; x.lineWidth = 2.2; x.beginPath(); x.moveTo(cx - rx * 0.8, cy - ry * 0.1); x.quadraticCurveTo(cx, cy - ry * 0.7, cx + rx * 0.8, cy); x.stroke();
}
function caillou(x, r, cx, cy, s, coul = '#8a7458') { ombre(x, cx, cy, s, s * 0.8); tache(x, r, cx, cy, s, s * 0.8, coul); tache(x, r, cx - s * 0.25, cy - s * 0.25, s * 0.5, s * 0.4, 'rgba(255,240,210,.35)'); }
function buissonSec(x, r, cx, cy, s) { // une touffe d'herbe sèche (immobile : ce n'est pas la boule qui roule)
  x.strokeStyle = '#9a7a3e'; x.lineWidth = 1.6; x.lineCap = 'round';
  for (let k = 0; k < 12; k++) { const a = r() * Math.PI * 2; x.beginPath(); x.moveTo(cx, cy); x.lineTo(cx + Math.cos(a) * s, cy + Math.sin(a) * s * 0.7); x.stroke(); }
}
function traces(x, xs) { // les traces de pneus d'une piste
  for (const x0 of xs) { x.strokeStyle = 'rgba(120,90,50,.35)'; x.lineWidth = 6; x.setLineDash([5, 4]); x.beginPath(); x.moveTo(x0, 0); x.bezierCurveTo(x0 + 30, TH * 0.3, x0 - 30, TH * 0.6, x0, TH); x.stroke(); x.setLineDash([]); }
}
function craquelures(x, r, cx, cy, rx, ry) { // la terre craquelée d'un fond de mare asséchée
  tache(x, r, cx, cy, rx, ry, '#c9a06a');
  x.strokeStyle = 'rgba(110,80,45,.55)'; x.lineWidth = 1.4;
  for (let k = 0; k < 30; k++) { const px = cx + (r() - 0.5) * rx * 1.6, py = cy + (r() - 0.5) * ry * 1.6; x.beginPath(); x.moveTo(px, py); for (let j = 0; j < 3; j++) x.lineTo(px + (r() - 0.5) * 30, py + (r() - 0.5) * 30); x.stroke(); }
}
function falaise(x, r, cote) { // le bord d'un canyon, sur un côté : roche rouge en strates
  const x0 = cote < 0 ? 0 : W, l = 70;
  x.fillStyle = '#8f4f2e'; x.beginPath(); x.moveTo(x0, -10);
  for (let y = -10; y <= TH + 10; y += 40) x.lineTo(x0 - cote * (l + Math.sin(y * 0.02) * 16 + r() * 8), y);
  x.lineTo(x0, TH + 10); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(240,170,110,.35)'; x.lineWidth = 2;
  for (let k = 1; k <= 4; k++) { x.beginPath(); for (let y = -10; y <= TH + 10; y += 40) { const px = x0 - cote * (k * 14 + Math.sin(y * 0.02 + k) * 6); y === -10 ? x.moveTo(px, y) : x.lineTo(px, y); } x.stroke(); }
  x.fillStyle = 'rgba(0,0,0,.22)'; x.beginPath(); for (let y = -10; y <= TH + 10; y += 40) { const px = x0 - cote * (l + Math.sin(y * 0.02) * 16); y === -10 ? x.moveTo(px, y) : x.lineTo(px, y); } for (let y = TH + 10; y >= -10; y -= 40) x.lineTo(x0 - cote * (l + 14 + Math.sin(y * 0.02) * 16), y); x.closePath(); x.fill(); // ombre au pied
}
function squelette(x, r, cx, cy) { // les os d'une grosse bête, à moitié dans le sable
  x.strokeStyle = '#efe4cc'; x.lineCap = 'round';
  x.lineWidth = 6; x.beginPath(); x.moveTo(cx - 70, cy); x.quadraticCurveTo(cx, cy - 10, cx + 60, cy + 4); x.stroke(); // colonne
  x.lineWidth = 4; for (let k = -3; k <= 3; k++) { const px = cx + k * 16; x.beginPath(); x.moveTo(px, cy - 4); x.quadraticCurveTo(px + 6, cy - 26, px + 2, cy - 36); x.moveTo(px, cy + 4); x.quadraticCurveTo(px + 6, cy + 26, px + 2, cy + 36); x.stroke(); }
  x.fillStyle = '#efe4cc'; x.beginPath(); x.ellipse(cx + 76, cy + 6, 18, 13, 0.2, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#6b5a40'; x.beginPath(); x.arc(cx + 80, cy + 2, 3.5, 0, Math.PI * 2); x.arc(cx + 80, cy + 12, 3.5, 0, Math.PI * 2); x.fill();
  tache(x, r, cx - 40, cy + 20, 26, 10, 'rgba(217,178,122,.85)'); // le sable qui le recouvre
}
function blocs(x, r, cx, cy, n) { // des blocs de grès taillés, une colonne couchée
  for (let k = 0; k < n; k++) { const px = cx + (r() - 0.5) * 120, py = cy + (r() - 0.5) * 90, w = 22 + r() * 18, h = 16 + r() * 12; x.fillStyle = 'rgba(0,0,0,.28)'; x.fillRect(px + 5, py + 6, w, h); x.fillStyle = '#c99a5e'; x.fillRect(px, py, w, h); x.strokeStyle = '#9a7040'; x.lineWidth = 1.6; x.strokeRect(px, py, w, h); }
}
function colonneCouchee(x, cx, cy, ang) { x.save(); x.translate(cx, cy); x.rotate(ang); x.fillStyle = 'rgba(0,0,0,.28)'; x.fillRect(-46, -6, 92, 22); x.fillStyle = '#d8b07a'; x.fillRect(-50, -11, 100, 22); x.strokeStyle = '#a07a48'; x.lineWidth = 1.6; for (let k = -40; k <= 40; k += 10) { x.beginPath(); x.moveTo(k, -11); x.lineTo(k, 11); x.stroke(); } x.restore(); }
function statueScarabee(x, r, cx, cy) { // un scarabée de pierre à moitié enfoui : l'annonce du boss
  ombre(x, cx, cy, 34, 30);
  x.fillStyle = '#b08a55'; x.beginPath(); x.ellipse(cx, cy, 30, 36, 0, 0, Math.PI * 2); x.fill();
  x.strokeStyle = '#7a5a30'; x.lineWidth = 2.4; x.beginPath(); x.moveTo(cx, cy - 26); x.lineTo(cx, cy + 34); x.stroke();
  x.fillStyle = '#9a7444'; x.beginPath(); x.ellipse(cx, cy - 38, 16, 10, 0, 0, Math.PI * 2); x.fill();
  tache(x, r, cx + 10, cy + 30, 34, 14, 'rgba(217,178,122,.9)');
}
function palmeDeHaut(x, r, cx, cy, R) { // un palmier d'oasis vu de haut
  ombre(x, cx, cy, R, R);
  for (let k = 0; k < 7; k++) { const a = k / 7 * Math.PI * 2 + r() * 0.3; x.save(); x.translate(cx, cy); x.rotate(a); x.fillStyle = k % 2 ? '#3f8a3a' : '#4f9a48'; x.beginPath(); x.moveTo(R * 0.1, 0); x.quadraticCurveTo(R * 0.6, -R * 0.26, R, 0); x.quadraticCurveTo(R * 0.6, R * 0.26, R * 0.1, 0); x.fill(); x.strokeStyle = '#9fd08a'; x.lineWidth = 1.2; x.beginPath(); x.moveTo(R * 0.12, 0); x.lineTo(R * 0.95, 0); x.stroke(); x.restore(); }
  x.fillStyle = '#7a5a36'; x.beginPath(); x.arc(cx, cy, R * 0.14, 0, Math.PI * 2); x.fill();
}
function brumeDeSable(x, r) { // la tempête : des voiles de sable en biais
  for (let k = 0; k < 16; k++) { const y = r() * TH; x.strokeStyle = 'rgba(255,235,200,.16)'; x.lineWidth = 8 + r() * 14; x.lineCap = 'round'; x.beginPath(); x.moveTo(-20, y); x.lineTo(W + 20, y + 60 + r() * 40); x.stroke(); }
}
const TUILES_DESERT = {
  dunes(x, r, d) { sable0(x, r, d.pal); dune(x, r, 110, 180, 90, 50, d.pal); dune(x, r, 270, 460, 80, 46, d.pal); rides(x, r, 26, 'rgba(150,110,60,.4)'); caillou(x, r, 300, 140, 8); },

Object.assign(TUILES, Object.fromEntries(Object.entries(TUILES_DESERT).map(([k, f]) => ['d_' + k, f])));

const peintes = new Map(); // mission → tuiles peintes
function tuilesDe(id) {
  if (peintes.has(id)) return peintes.get(id);
  const d = DECORS[id] ?? DECORS.j1;
  const liste = d.tuiles.map((nom, k) => {
    const c = document.createElement('canvas'); c.width = W * ECH; c.height = TH * ECH;
    const x = c.getContext('2d'); x.scale(ECH, ECH);
    TUILES[nom](x, graine(hachage(id + nom + k)), d);
    // la lumière dorée du nid : un voile UNI (un dégradé par tuile laissait voir chaque raccord)
    if (d.dore) { x.fillStyle = 'rgba(255,215,110,.10)'; x.fillRect(0, 0, W, TH); }
    return c;
  });
  peintes.set(id, liste);
  return liste;
}

/** La mission a-t-elle un sol peint ? */

// Commande relative : on glisse n'importe où, le module reproduit le mouvement du doigt.
// lire() rend le glissement accumulé depuis la lecture précédente (une fois par image).

/**
 * @param {HTMLElement} zone  l'élément qui reçoit le doigt (le canvas)
 * @param {{ echelle: () => number, sens?: number }} reglages
 */
function brancherDoigt(zone, { echelle, sens = 1.25 }) {
  let doigt = null, dx = 0, dy = 0;
  zone.addEventListener('pointerdown', (ev) => {
    doigt = { id: ev.pointerId, x: ev.clientX, y: ev.clientY };
    zone.setPointerCapture?.(ev.pointerId);
  });
  zone.addEventListener('pointermove', (ev) => {
    if (!doigt || ev.pointerId !== doigt.id) return;
    dx += ((ev.clientX - doigt.x) / echelle()) * sens;
    dy += ((ev.clientY - doigt.y) / echelle()) * sens;
    doigt.x = ev.clientX; doigt.y = ev.clientY;
  });
  const lacher = (ev) => { if (doigt && ev.pointerId === doigt.id) doigt = null; };
  zone.addEventListener('pointerup', lacher);
  zone.addEventListener('pointercancel', lacher);
  return {
    /** @param {boolean} bas  vrai quand le décor défile vers le bas (sous-marin) : on inverse dy */
    lire(bas = false) {
      const e = { touche: doigt !== null, dx, dy: bas ? -dy : dy };
      dx = dy = 0;
      return e;
    },
    relacher() { doigt = null; dx = dy = 0; },
  };
}
