<title>Star Patrol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Star Patrol, en formes simples. Écran de jeu sombre par choix ;
   les vraies couleurs et la police viendront avec la direction B (livre illustré). */
:root{
  --fond:#0a0f2e; --panneau:#141c4a; --trait:#2a3570; --texte:#eef0ff; --doux:#b8c0f0;
  --accent:#fabc41; --sur-accent:#271900; --fini:#5fd68a;
  --police:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--fond);color:var(--texte);font-family:var(--police);overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#cadre{position:relative;height:100%;display:grid;place-items:center}
#jeu{position:relative;touch-action:none}
canvas{display:block;touch-action:none}
button{font:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ecran{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:20px 16px;background:rgba(6,9,30,.94);text-align:center;overflow:auto}
.ecran h1{font-size:26px;line-height:1.1;font-weight:800;margin:0;text-wrap:balance}
.ecran h2{font-size:24px;font-weight:800;margin:0}
.ecran p{color:var(--doux);font-size:15px;line-height:1.4;max-width:32ch;margin:0}
.gros{min-height:60px;min-width:240px;padding:0 20px;border:0;border-radius:18px;background:var(--accent);color:var(--sur-accent);
  font-size:19px;font-weight:800;box-shadow:0 5px 0 #8a6200}
.moyen{min-height:48px;min-width:180px;padding:0 18px;border:2px solid var(--doux);border-radius:14px;background:transparent;color:var(--texte);font-size:17px;font-weight:700}
/* Carte */
#carte{justify-content:flex-start}
/* L'action principale reste collée en bas, toujours visible */
#b-continuer{position:sticky;bottom:4px;margin-top:auto;flex-shrink:0}
.resume{font-size:14px;color:var(--doux)}
#planetes{display:grid;gap:10px;width:min(340px,100%)}
.planete{border:2px solid var(--c);border-radius:16px;padding:8px 10px 10px;background:var(--panneau);text-align:left}
.planete.lointaine{opacity:.6;padding:8px 10px}
.planete.lointaine h2{margin:0}
.planete h2{font-size:17px;color:var(--c);display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px}
.planete h2 small{font-size:14px;color:var(--doux);font-weight:600}
.chemin{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mission{min-height:48px;border-radius:12px;border:2px solid var(--trait);background:#0f1640;color:var(--doux);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;font-size:15px}
.mission small{font-size:14px;line-height:1}
.bientot{margin:6px 0 0;font-size:14px;color:var(--doux)}
.mission.ouverte{border-color:var(--accent);color:var(--texte);box-shadow:0 0 12px rgba(250,188,65,.35)}
.mission.finie{border-color:var(--fini);color:var(--texte)}
.mission:disabled{cursor:default}
.points{font-size:14px;line-height:1;color:var(--fini)}
details{width:min(340px,100%);text-align:left;border:1px solid var(--trait);border-radius:12px;padding:4px 12px}
summary{min-height:40px;display:flex;align-items:center;color:var(--doux);font-size:15px;cursor:pointer}
label{display:flex;align-items:center;gap:10px;font-size:15px;min-height:36px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.petit{min-height:40px;padding:0 12px;border:1px solid var(--doux);border-radius:10px;background:transparent;color:var(--texte);font-size:14px;margin:4px 0}
.secrete{grid-column:1/-1;margin-top:6px;min-height:48px;font-size:15px}
.secrete small{font-size:14px}
/* Hangar */
.ameliorations{display:grid;gap:10px;width:min(320px,100%)}
.amelioration{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;text-align:left;padding:12px;border-radius:14px;background:var(--panneau)}
.amelioration b{font-size:17px}
.amelioration small{grid-column:1;color:var(--doux);font-size:14px}
.niveaux{color:var(--accent);letter-spacing:2px}
.acheter{grid-row:1/3;grid-column:2;min-height:48px;min-width:104px;border:0;border-radius:12px;background:var(--accent);color:var(--sur-accent);font-weight:800;font-size:15px}
.acheter:disabled{background:#3a426e;color:#c8cdf0}
.rangee{display:flex;gap:8px;width:min(340px,100%)}
.rangee .moyen{flex:1;min-width:0}
.aide-installer{font-size:14px;color:var(--doux);max-width:34ch;margin:0}
.maj{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 12px;border-radius:12px;background:var(--panneau);border:1px solid var(--accent)}
.version{font-size:14px;color:var(--doux);margin:0}
/* Bilan */
.bilan{display:grid;gap:6px;width:min(300px,100%);text-align:left;font-size:16px;padding:12px;border-radius:14px;background:var(--panneau)}
.bilan .bon{color:var(--fini);font-weight:700}
/* Boutons posés sur la mission */
.rond{position:absolute;border:0;border-radius:50%;display:grid;place-items:center;font-weight:800}
#b-pause{top:8px;right:8px;width:44px;height:44px;background:rgba(20,28,74,.85);color:var(--texte);font-size:18px}
#b-super{right:12px;bottom:12px;width:76px;height:76px;background:#3a426e;color:#9aa3d0;font-size:13px;line-height:1.1;box-shadow:0 4px 0 #1a1f40}
#b-super.pret{background:var(--accent);color:var(--sur-accent);box-shadow:0 4px 0 #8a6200,0 0 24px rgba(250,188,65,.8)}
@media (prefers-reduced-motion:reduce){#b-super.pret{box-shadow:0 4px 0 #8a6200}}

</style>

<div id="cadre">
  <div id="jeu">
    <canvas id="toile" aria-label="La mission"></canvas>
    <button id="b-pause" class="rond" aria-label="Pause" hidden>II</button>
    <button id="b-super" class="rond" aria-label="Super-pouvoir" hidden>SUPER</button>

    <section id="carte" class="ecran">
      <h1>Star Patrol</h1>
      <div class="maj" id="maj" hidden>Une nouvelle version est prête. <button class="petit" id="recharger">Recharger</button></div>
      <div class="resume" id="c-resume"></div>
      <div id="planetes"></div>
      <div class="rangee">
        <button class="moyen" id="b-hangar">Hangar</button>
        <button class="moyen" id="installer" hidden>Installer</button>
      </div>
      <p class="aide-installer" id="aide-installer" hidden></p>
      <button class="gros" id="b-continuer">Continuer</button>
      <details>
        <summary>Réglages de test</summary>
        <label><input type="checkbox" id="o-invincible"> Invincible</label>
        <label><input type="checkbox" id="o-zones"> Voir les zones touchées</label>
        <label><input type="checkbox" id="o-vite"> Vitesse x2</label>
        <button class="petit" id="o-effacer">Effacer la sauvegarde</button>
      </details>
      <p class="version" id="version"></p>
    </section>

    <section id="hangar" class="ecran" hidden>
      <h2>Hangar</h2>
      <p id="h-resume"></p>
      <div id="h-liste" class="ameliorations"></div>
      <button class="gros" id="h-retour">Retour à la carte</button>
    </section>

    <section id="pause" class="ecran" hidden>
      <h2>Pause</h2>
      <button class="gros" id="p-reprendre">Reprendre</button>
      <button class="moyen" id="p-carte">Abandonner la mission</button>
    </section>

    <section id="mort" class="ecran" hidden>
      <h2>Oups, plus de cœurs !</h2>
      <p id="m-texte">La mission est courte : on la recommence. Les astronautes délivrés retournent dans leurs bulles.</p>
      <button class="gros" id="m-recommencer">Recommencer la mission</button>
      <button class="moyen" id="m-carte">Carte</button>
    </section>

    <section id="bilan" class="ecran" hidden>
      <h2>Mission réussie !</h2>
      <div class="bilan" id="bilan-liste"></div>
      <button class="gros" id="g-suite">Mission suivante</button>
      <button class="moyen" id="g-carte">Carte</button>
    </section>
  </div>
</div>

<script>
'use strict';
const __defs = new Map(), __faits = new Map();
function __def(nom, f) { __defs.set(nom, f); }
function __req(nom) {
  if (!__faits.has(nom)) { if (!__defs.has(nom)) throw new Error('module absent : ' + nom); __faits.set(nom, {}); __faits.set(nom, __defs.get(nom)(__req)); }
  return __faits.get(nom);

__def("jeu.js", function (__req) {
// Star Patrol : relie le moteur (pur), l'écran, la carte et la sauvegarde.

const { creePartie, pasPartie, repartirDuDrapeau } = __req("moteur/partie.js");
const { appliquerBilan, CHEMINS, prochaine } = __req("moteur/progression.js");
const { ARMES } = __req("moteur/tirs.js");
const { MISSIONS, MISSIONS_EXISTANTES } = __req("contenu/missions.js");
const { PLANETES } = __req("contenu/planetes.js");
const { dessinerPartie } = __req("ecran/rendu.js");
const { dessinerInterface } = __req("ecran/interface.js");
const { remplirCarte } = __req("ecran/carte.js");
const { remplirHangar } = __req("ecran/hangar.js");
const { brancherDoigt } = __req("ecran/commandes.js");
const { lire, ecrire, effacer } = __req("sauvegarde.js");

const $ = (id) => document.getElementById(id);
const toile = /** @type {HTMLCanvasElement} */ ($('toile')), ctx = toile.getContext('2d');
let echelle = 1;
let sauvegarde = lire();
let partie = null, enPause = false, message = null, demandeSuper = false;
const opt = { invincible: false, zones: false, vite: false };
const doigt = brancherDoigt(toile, { echelle: () => echelle });

const ECRANS = ['carte', 'hangar', 'pause', 'mort', 'bilan'];
function montrer(id) {
  for (const e of ECRANS) $(e).hidden = e !== id;
  $('b-pause').hidden = id !== null;
  $('b-super').hidden = id !== null;
  if (id === 'hangar') {
    const module = PLANETES[MISSIONS[prochaine(sauvegarde, MISSIONS_EXISTANTES)].planete].module;
    remplirHangar({ liste: $('h-liste'), resume: $('h-resume') }, sauvegarde, module, (s) => { sauvegarde = s; ecrire(s); montrer('hangar'); });
  }
  if (id === 'mort') {
    const drapeau = !!partie?.auDrapeau;
    $('m-texte').textContent = drapeau
      ? 'Tu repars du drapeau, juste avant le boss, cœurs remplis.'
      : 'La mission est courte : on la recommence. Les astronautes délivrés retournent dans leurs bulles.';
    $('m-recommencer').textContent = drapeau ? 'Repartir du drapeau' : 'Recommencer la mission';
  }
  if (id === 'carte') remplirCarte({ planetes: $('planetes'), resume: $('c-resume'), continuer: /** @type {HTMLButtonElement} */ ($('b-continuer')) }, sauvegarde, lancer);
}

function lancer(id) {
  partie = creePartie({ mission: MISSIONS[id], graine: (Date.now() % 100000) + 1, sauvegarde, options: { invincible: opt.invincible } });
  enPause = false; message = null; demandeSuper = false;
  doigt.relacher();
  majSuper();
  montrer(null);
}

function majSuper() {
  const b = $('b-super');
  const pret = partie && partie.jauge >= 100;
  b.classList.toggle('pret', !!pret);
  b.textContent = pret ? 'SUPER' : `${Math.floor(partie?.jauge ?? 0)} %`;
}

function suivante(id) {
  const ordre = CHEMINS[MISSIONS[id].planete], i = ordre.indexOf(id);
  if (i < 0) return null; // la mission secrète n'est pas sur le chemin : retour à la carte
  const n = ordre[i + 1];
  return n && MISSIONS_EXISTANTES.includes(n) ? n : null;
}

function finir() {
  const b = partie.bilan, M = partie.mission;
  const secretAvant = b.ouvreSecret ? sauvegarde.secrets[b.ouvreSecret] : true;
  sauvegarde = appliquerBilan(sauvegarde, b);
  const secretOuvert = !secretAvant && sauvegarde.secrets[b.ouvreSecret];
  ecrire(sauvegarde);
  const total = Object.keys(M.cages).length;
  const lignes = [
    `<div>Cristaux ramassés : <b>${b.cristaux}</b></div>`,
    `<div>Astronautes délivrés : <span class="points">${'●'.repeat(b.cages.length)}${'○'.repeat(total - b.cages.length)}</span> ${b.cages.length} sur ${total}</div>`,
  ];
  if (b.nouvellesArmes.length) lignes.push(`<div class="bon">Nouvelle arme : ${b.nouvellesArmes.map((a) => ARMES[a].nom).join(', ')}</div>`);
  if (b.avecCopain) lignes.push(b.copainSauve ? '<div class="bon">Copain sauvé</div>' : "<div>Le copain n'a pas été sauvé : rejoue pour l'aider</div>");
  if (secretOuvert) lignes.push("<div class=\"bon\">Un chemin secret s'est ouvert sur la carte !</div>");
  lignes.push(`<div style="color:var(--doux);font-size:14px">Coups encaissés : ${b.coups} · ${Math.round(b.duree / SEC)} s</div>`);

}

function pasJeu() {
  if (!partie || enPause || partie.etat !== 'jeu') return;
  const entree = doigt.lire(partie.M.bas);
  entree.super = demandeSuper; demandeSuper = false;
  pasPartie(partie, entree);
  for (const ev of partie.evenements.splice(0)) {
    if (ev.type === 'message') message = { texte: ev.texte, reste: ev.duree };
    if (ev.type === 'vibre' && navigator.vibrate) try { navigator.vibrate(80); } catch { /* refusé */ }
  }
  if (message && --message.reste <= 0) message = null;
  if (partie.etat === 'mort') montrer('mort');
  if (partie.etat === 'fini') finir();
}

// Boucle à pas fixe : le jeu avance à 60 images par seconde quelle que soit la fréquence de l'écran
let avant = performance.now(), reste = 0;
function boucle(maintenant) {
  requestAnimationFrame(boucle);
  reste += Math.min(100, maintenant - avant); avant = maintenant;
  while (reste >= 1000 / FPS) { pasJeu(); if (opt.vite) pasJeu(); reste -= 1000 / FPS; }
  ctx.setTransform(echelle * devicePixelRatio, 0, 0, echelle * devicePixelRatio, 0, 0);
  if (partie) {
    dessinerPartie(ctx, partie, { zones: opt.zones });
    dessinerInterface(ctx, partie, message);
    majSuper();
  } else {
    ctx.fillStyle = '#0a0f2e'; ctx.fillRect(0, 0, W, H);
  }
}
requestAnimationFrame(boucle);

// Boutons et écrans
$('b-pause').onclick = () => { enPause = true; montrer('pause'); };
$('p-reprendre').onclick = () => { enPause = false; doigt.relacher(); montrer(null); };
$('p-carte').onclick = () => { partie = null; montrer('carte'); };
$('m-recommencer').onclick = () => {
  if (partie?.auDrapeau) { repartirDuDrapeau(partie); doigt.relacher(); message = null; montrer(null); }
  else lancer(partie.mission.id);
};
$('b-hangar').onclick = () => montrer('hangar');
$('h-retour').onclick = () => montrer('carte');
$('m-carte').onclick = () => { partie = null; montrer('carte'); };
$('g-carte').onclick = () => montrer('carte');
$('b-super').onclick = () => { demandeSuper = true; };
for (const k of ['invincible', 'zones', 'vite']) $('o-' + k).addEventListener('change', (e) => { opt[k] = /** @type {HTMLInputElement} */ (e.target).checked; });
let confirmer = false;
$('o-effacer').onclick = () => {
  if (!confirmer) { confirmer = true; $('o-effacer').textContent = 'Toucher encore pour tout effacer'; return; }
  confirmer = false; $('o-effacer').textContent = 'Effacer la sauvegarde';
  effacer(); sauvegarde = lire(); montrer('carte');
};
// L'app passe en arrière-plan : pause automatique
document.addEventListener('visibilitychange', () => { if (document.hidden && partie && partie.etat === 'jeu') { enPause = true; montrer('pause'); } });
// Pas de zoom de page dans un jeu tactile (double appui sur iPhone)
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());

function redim() {
  const r = $('cadre').getBoundingClientRect();
  echelle = Math.min(r.width / W, r.height / H);
  const w = Math.floor(W * echelle), h = Math.floor(H * echelle);
  $('jeu').style.width = w + 'px'; $('jeu').style.height = h + 'px';
  toile.style.width = w + 'px'; toile.style.height = h + 'px';
  toile.width = Math.floor(w * devicePixelRatio); toile.height = Math.floor(h * devicePixelRatio);
}
addEventListener('resize', redim);
redim();
montrer('carte');

// Un rechargement ne redemande pas sw.js : il faut update(), à l'ouverture et à chaque
// retour sur l'onglet. Une nouvelle version ne recharge JAMAIS la page d'elle-même (on
// pourrait être en pleine mission) : un bandeau sur la carte propose de recharger.

  navigator.serviceWorker.addEventListener('controllerchange', () => { if (avait) $('maj').hidden = false; });

// Chrome donne son invitation (beforeinstallprompt) ; sans elle (iPhone, ou invitation

    : 'Ouvre le menu du navigateur, puis « Installer l\u2019application » ou « Ajouter à l\u2019écran d\u2019accueil ».';

/** @type {any} */ (window).__patrouille = { get partie() { return partie; }, get sauvegarde() { return sauvegarde; }, lancer, opt, pasJeu, PLANETES };

});
__def("moteur/constantes.js", function (__req) {
// Dimensions et rythme du jeu. Tout le moteur compte en pixels « logiques »
// d'un écran 360 × 640 et en images à 60 par seconde.
const W = 360;
const H = 640;
const FPS = 60;
const SEC = 60;
/** Vitesse du décor qui défile, en px par image. */
const DEFIL = 1.2;
/** Rayon de la zone touchée par un tir rouge (le cœur du module). */
const ZT = 4;
/** Rayon qui avale un tir bleu (tout le corps du module). */
const ZB = 15;

return { W, H, FPS, SEC, DEFIL, ZT, ZB };
});
__def("moteur/partie.js", function (__req) {
// Une mission, image par image. Pur : aucun DOM, aucun canvas, aucun Math.random.
// L'écran lit l'état (p.j, p.ennemis, p.tirsE…) et vide p.evenements (messages, vibrations).
const { W, H, SEC, ZT, ZB } = __req("moteur/constantes.js");
const { creeHasard } = __req("moteur/hasard.js");
const { MODULES, nouveauJoueur, piloter } = __req("moteur/pilotage.js");
const { ARMES, tirBase } = __req("moteur/tirs.js");
const { COMPORTEMENTS } = __req("moteur/ennemis.js");
const { POIDS_BONUS, NOM_BONUS, appliquerBonus } = __req("moteur/bonus.js");
const { majMilieux, forces } = __req("moteur/milieux.js");
const { FORMATIONS } = __req("moteur/vagues.js");
const { majCopain, attraperCopain, monterRobot, descendreRobot } = __req("moteur/allies.js");
const { ENNEMIS } = __req("contenu/ennemis.js");
const { PLANETES } = __req("contenu/planetes.js");

const RECOLTE = { petit: 1, moyen: 3, gros: 12, porteur: 2, cage: 0 };
const JAUGE = { petit: 4, moyen: 10, gros: 25, porteur: 6, cage: 0 };
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;

/**
 * @param {{ mission: any, graine?: number, sauvegarde: any, options?: { invincible?: boolean } }} reglages
 */
function creePartie({ mission, graine = 1, sauvegarde, options = {} }) {
  const planete = PLANETES[mission.planete];
  const module = planete.module, M = MODULES[module];
  const hangar = sauvegarde.hangar[module];
  const p = {
    mission, planete, module, M, options,

// Hasard à graine : même graine, même suite. Le moteur n'utilise JAMAIS Math.random,
// sinon une partie ne se rejoue plus à l'identique (bancs, robot, équilibrage).

/**
 * @param {number} graine

  return {
    suivant,
    /** @param {number} a @param {number} b */
    entre: (a, b) => a + suivant() * (b - a),
    /** @param {number} n */
    entier: (n) => Math.floor(suivant() * n),
    /** @template T @param {T[]} t @returns {T} */
    choix: (t) => t[Math.floor(suivant() * t.length)],
    /** Tire une clé selon ses poids. @param {Record<string, number>} poids */
    pondere(poids) {
      let total = 0;
      for (const k in poids) total += poids[k];
      let r = suivant() * total;
      for (const k in poids) if ((r -= poids[k]) < 0) return k;
      return Object.keys(poids)[0];
    },
  };
}

// ⚠️ Jamais de ressort vers un point fixe : essayé, il faisait trembler le module au
// lâcher (11 à 24 demi-tours) et annulait les courants (1 px de dérive au lieu de 164).

/** @typedef {{ type: 'direct'|'elan', lissage?: number, acc?: number, frX?: number, frY?: number, vmax?: number, vmaxY?: number, zone: [number, number], bas?: boolean }} Module */

/** @type {Record<string, Module>} */
const MODULES = {
  avion:     { type: 'direct', lissage: 0.35, zone: [80, H - 100] },
  rover:     { type: 'elan', acc: 0.45, frX: 0.95, frY: 0.88, vmax: 5.5, vmaxY: 3, zone: [H * 0.48, H - 100] },
  sousmarin: { type: 'elan', acc: 0.16, frX: 0.975, frY: 0.975, vmax: 3.4, vmaxY: 3.4, zone: [80, H - 100], bas: true },
  vaisseau:  { type: 'elan', acc: 1.1, frX: 0.95, frY: 0.95, vmax: 9, vmaxY: 9, zone: [80, H - 100] },
};

const borne = (v, a, b) => Math.max(a, Math.min(b, v));

/** @param {Module} M */
function nouveauJoueur(M) {
  const y = Math.min(M.zone[1], H - 140);
  return { x: W / 2, y, cx: W / 2, cy: y, vx: 0, vy: 0, wx: 0, wy: 0, inv: 0, cad: 0, z: 0, saut: 0 };

 * @param {ReturnType<typeof nouveauJoueur>} j

 * @param {{ fx: number, fy: number, lent: number }} [forces]  courants, attraction (en px/image²), ralentissement du sol
 */

  if (M.type === 'direct') {
    j.cx += entree.dx; j.cy += entree.dy;
    j.cx += forces.fx * 8; j.cy += forces.fy * 8; // une force déplace la cible : on lutte en glissant
    const px = j.x, py = j.y;
    j.x += (j.cx - j.x) * M.lissage; j.y += (j.cy - j.y) * M.lissage;

    const vmax = M.vmax * forces.lent, vmaxY = M.vmaxY * forces.lent;

    j.wx = j.wx * 0.5 + entree.dx * 0.5; j.wy = j.wy * 0.5 + entree.dy * 0.5;

    else { j.vx *= M.frX; j.vy *= M.frY; j.wx = j.wy = 0; }
    j.vx += forces.fx; j.vy += forces.fy;
    j.vx = borne(j.vx, -vmax, vmax); j.vy = borne(j.vy, -vmaxY, vmaxY);
    if (Math.abs(j.vx) < 0.02) j.vx = 0;
    if (Math.abs(j.vy) < 0.02) j.vy = 0;
    j.x += j.vx; j.y += j.vy;
    j.cx = j.x; j.cy = j.y;
  }
  const [y0, y1] = M.zone;
  if (j.x < 16 || j.x > W - 16) j.vx = 0;
  if (j.y < y0 || j.y > y1) j.vy = 0;
  j.x = borne(j.x, 16, W - 16); j.y = borne(j.y, y0, y1);
  j.cx = borne(j.cx, 16, W - 16); j.cy = borne(j.cy, y0, y1);
}

return { MODULES, nouveauJoueur, piloter };

__def("moteur/ennemis.js", function (__req) {
// Les comportements communs à toutes les planètes. Une fiche d'ennemi (dans contenu/)
// choisit un comportement et le règle ; chaque planète habille ces comportements avec
// ses propres créatures. Un comportement reçoit l'ennemi `e` et la partie `p`, qui
// fournit p.h (hasard à graine), p.j (le joueur), p.vise, p.anneau et p.ajouter.
const { DEFIL } = __req("moteur/constantes.js");

/** @type {Record<string, (e: any, p: any) => void>} */
const COMPORTEMENTS = {
  // Fonce tout droit vers le bas (popcorn, en V ou en pluie)
  foncer(e) { e.y += e.def.vitesse ?? 2.6; e.x += e.vx; },
  // Descend en tournoyant autour de sa colonne
  tournoyer(e) { e.y += e.def.vitesse ?? 1.7; e.x = e.x0 + Math.sin(e.age * 0.06 + e.ph) * (e.def.ampleur ?? 50); e.rot = e.age * 0.2; },
  // Entre par le côté, puis pique sur le joueur
  piquer(e, p) {
    if (e.age < e.delai) { e.x += e.vx; return; }
    if (!e.pique) { const a = Math.atan2(p.j.y - e.y, p.j.x - e.x), v = e.def.vitesse ?? 3.2; e.vx = Math.cos(a) * v; e.vy = Math.sin(a) * v; e.pique = true; }
    e.x += e.vx; e.y += e.vy;
  },
  // Descend, s'arrête, vise trois fois, puis s'en va par le côté
  viser(e, p) {
    // Altitude d'arrêt tirée une fois. Sans elle, le perroquet restait au-dessus de l'écran,
    // tirait hors de vue et repartait sans jamais apparaître (1 seul tir rouge en 2 min sur j1).
    e.arret ??= p.h.entre(110, 190);
    if (!e.part && e.y < e.arret) { e.y += 2.4; return; }
    if (!e.part) {
      e.attente = (e.attente || 0) + 1;
      if ([40, 70, 100].includes(e.attente)) p.vise(e, e.def.vitesseTir ?? 3.2, e.def.nTirs ?? 1);
      if (e.attente > 150) e.part = true;
      return;
    }
    e.x += e.x < 180 ? -3 : 3;
  },
  // Planté au sol (défile avec le décor), tire en étoile ; un tir sur deux est bleu.
  // Il se tait dans le bas de l'écran : un anneau tiré à bout portant est injuste.
  etoile(e, p) {
    e.y += DEFIL; e.rot = e.age * 0.02;
    if (e.age % 110 === 60 && e.y > 40 && e.y < 380) p.anneau(e, e.def.branches ?? 8, 1.8, e.age * 0.1, 2);
  },
  // Descend en ondulant (les Gloutonnets)
  onduler(e) { e.y += e.def.vitesse ?? 1.3; e.x += Math.sin(e.age * 0.1) * 1.2; },
  // Traverse l'écran en portant un cadeau
  porteur(e) { e.x += e.vx; e.y = e.y0 + Math.sin(e.age * 0.05) * 14; },
  // Caché sous le feuillage : il tremble (annonce), puis surgit, tire deux fois et s'en va
  cache(e, p) {
    if (e.cache) { e.y += DEFIL; if (e.age > (e.def.attente ?? 80)) { e.cache = false; e.surgi = 0; } return; }
    e.surgi++;
    if (e.surgi < 20) e.y -= 2.5; else e.y += 0.6;
    if (e.surgi === 30 || e.surgi === 70) p.vise(e, 2.8, 3);
    if (e.surgi > 110) e.y += 2.5;
  },
  // Le gros : descend, reste un moment en fabriquant des petits, vise en éventail, repart
  fabrique(e, p) {
    if (!e.part && e.y < 110) { e.y += 1; return; }
    if (!e.part) {
      e.reste = (e.reste ?? e.def.duree ?? 600) - 1;
      if (e.reste % 80 === 0) p.ajouter(e.def.pond, e.x + p.h.entre(-20, 20), e.y + 20);
      if (e.reste % 140 === 70) p.vise(e, 2.4, 5, 0.25);
      if (e.reste <= 0) e.part = true;
      return;
    }
    e.y += 1.5;
  },
  // Chasseur du copain : il le poursuit ; une fois le copain sauvé ou emporté, il s'en va
  chasser(e, p) {
    const c = p.copain;
    if (!c || c.etat !== 'fuit') { e.y -= 2.5; return; }
    const a = Math.atan2(c.y - e.y, c.x - e.x), v = 1.15 + e.age / 900;
    e.x += Math.cos(a) * v; e.y += Math.sin(a) * v;
    if ((e.x - c.x) ** 2 + (e.y - c.y) ** 2 < 14 * 14) p.attraperCopain();
  },
  // Cage d'astronaute posée dans le décor
  cage(e) { e.y += DEFIL; },
};

return { COMPORTEMENTS };
});

const DUREES = { aimant: 10 * SEC, compagnons: 15 * SEC, etoile: 5 * SEC };
const NOM_BONUS = {

  aimant: 'Aimant géant 10 s',

  etoile: 'Étoile : invincible 5 s',

  if (b === 'aimant') p.aimant = DUREES.aimant;
  if (b === 'compagnons') p.compagnons = DUREES.compagnons;

// Ce que le monde fait au module. Tranche 1 : le feuillage de la Jungle.
// Les sols du Désert, les courants de l'Océan et l'attraction de la Ceinture viennent
// avec leurs tranches ; forces() est déjà le point d'entrée du pilotage.
const { DEFIL, H } = __req("moteur/constantes.js");

/**
 * Une touffe de feuillage : au-dessus du sol, sous le module. Des plantes s'y cachent.
 * @param {any} p @param {number} x @param {number} r @param {number} [y]
 */
function feuillage(p, x, r, y = -r) {
  const bouts = Array.from({ length: 6 }, () => [p.hv.entre(-0.7, 0.7), p.hv.entre(-0.7, 0.7), p.hv.entre(0.45, 0.7)]);
  const t = { k: 'feuille', x, y, r, bouts };
  p.terrain.push(t);
  return t;
}

/** Fait défiler le terrain avec le décor et oublie ce qui est sorti. @param {any} p */
function majMilieux(p) {
  for (const t of p.terrain) t.y += DEFIL;
  p.terrain = p.terrain.filter((t) => t.y < H + 160);
}

/** Forces appliquées au module cette image (aucune dans la Jungle). @param {any} p */
function forces(p) {
  return { fx: 0, fy: 0, lent: 1 };
}

return { feuillage, majMilieux, forces };
});

// Les formations : ce qu'une fiche de mission peut demander, en données seulement.
// Une vague est [seconde, { f: 'nom', ...réglages }] ; ici, chaque nom devient des ennemis.

const { feuillage } = __req("moteur/milieux.js");

const { creerBoss } = __req("moteur/boss.js");

/** @type {Record<string, (p: any, v: any) => void>} */
const FORMATIONS = {
  // n ennemis en V, pointe en bas, centrés sur x
  V(p, { type, n = 5, x = W / 2 }) { for (let i = 0; i < n; i++) { const k = i - (n - 1) / 2; p.ajouter(type, x + k * 26, -20 - Math.abs(k) * 22); } },
  // n ennemis répartis sur la largeur, en escalier
  ligne(p, { type, n = 4 }) { for (let i = 0; i < n; i++) p.ajouter(type, 60 + i * (240 / Math.max(1, n - 1)), -20 - i * 30, { ph: i }); },
  // n ennemis qui entrent par un côté à la hauteur y (pour « piquer »)

    for (let i = 0; i < n; i++) p.ajouter(type, cote < 0 ? -20 - i * 26 : W + 20 + i * 26, y, { vx: cote < 0 ? 2.4 : -2.4, delai: 50 + i * 10 });
  },
  // n ennemis éparpillés, l'un après l'autre
  pluie(p, { type, n = 3 }) { for (let i = 0; i < n; i++) p.ajouter(type, p.h.entre(40, W - 40), -20 - i * 40); },

  // un porteur de cadeau qui traverse
  porteur(p) { p.ajouter('porteur', -20, 120, { vx: 1.6, y0: p.h.entre(100, 170) }); },
  // une cage d'astronaute déclarée dans la fiche (cages: { id: contenu })
  cage(p, { id, x = W / 2 }) { p.ajouterCage(id, x, -20); },
  // une touffe de feuillage, avec éventuellement un ennemi caché dessous
  feuillage(p, { x = W / 2, r = 65, y, cache }) {

  message(p, { texte }) { p.message(texte); },

  fin(p) { p.fin = true; },

// Le copain à sauver (idée de Star Fox) et le robot de combat (idée de Metal Slug).
const { W, SEC } = __req("moteur/constantes.js");

/** Un copain astronaute arrive par le bas, poursuivi par trois chasseurs. @param {any} p */
function creerCopain(p) {
  const x = p.h.entre(80, W - 80);
  p.copain = { x, y: 700, etat: 'fuit', age: 0 };
  for (let i = 0; i < 3; i++) p.ajouter('chasseur', x + (i - 1) * 30, 750 + i * 22);
  p.message('Un copain appelle à l\'aide ! Abats ses poursuivants', 3 * SEC);
}

/** Un chasseur l'a rattrapé : il est emporté (le rater ne coûte rien d'autre). @param {any} p */
function attraperCopain(p) {
  if (!p.copain || p.copain.etat !== 'fuit') return;
  p.copain.etat = 'pris';
  p.message('Trop tard, le copain est emporté…', 2.5 * SEC);
}

/** @param {any} p @param {(o: any) => void} balle */
function majCopain(p, balle) {
  const c = p.copain;
  if (!c) return;
  c.age++;
  if (c.etat === 'fuit') {
    if (c.y > 260) c.y -= 1.3;
    c.x = Math.max(20, Math.min(W - 20, c.x + Math.sin(c.age * 0.04) * 1.4));
    if (!p.ennemis.some((e) => e.type === 'chasseur' && !e.mort)) {
      c.etat = 'ami'; p.copainSauve = true;
      p.message(p.mission.ouvreSecret ? 'Copain sauvé ! Il t\'aide, et un chemin secret s\'ouvre' : 'Copain sauvé ! Il t\'aide', 3 * SEC);

  } else if (c.etat === 'pris') {
    c.y -= 2.5;
    if (c.y < -30) p.copain = null;

    // Allié : il vole à côté du module et tire avec lui jusqu'à la fin de la mission
    c.x += (p.j.x - 38 - c.x) * 0.12; c.y += (p.j.y + 12 - c.y) * 0.12;
    if (c.age % 14 === 0) balle({ x: c.x, y: c.y - 10 });
  }

/** Le module monte dans le robot de combat : 20 s, il encaisse 5 coups. @param {any} p */
function monterRobot(p) {
  p.robot = { t: 20 * SEC, pv: 5 };
  p.message('Le robot de combat ! Il encaisse 5 coups', 2.5 * SEC);
}

/** @param {any} p */
function descendreRobot(p) {
  for (let i = 0; i < 16; i++) p.effets.push({ x: p.j.x, y: p.j.y, vx: p.hv.entre(-4, 4), vy: p.hv.entre(-4, 4), vie: 40, couleur: ['#e33', '#3a3', '#36f', '#fd2'][i % 4] });
  p.robot = null;
  p.j.inv = 70;
  p.message('Le robot se démonte !', 1.5 * SEC);
}

return { creerCopain, attraperCopain, majCopain, monterRobot, descendreRobot };

// Les boss. Chacun : une entrée, 2 phases (la seconde reprend les ennemis de sa
// planète), une barre de vie visible. Environ 45 s avec le module de départ :
// à 260 points de vie, le premier boss de la POC tenait plus de 2 minutes.
const { W, SEC } = __req("moteur/constantes.js");

/** @type {Record<string, { nom: string, pv: number, r: number, maj: (b: any, p: any) => void }>} */
const BOSS = {
  // Le Grand Caméléon (Jungle). Phase 2 : il se fond dans le feuillage, on ne peut
  // plus le toucher, mais ses yeux le trahissent et le feuillage tremble avant qu'il
  // ressorte.
  cameleon: {
    nom: 'le Grand Caméléon', pv: 135, r: 38,
    maj(b, p) {
      if (b.y < 140) { b.y += 1.2; return; }
      if (b.phase === 1 && b.pv < b.pvMax / 2) {
        b.phase = 2; b.cycle = 0;
        p.message('Il se fond dans le feuillage ! Ses yeux le trahissent', 3 * SEC);
      }
      const a = Math.atan2(p.j.y - b.y, p.j.x - b.x);
      if (b.phase === 1) {
        b.x = W / 2 + Math.sin(b.age * 0.012) * 110;
        if (b.age % 70 === 0) for (let i = -1; i <= 1; i++) p.tirer(b.x, b.y + 20, a + i * 0.2, 2.8, i === 0);
        if (b.age % 240 === 120) for (let i = -1; i <= 1; i++) p.ajouter('scarabee', b.x + i * 22, b.y + 20, { vx: 0, delai: 0 });
        return;
      }

      b.cycle++;

__def("moteur/progression.js", function (__req) {
// Progression d'une séance à l'autre : missions finies, astronautes délivrés, armes
// découvertes, cristaux, améliorations du Hangar. Pur : la lecture et l'écriture
// dans le navigateur vivent dans sauvegarde.js.
const { LISTE_ARMES } = __req("moteur/tirs.js");

const PLANETES_ORDRE = ['jungle', 'desert', 'ocean', 'ceinture'];
/** Les missions de chaque planète, dans l'ordre du chemin (la secrète est à part). */
const CHEMINS = {
  jungle: ['j1', 'j2', 'j3', 'j4', 'j5', 'jboss'],
  desert: ['d1', 'd2', 'd3', 'd4', 'd5', 'dboss'],
  ocean: ['o1', 'o2', 'o3', 'o4', 'o5', 'oboss'],
  ceinture: ['c1', 'c2', 'c3', 'c4', 'c5', 'cboss'],
};
const ORDRE_GLOBAL = PLANETES_ORDRE.flatMap((p) => CHEMINS[p]);
/** La mission secrète de chaque planète : hors du chemin, ouverte par un exploit (le copain). */
const SECRETES = { jungle: 'jsecret', desert: 'dsecret', ocean: 'osecret', ceinture: 'csecret' };
const MODULES = ['avion', 'rover', 'sousmarin', 'vaisseau'];
const PRIX_HANGAR = [15, 35, 70];
const VERSION_SAUVEGARDE = 1;

function sauvegardeVide() {
  return {
    version: VERSION_SAUVEGARDE,
    cristaux: 0,
    armes: [],
    missions: {},
    hangar: Object.fromEntries(MODULES.map((m) => [m, { tir: 0, coeur: 0, aimant: 0 }])),
    secrets: Object.fromEntries(PLANETES_ORDRE.map((p) => [p, false])),
    derniere: null,
  };
}

const entier = (v, min, max) => (Number.isFinite(v) ? Math.max(min, Math.min(max, Math.floor(v))) : min);

/** Rend une sauvegarde valide à partir de n'importe quoi (vide, corrompue, ancienne). */
function normaliser(brut) {
  const s = sauvegardeVide();
  if (!brut || typeof brut !== 'object') return s;
  s.cristaux = entier(brut.cristaux, 0, 1e7);
  if (Array.isArray(brut.armes)) s.armes = [...new Set(brut.armes.filter((a) => LISTE_ARMES.includes(a)))];
  if (brut.missions && typeof brut.missions === 'object' && !Array.isArray(brut.missions)) {
    for (const [id, m] of Object.entries(brut.missions)) {
      if (!m || typeof m !== 'object') continue;
      s.missions[id] = { fini: m.fini === true, cages: Array.isArray(m.cages) ? [...new Set(m.cages.filter((c) => typeof c === 'string'))] : [] };
    }
  }
  if (brut.hangar && typeof brut.hangar === 'object') {
    for (const m of MODULES) {
      const h = brut.hangar[m];
      if (h && typeof h === 'object') s.hangar[m] = { tir: entier(h.tir, 0, 3), coeur: entier(h.coeur, 0, 3), aimant: entier(h.aimant, 0, 3) };
    }
  }
  if (brut.secrets && typeof brut.secrets === 'object') for (const p of PLANETES_ORDRE) s.secrets[p] = brut.secrets[p] === true;
  if (typeof brut.derniere === 'string') s.derniere = brut.derniere;
  return s;
}

const fini = (s, id) => s.missions[id]?.fini === true;

/** Une mission est ouverte si c'est la toute première, ou si la précédente du chemin est finie
 *  (la première d'une planète s'ouvre quand le boss de la planète d'avant est battu). */
function estOuverte(s, id) {
  const planeteSecrete = Object.keys(SECRETES).find((p) => SECRETES[p] === id);
  if (planeteSecrete) return s.secrets?.[planeteSecrete] === true;
  const i = ORDRE_GLOBAL.indexOf(id);
  if (i < 0) return false;
  return i === 0 || fini(s, ORDRE_GLOBAL[i - 1]);
}

/** La mission que propose « Continuer » : la première non finie parmi celles qui existent. */
function prochaine(s, existantes = ORDRE_GLOBAL) {
  for (const id of ORDRE_GLOBAL) if (existantes.includes(id) && !fini(s, id)) return id;
  return existantes[existantes.length - 1] ?? 'j1';
}

/** Ajoute le résultat d'une mission réussie. Renvoie une nouvelle sauvegarde. */
function appliquerBilan(s0, bilan) {
  const s = normaliser(JSON.parse(JSON.stringify(s0)));
  const m = (s.missions[bilan.mission] ||= { fini: false, cages: [] });
  m.fini = true;
  for (const c of bilan.cages ?? []) if (!m.cages.includes(c)) m.cages.push(c);
  for (const a of bilan.nouvellesArmes ?? []) if (!s.armes.includes(a) && LISTE_ARMES.includes(a)) s.armes.push(a);
  s.cristaux += Math.max(0, Math.floor(bilan.cristaux ?? 0));
  if (bilan.copainSauve && bilan.ouvreSecret && s.secrets[bilan.ouvreSecret] !== undefined) s.secrets[bilan.ouvreSecret] = true;
  s.derniere = bilan.mission;
  return s;
}

/** Achète le niveau suivant d'une amélioration ; renvoie la sauvegarde, inchangée si impossible. */
function acheter(s0, module, amelio) {
  const s = normaliser(JSON.parse(JSON.stringify(s0)));
  const n = s.hangar[module]?.[amelio];
  if (n === undefined || n >= 3 || s.cristaux < PRIX_HANGAR[n]) return s;
  s.cristaux -= PRIX_HANGAR[n];
  s.hangar[module][amelio] = n + 1;
  return s;
}

return { PLANETES_ORDRE, CHEMINS, ORDRE_GLOBAL, SECRETES, PRIX_HANGAR, VERSION_SAUVEGARDE, sauvegardeVide, normaliser, estOuverte, prochaine, appliquerBilan, acheter };
});

// Commande relative : on glisse n'importe où, le module reproduit le mouvement du doigt.
// lire() rend le glissement accumulé depuis la lecture précédente (une fois par image).

/**
 * @param {HTMLElement} zone  l'élément qui reçoit le doigt (le canvas)
 * @param {{ echelle: () => number, sens?: number }} reglages
 */
function brancherDoigt(zone, { echelle, sens = 1.25 }) {
  let doigt = null, dx = 0, dy = 0;
  zone.addEventListener('pointerdown', (ev) => {
    doigt = { id: ev.pointerId, x: ev.clientX, y: ev.clientY };
    zone.setPointerCapture?.(ev.pointerId);
  });
  zone.addEventListener('pointermove', (ev) => {
    if (!doigt || ev.pointerId !== doigt.id) return;
    dx += ((ev.clientX - doigt.x) / echelle()) * sens;
    dy += ((ev.clientY - doigt.y) / echelle()) * sens;
    doigt.x = ev.clientX; doigt.y = ev.clientY;
  });
  const lacher = (ev) => { if (doigt && ev.pointerId === doigt.id) doigt = null; };
  zone.addEventListener('pointerup', lacher);
  zone.addEventListener('pointercancel', lacher);
  return {
    /** @param {boolean} bas  vrai quand le décor défile vers le bas (sous-marin) : on inverse dy */
    lire(bas = false) {
      const e = { touche: doigt !== null, dx, dy: bas ? -dy : dy };
      dx = dy = 0;
      return e;
    },
    relacher() { doigt = null; dx = dy = 0; },
  };
}

return { brancherDoigt };

// Lecture et écriture de la sauvegarde dans le navigateur. Chaque accès est protégé :
// stockage bloqué, plein, vide ou corrompu, le jeu démarre quand même.
const { normaliser } = __req("moteur/progression.js");

const CLE = 'patrouille:sauvegarde';

function lire() {
  try { return normaliser(JSON.parse(localStorage.getItem(CLE) || 'null')); }
  catch { return normaliser(null); }
}

/** @param {any} s */
function ecrire(s) {
  try { localStorage.setItem(CLE, JSON.stringify(s)); return true; }
  catch { return false; }
}

function effacer() {
  try { localStorage.removeItem(CLE); } catch { /* rien à faire */ }
}

return { lire, ecrire, effacer };
