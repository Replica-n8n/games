<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#111}canvas{image-rendering:pixelated;width:1280px;height:720px;display:block}</style></head>
<body><canvas id="c" width="320" height="180"></canvas>
<script type="module">
const q = new URLSearchParams(location.search), nom = q.get('salle') || 'salon';
const mod = await import(`./${nom}.js`);
const S = mod[nom.toUpperCase()];
const fond = S.peindre();
const c = document.getElementById('c').getContext('2d');
const etat = { alerte: Object.fromEntries(Object.keys(S.cachettes).map((k) => [k, q.has('alerte') ? 1 : 0])), ouvert: Object.fromEntries(Object.keys(S.cachettes).map((k) => [k, q.has('ouvert') ? 1 : 0])), objets: Object.fromEntries(S.objets.map((o) => [o.id, { charge: 0 }])) };
c.drawImage(fond, 0, 0); S.animer(c, etat, 1.3);
document.body.dataset.pret = 1;
</script></body></html>
