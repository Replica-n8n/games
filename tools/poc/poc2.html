<title>Patrouille POC 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
/* Écran de jeu unique, sombre par choix : le canvas au centre, l'interface posée dessus.
   Formes simples seulement : aucun graphisme tant que les mécaniques ne sont pas validées. */
:root{
  --fond:#0a0f2e; --panneau:#141c4a; --trait:#2a3570; --texte:#eef0ff; --doux:#b8c0f0;
  --accent:#fabc41; --sur-accent:#271900; --fini:#5fd68a; --ferme:#58608e;
  --police:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--fond);color:var(--texte);font-family:var(--police);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cadre{position:relative;height:100%;display:grid;place-items:center}
#jeu{position:relative;touch-action:none}
canvas{display:block}
button{font:inherit;touch-action:manipulation;cursor:pointer}
.ecran{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:20px 16px;background:rgba(6,9,30,.92);text-align:center;overflow:auto}
.ecran h1{font-size:26px;line-height:1.1;font-weight:800;text-wrap:balance}
.ecran h2{font-size:24px;font-weight:800}
.ecran p{color:var(--doux);font-size:15px;line-height:1.4;max-width:30ch}
.gros{min-height:60px;min-width:240px;padding:0 20px;border:0;border-radius:18px;background:var(--accent);color:var(--sur-accent);
  font-size:20px;font-weight:800;box-shadow:0 5px 0 #8a6200}
.moyen{min-height:48px;min-width:180px;padding:0 18px;border:2px solid var(--doux);border-radius:14px;background:transparent;color:var(--texte);font-size:17px;font-weight:700}
.gros:focus-visible,.moyen:focus-visible,.rond:focus-visible,.etape:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* La carte : un chemin de missions qui monte, avec une bifurcation vers la mission secrète */
#chemin{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;width:min(330px,100%);margin-block:4px}
.etape{min-height:64px;border-radius:14px;border:2px solid var(--trait);background:var(--panneau);color:var(--texte);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;font-size:15px;font-weight:700}
.etape small{font-size:14px;font-weight:600;color:var(--doux)}
.etape.fini{border-color:var(--fini)}
.etape.ouvert{border-color:var(--accent);box-shadow:0 0 16px rgba(250,188,65,.35)}
.etape:disabled{opacity:.55;cursor:default}
.etape.large{grid-column:1/3}
.points{letter-spacing:2px;color:var(--fini)}
.chambre{width:min(330px,100%);padding:10px;border-radius:14px;background:#10173d;font-size:15px;color:var(--doux)}
.chambre b{color:var(--texte)}
details{width:min(330px,100%);text-align:left;border:1px solid var(--trait);border-radius:12px;padding:6px 12px}
summary{min-height:36px;display:flex;align-items:center;color:var(--doux);font-size:15px;cursor:pointer}
label{display:flex;align-items:center;gap:10px;font-size:15px;min-height:34px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}
.petit{min-height:40px;padding:0 12px;border:1px solid var(--doux);border-radius:10px;background:transparent;color:var(--texte);font-size:14px;margin:4px 0}
.ligne-att{display:grid;grid-template-columns:1fr auto;align-items:center;gap:6px 12px;width:min(310px,100%);text-align:left;
  padding:12px;border-radius:14px;background:var(--panneau)}
.ligne-att b{font-size:17px}
.ligne-att small{grid-column:1;color:var(--doux);font-size:14px}
.acheter{grid-row:1/3;grid-column:2;min-height:48px;min-width:96px;border:0;border-radius:12px;background:var(--accent);color:var(--sur-accent);font-weight:800;font-size:16px}
.acheter:disabled{background:#3a426e;color:#9aa3d0}
.bilan{display:grid;gap:6px;width:min(300px,100%);text-align:left;font-size:16px;padding:12px;border-radius:14px;background:var(--panneau)}
.bilan .bon{color:var(--fini);font-weight:700}
.rond{position:absolute;border:0;border-radius:50%;display:grid;place-items:center;font-weight:800}
#pause{top:8px;right:8px;width:44px;height:44px;background:rgba(20,28,74,.85);color:var(--texte);font-size:18px}
#superb{right:12px;bottom:12px;width:76px;height:76px;background:#3a426e;color:#9aa3d0;font-size:13px;line-height:1.1;box-shadow:0 4px 0 #1a1f40}
#superb.pret{background:var(--accent);color:var(--sur-accent);box-shadow:0 4px 0 #8a6200,0 0 24px rgba(250,188,65,.8)}
.cache{display:none!important}
@media (prefers-reduced-motion:reduce){#superb.pret{box-shadow:0 4px 0 #8a6200}}
</style>

<div id="cadre">
  <div id="jeu">
    <canvas id="toile"></canvas>
    <button id="pause" class="rond cache" aria-label="Pause">II</button>
    <button id="superb" class="rond cache" aria-label="Super-pouvoir">SUPER</button>

    <section id="carte" class="ecran">
      <h1>Le Jardin</h1>
      <div class="chambre">Chambre : <b id="c-jouets">0</b> jouets délivrés · <b id="c-armes">0</b> armes sur 6 · <b id="c-boutons">0</b> boutons</div>
      <div id="chemin"></div>
      <button class="gros" id="b-continuer">Continuer</button>
      <button class="moyen" id="b-atelier">Atelier</button>
      <details>
        <summary>Réglages de test</summary>
        <label><input type="checkbox" id="o-bas"> Défilement vers le bas (Baignoire)</label>
        <label><input type="checkbox" id="o-zone"> Voir les zones touchées</label>
        <label><input type="checkbox" id="o-invincible"> Invincible</label>
        <label><input type="checkbox" id="o-vite"> Vitesse x2</label>
        <label><input type="checkbox" id="o-armes"> Toutes les armes dès le début</label>
        <button class="petit" id="o-debloquer">Tout débloquer</button>
        <button class="petit" id="o-effacer">Effacer la sauvegarde</button>
      </details>
    </section>

    <section id="atelier" class="ecran cache">
      <h2>Atelier</h2>
      <p><span id="a-boutons">0</span> boutons à dépenser</p>
      <div id="a-liste" style="display:grid;gap:10px"></div>
      <button class="gros" id="a-retour">Retour à la carte</button>
    </section>

    <section id="pausee" class="ecran cache">
      <h2>Pause</h2>
      <button class="gros" id="p-reprendre">Reprendre</button>
      <button class="moyen" id="p-carte">Abandonner la mission</button>
    </section>

    <section id="mort" class="ecran cache">
      <h2>Oups, plus de cœurs !</h2>
      <p id="mort-txt"></p>
      <button class="gros" id="d-reprendre">Recommencer</button>
      <button class="moyen" id="d-carte">Carte</button>
    </section>

    <section id="bilan" class="ecran cache">
      <h2>Mission réussie !</h2>
      <div class="bilan" id="bilan-liste"></div>
      <button class="gros" id="g-suite">Mission suivante</button>
      <button class="moyen" id="g-carte">Carte</button>
    </section>
  </div>
</div>

<script>
'use strict';
// ================= Constantes =================
const W = 360, H = 640, FPS = 60, SEC = FPS;
const DEFIL = 1.2, SENS = 1.25, LISSAGE = 0.35;
const ZT = 4;            // zone touchée par un tir rouge
const ZB = 15;           // zone qui avale un tir bleu (tout le corps)
const COUL = { joueur: '#7fd1ff', tirJ: '#fff3a0', rouge: '#ff3b5c', bleu: '#4fd6ff', bouton: '#ffb347', ami: '#5fd68a', fond1: '#16204f', fond2: '#1d2a63' };
const PRIX = [15, 35, 70];

const toile = document.getElementById('toile');
const ctx = toile.getContext('2d');
const $ = (id) => document.getElementById(id);
let echelle = 1;

// ================= Armes spéciales (munitions, une à la fois) =================
// tir(j) crée les balles ; chaque appel consomme une munition.
const ARMES = {
  crayon:   { nom: 'Lance-crayons', mun: 40, cad: 14, c: '#ffe14d',
    tir(j) { balle({ x: j.x, y: j.y - 18, vy: -12, dmg: 2, perce: new Set(), forme: 'trait' }); } },
  arrosoir: { nom: 'Arrosoir', mun: 220, cad: 3, c: '#6fd3ff',
    tir(j) { balle({ x: j.x + hasard(-4, 4), y: j.y - 16, vx: hasard(-0.8, 0.8), vy: -6.5, dmg: 1, vie: 30, forme: 'goutte' }); } },
  elastiques: { nom: 'Élastiques', mun: 30, cad: 14, c: '#ff9de2',
    tir(j) { for (let i = -2; i <= 2; i++) balle({ x: j.x, y: j.y - 14, vx: i * 1.8, vy: -8, dmg: 1, forme: 'rond' }); } },
  avions:   { nom: 'Avions téléguidés', mun: 24, cad: 24, c: '#c6ff6f',
    tir(j) { for (const s of [-1, 1]) balle({ x: j.x + s * 12, y: j.y, vx: s * 2, vy: -4, dmg: 3, guide: true, vie: 150, forme: 'fleche' }); } },
  billes:   { nom: 'Billes', mun: 30, cad: 16, c: '#ffffff',
    tir(j) { for (const s of [-1, 1]) balle({ x: j.x, y: j.y - 14, vx: s * 3, vy: -7, dmg: 1, rebond: 3, vie: 200, r: 5, forme: 'rond' }); } },
  bulles:   { nom: 'Grosses bulles', mun: 20, cad: 22, c: '#9fe8ff',
    tir(j) { balle({ x: j.x, y: j.y - 18, vy: -3.5, dmg: 3, zone: 46, r: 11, forme: 'bulle' }); } },
};
const ORDRE_ARMES = ['crayon', 'elastiques', 'arrosoir', 'billes', 'avions', 'bulles'];
const BONUS = ['bouclier', 'aimant', 'toupies', 'etoile', 'coeur'];
const POIDS_BONUS = { bouclier: 25, aimant: 20, toupies: 25, etoile: 20, coeur: 10 };
const NOM_BONUS = { bouclier: 'Bouclier : il encaisse un coup', aimant: 'Aimant géant 10 s', toupies: 'Toupies-compagnons 15 s', etoile: 'Étoile : invincible 5 s', coeur: 'Un cœur en plus' };

// ================= Sauvegarde (facultative) =================
const CLE = 'patrouille-poc2';
const VIDE = () => ({ boutons: 0, tir: 0, coeur: 0, aimant: 0, missions: {}, armes: [], secret: false });
let sauve = VIDE();
try { Object.assign(sauve, JSON.parse(localStorage.getItem(CLE) || '{}')); } catch (e) {}
const ecrire = () => { try { localStorage.setItem(CLE, JSON.stringify(sauve)); } catch (e) {} };
const etatMission = (id) => (sauve.missions[id] ||= { fini: false, cages: [] });

// ================= Outils =================
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const hasard = (a, b) => a + Math.random() * (b - a);
const tire = (poids) => { let s = 0; for (const k in poids) s += poids[k]; let r = Math.random() * s; for (const k in poids) if ((r -= poids[k]) < 0) return k; };
function setMsg(t, duree = 3 * SEC) { S.msg = t; S.msgT = duree; }
function balle(o) { S.tirsJ.push(Object.assign({ vx: 0, vy: -9, dmg: 1, r: 4 }, o)); }
function tirE(x, y, a, v, bleu = false) { S.tirsE.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 5, bleu }); }
const bleuP = (e) => Math.random() < (TYPES[e.type]?.pBleu ?? 0.3);
function vise(e, v, n = 1, ecart = 0.22) {
  const a = Math.atan2(S.j.y - e.y, S.j.x - e.x);
  for (let i = 0; i < n; i++) tirE(e.x, e.y, a + (i - (n - 1) / 2) * ecart, v, bleuP(e));
}
function anneau(e, n, v, dec = 0, tousLesN = 0) {
  for (let i = 0; i < n; i++) tirE(e.x, e.y, dec + (i / n) * Math.PI * 2, v, tousLesN ? i % tousLesN === 0 : bleuP(e));
}
function eclats(x, y, c, n = 8, v = 3) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = hasard(0.5, 1) * v; S.effets.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, vie: 30, c }); }
}

// ================= Ennemis =================
const TYPES = {
  guepe:     { r: 11, hp: 1, taille: 'petit', forme: 'tri', c: '#ffd23f', maj(e) { e.y += 2.6; } },
  graine:    { r: 9, hp: 1, taille: 'petit', forme: 'carre', c: '#c98a3e', maj(e) { e.y += 1.7; e.x = e.x0 + Math.sin(e.age * 0.06 + e.ph) * 50; e.rot = e.age * 0.2; } },
  coccinelle:{ r: 10, hp: 1, taille: 'petit', forme: 'rond', c: '#ff7a3d',
    maj(e) {
      if (e.age < e.delai) e.x += e.vx;
      else { if (!e.pique) { const a = Math.atan2(S.j.y - e.y, S.j.x - e.x); e.vx = Math.cos(a) * 3.2; e.vy = Math.sin(a) * 3.2; e.pique = true; } e.x += e.vx; e.y += e.vy; }
    } },
  mouton:    { r: 12, hp: 2, taille: 'petit', forme: 'rond', c: '#b6b2c8', maj(e) { e.y += 1.3; e.x += Math.sin(e.age * 0.1) * 1.2; } },
  corbeau:   { r: 9, hp: 2, taille: 'petit', forme: 'tri', c: '#6c7bff', maj(e) { e.x += e.vx; e.y += e.vy; } },
  chasseur:  { r: 9, hp: 2, taille: 'petit', forme: 'losange', c: '#d94dff',
    maj(e) {
      const c = S.copain;
      if (!c || c.etat !== 'fuit') { e.y -= 2.5; return; }
      const a = Math.atan2(c.y - e.y, c.x - e.x), v = 1.15 + e.age / 900;
      e.x += Math.cos(a) * v; e.y += Math.sin(a) * v;
      if (dist2(e, c) < 14 * 14) attrapeCopain();
    } },
  cerf:      { r: 16, hp: 6, taille: 'moyen', forme: 'losange', c: '#ff8a3d', pBleu: 0.35,
    maj(e) { e.y += 0.9; e.x += e.vx; if (e.x < 30 || e.x > W - 30) e.vx *= -1; if (e.age % 90 === 45 && e.y > 20) vise(e, 2.6, 3); } },
  libellule: { r: 14, hp: 5, taille: 'moyen', forme: 'barre', c: '#3de0ff', pBleu: 0.3,
    maj(e) {
      if (e.y < e.arret && !e.part) e.y += 2.4;
      else if (!e.part) { e.attente = (e.attente || 0) + 1; if ([40, 70, 100].includes(e.attente)) vise(e, 3.2); if (e.attente > 150) e.part = true; }
      else e.x += e.x < W / 2 ? -3 : 3;
    } },
  pissenlit: { r: 15, hp: 7, taille: 'moyen', forme: 'etoile', c: '#f4f4f4', sol: true,
    maj(e) { e.y += DEFIL; if (e.age % 110 === 60 && e.y > 40 && e.y < H - 140) anneau(e, 8, 1.8, e.age * 0.1, 2); } },
  ruche:     { r: 30, hp: 45, taille: 'gros', forme: 'hexa', c: '#ffae00', pBleu: 0.3,
    maj(e) {
      if (e.y < 110 && !e.part) e.y += 1;
      else if (!e.part) { e.reste = (e.reste ?? 720) - 1; if (e.reste % 80 === 0) ajoute('guepe', e.x + hasard(-20, 20), e.y + 20); if (e.reste % 150 === 75) vise(e, 2.4, 5, 0.25); if (e.reste <= 0) e.part = true; }
      else e.y += 1.5;
    } },
  porteur:   { r: 13, hp: 3, taille: 'porteur', forme: 'penta', c: '#ffe066', maj(e) { e.x += e.vx; e.y = e.y0 + Math.sin(e.age * 0.05) * 14; } },
  cage:      { r: 15, hp: 4, taille: 'cage', forme: 'cage', c: '#8a8aa8', sol: true, maj(e) { e.y += DEFIL; } },
};
const RECOLTE = { petit: 1, moyen: 3, gros: 12, porteur: 2, cage: 0 };
const JAUGE = { petit: 4, moyen: 10, gros: 25, porteur: 6, cage: 0 };

function ajoute(type, x, y, extra = {}) {
  const T = TYPES[type];
  const e = Object.assign({ type, x, y, x0: x, y0: y, vx: 0, vy: 0, hp: T.hp, r: T.r, age: 0, ph: Math.random() * 6, rot: 0, flash: 0 }, extra);
  S.ennemis.push(e);
  return e;
}

// Formations
const V = (n, x0, type = 'guepe') => { for (let i = 0; i < n; i++) { const k = i - (n - 1) / 2; ajoute(type, x0 + k * 26, -20 - Math.abs(k) * 22); } };
const graines = (n) => { for (let i = 0; i < n; i++) ajoute('graine', 60 + i * (240 / Math.max(1, n - 1)), -20 - i * 30, { ph: i }); };
const cocci = (n, cote, y) => { for (let i = 0; i < n; i++) ajoute('coccinelle', cote < 0 ? -20 - i * 26 : W + 20 + i * 26, y, { vx: cote < 0 ? 2.4 : -2.4, delai: 50 + i * 10 }); };
const moutons = (n) => { for (let i = 0; i < n; i++) ajoute('mouton', hasard(40, W - 40), -20 - i * 40); };
const cerf = (x) => ajoute('cerf', x, -24, { vx: x < W / 2 ? 1.6 : -1.6 });
const libel = (x) => ajoute('libellule', x, -20, { arret: hasard(120, 190) });
const piss = (x) => ajoute('pissenlit', x, -20);
const porteur = () => ajoute('porteur', -20, 120, { vx: 1.6, y0: hasard(100, 170) });
const cage = (cid, x) => ajoute('cage', x, -20, { cid });
const ruche = () => ajoute('ruche', W / 2, -40);
const caisse = (x) => S.objets.push({ k: 'caisse', x, y: -20, vx: 0, vy: 0.8 });

// ================= Les missions du Jardin =================
// cages : ce que donne chaque prisonnier délivré. fin : plus rien n'arrive ensuite,
// la mission se termine quand l'écran est vide.
const MISSIONS = [
  { id: 'm1', nom: 'Le potager', suite: 'm2',
    cages: { a: { arme: 'crayon' }, b: { arme: 'elastiques' }, c: { bonus: true } },
    script: [
      [4, () => V(5, 180)], [8, () => graines(4)], [12, () => cage('a', 90)], [14, () => V(5, 250)],
      [18, () => cocci(6, -1, 140)], [23, () => porteur()], [27, () => cerf(100)], [31, () => cage('b', 270)],
      [34, () => { V(5, 120); graines(3); }], [39, () => caisse(180)], [42, () => { cocci(6, 1, 170); V(3, 180); }],
      [48, () => { cerf(80); cerf(280); }], [54, () => porteur()], [57, () => cage('c', 180)], [60, () => { graines(4); moutons(3); }],
      [66, () => { V(5, 110); V(5, 250); }], [72, () => { cerf(180); cocci(6, -1, 130); }], [79, () => { graines(5); V(3, 90); }],
      [85, () => { cocci(6, 1, 150); cerf(250); }], [92, () => moutons(4)], [97, () => { V(5, 180); porteur(); }],
      [104, () => { ruche(); setMsg('Une ruche ! Elle fabrique des guêpes'); }], [105, 'fin'],
    ] },
  { id: 'm2', nom: 'La haie', suite: 'm3', copain: true, ouvreSecret: true,
    cages: { d: { arme: 'arrosoir' }, e: { arme: 'billes' }, f: { bonus: true } },
    script: [
      [4, () => V(5, 180)], [8, () => libel(240)], [13, () => { cage('d', 100); graines(3); }], [17, () => { piss(90); piss(270); }],
      [23, () => moutons(3)], [27, () => porteur()], [31, () => { cerf(90); V(5, 250); }], [37, () => { libel(110); libel(250); }],
      [43, () => cage('e', 260)], [46, () => cocci(6, -1, 150)],
      [52, () => { creeCopain(); }], [64, () => { graines(4); piss(180); }], [70, () => caisse(120)],
      [72, () => { libel(70); libel(290); moutons(3); }], [79, () => porteur()], [82, () => cage('f', 180)],
      [85, () => { cerf(100); cerf(260); V(5, 180); }], [93, () => { piss(60); piss(180); piss(300); }],
      [100, () => { cocci(6, -1, 130); cocci(6, 1, 190); }], [108, () => { libel(70); libel(180); libel(290); cerf(180); }], [110, 'fin'],
    ] },
  { id: 'secret', nom: 'Le nid secret', suite: 'm3', secret: true,
    cages: { g: { arme: 'avions', dore: true }, h: { bonus: true } },
    script: [
      [3, () => { V(7, 180); setMsg('Mission secrète !'); }], [7, () => cocci(6, -1, 140)], [10, () => cocci(6, 1, 180)],
      [14, () => cage('g', 180)], [16, () => { V(5, 100); V(5, 260); }], [21, () => porteur()], [24, () => moutons(5)],
      [30, () => { graines(5); cerf(180); }], [36, () => cage('h', 90)], [38, () => { cocci(6, -1, 120); cocci(6, 1, 200); }],
      [45, () => { V(7, 180); porteur(); }], [52, () => { libel(90); libel(270); moutons(4); }], [60, () => { V(5, 120); V(5, 240); graines(4); }],
      [68, () => ruche()], [69, 'fin'],
    ] },
  { id: 'm3', nom: 'Le champ de l\'Épouvantail', boss: true, drapeau: 74,
    cages: { i: { arme: 'bulles' }, j: { bonus: true } },
    script: [
      [4, () => V(5, 180)], [8, () => { libel(240); graines(3); }], [13, () => cage('i', 120)], [16, () => { cerf(100); piss(270); }],
      [23, () => porteur()], [26, () => { cocci(6, -1, 150); moutons(3); }], [32, () => caisse(240)], [34, () => { libel(90); libel(270); }],
      [41, () => cage('j', 240)], [44, () => { V(5, 110); V(5, 250); cerf(180); }], [52, () => { piss(80); piss(280); graines(4); }],
      [60, () => porteur()], [63, () => { cocci(6, 1, 170); libel(180); }],
      [77, () => { S.alerte = 3 * SEC; }], [80, () => creeBoss()], [81, 'fin'],
    ] },

const mission = (id) => MISSIONS.find((m) => m.id === id);
const ouverte = (id) => id === 'm1' || (id === 'm2' && etatMission('m1').fini) || (id === 'secret' && sauve.secret) || (id === 'm3' && etatMission('m2').fini);
function prochaine() {
  for (const id of ['m1', 'm2', 'm3']) if (!etatMission(id).fini) return id;
  return 'm3';
}

// ================= État de partie =================
let S = null;
const opt = { bas: false, zone: false, invincible: false, vite: false, armes: false };

function lancer(id) {
  const M = mission(id);
  S = {
    M, t: 0, idx: 0, fin: false, enJeu: true, finT: 0, apresDrapeau: false,
    j: { x: W / 2, y: H - 130, cx: W / 2, cy: H - 130, inv: 0, cad: 0 },
    coeurs: 3 + sauve.coeur, coeursMax: 3 + sauve.coeur,
    arme: null, bouclier: false, aimantG: 0, toupies: 0, etoile: 0, robot: null,
    jauge: 0, boutons: 0, cagesLibres: [], nouvellesArmes: [],
    copain: null, copainSauve: false, boss: null, alerte: 0,
    ennemis: [], tirsJ: [], tirsE: [], objets: [], effets: [],
    msg: null, msgT: 0, vus: {},
    // compteurs pour le banc et le bilan
    stats: { bleus: 0, rouges: 0, armesPrises: 0, bonusPris: 0, robot: 0 },

  majSuper();

}

// ================= Copain à sauver =================
function creeCopain() {
  S.copain = { x: hasard(80, 280), y: H + 20, etat: 'fuit', age: 0 };
  for (let i = 0; i < 3; i++) ajoute('chasseur', S.copain.x + (i - 1) * 30, H + 70 + i * 22);
  setMsg('Un copain appelle à l\'aide ! Abats ses poursuivants', 3 * SEC);
}
function attrapeCopain() {
  if (S.copain.etat !== 'fuit') return;
  S.copain.etat = 'pris';
  setMsg('Trop tard, le copain est emporté…', 2.5 * SEC);
}
function majCopain() {
  const c = S.copain; if (!c) return;
  c.age++;
  if (c.etat === 'fuit') {
    c.y += c.y > 260 ? -1.3 : 0; c.x += Math.sin(c.age * 0.04) * 1.4;
    c.x = Math.max(20, Math.min(W - 20, c.x));
    if (!S.ennemis.some((e) => e.type === 'chasseur')) {
      c.etat = 'ami'; S.copainSauve = true; eclats(c.x, c.y, COUL.ami, 16);
      setMsg(S.M.ouvreSecret ? 'Copain sauvé ! Il t\'aide, et un chemin secret s\'ouvre' : 'Copain sauvé ! Il t\'aide', 3 * SEC);
    }
  } else if (c.etat === 'pris') { c.y -= 2.5; if (c.y < -30) S.copain = null; }
  else if (c.etat === 'ami') {
    c.x += (S.j.x - 38 - c.x) * 0.12; c.y += (S.j.y + 12 - c.y) * 0.12;
    if (c.age % 14 === 0 && !S.fin) balle({ x: c.x, y: c.y - 10, vy: -9, dmg: 1 });
  }
}

// ================= Boss =================
function creeBoss() { S.boss = { x: W / 2, y: -60, r: 44, hp: 110, hpMax: 110, age: 0, phase: 1, flash: 0, spirale: 0, type: 'boss' }; setMsg('L\'Épouvantail !', 2 * SEC); }
function majBoss(b) {
  b.age++; if (b.flash) b.flash--;
  if (b.y < 130) { b.y += 1.2; return; }
  b.x = W / 2 + Math.sin(b.age * (b.phase === 1 ? 0.012 : 0.02)) * 110;
  if (b.phase === 1 && b.hp < b.hpMax / 2) { b.phase = 2; b.age = 0; setMsg('Il se met en colère !', 2 * SEC); anneau(b, 18, 2.2, 0, 3); }
  if (b.phase === 1) {
    if (b.age % 70 === 0) { const a = Math.atan2(S.j.y - b.y, S.j.x - b.x); for (let i = -1; i <= 1; i++) tirE(b.x, b.y, a + i * 0.2, 2.8, i === 0); }
    if (b.age % 240 === 120) for (let i = -1; i <= 1; i++) { const a = Math.atan2(S.j.y - b.y, S.j.x - b.x) + i * 0.35; ajoute('corbeau', b.x + i * 20, b.y + 20, { vx: Math.cos(a) * 3, vy: Math.sin(a) * 3 }); }
  } else {
    if (b.age % 100 === 0) anneau(b, 14, 2, b.age * 0.05, 3);
    if (b.age % 300 === 150) b.spirale = 90;
    if (b.spirale > 0) { b.spirale--; if (b.spirale % 6 === 0) { const a = b.age * 0.15; tirE(b.x, b.y, a, 2.4, b.spirale % 24 === 0); tirE(b.x, b.y, a + Math.PI, 2.4); } }
    if (b.age % 200 === 60) { const a = Math.atan2(S.j.y - b.y, S.j.x - b.x); for (let i = -2; i <= 2; i++) tirE(b.x, b.y, a + i * 0.18, 3.2, Math.abs(i) === 2); }
    if (b.age % 260 === 200) for (let i = -2; i <= 2; i++) ajoute('corbeau', b.x + i * 18, b.y + 20, { vx: i * 0.6, vy: 3.2 });
  }
}

// ================= Joueur : tir =================
function cadenceBase() { return [12, 9, 9, 7][sauve.tir]; }
function tirer() {
  const j = S.j;
  if (--j.cad > 0) return;
  if (S.robot) { // le robot en Lego : tir lourd
    j.cad = 7;
    for (let i = -1; i <= 1; i++) balle({ x: j.x + i * 10, y: j.y - 24, vx: i * 0.8, vy: -10, dmg: 2, r: 5, forme: 'rond' });
    return;
  }
  if (S.arme) {
    const A = ARMES[S.arme.k];
    j.cad = A.cad; A.tir(j);
    if (--S.arme.mun <= 0) { S.arme = null; setMsg('Plus de munitions : retour au tir de base', 2 * SEC); }
    return;
  }
  j.cad = cadenceBase();
  if (sauve.tir >= 2) { balle({ x: j.x - 6, y: j.y - 16 }); balle({ x: j.x + 6, y: j.y - 16 }); } else balle({ x: j.x, y: j.y - 16 });
  if (sauve.tir >= 3) { balle({ x: j.x - 8, y: j.y - 16, vx: -1.4 }); balle({ x: j.x + 8, y: j.y - 16, vx: 1.4 }); }
}
function tirToupies() {
  if (S.toupies <= 0 || S.fin) return;
  for (let k = 0; k < 2; k++) {
    const a = S.t * 0.08 + k * Math.PI;
    if (S.t % 18 === k * 9) balle({ x: S.j.x + Math.cos(a) * 30, y: S.j.y + Math.sin(a) * 30 - 6, vy: -9, dmg: 1 });
  }
}

// ================= Coups reçus =================
function touche() {
  if (S.j.inv > 0 || opt.invincible || S.etoile > 0 || S.fin) return;
  if (S.robot) {
    S.robot.pv--; S.j.inv = 30; eclats(S.j.x, S.j.y, '#ff9a3d', 8);
    if (S.robot.pv <= 0) finRobot();
    return;
  }
  if (S.bouclier) { S.bouclier = false; S.j.inv = 60; eclats(S.j.x, S.j.y, '#8ff', 14); setMsg('Le bouclier t\'a protégé', 2 * SEC); return; }
  S.coeurs--; S.j.inv = 100; S.stats.rouges++;
  eclats(S.j.x, S.j.y, COUL.joueur, 16, 4);
  S.tirsE = S.tirsE.filter((b) => dist2(b, S.j) > 90 * 90);
  if (navigator.vibrate) try { navigator.vibrate(80); } catch (e) {}
  if (S.coeurs <= 0) mourir();
}
function finRobot() {
  for (let i = 0; i < 16; i++) S.effets.push({ x: S.j.x, y: S.j.y, vx: hasard(-4, 4), vy: hasard(-4, 4), vie: 40, c: ['#e33', '#3a3', '#36f', '#fd2'][i % 4], carre: true });
  S.robot = null; S.j.inv = 70;
  setMsg('Le robot se démonte !', 1.5 * SEC);
}
function mourir() {
  S.enJeu = false;
  const peutDrapeau = S.M.boss && S.auDrapeau;
  $('mort-txt').textContent = peutDrapeau
    ? 'Tu repars du drapeau, juste avant l\'Épouvantail, cœurs remplis.'
    : 'La mission est courte : on la recommence. Les prisonniers délivrés reviennent dans leurs cages.';
  $('d-reprendre').textContent = peutDrapeau ? 'Repartir du drapeau' : 'Recommencer la mission';
  montre('mort');
}
function repartir() {
  if (S.M.boss && S.auDrapeau) {
    const d = S.auDrapeau;
    S.t = d.t; S.idx = S.M.script.findIndex((e) => e[0] * SEC >= d.t);
    S.boutons = d.boutons; S.cagesLibres = d.cages.slice(); S.arme = null; S.robot = null;
    S.ennemis = []; S.tirsJ = []; S.tirsE = []; S.objets = []; S.boss = null; S.alerte = 0;
    S.coeurs = S.coeursMax; S.bouclier = false; S.aimantG = 0; S.toupies = 0; S.etoile = 0;
    S.j.inv = 120; S.enJeu = true; montre(null);
  } else lancer(S.M.id);
}

// ================= Super-pouvoir =================
function superPouvoir() {
  if (!S || !S.enJeu || S.jauge < 100) return;
  S.jauge = 0; S.effets.push({ onde: 0 }); S.tirsE = [];
  for (const e of S.ennemis) if (e.type !== 'cage') blesse(e, 15);
  if (S.boss && S.boss.y > 0) blesseBoss(25);
  majSuper();
}
function majSuper() {
  const b = $('superb');
  b.classList.toggle('pret', S.jauge >= 100);
  b.textContent = S.jauge >= 100 ? 'SUPER' : Math.floor(S.jauge) + ' %';
}
function remplit(n) {
  const avant = S.jauge; S.jauge = Math.min(100, S.jauge + n);
  if (S.jauge >= 100 && avant < 100 && !S.vus.superPret) { S.vus.superPret = true; setMsg('Super-pouvoir prêt : touche le bouton'); }
  majSuper();
}

// ================= Dégâts =================
function frappe(c, d) { if (c.type === 'boss') blesseBoss(d); else blesse(c, d); }
function blesse(e, d) {
  if (e.mort) return;
  e.hp -= d; e.flash = 4;
  if (e.hp > 0) return;
  e.mort = true;
  const T = TYPES[e.type];
  if (e.type === 'cage') { libere(e); return; }
  eclats(e.x, e.y, T.c, T.taille === 'gros' ? 30 : 10, T.taille === 'gros' ? 5 : 3);
  for (let i = 0; i < RECOLTE[T.taille]; i++) S.objets.push({ k: 'bouton', x: e.x + hasard(-8, 8), y: e.y, vx: hasard(-1.2, 1.2), vy: hasard(-1.5, 0.5) });
  remplit(JAUGE[T.taille]);
  if (e.type === 'porteur') {
    const dispo = decouvertes();
    if (dispo.length && Math.random() < 0.5) cadeau(e.x, e.y, { a: dispo[Math.floor(Math.random() * dispo.length)] });
    else cadeau(e.x, e.y, { b: tire(POIDS_BONUS) });
    if (!S.vus.cadeau) { S.vus.cadeau = true; setMsg('Un cadeau ! Attrape-le'); }
  }
}
function blesseBoss(d) {
  const b = S.boss; if (!b) return;
  b.hp -= d; b.flash = 4;
  if (b.hp > 0) return;
  eclats(b.x, b.y, '#ffd23f', 60, 6);
  for (let i = 0; i < 40; i++) S.objets.push({ k: 'bouton', x: b.x + hasard(-30, 30), y: b.y + hasard(-20, 20), vx: hasard(-2, 2), vy: hasard(-2, 1) });
  S.boss = null; S.tirsE = []; S.ennemis.forEach((e) => { if (e.type !== 'cage') e.mort = true; });
  S.aimantG = 3 * SEC;
  setMsg('Bravo, l\'Épouvantail est battu !', 3 * SEC);
}
const decouvertes = () => (opt.armes ? ORDRE_ARMES.slice() : sauve.armes.concat(S.nouvellesArmes.filter((a) => !sauve.armes.includes(a))));
function cadeau(x, y, contenu) { S.objets.push(Object.assign({ k: 'cadeau', x, y, vx: 0, vy: 0.9 }, contenu)); }

// Un jouet prisonnier est délivré : il lance son cadeau et file vers la chambre.
function libere(e) {
  const def = S.M.cages[e.cid];
  if (!S.cagesLibres.includes(e.cid)) S.cagesLibres.push(e.cid);
  S.effets.push({ ami: true, x: e.x, y: e.y, vie: 70, dore: def.dore });
  eclats(e.x, e.y, def.dore ? '#ffd700' : COUL.ami, 14);
  if (def.arme) {
    const neuve = !sauve.armes.includes(def.arme) && !S.nouvellesArmes.includes(def.arme);
    if (neuve) { S.nouvellesArmes.push(def.arme); setMsg(`Nouvelle arme : ${ARMES[def.arme].nom} !`, 3 * SEC); }
    else setMsg('Jouet délivré !', 1.5 * SEC);
    cadeau(e.x, e.y, { a: def.arme });
  } else { cadeau(e.x, e.y, { b: tire(POIDS_BONUS) }); setMsg('Jouet délivré !', 1.5 * SEC); }
}

function prend(o) {
  if (o.a) {
    S.stats.armesPrises++;
    S.arme = { k: o.a, mun: ARMES[o.a].mun };
    if (!S.vus['arme' + o.a]) setMsg(ARMES[o.a].nom, 1.5 * SEC);
    S.vus['arme' + o.a] = true;
  } else {
    S.stats.bonusPris++;
    const b = o.b;
    if (b === 'bouclier') S.bouclier = true;
    if (b === 'aimant') S.aimantG = 10 * SEC;
    if (b === 'toupies') S.toupies = 15 * SEC;
    if (b === 'etoile') S.etoile = 5 * SEC;
    if (b === 'coeur') S.coeurs = Math.min(S.coeursMax, S.coeurs + 1);
    setMsg(NOM_BONUS[b], 2 * SEC);
  }
  eclats(S.j.x, S.j.y, '#fff', 12);
}

// ================= Une image de jeu =================
function cibles() { return S.boss && S.boss.y > 0 ? S.ennemis.concat([S.boss]) : S.ennemis; }
function pas() {
  if (!S || !S.enJeu) return;
  S.t++;
  const M = S.M;
  // Script de la mission
  while (S.idx < M.script.length && M.script[S.idx][0] * SEC <= S.t) {
    const f = M.script[S.idx++][1];
    if (f === 'fin') S.fin = true; else f();
  }
  if (M.drapeau && !S.auDrapeau && S.t >= M.drapeau * SEC) {
    S.auDrapeau = { t: S.t, boutons: S.boutons, cages: S.cagesLibres.slice() };
    setMsg('Drapeau : tu repartiras d\'ici', 2.5 * SEC);
  }
  if (S.msgT > 0) S.msgT--;
  if (S.alerte > 0) S.alerte--;
  for (const k of ['aimantG', 'toupies', 'etoile']) if (S[k] > 0) S[k]--;
  if (S.robot && --S.robot.t <= 0) finRobot();

  // Joueur
  const j = S.j;
  j.x += (j.cx - j.x) * LISSAGE; j.y += (j.cy - j.y) * LISSAGE;
  if (j.inv > 0) j.inv--;
  if (!(S.fin && !S.boss && S.ennemis.length === 0)) { tirer(); tirToupies(); }
  majCopain();

  // Tirs du joueur
  const C = cibles();
  for (const b of S.tirsJ) {
    if (b.guide) { // avions téléguidés : virent vers l'ennemi le plus proche
      let best = null, bd = 1e9;
      for (const e of C) { if (e.type === 'cage' || e.y < 0) continue; const d = dist2(b, e); if (d < bd) { bd = d; best = e; } }
      if (best) {
        const a = Math.atan2(b.vy, b.vx), v = Math.hypot(b.vx, b.vy), cible = Math.atan2(best.y - b.y, best.x - b.x);
        let da = ((cible - a + Math.PI * 3) % (Math.PI * 2)) - Math.PI; da = Math.max(-0.12, Math.min(0.12, da));
        const na = a + da, nv = Math.min(7, v + 0.15); b.vx = Math.cos(na) * nv; b.vy = Math.sin(na) * nv;
      }
    }
    b.x += b.vx; b.y += b.vy;
    if (b.rebond !== undefined) {
      if ((b.x < 4 && b.vx < 0) || (b.x > W - 4 && b.vx > 0)) { b.vx *= -1; b.rebond--; }
      if (b.y < 4 && b.vy < 0) { b.vy *= -1; b.rebond--; }
      if (b.rebond < 0) b.mort = true;
    }
    if (b.vie !== undefined && --b.vie <= 0) b.mort = true;
  }
  S.tirsJ = S.tirsJ.filter((b) => !b.mort && b.y > -30 && b.y < H + 30 && b.x > -30 && b.x < W + 30);

  // Ennemis
  for (const e of S.ennemis) {
    e.age++; if (e.flash) e.flash--;
    TYPES[e.type].maj(e);
    if (e.y > H + 60 || e.y < -260 || (e.age > 30 && (e.x < -90 || e.x > W + 90))) e.sorti = true;
  }
  if (S.boss) majBoss(S.boss);

  // Collisions : tirs du joueur
  for (const b of S.tirsJ) {
    if (b.mort) continue;
    for (const e of cibles()) {
      if (e.mort || e.y < -10) continue;
      if (dist2(b, e) >= (e.r + b.r) ** 2) continue;
      if (b.perce) { if (!b.perce.has(e)) { b.perce.add(e); frappe(e, b.dmg); } continue; }
      if (b.zone) { // grosse bulle : éclate sur une zone
        S.effets.push({ rond: true, x: b.x, y: b.y, r: b.zone, vie: 16 });
        for (const f of cibles()) if (dist2(b, f) < (b.zone + f.r) ** 2) frappe(f, b.dmg);
      } else frappe(e, b.dmg);
      b.mort = true; break;
    }
  }
  S.tirsJ = S.tirsJ.filter((b) => !b.mort);
  S.ennemis = S.ennemis.filter((e) => !e.mort && !e.sorti);

  // Tirs ennemis : les bleus s'avalent avec tout le corps, les rouges blessent au cœur
  const zr = S.robot ? 10 : ZT;
  for (const b of S.tirsE) {
    b.x += b.vx; b.y += b.vy;
    if (b.bleu) { if (dist2(b, j) < (b.r + (S.robot ? 22 : ZB)) ** 2) { b.mort = true; S.stats.bleus++; remplit(5); S.effets.push({ x: b.x, y: b.y, vx: 0, vy: 0, vie: 12, c: COUL.bleu }); } }
    else if (dist2(b, j) < (b.r + zr) ** 2) { b.mort = true; touche(); }
  }
  S.tirsE = S.tirsE.filter((b) => !b.mort && b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);
  // Contacts
  for (const e of S.ennemis) {
    if (e.type === 'cage') continue;
    if (dist2(e, j) < (e.r * 0.7 + (S.robot ? 16 : ZT)) ** 2) {
      if (S.etoile > 0 || S.robot) { if (S.t % 6 === 0) blesse(e, S.robot ? 2 : 1); if (S.robot) touche(); }
      else { touche(); blesse(e, 2); }
    }
  }
  if (S.boss && dist2(S.boss, j) < (S.boss.r * 0.7 + ZT) ** 2) touche();

  // Objets
  const rayon = 26 + 30 * sauve.aimant;
  for (const o of S.objets) {
    const d2 = dist2(o, j);
    const attire = o.k === 'bouton' && (S.aimantG > 0 || d2 < rayon * rayon);
    if (attire) { const d = Math.sqrt(d2) || 1; o.x += ((j.x - o.x) / d) * 7; o.y += ((j.y - o.y) / d) * 7; }
    else { o.vy = Math.min(o.vy + 0.05, o.k === 'bouton' ? 1.6 : 0.9); o.vx *= 0.97; o.x += o.vx; o.y += o.vy; }
    if (d2 < (o.k === 'bouton' ? 16 : 24) ** 2) {
      o.mort = true;
      if (o.k === 'bouton') S.boutons++;
      else if (o.k === 'caisse') { S.robot = { t: 20 * SEC, pv: 5 }; S.stats.robot++; setMsg('Le robot en Lego ! Il encaisse 5 coups', 2.5 * SEC); }
      else prend(o);
    }
  }
  S.objets = S.objets.filter((o) => !o.mort && o.y < H + 20);

  // Effets
  for (const f of S.effets) {
    if (f.onde !== undefined) { f.onde += 14; if (f.onde > 800) f.mort = true; continue; }
    if (f.ami) { f.y -= 3; if (--f.vie <= 0) f.mort = true; continue; }
    if (f.rond) { if (--f.vie <= 0) f.mort = true; continue; }
    f.x += f.vx; f.y += f.vy; f.vx *= 0.94; f.vy *= 0.94; if (--f.vie <= 0) f.mort = true;
  }
  S.effets = S.effets.filter((f) => !f.mort);

  // Fin de mission : plus rien n'arrive et l'écran est vide (les cages oubliées défilent)
  if (S.fin && !S.boss && !S.ennemis.some((e) => e.type !== 'cage') && !S.objets.some((o) => o.k === 'cadeau')) {
    if (++S.finT > 1.5 * SEC) bilan();
  }
}

// ================= Bilan et sauvegarde =================
function bilan() {
  S.enJeu = false;
  const M = S.M, em = etatMission(M.id);
  const total = Object.keys(M.cages).length;
  const avant = em.cages.length;
  em.fini = true;

  // De haut en bas : le boss, la bifurcation (mission 2 et sa mission secrète), la mission 1
  etape('m3', true); etape('m2'); etape('secret'); etape('m1', true);
  const p = prochaine();
  $('b-continuer').textContent = etatMission('m3').fini ? 'Rejouer l\'Épouvantail' : `Continuer : ${mission(p).nom}`;
  $('b-continuer').onclick = () => lancer(p);
}
function lireOptions() {
  for (const k of ['bas', 'zone', 'invincible', 'vite', 'armes']) opt[k] = $('o-' + k).checked;
}
['o-bas', 'o-zone', 'o-invincible', 'o-vite', 'o-armes'].forEach((id) => $(id).addEventListener('change', lireOptions));
$('b-atelier').onclick = () => montre('atelier');
$('a-retour').onclick = () => montre('carte');
$('pause').onclick = () => { if (S) S.enJeu = false; montre('pausee'); };
$('p-reprendre').onclick = () => { S.enJeu = true; montre(null); };
$('p-carte').onclick = () => { S = null; montre('carte'); };
$('d-reprendre').onclick = repartir;
$('d-carte').onclick = () => { S = null; montre('carte'); };
$('g-carte').onclick = () => { S = null; montre('carte'); };
$('superb').onclick = superPouvoir;
$('o-debloquer').onclick = () => { for (const id of ['m1', 'm2']) etatMission(id).fini = true; sauve.secret = true; ecrire(); remplirCarte(); };
let confirmeEffacer = false;
$('o-effacer').onclick = () => {
  if (!confirmeEffacer) { confirmeEffacer = true; $('o-effacer').textContent = 'Toucher encore pour tout effacer'; return; }
  confirmeEffacer = false; $('o-effacer').textContent = 'Effacer la sauvegarde';
  sauve = VIDE(); ecrire(); remplirCarte();
};
document.addEventListener('visibilitychange', () => { if (document.hidden && S && S.enJeu) { S.enJeu = false; montre('pausee'); } });

// ================= Atelier =================
const AMELIO = [
  { k: 'tir', nom: 'Tir de base', niv: ['cadence plus rapide', 'tir double', 'tir en éventail'] },
  { k: 'coeur', nom: 'Cœurs', niv: ['4 cœurs', '5 cœurs', '6 cœurs'] },
  { k: 'aimant', nom: 'Aimant à boutons', niv: ['attire de plus loin', 'encore plus loin', 'très loin'] },
];
function remplirAtelier() {
  $('a-boutons').textContent = sauve.boutons;
  $('a-liste').innerHTML = '';
  for (const a of AMELIO) {
    const n = sauve[a.k], max = n >= 3, prix = PRIX[n];
    const div = document.createElement('div');
    div.className = 'ligne-att';
    div.innerHTML = `<b>${a.nom} <span class="points" style="color:var(--accent)">${'●'.repeat(n)}${'○'.repeat(3 - n)}</span></b><small>${max ? 'Au maximum' : 'Prochain : ' + a.niv[n]}</small>`;
    const btn = document.createElement('button');
    btn.className = 'acheter'; btn.textContent = max ? 'Max' : `${prix} boutons`; btn.disabled = max || sauve.boutons < prix;
    btn.onclick = () => { sauve.boutons -= prix; sauve[a.k]++; ecrire(); remplirAtelier(); };
    div.append(btn); $('a-liste').append(div);
  }
}

// ================= Taille de l'écran =================
function redim() {
  const r = $('cadre').getBoundingClientRect();
  echelle = Math.min(r.width / W, r.height / H);
  const w = Math.floor(W * echelle), h = Math.floor(H * echelle);
  $('jeu').style.width = w + 'px'; $('jeu').style.height = h + 'px';
  toile.style.width = w + 'px'; toile.style.height = h + 'px';
  toile.width = Math.floor(w * devicePixelRatio); toile.height = Math.floor(h * devicePixelRatio);
}
addEventListener('resize', redim);
redim();
montre('carte');
window.__poc = { get S() { return S; }, get sauve() { return sauve; }, opt, pas, lancer, MISSIONS };
</script>
