<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Décors à thème</title>
<!-- Maquette : des décors PROPRES à chaque univers (sols, objets, plan qui n'est
     pas forcément carré, gros objets sur plusieurs cases, noms des pièces sur le
     plan), d'après ce que fait Murdoku. Capture : node tools/mockup-conviction-themes.mjs -->
<style>
body { margin: 0; background: #c9d0d6; font: 14px system-ui, sans-serif; color: #1b2430; }
#planche { padding: 20px; width: max-content; display: grid; grid-template-columns: repeat(3, 400px); gap: 22px; align-items: start; }
h2 { margin: 0 0 4px; font-size: 18px; }
p.s { margin: 0 0 10px; font-size: 13px; color: #44515f; min-height: 34px; }
.avant img { width: 400px; border-radius: 10px; display: block; }
.maquette { background: #2a211c; border-radius: 10px; padding: 8px 10px 10px 0; box-shadow: 0 18px 40px rgb(0 0 0 / .35), inset 0 0 0 4px #3b2f28; }
.gw { display: grid; grid-template-columns: 22px repeat(var(--n), 1fr); grid-template-rows: 22px repeat(var(--n), 1fr); position: relative; }
.lab { color: #e8dcc4; font: 700 15px system-ui; display: grid; place-items: center; }
.cell { aspect-ratio: 1; position: relative; background-size: 100% 100%; }
.cell.vide { background: none; }
.mur { position: absolute; inset: 0; pointer-events: none; }
.obj { position: absolute; pointer-events: none; display: grid; place-items: center; z-index: 2; }
.obj svg { width: 86%; height: 86%; filter: drop-shadow(2px 3px 2px rgb(0 0 0 / .4)); overflow: visible; }
.nom { position: absolute; z-index: 3; font: 800 11.5px/1 system-ui; letter-spacing: .04em; text-transform: uppercase; color: #fff; text-shadow: 0 0 2px #1b1410, 1.5px 1.5px 0 #1b1410, -1.5px 1.5px 0 #1b1410, 1.5px -1.5px 0 #1b1410, -1.5px -1.5px 0 #1b1410, 0 2px 3px rgb(0 0 0 / .5); white-space: nowrap; pointer-events: none; }
.fond { position: absolute; z-index: 0; pointer-events: none; }
.legende { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; }
.legende span { display: inline-flex; align-items: center; gap: 4px; }
.legende i { width: 18px; height: 18px; border-radius: 3px; background-size: 100% 100%; box-shadow: inset 0 0 0 1px rgb(0 0 0 / .25); }
</style></head><body><div id="planche"></div>
<script type="module">
const T = '#2b1d17';
const L = ` stroke="${T}" stroke-width="1.4" stroke-linejoin="round"`;
const l = (w = 1) => ` stroke="${T}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const url = (svg) => `url(data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40' preserveAspectRatio='none'>${svg}</svg>`).replace(/'/g, '%27').replace(/\(/g, '%28').replace(/\)/g, '%29')})`;

// ---------------- Sols (une case de 40) ----------------
const SOLS = {
  // Egghead : acier bleu des labos, grille lumineuse de Punk Records, tôle de l'usine, dalles pastel de la ville, pelouse de serre, quai.
  acier: url(`<rect width='40' height='40' fill='#c3d2e0'/><rect x='1' y='1' width='38' height='38' rx='2' fill='#d3e0ec'/><path d='M2 38V2h36' stroke='#eef5fb' stroke-width='1.2' fill='none'/><path d='M38 2v36H2' stroke='#9fb1c3' stroke-width='1.2' fill='none'/><circle cx='5' cy='5' r='1.1' fill='#8ea2b6'/><circle cx='35' cy='5' r='1.1' fill='#8ea2b6'/><circle cx='5' cy='35' r='1.1' fill='#8ea2b6'/><circle cx='35' cy='35' r='1.1' fill='#8ea2b6'/><path d='M10 20h20' stroke='#9fdcf2' stroke-width='.8' opacity='.8'/>`),
  donnees: url(`<rect width='40' height='40' fill='#1c2a4c'/><path d='M0 .5H40M.5 0V40' stroke='#3fd2ff' stroke-width='1.2' opacity='.85'/><path d='M0 20H40M20 0V40' stroke='#3fd2ff' stroke-width='.5' opacity='.35'/><circle cx='20' cy='20' r='1.6' fill='#9ff0ff'/><circle cx='.5' cy='.5' r='2' fill='#9ff0ff' opacity='.9'/>`),
  tole: url(`<rect width='40' height='40' fill='#7b8592'/><g stroke='#a3adb8' stroke-width='1.6' stroke-linecap='round'><path d='M5 8l5-3M18 8l5-3M31 8l5-3M5 22l5-3M18 22l5-3M31 22l5-3M5 36l5-3M18 36l5-3M31 36l5-3'/><path d='M11 15l5 3M24 15l5 3M11 29l5 3M24 29l5 3'/></g><path d='M0 39.5H40M39.5 0V40' stroke='#5c6570'/>`),
  pastel: url(`<rect width='40' height='40' fill='#f6f1f6'/><rect x='1' y='1' width='18' height='18' rx='3' fill='#f7d9e6'/><rect x='21' y='21' width='18' height='18' rx='3' fill='#f7d9e6'/><rect x='21' y='1' width='18' height='18' rx='3' fill='#d9ecf7'/><rect x='1' y='21' width='18' height='18' rx='3' fill='#d9ecf7'/>`),
  serre: url(`<rect width='40' height='40' fill='#79c46b'/><path d='M6 10l2-4 2 4M24 6l2-4 2 4M14 26l2-4 2 4M32 24l2-4 2 4M4 36l2-4 2 4' stroke='#4f9a44' stroke-width='1.2' fill='none'/><circle cx='30' cy='12' r='1.6' fill='#fff7a8'/><circle cx='10' cy='30' r='1.6' fill='#f7b6d0'/><path d='M0 20h40' stroke='#ffffff' stroke-width='.6' opacity='.35' stroke-dasharray='3 3'/>`),
  quai: url(`<rect width='40' height='40' fill='#e3e9ef'/><path d='M0 13.5H40M0 26.5H40' stroke='#c2ccd6' stroke-width='1'/><path d='M0 39H40' stroke='#f2c230' stroke-width='2' stroke-dasharray='6 4'/>`),
  // Égypte : dalles de grès gravées, le Nil, le palais (lapis et or), le désert.
  gres: url(`<rect width='40' height='40' fill='#dcbd86'/><rect x='1' y='1' width='38' height='18' fill='#e6c994'/><rect x='1' y='21' width='18' height='18' fill='#e3c58f'/><rect x='21' y='21' width='18' height='18' fill='#e8cc98'/><path d='M8 6v8M5 8h6M8 6c-2 0-3-1-3-2s1-2 3-2 3 1 3 2-1 2-3 2' stroke='#b8935a' stroke-width='1' fill='none' opacity='.8'/><path d='M27 30c3-3 7-3 9 0-2 3-6 3-9 0z' stroke='#b8935a' stroke-width='1' fill='none' opacity='.8'/><circle cx='31.5' cy='30' r='1.2' fill='#b8935a' opacity='.8'/>`),
  nil: url(`<rect width='40' height='40' fill='#3d9cb5'/><path d='M0 9c5-3 9 3 14 0s9-3 14 0 8 2 12 0M0 22c5-3 9 3 14 0s9-3 14 0 8 2 12 0M0 35c5-3 9 3 14 0s9-3 14 0 8 2 12 0' stroke='#8fd4e4' stroke-width='1.3' fill='none'/><path d='M30 16c4-1 6 1 7 3' stroke='#bfe9f2' stroke-width='1' fill='none'/>`),
  palais: url(`<rect width='40' height='40' fill='#2f5a92'/><rect x='1.5' y='1.5' width='37' height='37' rx='1' fill='#36659f'/><path d='M20 13L27 20 20 27 13 20z' fill='none' stroke='#cfa846' stroke-width='1.2' opacity='.85'/><circle cx='20' cy='20' r='1.6' fill='#cfa846' opacity='.85'/><path d='M0 .5H40M.5 0V40' stroke='#cfa846' stroke-width='1' opacity='.55'/>`),
  desert: url(`<rect width='40' height='40' fill='#ecd3a0'/><path d='M0 30c10-10 22-12 40-6V40H0z' fill='#e2c287'/><path d='M0 11c7-3 13 3 20 0s13-2 20 0' stroke='#d3b077' stroke-width='1.1' fill='none'/><path d='M0 30c10-10 22-12 40-6' stroke='#d1ad73' stroke-width='1.1' fill='none'/>`),
};

// ---------------- Objets (carré de 48 par case occupée) ----------------
const OBJ = {
  // Egghead
  ecran: (w) => `<svg viewBox="0 0 ${48 * w} 48"><rect x="4" y="6" width="${48 * w - 8}" height="30" rx="3" fill="#18233e"${L}/><rect x="8" y="10" width="${48 * w - 16}" height="22" rx="1.5" fill="#3fc6f0"/><path d="M12 25c6-8 10 4 16-3s10 5 16-2 10 4 16-1 8 3 14-2" stroke="#e8fbff" stroke-width="2" fill="none"/><path d="M${24 * w - 6} 36h12l3 6h-18z" fill="#9aaabb"${L}/></svg>`,
  cuve: () => `<svg viewBox="0 0 48 48"><rect x="12" y="2" width="24" height="6" rx="2" fill="#9aaabb"${L}/><rect x="13" y="8" width="22" height="32" rx="4" fill="#bdeefc" fill-opacity=".75"${L}/><rect x="15" y="20" width="18" height="18" rx="2" fill="#52d6a8"/><circle cx="20" cy="27" r="1.6" fill="#e9fff6"/><circle cx="27" cy="31" r="1.2" fill="#e9fff6"/><circle cx="23" cy="23" r="1" fill="#e9fff6"/><path d="M17 12v20" stroke="#ffffff" stroke-width="2" opacity=".7" stroke-linecap="round"/><rect x="11" y="40" width="26" height="6" rx="2" fill="#7b8592"${L}/></svg>`,
  sphere: () => `<svg viewBox="0 0 96 96"><circle cx="48" cy="46" r="36" fill="#bff3ff" fill-opacity=".6" stroke="#3fd2ff" stroke-width="3"/><circle cx="48" cy="46" r="26" fill="#2a8fd6"${l(2)}/><path d="M30 40c4-8 12-8 14-2 2-8 12-8 16-1 6-2 10 4 6 10 4 6-2 12-8 10-2 6-12 6-14 0-6 4-14 0-12-6-6-2-6-10-2-11z" fill="#9ff0ff" stroke="#e8fbff" stroke-width="1.5"/><path d="M40 44c4 2 8 0 10-3M48 52c3-3 7-3 10 0" stroke="#2a8fd6" stroke-width="1.6" fill="none"/><ellipse cx="48" cy="86" rx="24" ry="5" fill="#7b8592"${L}/></svg>`,
  console: () => `<svg viewBox="0 0 48 48"><path d="M6 30l6-16h24l6 16z" fill="#d3e0ec"${L}/><path d="M13 18h22l3 9H10z" fill="#18233e"/><rect x="14" y="20" width="5" height="3" rx="1" fill="#f7a8c8"/><rect x="21" y="20" width="5" height="3" rx="1" fill="#3fd2ff"/><rect x="28" y="20" width="5" height="3" rx="1" fill="#ffe06a"/><rect x="6" y="30" width="36" height="14" rx="2" fill="#9fb1c3"${L}/></svg>`,
  capsule: () => `<svg viewBox="0 0 48 48"><ellipse cx="24" cy="26" rx="14" ry="18" fill="#fbe9f1"${L}/><path d="M12 22c4 3 8-2 12 1s8-2 12 1" stroke="#e66b9a" stroke-width="2.2" fill="none"/><path d="M14 30c6 4 14 4 20 0" stroke="#e6c4d3" stroke-width="1.5" fill="none"/><ellipse cx="19" cy="16" rx="3" ry="5" fill="#ffffff" opacity=".85"/></svg>`,
  arbre: () => `<svg viewBox="0 0 48 48"><rect x="21" y="28" width="6" height="16" rx="2" fill="#e6eef5"${L}/><circle cx="24" cy="18" r="14" fill="#68c7a0"${L}/><circle cx="24" cy="18" r="8" fill="#9fe3c4"/><circle cx="20" cy="14" r="3" fill="#e9fff6"/></svg>`,
  // Égypte
  obelisque: () => `<svg viewBox="0 0 48 48"><path d="M19 8l5-6 5 6 3 34H16z" fill="#d9b77a"${L}/><path d="M24 2l5 6 3 34h-8z" fill="#c09a5c"/><path d="M22 14h4M22 20c1-1 3-1 4 0M23 26h2v4h-2zM22 34h4" stroke="#8a6a38" stroke-width="1.2" fill="none"/><path d="M19 8l5-6 5 6z" fill="#e8c04a"${L}/><rect x="12" y="42" width="24" height="4" rx="1" fill="#b8935a"${L}/></svg>`,
  sphinx: (w) => `<svg viewBox="0 0 96 48"><path d="M6 44V36c0-6 6-8 14-8h40l6-12c2-8 8-12 14-12s12 4 12 12v32z" fill="#dcbd86"${L}/><path d="M68 18c0-6 4-10 10-10s10 4 10 10v8H68z" fill="#3a6fb6"${L}/><path d="M68 20l-4 10M88 20l4 10" stroke="#3a6fb6" stroke-width="5" stroke-linecap="round"/><path d="M68 20l-4 10M88 20l4 10" stroke="#d8b04a" stroke-width="1.4" stroke-dasharray="2 2"/><ellipse cx="78" cy="24" rx="7" ry="8" fill="#e3c58f"${L}/><path d="M75 22h1.5M80.5 22h1.5" stroke="${T}" stroke-width="1.6" stroke-linecap="round"/><path d="M76 28c1.5 1 3 1 4.5 0" stroke="${T}" stroke-width="1.1" fill="none"/><path d="M8 44h20M34 44h18" stroke="#b8935a" stroke-width="2"/><path d="M20 36c8-2 20-2 32 0" stroke="#c09a5c" stroke-width="1.4" fill="none"/></svg>`,
  palmier: () => `<svg viewBox="0 0 48 48"><path d="M23 44c-2-10 0-20 2-28" stroke="#8a6234" stroke-width="5" stroke-linecap="round"/><path d="M23 44c-2-10 0-20 2-28" stroke="#b08048" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="3 2"/><path d="M25 16C18 8 9 8 4 14c8-1 14 0 21 2zM25 16C30 7 40 6 45 12c-8 0-14 1-20 4zM25 16c-6 2-12 8-13 16 5-6 9-11 13-16zM25 16c6 2 11 8 12 15-5-6-8-10-12-15z" fill="#4f9a44"${l(1.2)}/><circle cx="23" cy="18" r="2" fill="#7a4a24"/><circle cx="27" cy="18" r="2" fill="#7a4a24"/></svg>`,
  barque: (w) => `<svg viewBox="0 0 96 48"><path d="M4 22c10 14 26 18 44 18s34-4 44-18c-14 4-30 6-44 6S18 26 4 22z" fill="#c9924e"${L}/><path d="M10 26c12 6 26 8 38 8s26-2 38-8" stroke="#8a5a2a" stroke-width="1.4" fill="none"/><path d="M48 30V6" stroke="#6b4423" stroke-width="2.6"/><path d="M48 8l18 14H48z" fill="#f2ead8"${l(1.2)}/><path d="M4 22l-2-6M92 22l2-6" stroke="#c9924e" stroke-width="3" stroke-linecap="round"/></svg>`,
  sarcophage: (w, h) => `<svg viewBox="0 0 48 96"><path d="M24 4c10 0 16 8 16 18v52c0 12-6 18-16 18S8 86 8 74V22C8 12 14 4 24 4z" fill="#d8b04a"${L}/><path d="M14 12c2-4 6-6 10-6s8 2 10 6v14H14z" fill="#2e5d9f"/><path d="M14 12v14M20 8v18M28 8v18M34 12v14" stroke="#d8b04a" stroke-width="1.5"/><ellipse cx="24" cy="22" rx="7" ry="8" fill="#e8c78a"${l(1.2)}/><path d="M21 21h1.6M26.4 21h1.6" stroke="${T}" stroke-width="1.6" stroke-linecap="round"/><path d="M14 40h20M14 46h20M14 52h20" stroke="#2e5d9f" stroke-width="3"/><path d="M18 34l6 6 6-6" stroke="#2e5d9f" stroke-width="2" fill="none"/></svg>`,
  jarre: () => `<svg viewBox="0 0 48 48"><path d="M17 8h14l-1 4c6 3 9 9 9 16 0 9-6 16-15 16S9 37 9 28c0-7 3-13 9-16z" fill="#c9714a"${L}/><path d="M12 24h24" stroke="#2e5d9f" stroke-width="3"/><path d="M12 30h24" stroke="#d8b04a" stroke-width="2"/><ellipse cx="24" cy="8" rx="8" ry="3" fill="#a85a38"${L}/></svg>`,
  brasero: () => `<svg viewBox="0 0 48 48"><path d="M24 4c-6 8-8 12-4 18 2-4 4-4 4-4 0 4 2 6 4 6 4-6 0-12-4-20z" fill="#f2a43a"${l(1.2)}/><path d="M24 12c-2 4-2 7 0 10 2-3 2-6 0-10z" fill="#ffe06a"/><path d="M10 24h28l-4 8H14z" fill="#b8935a"${L}/><path d="M18 32l-4 12M30 32l4 12M24 32v12" stroke="${T}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  trone: () => `<svg viewBox="0 0 48 48"><path d="M12 30V8c0-3 2-5 5-5h14c3 0 5 2 5 5v22z" fill="#d8b04a"${L}/><path d="M16 8h16v18H16z" fill="#2e5d9f"/><path d="M24 10l4 7-4 7-4-7z" fill="#d8b04a"/><rect x="8" y="28" width="32" height="8" rx="2" fill="#e8c04a"${L}/><path d="M11 36v8M37 36v8" stroke="${T}" stroke-width="3" stroke-linecap="round"/></svg>`,
};

// ---------------- Les deux plans ----------------
const THEMES = [
  { titre: 'Egghead, version à thème', sous: "L'île du futur sur son anneau de nuages : l'œuf du Labophase, Punk Records, l'usine, la ville pastel.",
    n: 7, vide: 'nuage',
    layout: ['.LLLL..', 'LLLLDDD', 'VVLLDDD', 'VVVUDDD', 'SVVUUUU', 'SSQQUUU', '.SQQQ..'],
    rooms: { L: ['Le Labophase', 'acier'], D: ['Punk Records', 'donnees'], V: ['La ville', 'pastel'], U: ["L'usine", 'tole'], S: ['La serre', 'serre'], Q: ['Le port', 'quai'] },
    objets: [['ecran', 1, 1, 2, 1], ['cuve', 0, 3], ['capsule', 0, 1], ['sphere', 1, 5, 2, 2], ['console', 3, 4], ['cuve', 3, 6], ['arbre', 2, 0], ['capsule', 3, 1], ['console', 4, 5], ['cuve', 5, 6], ['arbre', 4, 0], ['arbre', 6, 1], ['capsule', 5, 2]],
    noms: { L: [2, 3], D: [3, 5], V: [4, 1], U: [4, 4], S: [5, 0], Q: [6, 3] },
  },
  { titre: "L'Égypte, pour la mythologie", sous: 'Le meurtre d\'Osiris : le temple, le Nil et sa barque, le palais de lapis et d\'or, le désert du sphinx.',
    n: 6, vide: 'nuit',
    layout: ['.TTT..', 'NTTTPP', 'NNTPPP', 'NNDDPP', '.NDDDD', '..DDDD'],
    rooms: { T: ['Le temple', 'gres'], N: ['Le Nil', 'nil'], P: ['Le palais', 'palais'], D: ['Le désert', 'desert'] },
    objets: [['obelisque', 0, 1], ['jarre', 0, 3], ['brasero', 1, 3], ['palmier', 1, 0], ['barque', 3, 0, 2, 1], ['trone', 1, 5], ['sarcophage', 2, 4, 1, 2], ['jarre', 2, 5], ['sphinx', 5, 3, 2, 1], ['palmier', 4, 5], ['brasero', 4, 2]],
    noms: { T: [2, 2], N: [4, 1], P: [3, 5], D: [5, 2] },
  },
];

const COL = 'ABCDEFGH';
function plan(t) {
  const n = t.n, at = (r, c) => (r < 0 || c < 0 || r >= n || c >= n ? '.' : t.layout[r][c]);
  let h = `<div class="maquette"><div class="gw" style="--n:${n}"><span></span>`;
  for (let c = 0; c < n; c++) h += `<span class="lab">${COL[c]}</span>`;
  for (let r = 0; r < n; r++) {
    h += `<span class="lab">${r + 1}</span>`;
    for (let c = 0; c < n; c++) {
      const k = at(r, c);
      if (k === '.') { h += `<span class="cell vide"></span>`; continue; }
      const m = (dr, dc) => (at(r + dr, c + dc) !== k ? (at(r + dr, c + dc) === '.' ? 4 : 3.5) : 0);
      const [mt, mr, mb, ml] = [m(-1, 0), m(0, 1), m(1, 0), m(0, -1)];
      h += `<span class="cell" style="background-image:${SOLS[t.rooms[k][1]]}"><span class="mur" style="border:0 solid #1d1511;border-width:${mt}px ${mr}px ${mb}px ${ml}px;margin:${mt ? -1 : 0}px ${mr ? -1 : 0}px ${mb ? -1 : 0}px ${ml ? -1 : 0}px"></span></span>`;
    }
  }
  return h + `</div></div>`;
}

const planche = document.getElementById('planche');
planche.innerHTML = `<div class="avant"><h2>Aujourd'hui</h2><p class="s">Egghead avec les sols de toutes les maisons : carrelage, tomettes, parquet, pavés.</p><div style="height:388px;overflow:hidden;border-radius:10px"><img src="../docs/conviction-onepiece-egghead-difficile-plan.png" style="margin-top:-62px"></div></div>`
  + THEMES.map((t, i) => `<div><h2>${t.titre}</h2><p class="s">${t.sous}</p><div id="t${i}">${plan(t)}</div><div class="legende">${Object.values(t.rooms).map(([nom, s]) => `<span><i style="background-image:${SOLS[s]}"></i>${nom}</span>`).join('')}</div></div>`).join('');

// Placer objets, noms de pièces et fond des cases vides après la mise en page (positions mesurées).
THEMES.forEach((t, i) => {
  const gw = document.querySelector(`#t${i} .gw`);
  const cells = [...gw.querySelectorAll('.cell')];
  const box = (r, c) => { const e = cells[r * t.n + c]; return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight }; };
  // Les cases hors plan : un ciel de nuages (Egghead) ou la nuit du désert (Égypte).
  for (let r = 0; r < t.n; r++) for (let c = 0; c < t.n; c++) if (t.layout[r][c] === '.') {
    const b = box(r, c), f = document.createElement('span');
    f.className = 'fond';
    Object.assign(f.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
    f.innerHTML = t.vide === 'nuage'
      ? `<svg viewBox="0 0 40 40" width="100%" height="100%"><rect width="40" height="40" fill="#8fcaf0"/><path d="M4 30c-3 0-4-6 0-7 0-6 8-8 11-4 2-5 11-5 12 1 6-1 9 6 5 10z" fill="#fff" opacity=".95"/><path d="M6 31h28" stroke="#d6ecfa" stroke-width="2"/></svg>`
      : `<svg viewBox="0 0 40 40" width="100%" height="100%"><rect width="40" height="40" fill="#1c2340"/><circle cx="10" cy="12" r=".9" fill="#fff"/><circle cx="28" cy="8" r=".7" fill="#fff"/><circle cx="32" cy="26" r="1" fill="#fff"/><circle cx="16" cy="30" r=".6" fill="#fff"/></svg>`;
    gw.appendChild(f);
  }
  for (const [type, r, c, w = 1, h = 1] of t.objets) {
    const a = box(r, c), z = box(r + h - 1, c + w - 1), o = document.createElement('span');
    o.className = 'obj';
    Object.assign(o.style, { left: a.x + 'px', top: a.y + 'px', width: z.x + z.w - a.x + 'px', height: z.y + z.h - a.y + 'px' });
    o.innerHTML = OBJ[type](w, h);
    gw.appendChild(o);
  }
  // Le nom de chaque pièce, écrit sur le plan, dans une case choisie (sans objet).
  for (const [k, [nom]] of Object.entries(t.rooms)) {
    const b = box(...t.noms[k]), s = document.createElement('span');
