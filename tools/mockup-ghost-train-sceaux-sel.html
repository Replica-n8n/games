<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sceaux de sel</title>
<style>
  :root { --fond: #120818; --carte: #1e1028; --texte: #f4ecff; --doux: #b8a6c8; --jaune: #fff27a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond); color: var(--texte); font: 16px/1.5 system-ui, sans-serif; }
  body { padding-block: 16px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p.chapeau { max-width: 72ch; color: var(--doux); margin: 0 0 16px; }
  .grille { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 16px; }
  .carte { background: var(--carte); border-radius: 8px; padding: 12px; min-width: 0; }
  .carte h2 { font-size: 16px; margin: 0 0 8px; color: var(--jaune); }
  .carte p { margin: 8px 0 0; color: var(--doux); font-size: 15px; }
  canvas { width: 100%; max-width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; display: block; border-radius: 4px; }
</style>
</head>
<body>
<h1>Les sceaux de sel</h1>
<p class="chapeau">Des symboles d'alchimiste, versés en sel autour du fantôme. Le sel a d'ailleurs son propre signe en alchimie : un cercle barré. Les sceaux simples se font d'un trait ; les grands en deux, chaque trait avec son point de départ numéroté, et on peut lever le doigt entre les deux.</p>
<div class="grille" id="grille"></div>
<script type="module">
const BASE = location.pathname.includes('/tools/') ? '../ghost-train/' : './ghost-train/';
const { preparer, S, BLANC } = await import(BASE + 'ecran/dessins.js');
const { CHAMBRE } = await import(BASE + 'ecran/etage3.js');
const { ecrire } = await import(BASE + 'ecran/police.js');

const W = 320, H = 180, NOIR = '#120818';
preparer();
const zero = new Proxy({}, { get: () => 0 });
const salle = { alerte: zero, ouvert: zero, objets: new Proxy({}, { get: () => ({ fait: true, fini: true }) }) };
const chambre = CHAMBRE.peindre();
const R = (c, col, x, y, w, h) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
const h32 = (n) => { n = Math.imul(n ^ 61 ^ (n >>> 16), 9); n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; };
function points(pts) {
  const out = [];
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i], n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay)));
    for (let k = 0; k < n; k++) out.push([Math.round(ax + (bx - ax) * k / n), Math.round(ay + (by - ay) * k / n)]);
  }
  out.push(pts[pts.length - 1].map(Math.round));
  return out;
}
function pix(c, pts, col, ep, filtre) { c.fillStyle = col; const o = Math.floor(ep / 2); points(pts).forEach(([x, y], i) => { if (!filtre || filtre(i, x, y)) c.fillRect(x - o, y - o, ep, ep); }); }
const longueur = (pts) => pts.slice(1).reduce((a, q, i) => a + Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]), 0);
function partie(pts, k) {
  let reste = k * longueur(pts); const out = [pts[0]];
  for (let i = 1; i < pts.length && reste > 0; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i], l = Math.hypot(bx - ax, by - ay), f = Math.min(1, reste / l);
    out.push([ax + (bx - ax) * f, ay + (by - ay) * f]); reste -= l;
  }
  return out;
}

// --- les formes, en unités de -1 à 1 : une liste de traits ----------------------------------
const cercle = (r = 1, n = 40, a0 = -Math.PI / 2) => Array.from({ length: n + 1 }, (_, k) => { const a = a0 + k / n * Math.PI * 2; return [Math.cos(a) * r, Math.sin(a) * r]; });
const etoile = Array.from({ length: 6 }, (_, k) => { const a = -Math.PI / 2 + k * (Math.PI * 4 / 5); return [Math.cos(a) * 0.95, Math.sin(a) * 0.95]; });
const haut = [[0, -0.9], [0.85, 0.6], [-0.85, 0.6], [0, -0.9]], bas = [[0, 0.9], [-0.85, -0.6], [0.85, -0.6], [0, 0.9]];
const FORMES = [
  { nom: 'FEU', salle: 'CHAMBRE', traits: [haut] },
  { nom: 'EAU', salle: 'CHAMBRE', traits: [bas] },
  { nom: 'ÉTOILE', salle: 'LINGERIE', traits: [etoile] },
  { nom: 'SEL', salle: 'LINGERIE', traits: [cercle(0.85), [[-0.85, 0], [0.85, 0]]] },
  { nom: 'AIR', salle: 'COMBLES', traits: [haut, [[-0.62, 0.05], [0.62, 0.05]]] },
  { nom: 'PENTACLE', salle: 'COMBLES', traits: [etoile, cercle(1.05, 44)] },
];

function sel(c, pts, eclat, graine = 0) {
  const pp = points(pts);
  const grain = (i, g) => [Math.round((h32(i * 3 + g + graine) - 0.5) * 4), Math.round((h32(i * 5 + g + graine) - 0.5) * 4), h32(i * 11 + g + graine) < 0.8];
  pp.forEach(([x, y], i) => { for (let g = 0; g < 3; g++) { const [dx, dy, ok] = grain(i, g); if (ok) R(c, NOIR, x + dx - 1, y + dy - 1, 4, 4); } });
  pp.forEach(([x, y], i) => { for (let g = 0; g < 3; g++) { const [dx, dy, ok] = grain(i, g); if (ok) R(c, eclat ? '#e0faff' : h32(i + g * 7 + graine) < 0.3 ? '#c8c0d0' : '#ffffff', x + dx, y + dy, 2, 2); } });
}
function guide(c, pts) { pix(c, pts, '#6a5a8a', 1, (i) => i % 5 === 0); }
function depart(c, t, x, y, n) {
  const r = 6 + (((t * 4) | 0) & 1);
  for (const [cc, e] of [[NOIR, 3], ['#fff27a', 1]]) for (let a = 0; a < 18; a++) R(c, cc, Math.round(x + Math.cos(a / 18 * Math.PI * 2) * r) - (e >> 1), Math.round(y + Math.sin(a / 18 * Math.PI * 2) * r) - (e >> 1), e, e);
  ecrire(c, String(n), x - 2, y - 3, { coul: '#fff27a', contour: NOIR });
}
const place = (trait, cx, cy, r) => trait.map(([x, y]) => [cx + x * r, cy + y * r]);
function fantome(c, cx, cy, blanc = false, taille = 1, dx = 0) {
  if (taille <= 0.02) return;
  const w = 36 * taille, h = 38 * taille;
  c.drawImage(blanc ? BLANC.drap : S.drap, Math.round(cx - w / 2 + dx), Math.round(cy - h / 2 + 3), Math.round(w), Math.round(h));
}

// --- la scène jouée : le pentacle, en deux traits ----------------------------------------
const CX = 160, CY = 86, RS = 38;
const P1 = place(FORMES[5].traits[0], CX, CY, RS), P2 = place(FORMES[5].traits[1], CX, CY, RS);
function scene(c, t) {
  c.drawImage(chambre, 0, 0); CHAMBRE.animer(c, salle, t);
  c.globalAlpha = 0.5; R(c, NOIR, 0, 0, W, H); c.globalAlpha = 1;
  const u = t % 6.4;
  // 0-0.7 guide ; 0.7-2.3 l'étoile ; 2.3-2.8 le doigt se lève ; 2.8-4.3 le cercle ; puis le sceau prend
  const k1 = Math.max(0, Math.min(1, (u - 0.7) / 1.6)), k2 = Math.max(0, Math.min(1, (u - 2.8) / 1.5)), fini = u > 4.3, f = u - 4.3;
  const choc = fini && f < 1.1 ? Math.sin(f * 32) * 3 * (1 - f / 1.1) : 0;
  fantome(c, CX, CY, fini && f > 0.8, fini ? Math.max(0, 1 - Math.max(0, f - 1.1) * 2) : 1, choc);
  if (fini && f > 1.8) return;
  if (!fini) {
    guide(c, P1); guide(c, P2);
    if (k1 > 0) sel(c, partie(P1, k1), false, 0);
    if (k2 > 0) sel(c, partie(P2, k2), false, 50);
    if (k1 === 0) depart(c, t, P1[0][0], P1[0][1], 1);
    if (k1 >= 1 && k2 === 0) depart(c, t, P2[0][0], P2[0][1] - 1, 2);
    // le doigt qui verse : quelques grains tombent sous lui
    const tr = k1 > 0 && k1 < 1 ? partie(P1, k1) : k2 > 0 && k2 < 1 ? partie(P2, k2) : null;
    if (tr) { const b = tr[tr.length - 1]; for (let k = 0; k < 5; k++) R(c, '#f4f0ff', b[0] + (h32(k + ((t * 20) | 0)) - 0.5) * 4, b[1] - 12 + ((t * 40 + k * 4) % 12), 1, 1); }
    // les traits du sceau : où l'on en est
    for (let i = 0; i < 2; i++) { const x = CX - 5 + i * 10, y = CY - RS - 14, fait = i === 0 ? k1 >= 1 : k2 >= 1; R(c, NOIR, x - 3, y, 6, 6); R(c, fait ? '#6ee03a' : (i === 0 ? k1 < 1 : k1 >= 1) ? '#fff27a' : '#5a4a6a', x - 2, y + 1, 4, 4); }
    return;
  }
  c.globalAlpha = f > 1.3 ? Math.max(0, 1 - (f - 1.3) * 2) : 1;
  const a = c.globalAlpha; c.globalAlpha = a * 0.3; pix(c, P1, '#8ae8ff', 7); pix(c, P2, '#8ae8ff', 7); c.globalAlpha = a;
  sel(c, P1, true, 0); sel(c, P2, true, 50);
  c.globalAlpha = 1;
}

// --- la planche des formes ------------------------------------------------------------------
function planche(c, t) {
  R(c, '#1a1024', 0, 0, W, H);
  FORMES.forEach((f, i) => {
    const col = i % 3, lig = (i / 3) | 0, cx = 55 + col * 105, cy = 34 + lig * 84;
    for (const [k, tr] of f.traits.entries()) sel(c, place(tr, cx, cy, 22), false, k * 50 + i * 7);
    ecrire(c, f.nom, cx, cy + 29, { centre: true, coul: '#f4f0ff', contour: NOIR });
    ecrire(c, f.traits.length > 1 ? '2 TRAITS' : '1 TRAIT', cx, cy + 38, { centre: true, coul: '#8a7a9a' });
  });
}

const CARTES = [
  { titre: 'Le pentacle, dans le vrai jeu', texte: 'Le grand sceau des combles. Le point 1 brille : on verse l\'étoile d\'un trait. Le doigt se lève, le point 2 s\'allume : on verse le cercle autour. Les deux carrés au-dessus disent où on en est. Fermé, le sel s\'illumine, le fantôme se cogne contre lui, puis il est pris.', dessin: scene },
  { titre: 'Les six sceaux, salle par salle', texte: 'Chambre : les triangles du feu et de l\'eau (un trait). Lingerie : l\'étoile (un trait) et le signe du sel, un cercle barré (deux traits). Combles : l\'air, un triangle barré, et le pentacle (deux traits). La Gouvernante demande les grands, trois d\'affilée.', dessin: planche },
];
const grille = document.getElementById('grille'), toiles = [];
for (const v of CARTES) {
  const carte = document.createElement('div'); carte.className = 'carte';
  const h2 = document.createElement('h2'); h2.textContent = v.titre;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const p = document.createElement('p'); p.textContent = v.texte;
  carte.append(h2, cv, p); grille.append(carte);
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  toiles.push({ v, ctx });
}
const params = new URLSearchParams(location.search), tFixe = params.has('t') ? Number(params.get('t')) : null;
function dessiner(ms) {
  const t = tFixe ?? ms / 1000;
  for (const { v, ctx } of toiles) v.dessin(ctx, t);
  if (tFixe === null) requestAnimationFrame(dessiner); else document.body.dataset.pret = '1';
}
requestAnimationFrame(dessiner);
</script>
</body>
</html>
