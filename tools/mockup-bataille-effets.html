<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bataille effets</title>
<style>
/* MAQUETTE : des effets qui se SENTENT (Julie, 2026-10-28 : « le gros rond au-dessus
   de la tête, ce n'est pas un effet ; pour le phénix je veux une colonne de feu, sentir
   le phénix renaître »). Seize effets, les neuf gravures et les sept arcanes, joués
   sur un tapis dessiné comme celui du jeu. Chaque effet est une fonction du temps :
   la même image à t donné, pour la planche et pour la vidéo. Rien n'est dans le jeu. */
@font-face{font-family:'Fraunces';font-weight:600;src:url(../bataille/polices/fraunces-600-latin.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:500 700;src:url(../bataille/polices/outfit-latin.woff2) format('woff2')}
:root{color-scheme:dark}
body{margin:0;background:#000644;color:#f4f2ff;font:500 15px Outfit,sans-serif}
#c{display:block;width:360px;height:560px}
#nom{position:absolute;left:0;top:10px;width:360px;text-align:center;font:600 20px Fraunces,serif;color:#feca63;pointer-events:none}
#barre{display:flex;flex-wrap:wrap;gap:6px;padding:10px;width:360px;box-sizing:border-box}
#barre button{font:600 14px Outfit;min-height:44px;padding:0 10px;border-radius:22px;border:1.5px solid rgba(254,202,99,.5);background:rgba(255,255,255,.08);color:#f4f2ff}
.cadre{position:relative;width:360px}
</style>
</head>
<body>
<div class="cadre"><canvas id="c" width="360" height="560"></canvas><div id="nom"></div></div>
<div id="barre"></div>
<script>
(function(){
'use strict';
var cv=document.getElementById('c'),DPR=2,ctx=cv.getContext('2d');cv.width=360*DPR;cv.height=560*DPR;
var W=360,H=560,OR='#feca63',LUI='#cdacff',X=[70,180,290],YL=230,YM=430;
/* ---------- outils ---------- */
function alea(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function cl(v,a,b){return Math.max(a,Math.min(b,v));}
function k(t,a,b){return cl((t-a)/(b-a),0,1);}               // 0 avant a, 1 après b
function doux(x){return x*x*(3-2*x);}
function sortie(x){return 1-Math.pow(1-x,3);}
function cloche(t,a,m,b){return t<a||t>b?0:t<m?doux((t-a)/(m-a)):1-doux((t-m)/(b-m));}
/* des particules, calculées au temps t (rien n'est gardé d'une image à l'autre) */
function gerbe(seed,n,f){var r=alea(seed),l=[];for(var i=0;i<n;i++)l.push(f(r,i));return l;}
function parts(l,t,dessin){l.forEach(function(p){var u=t-p.t0;if(u<0||u>p.vie)return;var x=p.x+p.vx*u+(p.ox||0)*Math.sin(u*(p.of||6)+(p.ph||0)),y=p.y+p.vy*u+0.5*(p.g||0)*u*u;dessin(p,x,y,u/p.vie,u);});}
function eclair(x0,y0,x1,y1,seed,n,amp){var r=alea(seed),pts=[[x0,y0]];for(var i=1;i<n;i++){var a=i/n;pts.push([x0+(x1-x0)*a+(r()-0.5)*amp,y0+(y1-y0)*a+(r()-0.5)*amp*0.3]);}pts.push([x1,y1]);return pts;}
function trace(pts){ctx.beginPath();pts.forEach(function(p,i){i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]);});}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function lumiere(x,y,r,coul,a){var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,coul.replace('A',a));g.addColorStop(1,coul.replace('A',0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
function titre(txt,x,y,t,a,b,coul){var e=cloche(t,a,a+0.15,b);if(!e)return;var s=1+0.5*(1-sortie(k(t,a,a+0.2)));ctx.save();ctx.globalAlpha=e;ctx.translate(x,y-12*k(t,a,b));ctx.scale(s,s);
  ctx.font='600 30px Fraunces, serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=7;ctx.strokeStyle='#120c08';ctx.strokeText(txt,0,0);ctx.fillStyle=coul;ctx.fillText(txt,0,0);ctx.restore();}
function chiffre(txt,x,y,t,a,coul){var u=t-a;if(u<0||u>0.9)return;ctx.save();ctx.globalAlpha=1-k(u,0.5,0.9);var s=1+0.6*(1-sortie(k(u,0,0.15)));ctx.translate(x,y-30*u);ctx.scale(s,s);
  ctx.font='700 22px Outfit, sans-serif';ctx.textAlign='center';ctx.lineJoin='round';ctx.lineWidth=5;ctx.strokeStyle='#120c08';ctx.strokeText(txt,0,0);ctx.fillStyle=coul;ctx.fillText(txt,0,0);ctx.restore();}
/* ---------- une carte, comme dans le jeu ---------- */
function carte(c,o){o=o||{};if(o.cache)return;var sc=(o.sc||1)*1.15,w=40*sc,h=56*sc,lui=c.side<0,rouge=c.s==='♥'||c.s==='♦';
  ctx.save();ctx.globalAlpha=o.alpha===undefined?1:o.alpha;ctx.translate(c.x+(o.dx||0),c.y+(o.dy||0));
  if(!o.couche){ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,0,w*0.55,5,0,0,6.283);ctx.fill();
    ctx.strokeStyle='#120c08';ctx.lineWidth=2.6;ctx.lineCap='round';[-w*0.2,w*0.2].forEach(function(lx){ctx.beginPath();ctx.moveTo(lx,-11);ctx.lineTo(lx,-1);ctx.stroke();});}
  ctx.translate(0,-11);ctx.rotate(o.rot||0);
  rr(-w/2,-h,w,h,5);ctx.fillStyle=lui?'#3b2a57':'#f6efe0';ctx.fill();ctx.lineWidth=2.2;ctx.strokeStyle='#120c08';ctx.stroke();
  var ink=lui?(rouge?'#ff8098':'#e4d8ff'):(rouge?'#b8242c':'#1a1410');
  ctx.fillStyle=ink;ctx.textAlign='left';ctx.textBaseline='top';ctx.font='600 '+Math.round(14*sc)+'px Fraunces, serif';ctx.fillText(c.r,-w/2+4,-h+3);
  ctx.font=Math.round(11*sc)+'px Georgia, serif';ctx.fillText(c.s,-w/2+4,-h+17*sc);ctx.font=Math.round(20*sc)+'px Georgia, serif';ctx.textAlign='center';ctx.fillText(c.s,0,-h*0.32);
  /* les yeux */
  [-7,7].forEach(function(ex){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex*sc,-h*0.66,4.6*sc,0,6.283);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle='#120c08';ctx.stroke();
    if(o.yeuxClos){ctx.beginPath();ctx.moveTo(ex*sc-4*sc,-h*0.66);ctx.lineTo(ex*sc+4*sc,-h*0.66);ctx.lineWidth=2;ctx.stroke();}else{ctx.fillStyle='#120c08';ctx.beginPath();ctx.arc(ex*sc+(lui?0:0),-h*0.66+(lui?1.5:-1.5)*sc,2.1*sc,0,6.283);ctx.fill();}});
  if(o.teinte){rr(-w/2,-h,w,h,5);ctx.fillStyle=o.teinte;ctx.fill();}
  ctx.restore();
  if(o.vie!==undefined&&!o.couche){var bw=w*1.05,by=lui?c.y-11-h-12:c.y+7;ctx.fillStyle='#120c08';rr(c.x-bw/2-2+(o.dx||0),by-2+(o.dy||0),bw+4,9,3);ctx.fill();ctx.fillStyle=lui?'#a57ce5':OR;ctx.fillRect(c.x-bw/2+(o.dx||0),by+(o.dy||0),bw*cl(o.vie,0,1),5);}}
function haut(c,o){return c.y+((o&&o.dy)||0)-11-56*1.15*((o&&o.sc)||1);}
function milieu(c,o){return c.y+((o&&o.dy)||0)-11-28*1.15*((o&&o.sc)||1);}
/* un coup d'épée : la carte plonge vers sa cible, un arc blanc */
function frappe(a,b,t,t0,coul){var u=k(t,t0-0.15,t0)*(1-k(t,t0,t0+0.25));var dy=(b.y-a.y)*0.18*u,dx=(b.x-a.x)*0.18*u;
  if(t>t0&&t<t0+0.18){ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle=coul||'rgba(255,246,216,.9)';ctx.lineWidth=5;ctx.lineCap='round';var m=milieu(b);ctx.beginPath();ctx.arc(b.x,m,30,-2.6+k(t,t0,t0+0.18)*1.5,-0.6+k(t,t0,t0+0.18)*1.5);ctx.stroke();ctx.restore();}
  return{dx:dx,dy:dy};}
/* ---------- le tapis ---------- */
var fond=document.createElement('canvas');fond.width=W*DPR;fond.height=H*DPR;(function(){var c=fond.getContext('2d');c.scale(DPR,DPR);var g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#000644');g.addColorStop(1,'#202a6b');c.fillStyle=g;c.fillRect(0,0,W,H);
  var r=alea(4);for(var i=0;i<260;i++){c.fillStyle='rgba(244,242,255,'+(0.2+r()*0.5)+')';c.fillRect(r()*W,r()*H,1,1);}
  c.fillStyle='rgba(255,255,255,.07)';c.beginPath();c.roundRect(8,50,344,500,26);c.fill();c.strokeStyle='rgba(255,255,255,.12)';c.stroke();})();
var C=function(r,s,side,lane){return{r:r,s:s,side:side,x:X[lane],y:side>0?YM:YL};};

/* ---------- les seize effets ---------- */
var FX={};
/* PHÉNIX : la carte tombe, une colonne de feu jaillit du sol, elle renaît dans les flammes, ailes de feu ouvertes */
FX.phenix={nom:'Phénix',d:3.2,f:function(t){var moi=C('D','♥',1,1),lui=C('R','♠',-1,1);
  var fr=frappe(lui,moi,t,0.35),chute=k(t,0.4,0.75)*(1-k(t,1.15,1.6)),feu=cloche(t,0.95,1.25,2.6);
  carte(lui,Object.assign({vie:0.8},fr));
  /* la colonne de feu */
  if(feu){var sol=moi.y+4,larg=104*feu;ctx.save();ctx.globalCompositeOperation='lighter';
    for(var i=0;i<4;i++){var f=1-i*0.22,wob=Math.sin(t*30+i)*4,g=ctx.createLinearGradient(0,sol,0,0);g.addColorStop(0,'rgba(255,240,180,'+(0.9*feu*f)+')');g.addColorStop(0.35,'rgba(255,150,40,'+(0.7*feu*f)+')');g.addColorStop(1,'rgba(200,40,20,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(moi.x-larg*f/2+wob,sol);ctx.quadraticCurveTo(moi.x-larg*f*0.5,sol*0.3,moi.x-larg*f*0.18+wob*2,0);ctx.lineTo(moi.x+larg*f*0.18+wob*2,0);ctx.quadraticCurveTo(moi.x+larg*f*0.5,sol*0.3,moi.x+larg*f/2-wob,sol);ctx.fill();}
    lumiere(moi.x,sol,140*feu,'rgba(255,120,30,A)',0.5*feu);ctx.restore();}
  /* les ailes de feu derrière la carte qui renaît */
  var ail=cloche(t,1.3,1.7,3.0);if(ail){ctx.save();ctx.globalCompositeOperation='lighter';[-1,1].forEach(function(s){for(var p=0;p<6;p++){var a=(-0.35-p*0.22)*ail,L=(60+p*9)*ail;ctx.save();ctx.translate(moi.x+s*8,milieu(moi)-6);ctx.scale(s,1);ctx.rotate(a);
      var g=ctx.createLinearGradient(0,0,L,0);g.addColorStop(0,'rgba(255,230,140,'+0.8*ail+')');g.addColorStop(1,'rgba(255,90,30,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(L*0.5,-14,L,-4);ctx.quadraticCurveTo(L*0.5,6,0,6);ctx.fill();ctx.restore();}});ctx.restore();}
  var renait=k(t,1.15,1.6);
  carte(moi,{rot:chute*1.5,dy:chute*14-renait*(1-k(t,1.6,2.4))*18,sc:1+0.25*cloche(t,1.15,1.6,2.4),teinte:chute>0.1&&renait<0.5?'rgba(60,60,80,'+0.55*chute+')':renait?'rgba(255,170,60,'+0.5*(1-k(t,1.6,2.6))+')':null,vie:renait?0.5*k(t,1.2,1.8):0.6*(1-k(t,0.35,0.5))});
  /* braises et onde au sol */
  ctx.save();ctx.globalCompositeOperation='lighter';
  parts(gerbe(7,70,function(r){return{x:moi.x+(r()-0.5)*50,y:moi.y,vx:(r()-0.5)*40,vy:-120-r()*300,ox:14,of:5+r()*4,ph:r()*6,t0:0.95+r()*1.3,vie:0.8+r()*0.7,s:1.5+r()*2.5};}),t,function(p,x,y,a){ctx.fillStyle='rgba(255,'+Math.round(200-120*a)+',60,'+(1-a)+')';ctx.beginPath();ctx.arc(x,y,p.s*(1-a*0.5),0,6.283);ctx.fill();});
  var o=k(t,1.15,1.6);if(o>0&&o<1){ctx.strokeStyle='rgba(255,190,90,'+(1-o)+')';ctx.lineWidth=6*(1-o);ctx.beginPath();ctx.ellipse(moi.x,moi.y,30+120*o,10+30*o,0,0,6.283);ctx.stroke();}
  ctx.restore();
  titre('Phénix',moi.x,haut(moi)-40,t,1.3,2.9,'#ffb347');
  return{secousse:cloche(t,1.15,1.2,1.5)*7,eclat:['rgba(255,140,40,A)',0.35*cloche(t,1.15,1.2,1.7)]};}};

/* GIVRE : un coup d'éclats de glace, la cible se prend dans un bloc de givre, bouge au ralenti, puis le bloc éclate */
FX.givre={nom:'Givre',d:2.8,f:function(t){var moi=C('10','♣',1,1),lui=C('V','♦',-1,1);var fr=frappe(moi,lui,t,0.35,'rgba(170,225,255,.95)');
  var gel=k(t,0.4,0.75)*(1-k(t,2.25,2.3)),lent=gel?0.25:1;
  /* le Maudit essaie de frapper, au ralenti */
  var essai=gel?Math.sin((t-0.4)*3*lent*6)*4:0;
  carte(moi,Object.assign({vie:0.7},fr));
  carte(lui,{dy:essai,teinte:gel?'rgba(150,215,255,'+0.45*gel+')':null,vie:0.55});
  if(gel){var c=lui,hy=haut(c),w=62,h=88;ctx.save();ctx.globalAlpha=gel;
    /* le bloc */
    rr(c.x-w/2,hy-10,w,h,8);ctx.fillStyle='rgba(190,235,255,.28)';ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='rgba(230,248,255,.95)';ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(c.x-w/2+8,hy-2);ctx.lineTo(c.x-w/2+22,hy-2+14);ctx.moveTo(c.x+w/2-10,hy+30);ctx.lineTo(c.x+w/2-20,hy+50);ctx.stroke();
    /* cristaux qui poussent des coins */
    var r=alea(3);for(var i=0;i<10;i++){var cx=c.x+(r()<0.5?-1:1)*w/2,cy=hy-10+r()*h,L=(10+r()*16)*k(t,0.4+i*0.02,0.8);ctx.strokeStyle='rgba(235,250,255,.95)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(cx,cy);var an=r()*6.283;ctx.lineTo(cx+Math.cos(an)*L,cy+Math.sin(an)*L);ctx.stroke();}
    /* le compte du ralenti : une horloge de glace */
    ctx.restore();
    ctx.save();ctx.globalAlpha=gel;ctx.translate(c.x+w/2+6,hy+4);ctx.fillStyle='rgba(10,16,74,.9)';ctx.beginPath();ctx.arc(0,0,12,0,6.283);ctx.fill();ctx.strokeStyle='#bfe6ff';ctx.lineWidth=2;ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-8);ctx.moveTo(0,0);var ang=-1.57+(t-0.4)*0.8;ctx.lineTo(Math.cos(ang)*6,Math.sin(ang)*6);ctx.stroke();ctx.restore();}
  ctx.save();ctx.globalCompositeOperation='lighter';
  /* éclats au coup, puis le bloc qui éclate */
  [[11,0.35,18],[12,2.25,30]].forEach(function(z){parts(gerbe(z[0],z[2],function(r){var a=r()*6.283,v=80+r()*200;return{x:lui.x,y:milieu(lui),vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,g:420,t0:z[1],vie:0.6+r()*0.3,s:3+r()*5,an:r()*6};}),t,function(p,x,y,a){ctx.save();ctx.translate(x,y);ctx.rotate(p.an+a*6);ctx.fillStyle='rgba(220,245,255,'+(1-a)+')';ctx.beginPath();ctx.moveTo(0,-p.s);ctx.lineTo(p.s*0.5,p.s);ctx.lineTo(-p.s*0.5,p.s);ctx.fill();ctx.restore();});});
  /* flocons */
  parts(gerbe(13,30,function(r){return{x:lui.x+(r()-0.5)*120,y:haut(lui)-60-r()*40,vx:0,vy:20+r()*20,ox:10,of:2,ph:r()*6,t0:0.4+r()*1.4,vie:1.2,s:1.5+r()*1.5};}),t,function(p,x,y,a){ctx.fillStyle='rgba(235,250,255,'+(1-a)+')';ctx.beginPath();ctx.arc(x,y,p.s,0,6.283);ctx.fill();});
  ctx.restore();
  titre('Givre',lui.x,haut(lui)-46,t,0.45,1.8,'#bfe6ff');
  chiffre('Ralenti',lui.x+70,milieu(lui),t,0.9,'#bfe6ff');
  return{eclat:['rgba(150,215,255,A)',0.3*cloche(t,0.35,0.4,0.8)]};}};

/* ÉPINE (refaite : Julie préfère des ronces AUTOUR de la carte) : au coup, deux ronces
   s'enroulent autour d'elle comme une armure, les épines se dressent d'un coup et
   l'attaquant se pique ; puis les ronces se fanent. */
FX.epine={nom:'Épine',d:2.4,f:function(t){var moi=C('A','♥',1,1),lui=C('R','♣',-1,1);var fr=frappe(lui,moi,t,0.35);var recul=cloche(t,0.52,0.6,1.1);
  carte(lui,{dx:fr.dx,dy:fr.dy-recul*18,teinte:recul?'rgba(255,60,60,'+0.45*recul+')':null,vie:0.8-0.12*k(t,0.55,0.6)});
  var pousse=sortie(k(t,0.36,0.62)),pique=sortie(k(t,0.5,0.6)),fane=k(t,1.5,2.2),cx=moi.x,cy=milieu(moi),rx=34,ry=44;
  /* derrière la carte : la moitié arrière des ronces */
  function ronces(devant){if(!pousse||fane>=1)return;ctx.save();ctx.globalAlpha=1-fane;
    for(var i=0;i<2;i++){var ph=i*3.1416,pts=[],n=60,tours=1.15;
      for(var j=0;j<=n*pousse;j++){var u=j/n,an=ph+u*tours*6.283,yy=cy+ry*(1-2*u)*0.95,xx=cx+Math.cos(an)*rx*(1+0.1*Math.sin(an*3));pts.push([xx,yy,Math.sin(an)>0]);}
      /* on ne garde que les morceaux du bon côté : devant (sin>0) ou derrière */
      for(var j2=1;j2<pts.length;j2++){if(pts[j2][2]!==devant)continue;var p0=pts[j2-1],p1=pts[j2];
        ctx.strokeStyle=fane?'rgb('+Math.round(29+60*fane)+','+Math.round(59-10*fane)+',26)':'#1d3b1a';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.stroke();
        ctx.strokeStyle=fane?'rgb('+Math.round(61+80*fane)+','+Math.round(122-40*fane)+',44)':'#3d7a2c';ctx.lineWidth=3.5;ctx.stroke();
        /* les épines, tournées vers l'extérieur, qui se dressent d'un coup */
        if(j2%5===0){var nx=p1[0]-cx,ny=(p1[1]-cy)*0.6,L=Math.hypot(nx,ny)||1;nx/=L;ny/=L;var len=(5+11*pique)*(1-fane*0.5);
          ctx.fillStyle='#c0303a';ctx.strokeStyle='#120c08';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p1[0]-ny*4,p1[1]+nx*4);ctx.lineTo(p1[0]+nx*len,p1[1]+ny*len);ctx.lineTo(p1[0]+ny*4,p1[1]-nx*4);ctx.closePath();ctx.fill();ctx.stroke();}
        /* une feuille de temps en temps */
        if(j2%13===6&&devant){ctx.save();ctx.translate(p1[0],p1[1]);ctx.rotate(j2);ctx.fillStyle='#4f9a3a';ctx.beginPath();ctx.ellipse(6,0,7,3.2,0,0,6.283);ctx.fill();ctx.restore();}}}
    ctx.restore();}
  ronces(false);
  carte(moi,{vie:0.75,dy:-4*cloche(t,0.36,0.45,0.7)});
  ronces(true);
  /* l'attaquant se pique : éclats rouges et petites épines plantées */
  ctx.save();ctx.globalCompositeOperation='lighter';parts(gerbe(22,26,function(r){var an=-1.57+(r()-0.5)*2.4,v=90+r()*160;return{x:lui.x,y:milieu(lui)+10,vx:Math.cos(an)*v,vy:Math.sin(an)*v,g:500,t0:0.56,vie:0.6,s:2+r()*3};}),t,function(p,x,y,a){ctx.fillStyle='rgba(255,70,80,'+(1-a)+')';ctx.beginPath();ctx.arc(x,y,p.s,0,6.283);ctx.fill();});ctx.restore();

    ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(180,140,255,'+0.6*(1-f)+')';ctx.lineWidth=14;ctx.beginPath();ctx.arc(W/2,milieu(c)+20,120,-2.6,-2.6+2.2*f);ctx.stroke();ctx.restore();}

  parts(gerbe(81,50,function(r){return{x:c.x+(r()-0.5)*44,y:milieu(c)+(r()-0.5)*60,vx:(r()-0.5)*30,vy:-30-r()*50,ox:10,of:3,ph:r()*6,t0:1.2+r()*0.6,vie:1,s:1.5+r()*2};}),t,function(p,x,y,a){ctx.fillStyle='rgba(200,180,230,'+(1-a)+')';ctx.fillRect(x,y,p.s,p.s);});

FX.force={nom:'La Force',d:2.2,f:function(t){var moi=[C('10','♣',1,0),C('V','♥',1,1),C('7','♠',1,2)],lui=[C('9','♠',-1,0),C('R','♦',-1,1),C('8','♣',-1,2)];

  var o=k(t,0.1,0.6);if(o>0&&o<1){ctx.save();ctx.globalCompositeOperation='lighter';var y=H-o*(H-YM+60);var g=ctx.createLinearGradient(0,y-30,0,y+30);g.addColorStop(0,'rgba(255,200,80,0)');g.addColorStop(0.5,'rgba(255,200,80,'+0.6*(1-o*0.5)+')');g.addColorStop(1,'rgba(255,200,80,0)');ctx.fillStyle=g;ctx.fillRect(0,y-30,W,60);ctx.restore();}
  moi.forEach(function(c,i){if(a){ctx.save();ctx.globalCompositeOperation='lighter';for(var p=0;p<12;p++){var an=p/12*6.283+t*2+i,L=(16+8*Math.sin(t*16+p))*a,cx=c.x,cy=milieu(c);ctx.fillStyle='rgba(255,190,70,'+0.5*a+')';ctx.beginPath();ctx.moveTo(cx+Math.cos(an-0.25)*22,cy+Math.sin(an-0.25)*28);ctx.lineTo(cx+Math.cos(an)*(22+L),cy+Math.sin(an)*(28+L));ctx.lineTo(cx+Math.cos(an+0.25)*22,cy+Math.sin(an+0.25)*28);ctx.fill();}ctx.restore();}

FX.roue={nom:'La Roue',d:2.6,f:function(t){var moi=C('V','♥',1,0),lui=C('R','♠',-1,2),autres=[C('9','♣',1,2),C('8','♦',-1,0)];

  ctx.save();ctx.globalCompositeOperation='lighter';[[moi,lui,'rgba(255,90,110,A)'],[lui,moi,'rgba(120,255,160,A)']].forEach(function(z,i){var u=doux(k(t,0.9,1.6));if(u<=0||u>=1)return;var cx=W/2,cy=(YL+YM)/2-30,a0=Math.atan2(milieu(z[0])-cy,z[0].x-cx),a1=Math.atan2(milieu(z[1])-cy,z[1].x-cx),R=Math.hypot(z[0].x-cx,milieu(z[0])-cy),a=a0+(a1-a0+(i?-6.283:6.283)*0)*u;

FX.temperance={nom:'Tempérance',d:2.4,f:function(t){var moi=[C('10','♣',1,0),C('V','♥',1,1),C('7','♠',1,2)],lui=C('R','♦',-1,1);carte(lui,{vie:0.8});
  var pluie=cloche(t,0.3,0.6,1.8);

  ctx.save();ctx.globalAlpha=cloche(t,0,0.3,2.0);ctx.fillStyle='#2b3690';ctx.strokeStyle='#8fd3ff';ctx.lineWidth=2;[[90,70],[270,90]].forEach(function(p){ctx.beginPath();ctx.moveTo(p[0]-16,p[1]);ctx.lineTo(p[0]+16,p[1]);ctx.lineTo(p[0]+10,p[1]+22);ctx.lineTo(p[0]-10,p[1]+22);ctx.closePath();ctx.fill();ctx.stroke();});
  ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(143,211,255,.9)';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(100,70);ctx.quadraticCurveTo(180,10+Math.sin(t*6)*6,262,90);ctx.stroke();ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';parts(gerbe(91,60,function(r){var c=moi[Math.floor(r()*3)];return{x:c.x+(r()-0.5)*60,y:120,vx:0,vy:420+r()*80,t0:0.3+r()*1.2,vie:(c.y-140)/460};}),t,function(p,x,y,a){ctx.strokeStyle='rgba(160,220,255,'+0.8*pluie+')';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-12);ctx.stroke();});ctx.restore();
  moi.forEach(function(c,i){var e=k(t,0.6,1.6);carte(c,{vie:0.3+0.4*e,teinte:'rgba(140,210,255,'+0.25*pluie+')'});var o=((t*1.5+i*0.3)%1);if(pluie){ctx.strokeStyle='rgba(160,220,255,'+(1-o)*pluie+')';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(c.x,c.y,10+30*o,3+8*o,0,0,6.283);ctx.stroke();}chiffre('+15',c.x+30,milieu(c),t,0.8+i*0.1,'#a8f0b0');});
  titre('Tempérance',W/2,H-60,t,0.3,2.2,'#8fd3ff');return{};}};

FX.etoile={nom:'L’Étoile',d:2.6,f:function(t){var c=C('R','♥',1,1),lui=C('9','♠',-1,1);carte(lui,{vie:0.8});

  ctx.save();ctx.globalCompositeOperation='lighter';var u=k(t,0.2,0.75);if(u>0&&u<1){var x=W+20-(W+20-c.x)*doux(u),y=-20+(milieu(c)+20)*doux(u);for(var i=0;i<12;i++){var v=Math.max(0,u-i*0.025),xx=W+20-(W+20-c.x)*doux(v),yy=-20+(milieu(c)+20)*doux(v);lumiere(xx,yy,18-i,'rgba(220,235,255,A)',0.6*(1-i/12));}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,5,0,6.283);ctx.fill();}
  var e=k(t,0.75,1.4);if(e>0&&e<1){ctx.save();ctx.translate(c.x,milieu(c));ctx.rotate(e);ctx.fillStyle='rgba(240,245,255,'+(1-e)+')';ctx.beginPath();for(var s=0;s<16;s++){var R=s%2?14+20*e:40+90*e,a=s*0.3927;ctx.lineTo(Math.cos(a)*R,Math.sin(a)*R);}ctx.closePath();ctx.fill();ctx.restore();}

FX.soleil={nom:'Le Soleil',d:2.6,f:function(t){var lui=[C('9','♠',-1,0),C('R','♦',-1,1),C('8','♣',-1,2)],moi=[C('10','♣',1,0),C('V','♥',1,1),C('7','♠',1,2)];

var ORDRE=['phenix','givre','epine','ailes','bouclier','sangsue','criniere','eclair','heritage','tour','mort','force','roue','temperance','etoile','soleil'];
/* une image de l'effet `id` au temps t */
function image(id,t){var e=FX[id];ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);var r=e.f.length?null:null;
  ctx.save();ctx.drawImage(fond,0,0,W,H);ctx.restore();
  /* la secousse se calcule d'abord, puis on redessine décalé */
  var info=e.f(t)||{};if(info.secousse){var s=info.secousse,dx=Math.sin(t*90)*s,dy=Math.cos(t*77)*s;ctx.setTransform(DPR,0,0,DPR,dx*DPR,dy*DPR);ctx.drawImage(fond,-20,-20,W+40,H+40);e.f(t);}
  ctx.setTransform(DPR,0,0,DPR,0,0);if(info.eclat&&info.eclat[1]>0){ctx.fillStyle=info.eclat[0].replace('A',info.eclat[1]);ctx.fillRect(0,0,W,H);}
  document.getElementById('nom').textContent=e.nom;}
var courant=null,debut=0;
function joue(id){courant=id;debut=performance.now();}
function boucle(now){requestAnimationFrame(boucle);if(!courant)return;var t=(now-debut)/1000*(window.__lent||1),e=FX[courant];if(t>e.d+0.5){debut=now;t=0;}image(courant,Math.min(t,e.d));}
requestAnimationFrame(boucle);
var barre=document.getElementById('barre');ORDRE.forEach(function(id){var b=document.createElement('button');b.textContent=FX[id].nom;b.addEventListener('click',function(){joue(id);});barre.appendChild(b);});
joue('phenix');
window.__fx={image:image,ordre:ORDRE,fx:FX,joue:joue,arrete:function(){courant=null;}};
document.fonts.ready.then(function(){document.body.dataset.pret='1';});
})();
