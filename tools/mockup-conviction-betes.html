<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Créatures</title>
<!-- Planche des créatures des autres jeux (ui/bete.js) : calme, démasqué, qui proteste, victime.
     Capture : node tools/mockup-conviction-betes.mjs -->
<style>
body { margin: 0; background: #c9d0d6; font: 13px system-ui; color: #1b2430; }
#planche { padding: 16px; width: max-content; display: grid; grid-template-columns: 90px repeat(4, 150px); gap: 10px; align-items: center; }
.face { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px #fff; display: block; }
.face svg { width: 100%; height: 100%; display: block; }
b { font-size: 14px; }
</style></head><body><div id="planche"></div>
<script type="module">
import { bete, ESPECES_CONNUES } from '../conviction/ui/bete.js';
const c = (s) => `<span class="face">${s}</span>`;
document.getElementById('planche').innerHTML = '<span></span><b>Calme</b><b>Démasqué</b><b>Proteste</b><b>Victime</b>' + ESPECES_CONNUES.map((e) => {
  const p = { id: 'x', name: e, role: '', color: 'sapin', look: { espece: e } };
  return `<b>${e}</b>${c(bete(p))}${c(bete(p, 'choc'))}${c(bete(p, 'fier'))}${c(bete({ ...p, victim: true }))}`;
}).join('');
document.body.dataset.pret = '1';
</script></body></html>
