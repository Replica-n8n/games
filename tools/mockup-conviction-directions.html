<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pièce à conviction · trois directions</title>
<!-- Maquette d'exploration : polices chargées en ligne ici, hébergées dans le jeu si une direction est retenue. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=Instrument+Sans:wght@400;600&family=IBM+Plex+Mono:wght@600&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Bowlby+One&family=Rubik:wght@400;600;800&display=swap">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #c9d0d6; font-family: system-ui, sans-serif; }
.planche { display: flex; gap: 28px; padding: 28px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 12px; }
.col > h2 { margin: 0; font: 700 20px system-ui; color: #1b2430; }
.col > p { margin: 0; width: 360px; font: 400 15px/1.4 system-ui; color: #39434f; }
.tel { width: 360px; height: 732px; overflow: hidden; position: relative; display: flex; flex-direction: column; padding: 12px 16px 0; }
.tel > * { flex-shrink: 0; }
.tel header { display: grid; grid-template-columns: 1fr auto; align-items: baseline; column-gap: 8px; }
.tel header h1 { grid-column: 1 / -1; white-space: nowrap; }
.tel h1 { margin: 0; }
.meta { display: flex; gap: 12px; white-space: nowrap; }
.plan { display: grid; grid-template-columns: 20px repeat(6, 1fr); margin-top: 10px; }
.lab { display: flex; align-items: center; justify-content: center; font-size: 14px; }
.cell { position: relative; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
.cell > svg.meuble { width: 70%; height: 70%; }
.notes { position: absolute; inset: 2px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); pointer-events: none; }
.notes b { font-size: 14px; line-height: 1; display: flex; align-items: center; justify-content: center; }
.croix { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; }
.pion { position: absolute; width: 78%; height: 78%; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }
.gens { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
.gens button { border: 0; background: none; padding: 0; font: inherit; color: inherit; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; position: relative; }
.temoin { margin-top: 8px; font-size: 15px; line-height: 1.4; min-height: 42px; }
.temoin q { quotes: "« " " »"; }
.outils { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.seg { display: flex; flex: 1; }
.seg button { flex: 1; min-height: 44px; border: 0; font: inherit; }
.ico { width: 48px; min-height: 44px; display: flex; align-items: center; justify-content: center; border: 0; font: inherit; }
.ico svg { width: 22px; height: 22px; }
.outils2 { display: flex; gap: 8px; margin-top: 8px; }
.outils2 button { flex: 1; min-height: 44px; font: inherit; }
.outils2 button.plus { flex: 0 0 48px; }
.statut { margin-top: 8px; font-size: 15px; line-height: 1.4; }

/* ===================== 1. CALQUE BLEU ===================== */
.d1 { background: #0e3557; color: #e8f1f8; font-family: "Instrument Sans", sans-serif;
  background-image: radial-gradient(rgb(255 255 255 / .06) 1px, transparent 1.4px); background-size: 6px 6px; }
.d1 h1 { font: 900 38px/0.9 "Big Shoulders Stencil Display"; text-transform: uppercase; letter-spacing: .02em; }
.d1 .kick { font: 600 14px "IBM Plex Mono"; color: #f2b544; }
.d1 .meta { font: 600 14px "IBM Plex Mono"; color: #9cc0dc; }
.d1 .meta b { color: #fff; font-weight: 600; }
.d1 .plan { border: 0; }
.d1 .lab { font: 600 14px "IBM Plex Mono"; color: #9cc0dc; }
.d1 .lab.c { border-bottom: 1px solid #6f9cc2; position: relative; margin-bottom: 4px; }
.d1 .lab.c::before, .d1 .lab.c::after { content: ""; position: absolute; bottom: -4px; width: 1px; height: 7px; background: #6f9cc2; }
.d1 .lab.c::before { left: 0; } .d1 .lab.c::after { right: 0; }
.d1 .cell { border: 1px solid rgb(232 241 248 / .16); color: #dcebf6; }
.d1 .cell.wt { border-top: 3px solid #e8f1f8; } .d1 .cell.wb { border-bottom: 3px solid #e8f1f8; }
.d1 .cell.wl { border-left: 3px solid #e8f1f8; } .d1 .cell.wr { border-right: 3px solid #e8f1f8; }
.d1 .r-B { background: repeating-linear-gradient(0deg, transparent 0 9px, rgb(232 241 248 / .08) 9px 10px); }
.d1 .r-S { background: repeating-linear-gradient(45deg, transparent 0 11px, rgb(232 241 248 / .08) 11px 12px); }
.d1 .r-C { background: repeating-linear-gradient(90deg, transparent 0 9px, rgb(232 241 248 / .08) 9px 10px); }
.d1 .r-J { background: repeating-linear-gradient(-45deg, transparent 0 11px, rgb(232 241 248 / .08) 11px 12px); }
.d1 .cell.bloque > svg.meuble { opacity: .95; }
.d1 .nom-piece { position: absolute; left: 4px; top: 2px; font: 600 14px "IBM Plex Mono"; color: #f2b544; white-space: nowrap; z-index: 1; display: none; }
.d1 .cell.hl { box-shadow: inset 0 0 0 2px #f2b544; background-color: rgb(242 181 68 / .14); }
.d1 .pion { background: #0e3557; border: 3px solid var(--c1); color: #fff; font: 900 26px "Big Shoulders Stencil Display"; box-shadow: 0 0 0 2px #0e3557; }
.d1 .pion.v { border-style: dashed; border-color: #e8f1f8; }
.d1 .notes b { font: 600 14px "IBM Plex Mono"; color: var(--c1); }
.d1 .croix { color: #9cc0dc; font-family: "IBM Plex Mono"; }
.d1 .gens .jeton { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--c1); display: flex; align-items: center; justify-content: center; font: 900 24px "Big Shoulders Stencil Display"; color: #fff; }
.d1 .gens button.sel .jeton { background: var(--c1); color: #0e3557; }
.d1 .gens button.v .jeton { border-style: dashed; border-color: #e8f1f8; }
.d1 .gens button.pose::after { content: ""; position: absolute; top: 0; right: 4px; width: 10px; height: 10px; border-radius: 50%; background: #7fd6a4; }
.d1 .temoin b { color: #f2b544; }
.d1 .seg { border: 1.5px solid #e8f1f8; }
.d1 .seg button { background: none; color: #e8f1f8; font-weight: 600; }
.d1 .seg button.on { background: #e8f1f8; color: #0e3557; }
.d1 .ico { background: none; color: #e8f1f8; border: 1.5px solid #6f9cc2; }
.d1 .outils2 button { background: none; color: #e8f1f8; border: 1.5px solid #e8f1f8; font-weight: 600; }
.d1 .outils2 button.plus { border-color: #6f9cc2; }
.d1 .statut { border-left: 3px solid #f2b544; padding: 6px 10px; background: rgb(255 255 255 / .05); }
:root { --c-A: #f2b544; --c-B: #63d39a; --c-C: #c4a3ff; --c-D: #ff8a6b; --c-E: #59d2e8; --c-V: #e8f1f8; }

/* ===================== 2. MAQUETTE ===================== */
.d2 { background: #1d2327; color: #f1ede6; font-family: "Atkinson Hyperlegible", sans-serif; }
.d2 h1 { font: 800 31px/1.05 "Bricolage Grotesque"; letter-spacing: -.01em; }
.d2 .kick { font: 500 14px "Bricolage Grotesque"; color: #e8b77a; }
.d2 .meta { font: 700 14px "Atkinson Hyperlegible"; color: #b6bcc0; font-variant-numeric: tabular-nums; }
.d2 .meta b { color: #fff; }
.d2 .plan { padding: 4px; background: #2e2522; border-radius: 6px; box-shadow: 0 18px 40px rgb(0 0 0 / .45), inset 0 0 0 4px #3b302b; margin-top: 12px; }
.d2 .lab { color: #b6bcc0; font: 700 14px "Atkinson Hyperlegible"; }
.d2 .plan .lab:first-child, .d2 .plan > .lab { }
.d2 .cell { box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .18); }
.d2 .cell.wt { border-top: 4px solid #2e2522; } .d2 .cell.wb { border-bottom: 4px solid #2e2522; }
.d2 .cell.wl { border-left: 4px solid #2e2522; } .d2 .cell.wr { border-right: 4px solid #2e2522; }
.d2 .r-B { background: repeating-linear-gradient(90deg, #b88a5c 0 11px, #a87b4f 11px 12px), #b88a5c; }
.d2 .r-S { background: radial-gradient(circle at 50% 50%, #b4566a 0 40%, transparent 41%) 0 0 / 18px 18px, #a04a5c; }
.d2 .r-C { background: conic-gradient(#ece6d8 25%, #c5bba6 0 50%, #ece6d8 0 75%, #c5bba6 0) 0 0 / 17px 17px; }
.d2 .r-J { background: linear-gradient(#0000 calc(100% - 1px), rgb(80 40 20 / .35) 0) 0 0 / 100% 17px, linear-gradient(90deg, #0000 calc(100% - 1px), rgb(80 40 20 / .35) 0) 0 0 / 17px 100%, #c7825d; }
.d2 .cell > svg.meuble { filter: drop-shadow(2px 3px 2px rgb(0 0 0 / .4)); width: 82%; height: 82%; }
.d2 .cell.hl::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle, rgb(255 236 170 / .55), rgb(255 220 130 / .18) 70%); box-shadow: inset 0 0 0 2px #ffe08a; pointer-events: none; }
.d2 .pion { width: 86%; height: 86%; box-shadow: 0 4px 6px rgb(0 0 0 / .5), 0 0 0 2.5px #fff; overflow: hidden; }
.d2 .pion svg { width: 100%; height: 100%; }
.d2 .notes b { font: 700 14px "Atkinson Hyperlegible"; color: #1d2327; text-shadow: 0 0 3px #fff, 0 0 2px #fff; }
.d2 .croix { color: #1d2327; text-shadow: 0 0 4px #fff; font-weight: 700; }
.d2 .gens { gap: 4px; margin-top: 12px; }
.d2 .gens .portrait { width: 48px; height: 48px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 2px #3a4248; }
.d2 .gens .portrait svg { width: 100%; height: 100%; }
.d2 .gens .n { font: 700 14px "Atkinson Hyperlegible"; color: #b6bcc0; }
.d2 .gens button.sel .portrait { box-shadow: 0 0 0 3px #ffe08a; }
.d2 .gens button.sel .n { color: #ffe08a; }
.d2 .gens button.pose .portrait { opacity: 1; }
.d2 .gens button.pose::after { content: "✓"; position: absolute; top: -2px; right: 2px; width: 18px; height: 18px; border-radius: 50%; background: #7fcf9a; color: #12301f; font: 700 13px/18px system-ui; text-align: center; }
.d2 .temoin { background: #2a3237; border-radius: 14px; padding: 8px 12px; position: relative; margin-top: 12px; }
.d2 .temoin::before { content: ""; position: absolute; top: -7px; right: 26px; border: 7px solid transparent; border-top: 0; border-bottom-color: #2a3237; }
.d2 .temoin b { color: #ffe08a; }
.d2 .seg { background: #2a3237; border-radius: 22px; padding: 3px; }
.d2 .seg button { background: none; color: #d7dbde; border-radius: 19px; font-weight: 700; min-height: 40px; }
.d2 .seg button.on { background: #f1ede6; color: #1d2327; }
.d2 .ico { background: #2a3237; color: #f1ede6; border-radius: 22px; }
.d2 .outils2 button { background: #2a3237; color: #f1ede6; border: 0; border-radius: 22px; font-weight: 700; }
.d2 .outils2 button.main { background: #ffe08a; color: #1d2327; }
.d2 .statut { color: #c9ced1; padding: 0 4px; }

/* ===================== 3. PLATEAU ===================== */
.d3 { color: #2a1a10; font-family: "Rubik", sans-serif;
  background: repeating-linear-gradient(93deg, rgb(0 0 0 / .05) 0 2px, transparent 2px 9px), repeating-linear-gradient(88deg, rgb(255 255 255 / .04) 0 1px, transparent 1px 23px), linear-gradient(#8a5a35, #6c4327); }
.d3 header { background: #f6ecd8; margin: -12px -16px 0; padding: 12px 16px 10px; box-shadow: 0 3px 0 #3a2414; }
.d3 h1 { font: 400 25px/1.15 "Bowlby One"; color: #2a1a10; }
.d3 .kick { font: 800 14px "Rubik"; color: #b23a2a; text-transform: uppercase; letter-spacing: .04em; }
.d3 .meta { font: 600 14px "Rubik"; color: #5b4636; }
.d3 .meta b { color: #2a1a10; }
.d3 .plan { background: #f6ecd8; padding: 6px 8px 8px 2px; border-radius: 10px; box-shadow: 0 6px 0 #3a2414, 0 14px 20px rgb(0 0 0 / .4); margin-top: 14px; }
.d3 .lab { font: 800 14px "Rubik"; color: #5b4636; }
.d3 .cell { border: 1px solid rgb(42 26 16 / .25); }
.d3 .cell.wt { border-top: 3px solid #2a1a10; } .d3 .cell.wb { border-bottom: 3px solid #2a1a10; }
.d3 .cell.wl { border-left: 3px solid #2a1a10; } .d3 .cell.wr { border-right: 3px solid #2a1a10; }
.d3 .r-B { background: #e3a93b; } .d3 .r-S { background: #d9766a; } .d3 .r-C { background: #8cc2b5; } .d3 .r-J { background: #a8c06a; }
.d3 .cell > svg.meuble { width: 76%; height: 76%; }
.d3 .cell.hl { background-image: repeating-linear-gradient(45deg, rgb(255 255 255 / .55) 0 4px, transparent 4px 8px); box-shadow: inset 0 0 0 3px #fff; }
.d3 .pion { width: 74%; height: 74%; background: var(--c3); color: #fff; font: 400 22px "Bowlby One"; transform: translateY(-3px);
  box-shadow: 0 4px 0 var(--c3d), 0 6px 4px rgb(0 0 0 / .45), inset 0 2px 0 rgb(255 255 255 / .35); }
.d3 .pion.v { background: #fff; color: #2a1a10; box-shadow: 0 4px 0 #b9ab94, 0 6px 4px rgb(0 0 0 / .45); }
.d3 .notes b { font: 800 14px "Rubik"; color: #2a1a10; }
.d3 .croix { color: #2a1a10; font-weight: 800; }
.d3 .gens { margin-top: 18px; }
.d3 .gens .jeton { width: 42px; height: 42px; border-radius: 50%; background: var(--c3); color: #fff; font: 400 21px/42px "Bowlby One"; text-align: center;
  box-shadow: 0 4px 0 var(--c3d), 0 6px 4px rgb(0 0 0 / .4), inset 0 2px 0 rgb(255 255 255 / .35); }
.d3 .gens button.v .jeton { background: #fff; color: #2a1a10; box-shadow: 0 4px 0 #b9ab94, 0 6px 4px rgb(0 0 0 / .4); }
.d3 .gens button.sel .jeton { transform: translateY(-6px); box-shadow: 0 10px 0 #b9ab94, 0 12px 8px rgb(0 0 0 / .4), 0 0 0 3px #fff; }
.d3 .gens button.pose .jeton { transform: translateY(4px); box-shadow: 0 0 0 var(--c3d), inset 0 2px 4px rgb(0 0 0 / .35); filter: saturate(.9); }
.d3 .temoin { background: #fffaf0; border-radius: 10px; padding: 8px 10px 8px 58px; position: relative; margin-top: 10px; box-shadow: 0 3px 0 #3a2414, 0 6px 10px rgb(0 0 0 / .3); transform: rotate(-1deg); }
.d3 .temoin .portrait { position: absolute; left: 8px; top: 8px; width: 42px; height: 42px; border-radius: 8px; overflow: hidden; border: 2px solid #2a1a10; }
.d3 .temoin b { color: #b23a2a; }
.d3 .seg { background: #f6ecd8; border-radius: 10px; padding: 3px; box-shadow: 0 3px 0 #3a2414; }
.d3 .seg button { background: none; color: #2a1a10; font-weight: 800; border-radius: 8px; min-height: 40px; }
.d3 .seg button.on { background: #2a1a10; color: #f6ecd8; }
.d3 .ico { background: #f6ecd8; color: #2a1a10; border-radius: 10px; box-shadow: 0 3px 0 #3a2414; }
.d3 .outils2 button { background: #f6ecd8; color: #2a1a10; border: 0; border-radius: 10px; font-weight: 800; box-shadow: 0 3px 0 #3a2414; }
.d3 .outils2 button.main { background: #b23a2a; color: #fff; box-shadow: 0 3px 0 #6a1d12; }
.d3 .statut { color: #fff4e2; padding: 2px 2px; }
</style>
</head>
<body>
<div class="planche" id="planche"></div>
<script>
const LAYOUT = ["BBBSSS", "BBBSSS", "CCJJSS", "CCJJJJ", "CCJJJJ", "CCCJJJ"];
const ROOMS = { B: "Bibliothèque", S: "Salon", C: "Cuisine", J: "Jardin d'hiver" };
const MEUBLES = { "0,0": "etagere", "0,1": "etagere", "1,2": "fauteuil", "0,4": "piano", "1,3": "canape", "2,5": "cheminee", "3,0": "fourneau", "4,1": "table", "5,2": "chaise", "2,2": "plante", "3,3": "plante", "4,4": "fontaine", "5,4": "banc" };
const BLOQUE = new Set(["etagere", "piano", "cheminee", "fourneau", "table", "plante", "fontaine"]);
const GENS = [
  { id: "A", nom: "Agathe", role: "la cuisinière", c3: "#d18b17", c3d: "#7c510b", t: "J'étais à côté du fourneau." },
  { id: "B", nom: "Bastien", role: "le majordome", c3: "#2f8a55", c3d: "#174a2c", t: "J'étais assis dans un fauteuil de la bibliothèque." },
  { id: "C", nom: "Céleste", role: "la pianiste", c3: "#7a4fb5", c3d: "#41286a", t: "J'étais à côté du piano." },
  { id: "D", nom: "Dorian", role: "le jardinier", c3: "#c2452a", c3d: "#6c2414", t: "J'étais assis." },
  { id: "E", nom: "Eugénie", role: "la nièce", c3: "#1f8396", c3d: "#0f4651", t: "J'étais dans la cuisine." },
  { id: "V", nom: "Victor", role: "le comte, victime", c3: "#fff", c3d: "#b9ab94", t: "Le corps gisait contre le mur est, mais pas à côté de la fontaine.", v: true },
];
// La même partie dans les trois directions.
const POSE = { B: [1, 2], C: [0, 3], D: [5, 4] };
const NOTES = { "2,0": ["A", "E"], "4,0": ["A", "E"], "2,1": ["E"] };
const CROIX = new Set(["1,5"]);
const ECLAIRE = new Set(["0,5", "1,5", "3,5", "5,5"]); // le témoignage de Victor, éclairé sur le plan
const SEL = "V";

// ---------- Meubles au trait (calque) ----------
const S = 'stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"';
const TRAIT = {
  etagere: `<rect x="3" y="2" width="18" height="20" ${S}/><path d="M3 8h18M3 14h18M6 5v3M9 5v3M14 11v3M17 11v3M7 17v3M11 17v3" ${S}/>`,
  fauteuil: `<path d="M6 11V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5" ${S}/><path d="M4 11a2 2 0 0 1 4 0v3h8v-3a2 2 0 0 1 4 0v6H4z" ${S}/><path d="M6 17v3M18 17v3" ${S}/>`,
  piano: `<rect x="2" y="5" width="20" height="14" ${S}/><path d="M2 12h20M6 12v7M10 12v7M14 12v7M18 12v7" ${S}/><path d="M5 12V9h2v3M12 12V9h2v3" ${S}/>`,
  canape: `<path d="M5 10V7a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" ${S}/><path d="M2 11a2 2 0 0 1 3 0v3h14v-3a2 2 0 0 1 3 0v6H2z" ${S}/><path d="M5 17v2M19 17v2" ${S}/>`,
  cheminee: `<path d="M2 4h20M4 4v17h16V4" ${S}/><path d="M8 21v-7a4 4 0 0 1 8 0v7" ${S}/><path d="M12 19c-1.5 0-2-1-2-2 0-1.5 2-2 2-3.5.8 1 2 1.8 2 3.5 0 1-.5 2-2 2z" ${S}/>`,
  fourneau: `<rect x="3" y="3" width="18" height="18" ${S}/><circle cx="8.5" cy="8.5" r="2.5" ${S}/><circle cx="15.5" cy="8.5" r="2.5" ${S}/><circle cx="8.5" cy="15.5" r="2.5" ${S}/><circle cx="15.5" cy="15.5" r="2.5" ${S}/>`,
  table: `<rect x="3" y="7" width="18" height="10" rx="1" ${S}/><path d="M6 4v3M12 4v3M18 4v3M6 17v3M12 17v3M18 17v3" ${S}/>`,
  chaise: `<path d="M7 3v9h10V3" ${S}/><path d="M6 12h12M7 12v9M17 12v9M7 7h10" ${S}/>`,
  plante: `<path d="M7 15h10l-1.5 6h-7z" ${S}/><path d="M12 15V9M12 11c-3 0-5-2-5-5 3 0 5 2 5 5zM12 9c0-3 2-5 5-5 0 3-2 5-5 5z" ${S}/>`,
  fontaine: `<circle cx="12" cy="12" r="9" ${S}/><circle cx="12" cy="12" r="5" ${S}/><path d="M12 12V8M10 9c1-1.5 3-1.5 4 0" ${S}/>`,
  banc: `<path d="M3 10h18M3 14h18M5 14v6M19 14v6M5 10V6M19 10V6" ${S}/>`,
};

// ---------- Meubles vus de dessus, en couleur (maquette et plateau) ----------
function dessus(t, k) {
  const o = k ? ` stroke="${k}" stroke-width="1.2"` : ' stroke="rgb(0 0 0 / .35)" stroke-width=".6"';
  switch (t) {
    case "etagere": return `<rect x="1" y="4" width="22" height="16" rx="1" fill="#6b4224"${o}/>` + ["#b23a2a", "#2f6b8a", "#d9a13b", "#3f7a4a", "#7a4fb5", "#c2452a", "#e2d6bd"].map((c, i) => `<rect x="${2.5 + i * 2.9}" y="5.5" width="2.4" height="13" fill="${c}"/>`).join("");
    case "fauteuil": return `<rect x="3" y="3" width="18" height="18" rx="5" fill="#7a2f3a"${o}/><rect x="6.5" y="8" width="11" height="10" rx="3" fill="#a5495a"/><rect x="3" y="3" width="18" height="5" rx="2.5" fill="#64242e"/>`;
    case "piano": return `<path d="M3 3h16c2 0 3 2 3 4 0 3-3 3-3 7s2 4 2 6-1 3-3 3H3z" fill="#141414"${o}/><path d="M5 4.5h11" stroke="#555" stroke-width="1"/><rect x="3" y="3" width="3" height="20" fill="#f4f1ea"/><path d="M3 6h3M3 9h3M3 12h3M3 15h3M3 18h3M3 21h3" stroke="#141414" stroke-width=".6"/>`;
    case "canape": return `<rect x="1" y="5" width="22" height="14" rx="4" fill="#3f5f7a"${o}/><rect x="1" y="5" width="22" height="5" rx="2.5" fill="#2f4b62"/><rect x="4" y="10" width="7.5" height="7" rx="2" fill="#56789a"/><rect x="12.5" y="10" width="7.5" height="7" rx="2" fill="#56789a"/>`;
    case "cheminee": return `<rect x="1" y="2" width="22" height="20" rx="1" fill="#8e8a84"${o}/><rect x="5" y="6" width="14" height="12" rx="1" fill="#2a2420"/><path d="M12 17c-2.5 0-3.5-1.5-3.5-3.2 0-2 2.5-2.8 3-5 1.5 1.5 4 2.8 4 5 0 1.7-1 3.2-3.5 3.2z" fill="#f08a2c"/><path d="M12 17c-1.2 0-1.7-.8-1.7-1.6 0-1 1.2-1.4 1.6-2.6.8.8 1.8 1.4 1.8 2.6 0 .8-.5 1.6-1.7 1.6z" fill="#ffd36b"/>`;
    case "fourneau": return `<rect x="2" y="2" width="20" height="20" rx="2" fill="#3a3d40"${o}/>` + [[8, 8], [16, 8], [8, 16], [16, 16]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.2" fill="#1c1e20" stroke="#6b6f73" stroke-width=".8"/>`).join("");
    case "table": return `<rect x="2" y="5" width="20" height="14" rx="1.5" fill="#9a6538"${o}/><path d="M2 9h20M2 14h20" stroke="#7d4f2a" stroke-width=".6"/><circle cx="12" cy="12" r="2.5" fill="#e8e1d0"/>`;
    case "chaise": return `<rect x="5" y="7" width="14" height="13" rx="2" fill="#9a6538"${o}/><rect x="5" y="4" width="14" height="4" rx="1.5" fill="#6b4224"/>`;
    case "plante": return `<circle cx="12" cy="12" r="6" fill="#8a4a2a"${o}/>` + [0, 60, 120, 180, 240, 300].map((a) => `<ellipse cx="12" cy="5.5" rx="3" ry="6" fill="${a % 120 ? "#4f8a3f" : "#3a6e2f"}" transform="rotate(${a} 12 12)"/>`).join("") + `<circle cx="12" cy="12" r="2.5" fill="#6aa84f"/>`;
    case "fontaine": return `<circle cx="12" cy="12" r="11" fill="#b9b3a8"${o}/><circle cx="12" cy="12" r="8.5" fill="#5aa6c8"/><circle cx="12" cy="12" r="5" fill="none" stroke="#bfe6f5" stroke-width=".8"/><circle cx="12" cy="12" r="2.4" fill="#b9b3a8"/>`;
    case "banc": return `<rect x="1" y="7" width="22" height="10" rx="1.5" fill="#7d5130"${o}/><path d="M1 10.3h22M1 13.6h22" stroke="#5a3820" stroke-width=".8"/>`;
  }
}

// ---------- Portraits ----------
const PEAU = { A: "#f1c49e", B: "#e2a985", C: "#c98d68", D: "#a8714c", E: "#f5d3b8", V: "#e6ddd2" };
function portrait(id) {
  const p = PEAU[id];
  const yeux = id === "V"
    ? `<path d="M15.5 19.5h3M21.5 19.5h3" stroke="#3b2a22" stroke-width="1.2" stroke-linecap="round"/>`
    : `<circle cx="17" cy="19.5" r="1.1" fill="#2a1a12"/><circle cx="23" cy="19.5" r="1.1" fill="#2a1a12"/>`;
  const bouche = id === "V" ? "" : `<path d="M18 24.5q2 1.5 4 0" stroke="#7a3a2a" stroke-width="1" fill="none" stroke-linecap="round"/>`;
  const fonds = { A: "#e9c46a", B: "#7fb894", C: "#b49ad8", D: "#e58c6c", E: "#86c9d6", V: "#c9ccd1" };
  let corps = "", cheveux = "", dessusTete = "", detail = "";
  switch (id) {
    case "A":
      corps = `<path d="M5 40c1-8 7-11 15-11s14 3 15 11z" fill="#fafafa"/><path d="M14 31l6 5 6-5" fill="none" stroke="#d0d0d0" stroke-width="1.2"/>`;
      cheveux = `<path d="M11.5 18c0-5 3.5-8 8.5-8s8.5 3 8.5 8c-1-2-2-3-3-3.5H14.5c-1 .5-2 1.5-3 3.5z" fill="#6b3e26"/>`;
      dessusTete = `<rect x="12" y="9" width="16" height="4" rx="1" fill="#fff" stroke="#ddd" stroke-width=".6"/><circle cx="14" cy="6.5" r="4" fill="#fff"/><circle cx="20" cy="4.5" r="4.5" fill="#fff"/><circle cx="26" cy="6.5" r="4" fill="#fff"/>`;
      break;
    case "B":
      corps = `<path d="M5 40c1-8 7-11 15-11s14 3 15 11z" fill="#1f2226"/><path d="M16 29l4 9 4-9z" fill="#fff"/><path d="M17 31.5l3 1.5 3-1.5v3l-3-1.5-3 1.5z" fill="#111"/>`;
      cheveux = `<path d="M11.5 20c-.5-4 .5-6 2-7M28.5 20c.5-4-.5-6-2-7" stroke="#8d8d8d" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
      detail = `<path d="M16.5 23.2q3.5-2 7 0" stroke="#5a4a40" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
      break;
    case "C":
      corps = `<path d="M5 40c1-8 7-11 15-11s14 3 15 11z" fill="#5b3a8a"/><circle cx="20" cy="31.5" r="1.4" fill="#f3e3a0"/>`;
      cheveux = `<path d="M11 21c-1-7 3-11.5 9-11.5S30 14 29 21c-1-3-2-6-4-7-3 2-8 2.5-11 1.5-1.5 1.5-2.5 3-3 5.5z" fill="#2a1a14"/><circle cx="20" cy="7.5" r="4" fill="#2a1a14"/>`;
      detail = `<circle cx="11.5" cy="22.5" r="1.1" fill="#f3e3a0"/><circle cx="28.5" cy="22.5" r="1.1" fill="#f3e3a0"/>`;
      break;
    case "D":
      corps = `<path d="M5 40c1-8 7-11 15-11s14 3 15 11z" fill="#8a3a22"/><path d="M13 30v10M27 30v10" stroke="#6b5530" stroke-width="2.4"/>`;
      dessusTete = `<ellipse cx="20" cy="12.5" rx="14" ry="3.6" fill="#d9b45a"/><path d="M13 12.5c0-5 3-7.5 7-7.5s7 2.5 7 7.5z" fill="#e6c46e"/><path d="M13 11.3h14" stroke="#8a5a2b" stroke-width="1.8"/>`;
      detail = `<path d="M15 26q5 3 10 0" stroke="#4a2a18" stroke-width="1.6" fill="none" opacity=".5"/>`;
      break;
    case "E":
      cheveux = `<path d="M10 33c-2-10-1-23 10-23s12 13 10 23c-2-4-3-9-3-13-3-2-11-2-14 0 0 4-1 9-3 13z" fill="#b8452c"/>`;
      corps = `<path d="M5 40c1-8 7-11 15-11s14 3 15 11z" fill="#1f6f80"/>`;
      dessusTete = `<path d="M13 14.5c2-3.5 12-3.5 14 0-3 1.2-11 1.2-14 0z" fill="#b8452c"/><path d="M25 11.5l3.5-2.5v4z" fill="#f3e3a0"/>`;
      break;
    case "V":
      corps = `<path d="M5 40c1-8 7-11 15-11s14 3 15 11z" fill="#4a4f57"/><path d="M17 29l3 7 3-7z" fill="#f2f2f2"/>`;
      cheveux = `<path d="M11.5 19c-.5-6 3-9 8.5-9s9 3 8.5 9c-1-2.5-3-4-8.5-4s-7.5 1.5-8.5 4z" fill="#b8bcc2"/>`;
      detail = `<path d="M15.5 23.5q4.5-2.2 9 0q-2 1.6-4.5 .6q-2.5 1-4.5-.6z" fill="#9aa0a7"/>`;
      break;
  }
  return `<svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" fill="${fonds[id]}"/>${id === "E" ? cheveux : ""}${corps}<rect x="17.5" y="25" width="5" height="5" fill="${p}"/><circle cx="20" cy="19" r="8.5" fill="${p}"/>${id !== "E" ? cheveux : ""}${dessusTete}${yeux}${bouche}${detail}</svg>`;
}

const UNDO = `<svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" ${S} stroke-width="2"/></svg>`;
const REDO = `<svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13" ${S} stroke-width="2"/></svg>`;

function plan(dir) {
  let h = '<span class="lab"></span>';
  for (let c = 0; c < 6; c++) h += `<span class="lab c">${"ABCDEF"[c]}</span>`;
  const qui = Object.fromEntries(Object.entries(POSE).map(([id, [r, c]]) => [r + "," + c, id]));
  for (let r = 0; r < 6; r++) {
    h += `<span class="lab">${r + 1}</span>`;
    for (let c = 0; c < 6; c++) {
      const k = LAYOUT[r][c], key = r + "," + c, m = MEUBLES[key];
      const cls = ["cell", "r-" + k];
      if (r === 0 || LAYOUT[r - 1][c] !== k) cls.push("wt");
      if (r === 5 || LAYOUT[r + 1][c] !== k) cls.push("wb");
      if (c === 0 || LAYOUT[r][c - 1] !== k) cls.push("wl");
      if (c === 5 || LAYOUT[r][c + 1] !== k) cls.push("wr");
      if (m && BLOQUE.has(m)) cls.push("bloque");
      if (ECLAIRE.has(key)) cls.push("hl");
      let inner = "";
      if (m) inner += dir === 1 ? `<svg class="meuble" viewBox="0 0 24 24">${TRAIT[m]}</svg>` : `<svg class="meuble" viewBox="0 0 24 24">${dessus(m, dir === 3 ? "#2a1a10" : null)}</svg>`;
      if (NOTES[key] && !qui[key]) inner += `<span class="notes">${NOTES[key].map((id) => `<b style="--c1:var(--c-${id})">${id}</b>`).join("")}</span>`;
      if (CROIX.has(key)) inner += `<span class="croix">✕</span>`;
      const id = qui[key];
      if (id) {
        const g = GENS.find((x) => x.id === id);
        inner += dir === 2
          ? `<span class="pion">${portrait(id)}</span>`
          : `<span class="pion${g.v ? " v" : ""}" style="--c1:var(--c-${id});--c3:${g.c3};--c3d:${g.c3d}">${id}</span>`;
      }
      h += `<span class="${cls.join(" ")}">${inner}</span>`;
    }
  }
  return `<div class="plan">${h}</div>`;
}

function gens(dir) {
  return `<div class="gens">${GENS.map((g) => {
    const cls = [g.v ? "v" : "", g.id === SEL ? "sel" : "", POSE[g.id] ? "pose" : ""].join(" ");
    const style = `--c1:var(--c-${g.id});--c3:${g.c3};--c3d:${g.c3d}`;
    if (dir === 2) return `<button class="${cls}"><span class="portrait">${portrait(g.id)}</span><span class="n">${g.nom}</span></button>`;
    return `<button class="${cls}" style="${style}"><span class="jeton">${g.id}</span></button>`;
  }).join("")}</div>`;
}

function tel(dir) {
  const v = GENS.find((g) => g.id === SEL);
  const temoin = dir === 3
    ? `<div class="temoin"><span class="portrait">${portrait(SEL)}</span><b>${v.nom}</b>, ${v.role} : <q>${v.t}</q></div>`
    : `<div class="temoin"><b>${v.nom}</b>, ${v.role} : <q>${v.t}</q></div>`;
  return `<div class="tel d${dir}">
    <header><div class="kick">${dir === 3 ? "Enquête 1 · Manoir" : "Dossier 1 · Manoir"}</div>
      <div class="meta"><span>⏱ <b>4:12</b></span><span>Indices <b>1</b></span></div><h1>L'Affaire Valcourt</h1></header>
    ${plan(dir)}
    ${gens(dir)}
    ${temoin}
    <div class="outils"><div class="seg"><button class="on">Placer</button><button>Crayon</button><button>Barrer</button></div>
      <button class="ico" aria-label="Annuler">${UNDO}</button><button class="ico" aria-label="Rétablir">${REDO}</button></div>
    <div class="outils2"><button class="main">Indice</button><button>Vérifier</button><button class="plus" aria-label="Plus">⋯</button></div>
    <div class="statut">Victor : 4 cases correspondent. Touchez celle où était le corps.</div>
  </div>`;
}

const TEXTES = [
  ["1 · Calque bleu", "Le plan d'architecte poussé au bout : bleu de tirage, traits blancs, lignes de cote au-dessus des colonnes. Les personnes sont des cercles au crayon de couleur, comme annotées à la main."],
  ["2 · Maquette", "La maison vue de dessus, avec ses sols (parquet, tapis, carrelage, tomettes) et ses meubles qui portent une ombre. Les personnes ont un visage : la cuisinière a sa toque, le jardinier son chapeau."],
  ["3 · Plateau", "Un jeu de société posé sur la table : plateau imprimé, pions épais qui se soulèvent quand on les choisit, témoignage sur une carte."],
];
document.getElementById("planche").innerHTML = [1, 2, 3].map((d) => `<div class="col"><h2>${TEXTES[d - 1][0]}</h2>${tel(d)}<p>${TEXTES[d - 1][1]}</p></div>`).join("");
</script>
</body>
</html>
