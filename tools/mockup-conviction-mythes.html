<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Mythologies</title>
<!-- Planche des dieux d'Égypte (costumes.js, egypte.js) : calme, démasqué, qui proteste, victime, et en pion.
     Capture : node tools/mockup-conviction-egypte.mjs -->
<style>
body { margin: 0; background: #c9d0d6; font: 13px system-ui; color: #1b2430; }
#planche { padding: 16px; width: max-content; display: grid; grid-template-columns: 100px repeat(4, 140px) 70px; gap: 10px; align-items: center; }
.face { width: 140px; height: 140px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 3px #fff; display: block; }
.pion { width: 56px; height: 56px; }
.face svg { width: 100%; height: 100%; display: block; }
b { font-size: 14px; }
</style></head><body><div id="planche"></div>
<script type="module">
import { buste } from '../conviction/ui/buste.js';
// Les humains : un buste + son costume (costumes.js) ; les autres : onepiece.js.
const CAST = [
  ['minotaure'], ['thesee', { skin: 'hale', hair: 'boucle', hairColor: 'brun', outfit: 'tunique' }], ['ariane', { skin: 'mat', hair: 'long', hairColor: 'noir', outfit: 'robe' }, true],
  ['dedale', { skin: 'hale', hair: 'degarni', hairColor: 'blanc', outfit: 'tablier', extras: ['barbe'] }], ['icare', { skin: 'clair', hair: 'boucle', hairColor: 'blond', outfit: 'tunique' }],
  ['minos', { skin: 'mat', hair: 'boucle', hairColor: 'noir', outfit: 'manteau', extras: ['barbe'] }], ['pasiphae', { skin: 'clair', hair: 'boucle', hairColor: 'noir', outfit: 'robe' }, true],
  ['baldr', { skin: 'clair', hair: 'boucle', hairColor: 'blond', outfit: 'tunique' }], ['loki', { skin: 'clair', hair: 'long', hairColor: 'roux', outfit: 'tunique' }],
  ['hod', { skin: 'rose', hair: 'court', hairColor: 'brun', outfit: 'tunique' }], ['thor', { skin: 'rose', hair: 'long', hairColor: 'roux', outfit: 'tunique', extras: ['barbe'] }],
  ['odin', { skin: 'rose', hair: 'long', hairColor: 'gris', outfit: 'manteau', extras: ['barbe'] }], ['frigg', { skin: 'clair', hair: 'chignon', hairColor: 'blond', outfit: 'robe' }, true],
  ['nanna', { skin: 'rose', hair: 'long', hairColor: 'blond', outfit: 'robe' }, true],
  ['cesar', { skin: 'clair', hair: 'court', hairColor: 'chatain', outfit: 'tunique' }], ['brutus', { skin: 'hale', hair: 'boucle', hairColor: 'brun', outfit: 'tunique', extras: ['barbe'] }],
  ['decimus', { skin: 'rose', hair: 'court', hairColor: 'noir', outfit: 'tunique' }], ['antoine', { skin: 'hale', hair: 'boucle', hairColor: 'brun', outfit: 'armure' }],
  ['lepide', { skin: 'rose', hair: 'degarni', hairColor: 'gris', outfit: 'armure' }], ['spurinna', { skin: 'mat', hair: 'court', hairColor: 'gris', outfit: 'tunique', extras: ['barbe'] }],
  ['calpurnia', { skin: 'clair', hair: 'chignon', hairColor: 'brun', hat: 'voile', outfit: 'robe' }, true],
];
const c = (s, k = '') => `<span class="face ${k}">${s}</span>`;
document.getElementById('planche').innerHTML = '<span></span><b>Calme</b><b>Démasqué</b><b>Proteste</b><b>Victime</b><b>Pion</b>' + CAST.map(([nom, look, fem]) => {
  const p = { id: 'x', name: nom, role: '', color: 'sapin', fem: !!fem, look: nom === 'calpurnia' ? look : { ...(look ?? {}), perso: nom } };
  const f = buste;
  return `<b>${nom}</b>${c(f(p))}${c(f(p, 'choc'))}${c(f(p, 'fier'))}${c(f({ ...p, victim: true }))}${c(f(p, '', true), 'pion')}`;
}).join('');
document.body.dataset.pret = '1';
</script></body></html>
